const WAGON_TYPES={
  cargo:{name:'货运车厢',icon:'📦',cap:[60,120,200,300,450],pass:[0,0,0,0,0],spd:0.95,dur:[1.2,1.35,1.5,1.65,1.8],hp:[40,70,110,160,230],base:30000,color:'var(--accent)'},
  pass:{name:'载客车厢',icon:'🧳',cap:[0,0,0,0,0],pass:[8,12,16,20,25],spd:1.05,dur:[1.2,1.35,1.5,1.65,1.8],hp:[30,55,85,120,170],base:30000,color:'var(--travel)'},
  balanced:{name:'均衡车厢',icon:'⚖️',cap:[30,60,100,150,220],pass:[4,6,8,10,12],spd:0.97,dur:[1.1,1.22,1.34,1.46,1.58],hp:[35,60,95,140,200],base:45000,color:'var(--green)'},
  engine:{name:'动力车厢',icon:'⚙️',cap:[0,0,0,0,0],pass:[0,0,0,0,0],spd:[1.1,1.2,1.3,1.45,1.6],dur:[0.85,0.75,0.65,0.55,0.45],hp:[25,45,70,100,140],base:60000,color:'var(--gold)'}
};
// 费用梯度（指数分布）：1级几万 → 4级大几十万 → 5级小几百万（货运 base 3万：3万/9万/24万/60万/180万）
const WAGON_COST_MUL=[1,3,8,20,60];
// 每节车厢位独立解锁（v6.12）：{cur:当前装配, owned:已购买车厢集合}
// 已购买的车厢可免费更换装配；未购买的车厢需花金币购买解锁；各车厢位进度互不影响
// 当前装配的车厢（仅统计有效车厢位，避免超槽位旧存档造成容量与 UI 不一致）
function getWagons(){return (GS.vehicle.wagons||[]).slice(0,getWagonSlots()).filter(w=>w&&w.cur).map(w=>w.cur)}
// 装配/卸载后的容量预测（用于更换车厢与卸车时的超载保护）
function fitAfterSlot(i,type,lv){
  let cap=0,pass=0;
  (GS.vehicle.wagons||[]).slice(0,getWagonSlots()).forEach((w,idx)=>{
    if(idx===i||!w||!w.cur)return; // idx===i 将被新装配替换
    cap+=getWagonCap(w.cur);pass+=getWagonPass(w.cur);
  });
  if(type){cap+=getWagonCap({type,lv});pass+=getWagonPass({type,lv});}
  return{cap,pass};
}
// 接取任务后：为任务提供容量的车厢不可被卸载/替换（防止换车厢卡容量）
function isWagonLocked(i){
  const w=(GS.vehicle.wagons||[])[i];
  if(!w||!w.cur)return false;
  const hasCargo=(GS.tasks.active||[]).some(t=>t.capType==='cargo'&&!t.delivered);
  const hasPass=(GS.tasks.active||[]).some(t=>t.capType==='pass'&&!t.delivered);
  if(hasCargo&&getWagonCap(w.cur)>0)return true;
  if(hasPass&&getWagonPass(w.cur)>0)return true;
  return false;
}
function wagonKey(type,lv){return type+'_'+lv}
function getOwnedCount(w){return w&&w.owned?Object.keys(w.owned).length:0}
function isOwned(w,type,lv){return !!(w&&w.owned&&w.owned[wagonKey(type,lv)])}
function getWagonSlots(){return Math.max(1,GS.vehicle.level)} // 车厢位=载具等级（Lv1=1、Lv10=10）
function getWagonCap(w){return WAGON_TYPES[w.type].cap[w.lv-1]||0}
function getWagonPass(w){return WAGON_TYPES[w.type].pass[w.lv-1]||0}
function getWagonSpdMul(w){const s=WAGON_TYPES[w.type].spd;return Array.isArray(s)?s[w.lv-1]:s}
function getWagonDurMul(w){return WAGON_TYPES[w.type].dur[w.lv-1]}
// v8.10（C1）：耐久损耗倍率由"全部相乘"改为加权求和（1+Σ(倍率-1)，下限 0.2）。
// 修复全货运车队 1.8^10≈357× 的耐久爆炸；前期单节数值不变，后期"容量高损耗高"梯度仍清晰。
function getWagonDurMulAll(){let mul=1;for(const w of getWagons())mul+=getWagonDurMul(w)-1;return Math.max(0.2,mul)}
function getWagonCost(type,lv){return Math.round(WAGON_TYPES[type].base*WAGON_COST_MUL[lv-1])}
function getVehicleSpeed(){
  let mul=1;for(const w of getWagons())mul*=getWagonSpdMul(w);
  const coreSpeed=GS.vehicle.core?GS.vehicle.core.speed:0; // 载具核心：基础速度加成
  return Math.round((GS.vehicle.speed+coreSpeed)*mul);
}
function getVehicleCapacity(){return getWagons().reduce((s,w)=>s+getWagonCap(w),0)}
// 旅客仓：与货舱独立，物资不可占用旅客仓、旅客同理
function getPassCapacity(){return getWagons().reduce((s,w)=>s+getWagonPass(w),0)}
function getPassUsed(){return GS.vehicle.passengers}
function getUsedCargo(){let s=0;for(let v of Object.values(GS.cargo))s+=v;return s}
// 已接任务占用的容量：deliver 占货舱 qty 格（任务货物），escort 占旅客仓 qty 格（多人）
// 任务货物在任务内管理，不在玩家 cargo 中，无法转移仓库；完成/放弃后自动释放
function getTaskCargoUsed(){return (GS.tasks.active||[]).filter(t=>t.capType==='cargo'&&!t.delivered).reduce((s,t)=>s+t.qty,0)}
function getTaskPassUsed(){return (GS.tasks.active||[]).filter(t=>t.capType==='pass'&&!t.delivered).reduce((s,t)=>s+t.qty,0)}
function getCargoFree(){return getVehicleCapacity()-getUsedCargo()-getTaskCargoUsed()}
function getPassFree(){return getPassCapacity()-getPassUsed()-getTaskPassUsed()}
// 注：getMaxStock 唯一实现在"库存上限"定义处（含声望加成与顺价收紧）；此处无重复定义（v8.12 清理死代码）
function getCurStock(cityId,itemId){return Math.min(GS.cityStocks[cityId]?.[itemId]||0,getMaxStock(cityId,itemId))}

// ===== 车辆耐久系统 =====
// 耐久为点数池：载具升级白值 + 核心强化耐久 + 所有车厢耐久总和
// 载具升级白值：Lv1=100，每级 +20；核心强化：core.dura × 50；车厢：各车厢 hp
function getDurabilityMaxByLevel(lv){return 100+(lv-1)*20}
function getWagonHp(w){return WAGON_TYPES[w.type].hp[w.lv-1]||0}
function getWagonHpAll(){return getWagons().reduce((s,w)=>s+getWagonHp(w),0)}
function getCoreDurability(){return (GS.vehicle.core&&GS.vehicle.core.dura||0)*50}
function getDurabilityMax(){return getDurabilityMaxByLevel(GS.vehicle.level)+getCoreDurability()+getWagonHpAll()}
// 变更耐久上限后刷新：保持当前耐久在 [0, max] 内；added 为新增上限点数（可同步补充当前耐久）
function refreshDurability(added=0){
  GS.vehicle.durability=Math.max(0,Math.min(getDurabilityMax(),GS.vehicle.durability+added));
  GS.vehicle.durabilityMax=getDurabilityMax(); // 保留字段，兼容旧存档
}
// 加载/初始化后按新耐久公式迁移：原本满耐久则补满，否则钳制到新上限
function normalizeVehicleDurability(){
  const oldMax=GS.vehicle.durabilityMax||0;
  const newMax=getDurabilityMax();
  if(GS.vehicle.durability>=oldMax){GS.vehicle.durability=newMax;}
  else{GS.vehicle.durability=Math.min(GS.vehicle.durability,newMax);}
  GS.vehicle.durabilityMax=newMax;
}
function getDurability(){return GS.vehicle.durability}
function getDurabilityPct(){return Math.min(1,GS.vehicle.durability/getDurabilityMax())}
// 损耗率分阶段：耐久越低消耗越快（点/里）；再 × 车厢耐久倍率（非动力车厢掉更快、动力车厢掉更慢）
function getDurabilityRate(){const p=getDurabilityPct();const base=p>0.7?0.5:(p>0.4?0.8:(p>0.2?1.2:1.8));return base*getWagonDurMulAll()}
function calcDurabilityLoss(dist){return Math.round(dist*getDurabilityRate())}
// 耐久状态标签
function getDurabilityState(){
  const p=getDurabilityPct();
  if(p>0.7)return{label:'良好 🟢',cls:''};
  if(p>0.4)return{label:'磨损 ⚠️',cls:'warn'};
  if(p>0.2)return{label:'严重 🟠',cls:'warn'};
  return{label:'危险 🔴',cls:'danger'};
}
// 耐久颜色（进度条填充色）
function getDurabilityColor(){
  const p=getDurabilityPct();
  return p>0.7?'var(--green)':(p>0.2?'var(--sell)':'var(--red)');
}
// 维修费用：修复量 × 基础单价(60) × 等级系数 × 事件乘数（等级越高越贵；v6.5 货币量级）
function getRepairCost(){
  const need=getDurabilityMax()-GS.vehicle.durability;
  const unit=60,levelFactor=1+(GS.vehicle.level-1)*0.25;
  return Math.round(need*unit*levelFactor*getRepairMult(GS.day));
}

// ===== 操作 =====
// —— 货物批次（数组）：用于同城同次倒卖限制与成本展示 ——
// GS.lots[gid] = [ {city, qty, cost, stamp}, ... ]
// stamp = 买入时该城的"停留批次号"（GS.visitStamp[city]）；离开城市再返回后 stamp 递增，
// 旧批次不再属于"同城同次"，从而消除同城倒卖惩罚。
function migrateLots(){
  for(const gid of Object.keys(GS.lots||{})){
    const e=GS.lots[gid];
    if(Array.isArray(e))continue;
    const arr=[];
    for(const cid of Object.keys(e||{})){
      if(e[cid]&&e[cid].qty>0)arr.push({city:cid,qty:e[cid].qty,cost:e[cid].cost||0,stamp:0});
    }
    if(arr.length)GS.lots[gid]=arr;else delete GS.lots[gid];
  }
}
function addLots(gid,city,qty,cost){
  if(!GS.visitStamp[city])GS.visitStamp[city]=1;
  const stamp=GS.visitStamp[city];
  if(!GS.lots[gid])GS.lots[gid]=[];
  const b=GS.lots[gid].find(x=>x.city===city&&x.stamp===stamp);
  if(b){b.cost=Math.round((b.cost*b.qty+cost*qty)/(b.qty+qty));b.qty+=qty;}
  else{GS.lots[gid].push({city,qty,cost,stamp});}
}
// 判断本次卖出是否触发"同城同次 + 本城买入价<卖出价（顺价可套利）"的 60% 惩罚确认
function getSameVisitArbitrage(gid,qty){
  const arr=GS.lots[gid];
  if(!arr||!arr.length)return null;
  const buy=getDayPrice(GS.location,gid,GS.day)||0;
  const sPrice=getSellPrice(GS.location,gid,GS.day)||0;
  if(!(buy<sPrice))return null; // 非"顺价可套利"（买入价高于等于卖出价）时无惩罚判定
  const curStamp=GS.visitStamp[GS.location];
  let sameQty=0;
  for(const b of arr){if(b.city===GS.location&&b.stamp===curStamp)sameQty+=b.qty;}
  if(sameQty<=0)return null;
  return{sameQty:Math.min(sameQty,qty),buy,sPrice};
}
// 卖出时按批次扣除：同城同次批次受惩罚（顺价套利 60% / 普通 80%），其余批次按正常售价
// 返回 {revenue, sameQty, arbitrage}
function consumeLots(gid,qty){
  const sPrice=getSellPrice(GS.location,gid,GS.day)||0;
  const buy=getDayPrice(GS.location,gid,GS.day)||0;
  const arbitrage=buy<sPrice;
  const curStamp=GS.visitStamp[GS.location];
  let remaining=qty,revenue=0,sameQty=0;
  const arr=GS.lots[gid]||[];
  // 先结算同城同次批次
  for(const b of arr){
    if(remaining<=0)break;
    if(b.city===GS.location&&b.stamp===curStamp){
      const take=Math.min(b.qty,remaining);
      const rate=arbitrage?Math.round(buy*0.6):Math.round(b.cost*0.8);
      revenue+=take*rate;sameQty+=take;b.qty-=take;remaining-=take;
    }
  }
  // 其余批次按正常售价
  for(const b of arr){
    if(remaining<=0)break;
    if(b.qty<=0)continue;
    const take=Math.min(b.qty,remaining);
    revenue+=take*sPrice;b.qty-=take;remaining-=take;
  }
  GS.lots[gid]=(GS.lots[gid]||[]).filter(b=>b.qty>0);
  if(!GS.lots[gid].length)delete GS.lots[gid];
  return{revenue,sameQty,arbitrage};
}
function buyItem(itemId,qty){
  advanceDay();if(GS.traveling)return{ok:false,msg:'旅行中不可交易'};
  const city=GS.location,cityObj=getCity(city);
  if(!getBuyableGoods(city).includes(itemId))return{ok:false,msg:'该城不可购买此物资（声望不足或非本城货物）'};
  const price=getDayPrice(city,itemId,GS.day);if(!price)return{ok:false,msg:'价格数据异常'};
  const total=price*qty;if(GS.gold<total)return{ok:false,msg:'资金不足'};
  const stock=getCurStock(city,itemId);if(qty>stock)return{ok:false,msg:'库存不足'};
  if(getCargoFree()<qty)return{ok:false,msg:'载具容量不足'};
  GS.gold-=total;const oldQty=GS.cargo[itemId]||0,oldCost=GS.buyPrice[itemId]||0;
  GS.cargo[itemId]=oldQty+qty;GS.buyPrice[itemId]=Math.round((oldCost*oldQty+total)/(oldQty+qty));
  addLots(itemId,city,qty,price);
  GS.cityStocks[city][itemId]=stock-qty;
  const repGain=qty; // v8.11（C2）：交易为主——买入每 1 件 +1 声望（原每10件+1）
  addRep(city,repGain);
  statAdd('bought',qty); // 成就统计
  if(GS.tutorial&&GS.tutorial.step===1&&ITEMS[itemId].cat==='basic')advanceTutorial(1); // 引导：买入基础物资
  return{ok:true,msg:`购入${qty}件${getItem(itemId).name}${repGain>0?` · ⭐本城声望 +${repGain}`:''}`};
}
function sellItem(itemId,qty){
  advanceDay();if(GS.traveling)return{ok:false,msg:'旅行中不可交易'};
  const held=GS.cargo[itemId]||0;if(held<qty)return{ok:false,msg:'持有不足'};
  const sPrice=getSellPrice(GS.location,itemId,GS.day);if(!sPrice)return{ok:false,msg:'价格异常'};
  const{revenue,sameQty,arbitrage}=consumeLots(itemId,qty);
  GS.cargo[itemId]=held-qty;if(GS.cargo[itemId]<=0){delete GS.cargo[itemId];delete GS.buyPrice[itemId]}
  GS.gold+=revenue;
  const repGain=Math.floor(revenue/1000);
  addRep(GS.location,repGain); // v8.11（C2）：交易为主——卖出每 1000 金 +1 声望（原每5000金+1）
  statAdd('sold',qty);statAdd('income',revenue); // 成就统计
  if(GS.tutorial&&GS.tutorial.step===5)advanceTutorial(5); // 引导：卖出物资
  const sameNote=sameQty>0?`（其中${sameQty}件同城同次买入按${arbitrage?'当前买入价60%':'买入价80%'}结算）`:'';
  return{ok:true,msg:`售出${qty}件${getItem(itemId).name}，得${fmt(revenue)}金${sameNote}${repGain>0?` · ⭐本城声望 +${repGain}`:''}`};
}
function startTravel(destId){
  advanceDay();if(GS.traveling)return{ok:false,msg:'已在旅行中'};
  if(destId===GS.location)return{ok:false,msg:'已在目标城市'};
  if(destId==='starfall')return{ok:false,msg:'星陨城暂未开放，无法前往'}; // v8.10：特殊城暂不开放
  const sp=shortestPath(GS.location,destId);if(!sp)return{ok:false,msg:'无可用路径'};
  if(getDurability()<=0)return{ok:false,msg:'车辆耐久不足，请先维修'};
  const realSec=Math.round(sp.distance/getVehicleSpeed()*60);
  const durLoss=calcDurabilityLoss(sp.distance);
  GS.vehicle.durability=Math.max(0,GS.vehicle.durability-durLoss);
  GS.traveling={to:destId,startedAt:Date.now(),arrivalTime:Date.now()+realSec*1000,routeDistance:sp.distance,pendingEvent:rollPrivateEvent(sp,destId)};
  statAdd('travels',1);statAdd('distance',Math.round(sp.distance)); // 成就统计
  if(GS.tutorial&&GS.tutorial.step===3)advanceTutorial(3); // 引导：前往任务目的地
  return{ok:true,msg:`出发！${fmt(sp.distance)}里，耐久-${durLoss}点`};
}
// 维修车辆（网页内确认弹窗）
function doRepair(){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const cur=GS.vehicle.durability,max=getDurabilityMax();
  if(cur>=max)return toast('车辆耐久完整，无需维修','info');
  const disc=GS.repairDisc||1;
  const cost=Math.round(getRepairCost()*disc);
  if(GS.gold<cost)return toast('资金不足，维修需 '+fmt(cost)+' 金币','err');
  const st=getDurabilityState();
  showModal('🔧 维修车辆',
    `当前耐久：${Math.round(getDurabilityPct()*100)}%（${st.label}）\n维修至完整需花费 ${fmt(cost)} 金币${disc<1?'（工匠折扣 5 折）':''}`,
    '确认维修',()=>{
      GS.gold-=cost;GS.vehicle.durability=getDurabilityMax();GS.repairDisc=null;toast('车辆已维修至完整','ok');render();
    });
}
// ===== 仓库系统（v6.15：分级解锁 + 指数扩建） =====
// 初始无仓库；按城市阶段分级解锁（新手村 500 / 中期 5000 / 高级 50000），初始 100 格
// 扩建 +50 格/次，费用指数增长：解锁价 × 阶段系数^已扩建次数（新手村×1.5、中期×2~2.5、高级×3，越后期越贵）
function getWhConfig(cityId){
  const st=cityStage(cityId);
  if(st===1)return{unlock:500,coef:1.5};
  if(st===2)return{unlock:5000,coef:2};
  if(st===3)return{unlock:5000,coef:2.5};
  return{unlock:50000,coef:3};
}
function getWhExpandCost(cityId){
  const w=GS.warehouses[cityId];if(!w)return 0;
  const cfg=getWhConfig(cityId);
  return Math.round(cfg.unlock*Math.pow(cfg.coef,w.buildCount||0));
}
function doUnlockWarehouse(){
  if(GS.traveling)return toast('旅行中不可操作','info');
  if(GS.warehouses[GS.location])return toast('本城已有仓库','info');
  const cfg=getWhConfig(GS.location);
  if(GS.gold<cfg.unlock)return toast('资金不足，解锁需 '+fmt(cfg.unlock)+' 金币','err');
  GS.gold-=cfg.unlock;
  GS.warehouses[GS.location]={capacity:100,items:{},buildCount:0};
  toast(`🏪 仓库已解锁！（${getCityName(GS.location)} · 100 格）`,'ok');render();
}
function doExpandWarehouse(){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const w=GS.warehouses[GS.location];if(!w)return toast('本城无仓库，请先解锁','info');
  const cost=getWhExpandCost(GS.location);
  if(GS.gold<cost)return toast('资金不足，扩建需 '+fmt(cost)+' 金币','err');
  GS.gold-=cost;w.capacity+=50;w.buildCount=(w.buildCount||0)+1;
  toast(`🏪 仓库扩建成功！容量 ${w.capacity-50} → ${w.capacity} 格`,'ok');render();
}
function doWhIn(itemId,qty){if(GS.traveling)return toast('旅行中不可操作','info');const wh=GS.warehouses[GS.location];if(!wh)return toast('无仓库','err');const held=GS.cargo[itemId]||0;if(qty>held)return;const used=Object.values(wh.items).reduce((a,b)=>a+b,0);if(used+qty>wh.capacity)return toast('仓库满','err');GS.cargo[itemId]=held-qty;if(GS.cargo[itemId]<=0)delete GS.cargo[itemId];wh.items[itemId]=(wh.items[itemId]||0)+qty;toast('已存入仓库','ok');render()}
function doWhOut(itemId,qty){if(GS.traveling)return toast('旅行中不可操作','info');const wh=GS.warehouses[GS.location];if(!wh||!(wh.items[itemId])||wh.items[itemId]<qty)return toast('库存不足','err');if(getCargoFree()<qty)return toast('载具满','err');wh.items[itemId]-=qty;if(wh.items[itemId]<=0)delete wh.items[itemId];GS.cargo[itemId]=(GS.cargo[itemId]||0)+qty;toast('已装入载具','ok');render()}

// ===== 升级素材道具（任务系统产出，用于载具升级） =====
const MATERIALS={gear:{name:'精密齿轮',icon:'⚙️'},repair_kit:{name:'维修套件',icon:'🧰'},fuel_tank:{name:'燃油舱',icon:'🛢️'},engine:{name:'引擎核心',icon:'🔩'}};
function getMat(id){return MATERIALS[id]||{name:id,icon:'📦'}}

// ===== 城市声望系统（每城独立，长期养成） =====
// GS.reputation:{ [cityId]:{ level, exp } }；获取：本城交易额（买按数量、卖按税收折算）+ 完成本城任务
// 效果：① 逐步解锁该城可购物资类型（REP_GOODS，本城特产）② 提升库存上限（每级+15%）
//      ③ 卖出价差减免（每级+1%）④ 情报所联动：range/高级情报概率/消息条数
// 注：声望为长期养成，升级需求 = tierBase × 2^等级（village 3000 / town 8000 / capital 15000 起步，指数增长）
const REP_GOODS={
  oaktown:{2:['mushroom'],3:['honey']},
  ironfort:{2:['steel_blade']},
  saltbay:{2:['sailcloth'],3:['pearl']},
  purplefield:{2:['cheese'],3:['beer']},
  windoasis:{2:['carpet'],3:['leather']},
  moonvalley:{2:['herb'],3:['moon_crystal']},
  frostfort:{2:['fur'],3:['ginseng']}
};
function getRepLevel(cityId){return GS.reputation[cityId]?GS.reputation[cityId].level:0}
function getRepExp(cityId){return GS.reputation[cityId]?GS.reputation[cityId].exp:0}
// 升级阈值：按城市等级差异，指数增长（v6.5 货币量级放大后同步 ×10）
//   village: Lv1=3000 → Lv2=6000 → ...（新手村低门槛）
//   town:    Lv1=8000 → Lv2=16000 → ... → Lv8=1024000（百万级）
//   capital: Lv1=15000 → ...
function getRepTierBase(cityId){
  const c=getCity(cityId);const t=c?c.tier:'town';
  return t==='village'?3000:(t==='capital'?15000:(t==='special'?10000:8000));
}
function getRepExpNeed(cityId){
  const lv=getRepLevel(cityId);
  return Math.round(getRepTierBase(cityId)*Math.pow(2,lv));
}
function addRep(cityId,exp){
  if(exp<=0)return;
  if(!GS.reputation[cityId])GS.reputation[cityId]={level:0,exp:0};
  const r=GS.reputation[cityId];r.exp+=exp;let ups=0;
  while(r.exp>=getRepExpNeed(cityId)){r.exp-=getRepExpNeed(cityId);r.level++;ups++}
  if(ups>0){statAdd('reps',ups);toast(`⭐ ${getCityName(cityId)}声望提升至 Lv${r.level}！`,'ok');} // 成就统计
}
// 本城可购物资 = 基础清单 + 声望逐步解锁的本城特产（REP_GOODS）
function getBuyableGoods(cityId){
  const city=getCity(cityId);if(!city)return[];
  const lv=getRepLevel(cityId),set=new Set(city.goods);
  const g=REP_GOODS[cityId];if(g)for(const k of Object.keys(g)){if(Number(k)>lv)g[k].forEach(id=>set.delete(id));}
  return[...set];
}
// 库存上限：基础 ×（1+0.15×声望等级）；本城买入价<卖出价（顺价可套利）时临时收紧库存
function getMaxStock(cityId,itemId){
  const base=PURCHASE_LIMITS[cityId]?.[itemId]||100;
  let cap=Math.round(base*(1+0.15*getRepLevel(cityId)));
  const buy=getDayPrice(cityId,itemId,GS.day),sell=getSellPrice(cityId,itemId,GS.day);
  if(buy!=null&&sell!=null&&buy<sell){
    const gap=(sell-buy)/buy;
    cap=Math.round(cap*(gap>0.1?0.3:0.5)); // 顺价套利：库存上限临时收紧到五成/三成，抑制同城倒卖
  }
  return cap;
}
// 卖出价差减免：每级声望 +1%（视为更熟悉本城市场）
function getRepSellBonus(cityId){return 1+getRepLevel(cityId)*0.01}

// ===== 任务系统（送货 / 送客 · 多任务 · 任务自带货物/旅客） =====
// 每城任务板：抵达城市刷新 5 个任务位（slot）
// 送货：描述显示实际物资，接取后统一为"任务货物"（占货舱 qty 格），无需玩家备货
// 送客：可多人（qty 1~3），占旅客仓 qty 格
// 多任务：车辆容量允许即可接取多个任务
// 接取后任务位不消失，清空内容显示【查看更多任务】按钮，刷新计次继承
// 刷新：每任务位每城免费 2 次，第 3 次起 1000 金并逐次翻倍
// 任务货物/旅客在任务内管理，无法转移仓库；完成或放弃后释放容量
const TASK_RARITY=[
  {id:'common',name:'普通',goldMul:1,repMul:250,color:'var(--text2)'},
  {id:'rare',name:'稀有',goldMul:1.6,repMul:600,color:'var(--travel)'},
  {id:'epic',name:'史诗',goldMul:2.6,repMul:1500,color:'var(--accent)'},
  {id:'legend',name:'传说',goldMul:4.2,repMul:3000,color:'var(--gold)'}
];
// 声望等级 → 稀有度权重表（普通/稀有/史诗/传说），高稀有度低频
const RARITY_TABLE=[
  [0.72,0.25,0.03,0],     // Lv0
  [0.65,0.28,0.06,0.01],  // Lv1
  [0.58,0.30,0.10,0.02],  // Lv2
  [0.50,0.32,0.15,0.03],  // Lv3
  [0.42,0.34,0.19,0.05]   // Lv4+
];
function getRarity(id){return TASK_RARITY.find(r=>r.id===id)||TASK_RARITY[0]}
function rollRarity(){
  // 稀有度按城市梯度封顶：新手村仅普通/稀有（无史诗传说）、初期无传说、中期起开放传说
  const st=cityStage(GS.location);
  if(st===1)return Math.random()<0.72?TASK_RARITY[0]:TASK_RARITY[1];
  if(st===2){const r=Math.random();return r<0.60?TASK_RARITY[0]:(r<0.90?TASK_RARITY[1]:TASK_RARITY[2]);}
  let rep=Math.min(4,getRepLevel(GS.location));
  const c=getCity(GS.location);
  if(c&&c.tier==='capital')rep=Math.min(4,rep+1); // 王都基础稀有度更高（更高级的城市有更高级的任务）
  if(st===3)rep=Math.min(3,rep); // 中期最高到 Lv3 档（传说权重 3%）
  const table=RARITY_TABLE[Math.floor(rep)];
  let r=Math.random(),acc=0;
  for(let i=0;i<TASK_RARITY.length;i++){acc+=table[i];if(r<acc)return TASK_RARITY[i];}
  return TASK_RARITY[0];
}
// 素材产出：稀有 20% / 史诗 45% / 传说 80%；普通任务不产素材
function pickMat(){
  const r=Math.random();
  if(r<0.45)return'gear';
  if(r<0.70)return'repair_kit';
  if(r<0.90)return'fuel_tank';
  return'engine';
}
function rollMat(R){
  if(R.id==='legend')return Math.random()<0.8?[{id:pickMat(),qty:1}]:[];
  if(R.id==='epic')return Math.random()<0.45?[{id:pickMat(),qty:1}]:[];
  if(R.id==='rare')return Math.random()<0.2?[{id:pickMat(),qty:1}]:[];
  return[];
}
// 送客人数：与任务稀有度挂钩（旅游团/大迁徙），高级城市放大人数
//   common 1~3 · rare 4~8 · epic 10~25 · legend 30~60（×城市系数）
//   王都(×2)传说可达 60~120 人（百人团），需高等级载具旅客仓才能接取
function getCityTierMul(cityId){
  const c=getCity(cityId);const t=c?c.tier:'town';
  return t==='capital'?2:(t==='special'?1.5:1);
}
function rollPassQty(R,cityId){
  const mul=getCityTierMul(cityId);
  let n;
  if(R.id==='legend')n=30+Math.floor(Math.random()*31);
  else if(R.id==='epic')n=10+Math.floor(Math.random()*16);
  else if(R.id==='rare')n=4+Math.floor(Math.random()*5);
  else n=1+Math.floor(Math.random()*3);
  return Math.round(n*mul);
}
function rollTask(cityId,seq){
  const R=rollRarity();
  const st=cityStage(cityId);
  // 目的地限制：仅同阶段及下一阶段城市（新手村只出近邻任务，不出长距离）
  const others=CITIES.filter(c=>c.id!==cityId&&!(c.cityType==='special')&&cityStage(c.id)<=Math.min(4,st+1));
  const to=others[Math.floor(Math.random()*others.length)];
  // 任务金币按【城市阶段 × 距离】计酬（v8.11 与跑商并重）：
  //   新手村：100金/里（2~14里 → 200~1400）· 初期：350 · 中期：1000 · 后期：3000
  //   后期传说长距离最高约 75 万金，与跑商一车利润相当——任务与跑商并行成两条收入线
  const unit=[100,350,1000,3000][st-1];
  const ext=[40,80,150,250][st-1]; // 按件附加（deliver 每件；escort 每人 ×5）
  const dist=(shortestPath(cityId,to.id)||{distance:20}).distance;
  const gold=Math.round(dist*unit*R.goldMul),rep=R.repMul;
  const mats=rollMat(R);
  const id='t'+Date.now()+seq+Math.floor(Math.random()*999);
  if(Math.random()<0.5){
    const goods=getCity(cityId).goods;
    const gid=goods.length?goods[Math.floor(Math.random()*goods.length)]:null;
    if(gid){ // 空货物城（如未开放的特殊城）走送客分支，避免取到 undefined 崩溃
      const qty=5+Math.floor(Math.random()*15);
      return{id,rarity:R.id,type:'deliver',capType:'cargo',from:cityId,to:to.id,item:gid,qty,
        rewardGold:gold+qty*ext,rewardRep:rep+Math.floor(qty/2),rewardMats:mats,
        desc:`运送${getItem(gid).icon}${getItem(gid).name}×${qty}至${getCityName(to.id)}（${dist}里）`,delivered:false};
    }
  }
  const pq=rollPassQty(R,cityId); // 送客人数按稀有度+城市等级（按人计酬 ext×5/人）
  return{id,rarity:R.id,type:'escort',capType:'pass',from:cityId,to:to.id,item:null,qty:pq,
    rewardGold:gold+pq*ext*5,rewardRep:rep,rewardMats:mats,
    desc:`护送${pq}位商客至${getCityName(to.id)}（${dist}里 · 占旅客仓${pq}格）`,delivered:false};
}
// 任务板 slot：{id, state:'task'|'empty', t, refreshCount}
function genTasks(cityId){
  GS.tasks.board=[];
  for(let i=0;i<5;i++)GS.tasks.board.push({id:'s'+Date.now()+i,state:'task',t:rollTask(cityId,i),refreshCount:0});
}
// v8.14：任务板兜底——注册/登录/存档迁移后 board 可能为空（被服务器空存档或 resetGameState 清空），
// 渲染前若为空则补足 5 个任务位，避免新手引导卡在"今日暂无委托"。
function ensureTaskBoard(cityId){
  if(!GS.tasks)GS.tasks={board:[],active:[]};
  if(!Array.isArray(GS.tasks.board)||GS.tasks.board.length===0){
    GS.tasks.board=[];
    for(let i=0;i<5;i++)GS.tasks.board.push({id:'s'+Date.now()+i,state:'task',t:rollTask(cityId,i),refreshCount:0});
  }
}
function getSlotCost(slot){return(slot.refreshCount||0)<2?0:1000*Math.pow(2,(slot.refreshCount||0)-2)}
// —— 付费刷新"今日不再提示" ——
function refreshNudgeKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function isRefreshNudgeOff(){return localStorage.getItem('_refresh_nudge')===refreshNudgeKey();}
function setRefreshNudgeOff(){localStorage.setItem('_refresh_nudge',refreshNudgeKey());}
function doRollSlot(slot){
  const cost=getSlotCost(slot);
  if(cost>0){
    if(GS.gold<cost)return toast('资金不足，刷新需 '+fmt(cost)+' 金币','err');
    GS.gold-=cost;
  }
  slot.refreshCount=(slot.refreshCount||0)+1;
  slot.state='task';
  slot.t=rollTask(GS.location,Math.floor(Math.random()*999));
  toast(cost>0?`已花 ${fmt(cost)} 金币刷新任务`:'已免费刷新任务','ok');render();
}
// 刷新任务位（免费2次后付费，逐次翻倍）；付费前弹窗确认，支持"今日不再提示"
function rollSlot(slot){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const cost=getSlotCost(slot);
  if(cost<=0||isRefreshNudgeOff()){doRollSlot(slot);return;}
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal-box"><h3>🔄 付费刷新任务</h3><p>本次刷新将花费 <b style="color:var(--gold)">${fmt(cost)}</b> 金币<br>（前 2 次免费，之后每次费用翻倍）</p>
  <label class="nudge-check"><input type="checkbox" id="nudge-off"> 今日不再提示</label>
  <div class="modal-btns"><button class="btn-cancel">取消</button><button class="btn-ok">确认刷新</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('.btn-ok').onclick=()=>{const c=document.getElementById('nudge-off');if(c&&c.checked)setRefreshNudgeOff();ov.remove();doRollSlot(slot);};
  ov.querySelector('.btn-cancel').onclick=()=>ov.remove();
  ov.onclick=function(e){if(e.target===ov)ov.remove()};
}
function refreshTask(sid){const s=GS.tasks.board.find(x=>x.id===sid);if(s&&s.state==='task')rollSlot(s);}
function viewMoreTask(sid){const s=GS.tasks.board.find(x=>x.id===sid);if(s&&s.state==='empty')rollSlot(s);}
function acceptTask(sid){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const slot=GS.tasks.board.find(x=>x.id===sid);if(!slot||slot.state!=='task')return;
  const t=slot.t;
  if(t.capType==='cargo'&&getCargoFree()<t.qty)return toast('货舱空间不足，无法装载任务货物','err');
  if(t.capType==='pass'&&getPassFree()<t.qty)return toast('旅客仓空间不足，无法载客','err');
  GS.tasks.active.push(t);
  slot.state='empty';slot.t=null; // 任务位不消失，清空内容；刷新次数继承给"查看更多"
  if(GS.tutorial&&GS.tutorial.step===2)advanceTutorial(2); // 引导：接取任务
  toast(`已接取任务：${t.desc}`,'ok');render();saveNow(); // v8.16：接任务立即保存，刷新不丢
}
function abandonTask(tid){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const t=(GS.tasks.active||[]).find(x=>x.id===tid);if(!t)return;
  showModal('🚫 放弃任务',`确定放弃「${t.desc}」吗？\n${t.capType==='pass'?'商客将下车，旅客仓空间会释放。':'任务货物将被清空，货舱空间会释放。'}`,
    '确认放弃',()=>{
      GS.tasks.active=GS.tasks.active.filter(x=>x.id!==tid);
      toast('任务已放弃','info');render();saveNow(); // v8.16：放弃任务立即保存
    });
}
function completeTask(tid){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const t=(GS.tasks.active||[]).find(x=>x.id===tid);if(!t)return;
  if(!t.delivered)return toast('尚未抵达目的地，无法领取奖励','info');
  GS.gold+=t.rewardGold;addRep(t.from,t.rewardRep);
  for(const m of t.rewardMats||[])GS.materials[m.id]=(GS.materials[m.id]||0)+m.qty;
  const matTxt=(t.rewardMats||[]).map(m=>`${getMat(m.id).icon}${getMat(m.id).name}×${m.qty}`).join('、');
  statAdd('tasks',1); // 成就统计
  if(GS.tutorial&&GS.tutorial.step===4)advanceTutorial(4); // 引导：完成任务
  toast(`任务完成！+${fmt(t.rewardGold)}金 ⭐${getCityName(t.from)}声望+${t.rewardRep}${matTxt?' '+matTxt:''}`,'ok');
  GS.tasks.active=GS.tasks.active.filter(x=>x.id!==tid);
  render();saveNow(); // v8.16：领取奖励后立即保存
}
// 生成任务卡（mode='active' 已接 / 'open' 可接；open 需传 slotId 用于刷新/接取）
function taskCardHtml(t,mode,slotId){
  const R=getRarity(t.rarity);
  const matTxt=(t.rewardMats||[]).map(m=>getMat(m.id).icon+getMat(m.id).name+'×'+m.qty).join(' ');
  const capTxt=t.capType==='cargo'?`任务货物占货舱 ${t.qty} 格`:`旅客占旅客仓 ${t.qty} 格`;
  let reason='';
  if(mode==='open'){
    if(t.capType==='cargo'&&getCargoFree()<t.qty)reason='货舱空间不足';
    else if(t.capType==='pass'&&getPassFree()<t.qty)reason='旅客仓空间不足';
  }
  const canAccept=!reason;
  const topBtn=mode==='open'
    ?`<button class="task-refresh" onclick="refreshTask('${slotId}')" title="刷新任务">🔄</button>`
    :`<button class="task-x" onclick="abandonTask('${t.id}')" title="放弃任务">✖</button>`;
  const mainBtn=mode==='active'
    ?`<button class="btn btn-primary station-btn" onclick="completeTask('${t.id}')" ${t.delivered?'':'disabled'} style="margin-top:8px">✅ 领取奖励</button>`
    :`<button class="btn station-btn" style="background:${canAccept?'var(--accent)':'var(--card)'};color:${canAccept?'#111':'var(--text3)'}" onclick="acceptTask('${slotId}')" ${canAccept?'':'disabled'}>${canAccept?'📥 接取':'⛔ '+reason}</button>`;
  return `<div class="task-card rarity-${t.rarity}" style="border-color:${R.color}">
    <div class="task-top"><span class="task-rarity" style="color:${R.color}">${R.name}</span>${topBtn}</div>
    <div class="task-desc">${t.desc}</div>
    <div class="task-meta">📍${getCityName(t.from)} → 🏁${getCityName(t.to)} · ${capTxt}${mode==='active'&&t.delivered?' · 已抵达':''}${t.to==='starfall'?' · <span style="color:var(--red)">目的地暂未开放</span>':''}</div>
    <div class="task-reward">💰${fmt(t.rewardGold)} · ⭐${t.rewardRep}声望${matTxt?' · '+matTxt:''}</div>
    ${mainBtn}
  </div>`;
}
function renderTaskBoard(){
  const act=GS.tasks.active||[];
  // 上层：已接任务（多任务，无任务也保留高度占位）
  const upper=act.length
    ?`<div class="task-board-active">${act.map(t=>taskCardHtml(t,'active')).join('')}</div>`
    :`<div class="task-board-active task-active-empty">📌 暂无进行中的任务，可在下方任务板接取</div>`;
  // 下层：任务位（任务卡 / 查看更多）
  const rows=GS.tasks.board.map(slot=>{
    if(slot.state==='empty'){
      const cost=getSlotCost(slot);
      const costTxt=cost>0?fmt(cost)+'金':'免费';
      return `<div class="task-card task-slot-empty">
        <div class="task-top"><span class="task-rarity" style="color:var(--text3)">已接取</span></div>
        <div class="task-slot-empty-inner">任务已接取<br><span style="font-size:11px">查看更多将消耗刷新次数</span></div>
        <button class="btn station-btn" style="background:var(--accent);color:#111;margin-top:8px" onclick="viewMoreTask('${slot.id}')">🔎 查看更多任务（${costTxt}）</button>
      </div>`;
    }
    return taskCardHtml(slot.t,'open',slot.id);
  }).join('');
  const grid=rows?`<div class="task-board-grid">${rows}</div>`:`<div class="empty">今日暂无委托</div>`;
  return `<div class="station-panel"><h3>📋 任务板 <span style="font-size:12px;color:var(--text2)">抵达${getCityName(GS.location)}刷新 · 每任务免费刷新2次</span></h3>
  <div class="task-section-label">📌 已接取任务（${act.length}）</div>
  ${upper}
  <div class="task-divider"></div>
  <div class="task-section-label">📋 城市内可接任务（5）</div>
  ${grid}
  <div class="station-placeholder">后续版本：任务类型扩展 · 多人协作（占位）</div></div>`;
}

// ===== 载具升级（金币 + 素材；v6.8 只加车厢位 + 耐久上限） =====
// 车厢位：Lv1=1、每级 +1（Lv10=10）；耐久上限每级 +20；消耗机制不变（金币+素材）
function getUpgradeCost(){
  const lv=GS.vehicle.level;
  return{gold:4000*lv*lv,gear:Math.ceil(lv/2),repair_kit:lv>=2?Math.floor((lv-1)/2):0};
}
function doUpgradeVehicle(){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const lv=GS.vehicle.level,cost=getUpgradeCost();
  if(GS.gold<cost.gold)return toast('资金不足，升级需 '+fmt(cost.gold)+' 金币','err');
  if((GS.materials.gear||0)<cost.gear)return toast('精密齿轮不足，完成本城任务可获得','err');
  if((GS.materials.repair_kit||0)<cost.repair_kit)return toast('维修套件不足，完成本城任务可获得','err');
  const newSlots=getWagonSlots()+1;
  const oldMax=getDurabilityMax(),newMax=getDurabilityMaxByLevel(lv+1)+getCoreDurability()+getWagonHpAll();

// ===== 交互式地图（v7.9：缩放/平移/当前城居中/等高线/曲线路网/云雾） =====
// 视口状态：g 元素 transform="translate(px,py) scale(s)"，世界坐标直接使用城市 x/y
let MAP={s:0.8,px:0,py:0,init:false,drag:null};
const MAP_VW=850,MAP_VH=520; // 视口像素（viewBox 尺寸）
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mapSeed(key){let h=0;for(let i=0;i<key.length;i++){h=(h*31+key.charCodeAt(i))>>>0}return mulberry32(h+7)}
function mapWorldRange(){
  const xs=CITIES.map(c=>c.x),ys=CITIES.map(c=>c.y);
  return{x1:Math.min(...xs)-70,y1:Math.min(...ys)-70,x2:Math.max(...xs)+70,y2:Math.max(...ys)+70};
}
function mapWrapSize(){const w=document.getElementById('map-wrap');return w?[w.clientWidth,w.clientHeight]:[MAP_VW,MAP_VH]}
// v8.13：地图坐标统一为 SVG viewBox 单位（850×520）。
// svg 为 width:100%/height:auto，容器宽高比恒为 850:520，像素→单位系数 k=容器宽/850。
function mapUnitK(){const rw=mapWrapSize()[0];return rw/MAP_VW||1}
function clampMap(){
  const R=mapWorldRange();
  // 以 SVG viewBox（850×520）为边界限制平移区间，保证地图完整可见；
  // 修复此前混用容器像素导致地图边缘被裁且拖不回来的问题。
  const minPx=Math.min(MAP_VW-R.x2*MAP.s,-R.x1*MAP.s),maxPx=Math.max(MAP_VW-R.x2*MAP.s,-R.x1*MAP.s);
  const minPy=Math.min(MAP_VH-R.y2*MAP.s,-R.y1*MAP.s),maxPy=Math.max(MAP_VH-R.y2*MAP.s,-R.y1*MAP.s);
  MAP.px=Math.max(minPx,Math.min(maxPx,MAP.px));
  MAP.py=Math.max(minPy,Math.min(maxPy,MAP.py));
}
function centerOn(cid){
  const c=getCity(cid);if(!c)return;
  MAP.px=MAP_VW/2-c.x*MAP.s;MAP.py=MAP_VH/2-c.y*MAP.s;clampMap();
}
function applyMapView(){
  const g=document.querySelector('.map-scene');
  if(g)g.setAttribute('transform',`translate(${MAP.px.toFixed(1)},${MAP.py.toFixed(1)}) scale(${MAP.s})`);
}
function initMapView(){
  const R=mapWorldRange();
  MAP.sMin=Math.min(MAP_VW/(R.x2-R.x1),MAP_VH/(R.y2-R.y1))*0.9; // 留 10% 观察边距，边缘城市也能在最小缩放下看全地图
  MAP.sMax=Math.min(4,MAP.sMin*4);
  MAP.s=Math.max(MAP.sMin,MAP.sMin*1.9);
  MAP.needCenter=true; // 挂载后按真实容器尺寸居中
}
function mapZoomAt(cx,cy,k){
  const wrap=document.getElementById('map-wrap');if(!wrap)return;
  const rect=wrap.getBoundingClientRect();
  const kk=mapUnitK(); // 像素 → SVG 单位（缩放锚点跟随鼠标）
  const ux=(cx-rect.left)/kk,uy=(cy-rect.top)/kk;
  const wx=(ux-MAP.px)/MAP.s,wy=(uy-MAP.py)/MAP.s;
  const ns=Math.max(MAP.sMin,Math.min(MAP.sMax,MAP.s*k));
  if(ns===MAP.s)return;
  MAP.px=ux-wx*ns;MAP.py=uy-wy*ns;MAP.s=ns;clampMap();applyMapView();
}
function mapZoom(k){ // 按钮：以地图中心缩放
  const wrap=document.getElementById('map-wrap');
  if(wrap){const r=wrap.getBoundingClientRect();mapZoomAt(r.left+r.width/2,r.top+r.height/2,k);}
}
function mapCenter(){ // 回到当前位置：重置为默认缩放并居中，避免缩得太小时无法居中
  if(!MAP.sMin)initMapView();
  MAP.s=Math.max(MAP.sMin,MAP.sMin*1.9);
  centerOn(GS.location);
  applyMapView();
}
// 等高线地形（确定性生成一次：基于全局高度场的统一等值线，适配城市分布，避免局部圆环互相覆盖）
let MAP_DECO=null;
function mapPolyArea(pts){
  let a=0;
  for(let i=0;i<pts.length;i++){
    const p=pts[i],q=pts[(i+1)%pts.length];
    a+=p.x*q.y-q.x*p.y;
  }
  return Math.abs(a/2);
}
function mapNearestCityDist(x,y){
  let d1=1e9,d2=1e9;
  for(const c of CITIES){
    const d=Math.hypot(x-c.x,y-c.y);
    if(d<d1){d2=d1;d1=d;}
    else if(d<d2)d2=d;
  }
  return[d1,d2];
}
function pointSegDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1;
  const len2=dx*dx+dy*dy||1;
  let t=((px-x1)*dx+(py-y1)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  const qx=x1+dx*t,qy=y1+dy*t;
  return Math.hypot(px-qx,py-qy);
}
function pickTerrainPeaks(R){
  const pts=[],stepX=88,stepY=72,edge=60;
  for(let y=R.y1+edge;y<=R.y2-edge;y+=stepY){
    for(let x=R.x1+edge;x<=R.x2-edge;x+=stepX){
      const[d1,d2]=mapNearestCityDist(x,y);
      if(d1<72)continue; // 避开城市本体，给聚落留平缓地
      const centerBias=1-Math.abs((x-(R.x1+R.x2)/2)/((R.x2-R.x1)/2))*0.35;
      const score=d1*1.15+d2*0.35+centerBias*18;
      pts.push({x,y,score});
    }
  }
  pts.sort((a,b)=>b.score-a.score);
  const peaks=[];
  for(const p of pts){
    if(peaks.every(q=>Math.hypot(q.x-p.x,q.y-p.y)>150)){
      peaks.push({
        x:p.x,y:p.y,
        amp:0.34-Math.min(peaks.length,4)*0.04,
        sx:90+peaks.length*10,
        sy:64+peaks.length*8
      });
    }
    if(peaks.length>=5)break;
  }
  if(!peaks.length){
    peaks.push({x:(R.x1+R.x2)/2,y:(R.y1+R.y2)/2,amp:0.28,sx:110,sy:80});
  }
  return peaks;
}
function terrainHeightAt(x,y,R,peaks){
  const nx=(x-R.x1)/(R.x2-R.x1),ny=(y-R.y1)/(R.y2-R.y1);
  let h=0.07
    +0.028*Math.sin(nx*Math.PI*1.45)
    +0.022*Math.cos((ny*1.25+nx*0.42)*Math.PI*2)
    +0.018*Math.sin((nx+ny)*Math.PI*2.2);
  for(const p of peaks){
    const dx=(x-p.x)/p.sx,dy=(y-p.y)/p.sy;
    h+=p.amp*Math.exp(-(dx*dx+dy*dy))*0.82;
  }
  // 王都周边：低丘陵，范围广、起伏缓
  const dc=getCity('dawncapital');
  const dh=Math.hypot((x-dc.x)/220,(y-dc.y)/155);
  h+=0.105*Math.exp(-(dh*dh))*(0.7+0.3*Math.sin(x*0.03+y*0.022));
  h+=0.05*Math.exp(-(Math.hypot((x-(dc.x-120))/170,(y-(dc.y+15))/120)**2));
  // 霜岭堡北侧：高山脊，线密且起伏强
  const ff=getCity('frostfort');
  const ridgeA=pointSegDist(x,y,ff.x-160,ff.y-120,ff.x+30,ff.y-205);
  const ridgeB=pointSegDist(x,y,ff.x-70,ff.y-55,ff.x+170,ff.y-145);
  const northBoost=1+Math.max(0,(ff.y-y))/150;
  h+=0.22*Math.exp(-(ridgeA*ridgeA)/(28*28))*northBoost;
  h+=0.18*Math.exp(-(ridgeB*ridgeB)/(24*24))*northBoost;
  h+=0.05*Math.exp(-(ridgeA*ridgeA)/(70*70))*Math.sin((x+y)*0.05+0.8);
  // 盐湾港附近：沿海缓坡，地势整体更柔和、更开阔
  const sb=getCity('saltbay');
  const coast=pointSegDist(x,y,sb.x-190,sb.y+82,sb.x+170,sb.y+128);
  const coastB=pointSegDist(x,y,sb.x-130,sb.y+36,sb.x+220,sb.y+72);
  h+=0.05*Math.exp(-(coast*coast)/(78*78));
  h+=0.03*Math.exp(-(coastB*coastB)/(96*96));
  h-=0.08*Math.exp(-((x-sb.x)*(x-sb.x))/(260*260)-((y-(sb.y+126))*(y-(sb.y+126)))/(170*170));
  // 星陨城周边：断裂地貌，沿裂谷产生折线状高差
  const sf=getCity('starfall');
  const faultA=pointSegDist(x,y,sf.x-150,sf.y-92,sf.x+145,sf.y+48);
  const faultB=pointSegDist(x,y,sf.x-92,sf.y+92,sf.x+90,sf.y-65);
  const along=((x-sf.x)*0.72+(y-sf.y)*0.48)/44;
  h+=0.15*Math.exp(-(faultA*faultA)/(22*22))*(0.68+0.32*Math.sin(along));
  h+=0.11*Math.exp(-(faultB*faultB)/(18*18))*(0.65+0.35*Math.cos(along*1.35));
  h+=0.05*Math.exp(-(Math.hypot((x-sf.x)/130,(y-sf.y)/96)**2));
  for(const c of CITIES){
    const dx=(x-c.x)/54,dy=(y-c.y)/40;
    h-=0.058*Math.exp(-(dx*dx+dy*dy)); // 城市周边压低，形成更真实的盆地/缓坡
  }
  return Math.max(0,Math.min(1,h));
}
function contourEdgePoint(edge,x,y,step,tl,tr,br,bl,level){
  const lerp=(a,b,va,vb)=>{
    const t=(level-va)/((vb-va)||1e-6);
    return a+(b-a)*Math.max(0,Math.min(1,t));
  };
  if(edge===0)return{x:lerp(x,x+step,tl,tr),y};
  if(edge===1)return{x:x+step,y:lerp(y,y+step,tr,br)};
  if(edge===2)return{x:lerp(x,x+step,bl,br),y:y+step};
  return{x,y:lerp(y,y+step,tl,bl)};
}
function stitchContourSegments(segs,step){
  const keyOf=p=>`${Math.round(p.x*2)}_${Math.round(p.y*2)}`;
  const adj=new Map(),used=new Array(segs.length).fill(false),paths=[];
  const add=(k,ref)=>{if(!adj.has(k))adj.set(k,[]);adj.get(k).push(ref);};
  segs.forEach((s,i)=>{add(keyOf(s[0]),{i});add(keyOf(s[1]),{i});});
  const extend=(path,atHead)=>{
    while(true){
      const cur=atHead?path[0]:path[path.length-1],key=keyOf(cur);
      const nexts=(adj.get(key)||[]).filter(r=>!used[r.i]);
      if(!nexts.length)break;
      const seg=segs[nexts[0].i];used[nexts[0].i]=true;
      const a=seg[0],b=seg[1];
      const next=keyOf(a)===key?b:a;
      if(atHead)path.unshift(next);else path.push(next);
    }
  };
  for(let i=0;i<segs.length;i++){
    if(used[i])continue;
    used[i]=true;
    const path=[segs[i][0],segs[i][1]];
    extend(path,false);extend(path,true);
    if(path.length>=4){
      const f=path[0],l=path[path.length-1];
      if(Math.hypot(f.x-l.x,f.y-l.y)<=step*0.7)path[path.length-1]={x:f.x,y:f.y};
      paths.push(path);
    }
  }
  return paths;
}
function genMapDeco(){
  if(MAP_DECO)return MAP_DECO;

  const peaks=pickTerrainPeaks(R);
  const step=18,nx=Math.ceil((R.x2-R.x1)/step),ny=Math.ceil((R.y2-R.y1)/step);
  const ER={x1:R.x1-220,y1:R.y1-180,x2:R.x2+220,y2:R.y2+180};
  const enx=Math.ceil((ER.x2-ER.x1)/step),eny=Math.ceil((ER.y2-ER.y1)/step);

      const idx=(tl>=lv?1:0)|(tr>=lv?2:0)|(br>=lv?4:0)|(bl>=lv?8:0);
      for(const pair of table[idx]){
        segs.push([
          contourEdgePoint(pair[0],x,y,step,tl,tr,br,bl,lv),
          contourEdgePoint(pair[1],x,y,step,tl,tr,br,bl,lv)
        ]);
      }
    }
    for(const path of stitchContourSegments(segs,step)){
      const d=path.map((p,i)=>`${i?'L':'M'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
      const closed=Math.hypot(path[0].x-path[path.length-1].x,path[0].y-path[path.length-1].y)<=step*0.75;

  MAP_DECO=`<defs>
  <radialGradient id="mapCoreLight" cx="50%" cy="46%" r="62%"><stop offset="0%" stop-color="#3b6a7c" stop-opacity="0.15"/><stop offset="60%" stop-color="#24495e" stop-opacity="0.05"/><stop offset="100%" stop-color="#24495e" stop-opacity="0"/></radialGradient>
  <radialGradient id="cityShieldGrad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#dceeff" stop-opacity="0.15"/><stop offset="60%" stop-color="#dceeff" stop-opacity="0.06"/><stop offset="100%" stop-color="#dceeff" stop-opacity="0"/></radialGradient>
  <radialGradient id="mistGrad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#d9ecf7" stop-opacity="0.10"/><stop offset="60%" stop-color="#9fc3d8" stop-opacity="0.05"/><stop offset="100%" stop-color="#9fc3d8" stop-opacity="0"/></radialGradient>
  <filter id="cityShieldBlur" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="mistBlur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect x="${ox}" y="${oy}" width="${ow}" height="${oh}" fill="url(#mapCoreLight)"/>
  <ellipse cx="${ox+120}" cy="${cy0}" rx="230" ry="${oh*0.42}" fill="url(#mistGrad)" class="mist" filter="url(#mistBlur)"/>
  <ellipse cx="${ox+ow-120}" cy="${cy0}" rx="230" ry="${oh*0.42}" fill="url(#mistGrad)" class="mist" filter="url(#mistBlur)"/>

  <ellipse cx="${cx0}" cy="${oy+oh-96}" rx="${ow*0.42}" ry="160" fill="url(#mistGrad)" class="mist" filter="url(#mistBlur)"/>

// 流动云雾（确定性生成一次：高斯模糊云团 + 缓慢循环平移 + 呼吸透明度）
let MAP_CLOUDS=null;
function genMapClouds(){
  if(MAP_CLOUDS)return MAP_CLOUDS;
  const rnd=mulberry32(20260812);
  const R=mapWorldRange();
  const ER={x1:R.x1-220,y1:R.y1-180,x2:R.x2+220,y2:R.y2+180};
  const w=ER.x2-ER.x1,h=ER.y2-ER.y1;
  const cx=(R.x1+R.x2)/2,cy=(R.y1+R.y2)/2;
  let out='';
  for(let i=0;i<8;i++){
    let ex=0,ey=0;
    const side=i%4;
    if(side===0){ex=ER.x1+40+rnd()*110;ey=ER.y1+rnd()*h;}
    if(side===1){ex=ER.x2-40-rnd()*110;ey=ER.y1+rnd()*h;}
    if(side===2){ex=ER.x1+rnd()*w;ey=ER.y1+20+rnd()*90;}
    if(side===3){ex=ER.x1+rnd()*w;ey=ER.y2-20-rnd()*90;}
    ex=(ex+cx*0.18)/1.18;ey=(ey+cy*0.18)/1.18; // 保留外围感，但别离主图过远
    const rx=72+rnd()*128,ry=26+rnd()*42;
    const dur=45+rnd()*40;
    const dir=(rnd()<0.5?-1:1)*(90+rnd()*170);
    const baseOp=(side<2?0.03:0.022).toFixed(3);
    out+=`<ellipse cx="${ex.toFixed(0)}" cy="${ey.toFixed(0)}" rx="${rx.toFixed(0)}" ry="${ry.toFixed(0)}" fill="#eef8ff" fill-opacity="${baseOp}" class="cloud"><animateTransform attributeName="transform" type="translate" values="0 0; ${dir.toFixed(0)} 0; 0 0" dur="${dur.toFixed(0)}s" repeatCount="indefinite"/></ellipse>`;
  }
  MAP_CLOUDS=`<g filter="url(#cloudBlur)">${out}</g><defs><filter id="cloudBlur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter></defs>`;
  return MAP_CLOUDS;
}
// 曲线路网：按里数分段三次贝塞尔（长路多弯、边缘路大弧度；确定性种子，结果缓存）
let MAP_CURVES={};
function roadCurve(a,b,x1,y1,x2,y2,d){
  // v8.22：key 按端点归一化——地图绘制用 ROADS 顺序、旅行点用 shortestPath 方向（可能相反），
  // 方向敏感 key 会让两者生成形状不同的曲线，导致旅行点"偏移出路网"
  const key=a<b?a+'|'+b:b+'|'+a;
  if(MAP_CURVES[key])return MAP_CURVES[key];
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len;
  const rnd=mapSeed(key);
  const distLi=d||10;
  // 里数越长弧度越大（短途近似直路，长途蜿蜒绕行）：振幅 0.10~0.34
  const amp=Math.min(0.34,0.10+distLi*0.006);
  const segs=distLi>22?3:(distLi>9?2:1); // 长路拆多段 → 多个弯道
  let pd='',cxs=0,cys=0;
  const curves=[];
  for(let s=0;s<segs;s++){
    const t0=s/segs,t1=(s+1)/segs;
    const p0x=x1+dx*t0,p0y=y1+dy*t0;
    const p1x=x1+dx*t1,p1y=y1+dy*t1;
    const off=(rnd()-0.5)*len*amp*2;
    const mx=(p0x+p1x)/2,my=(p0y+p1y)/2;
    const c1x=mx+nx*off,c1y=my+ny*off;
    const c2x=mx+nx*off*0.55,c2y=my+ny*off*0.55;
    pd+=(s===0?`M ${p0x.toFixed(1)} ${p0y.toFixed(1)}`:'')+` C ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p1x.toFixed(1)} ${p1y.toFixed(1)}`;
    curves.push({p0:[p0x,p0y],c1:[c1x,c1y],c2:[c2x,c2y],p1:[p1x,p1y]});
    cxs+=mx;cys+=my;
  }
  MAP_CURVES[key]={d:pd,curves,cx:cxs/segs,cy:cys/segs};
  return MAP_CURVES[key];
}
// 三次贝塞尔求点 / 沿曲线组按【弧长】取点（旅行位置跟随路网，匀速沿曲线行进）
function bezierPt(p0,c1,c2,p1,t){
  const u=1-t;
  return [u*u*u*p0[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p1[0],
          u*u*u*p0[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p1[1]];
}
function bezierLen(c){
  let L=0,px=c.p0[0],py=c.p0[1];
  for(let i=1;i<=24;i++){
    const p=bezierPt(c.p0,c.c1,c.c2,c.p1,i/24);
    L+=Math.hypot(p[0]-px,p[1]-py);px=p[0];py=p[1];
  }
  return L;
}
function pointOnCurves(curves,frac){
  if(!curves||!curves.length)return null;
  const n=curves.length;
  if(!curves._len){ // 缓存各段弧长与总长
    curves._seg=[];curves._len=0;
    for(let i=0;i<n;i++){curves._seg[i]=bezierLen(curves[i]);curves._len+=curves._seg[i];}
  }
  if(curves._len<=0)return bezierPt(curves[0].p0,curves[0].c1,curves[0].c2,curves[0].p1,0);
  let target=Math.max(0,Math.min(1,frac))*curves._len,acc=0;
  for(let i=0;i<n;i++){
    const L=curves._seg[i];
    if(acc+L>=target||i===n-1){
      const t=L>0?Math.max(0,Math.min(1,(target-acc)/L)):0;
      return bezierPt(curves[i].p0,curves[i].c1,curves[i].c2,curves[i].p1,t);
    }
    acc+=L;
  }
  return bezierPt(curves[n-1].p0,curves[n-1].c1,curves[n-1].c2,curves[n-1].p1,1);
}
// 地图拖拽/缩放（pointer 事件：鼠标+触屏+触控笔；事件委托一次性绑定）
function initMapInteract(){
  if(window.__mapOn)return;window.__mapOn=true;
  document.addEventListener('pointerdown',e=>{
    const t=e.target;
    if(!t||!t.closest)return;
    if(!t.closest('#map-wrap'))return;
    if(t.closest('.city-node')||t.closest('.map-tools'))return;
    MAP.drag={sx:e.clientX,sy:e.clientY,px:MAP.px,py:MAP.py,moved:false};
    if(e.cancelable)e.preventDefault();
  });
  document.addEventListener('pointermove',e=>{
    if(!MAP.drag)return;
    const dx=e.clientX-MAP.drag.sx,dy=e.clientY-MAP.drag.sy;
    if(!MAP.drag.moved&&Math.hypot(dx,dy)>5)MAP.drag.moved=true;
    if(MAP.drag.moved){const kk=mapUnitK();MAP.px=MAP.drag.px+dx/kk;MAP.py=MAP.drag.py+dy/kk;clampMap();applyMapView();} // v8.13：拖动增量换算为 SVG 单位
  });
  document.addEventListener('pointerup',()=>{MAP.drag=null;});
  document.addEventListener('wheel',e=>{
    const wrap=document.getElementById('map-wrap');
    if(!wrap||!e.target.closest('#map-wrap'))return;
    e.preventDefault();
    mapZoomAt(e.clientX,e.clientY,e.deltaY>0?0.85:1.18);
  },{passive:false});
}

// 车厢管理：最前为载具核心 slot，其后车厢一字排开（v6.12 每节独立解锁，已购可免费更换）

  let cards=`<div class="wagon-card core-card" onclick="openCoreUpgrade()">

// 更换车厢：两级选择（先类型 → 再等级）；已购买的车厢免费装配，未购买需金币解锁（每节独立）
function replaceWagon(i){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const w=GS.vehicle.wagons[i]||{cur:null,owned:{}};
  let opts='';
  for(const[type,T]of Object.entries(WAGON_TYPES)){
    const caps=[];const c=T.cap[0],p=T.pass[0];
    if(c>0)caps.push(`货舱${c}起`);
    if(p>0)caps.push(`旅客${p}起`);
    caps.push(`损耗${T.dur[0]}~${T.dur[4]}`);
    const hasType=Object.keys(w.owned||{}).some(k=>k.startsWith(type+'_'));
    opts+=`<div class="wagon-cat" style="border-color:${T.color}" onclick="showWagonLevels(${i},'${type}')"><span style="font-size:20px">${T.icon}</span><span style="flex:1"><span style="color:${T.color}">${T.name}${hasType?' <span style="font-size:10px;color:var(--green)">✔ 已解锁</span>':''}</span><br><span style="font-size:11px;color:var(--text3);font-weight:600">${caps.join(' · ')}</span></span><span class="wc-arrow" style="color:${T.color}">›</span></div>`;
  }
  showModal('🚂 选择车厢类型（已解锁的免费装配）',opts,'关闭',()=>{});
}
function showWagonLevels(i,type){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const T=WAGON_TYPES[type];
  const w=GS.vehicle.wagons[i]||{cur:null,owned:{}};
  let opts=`<div class="wagon-cat" onclick="backToWagonTypes(${i})"><span style="font-size:16px">↩</span><span style="flex:1">返回类型选择</span><span class="wc-arrow">‹</span></div>`;
  for(let lv=1;lv<=5;lv++){
    const cost=getWagonCost(type,lv);
    const caps=[];const c=T.cap[lv-1],p=T.pass[lv-1],sp=Array.isArray(T.spd)?T.spd[lv-1]:T.spd,du=T.dur[lv-1];
    if(c>0)caps.push(`货舱${c}`);
    if(p>0)caps.push(`旅客${p}`);
    if(Array.isArray(T.spd))caps.push(`时速×${sp}`);
    else if(sp!==1)caps.push(`时速×${sp}`);
    caps.push(`损耗×${du}`);
    caps.push(`耐久+${T.hp[lv-1]}`);

    const curFlag=w.cur&&w.cur.type===type&&w.cur.lv===lv?'（当前）':'';

  showModal(`🚂 ${T.icon} ${T.name}`,opts,'关闭',()=>{});

function buyWagon(i,type,lv){
  if(i<0||i>=getWagonSlots())return toast('车厢位不存在','err');
  if(isWagonLocked(i))return toast('该车厢正为已接任务提供容量，暂不可更换','err');
  const slot=GS.vehicle.wagons[i]||{cur:null,owned:{}};
  if(!GS.vehicle.wagons[i])GS.vehicle.wagons[i]=slot;
  const key=wagonKey(type,lv);
  // 超载保护：装配后容量须能容纳现有货物与旅客（含已接任务占用）
  const fit=fitAfterSlot(i,type,lv);
  if(getUsedCargo()+getTaskCargoUsed()>fit.cap)return toast('货舱空间不足：现有货物超出该车厢容量，请先转移/卖出','err');
  if(getPassUsed()+getTaskPassUsed()>fit.pass)return toast('旅客仓空间不足：现有旅客超出该车厢容量，请先完成任务','err');
  const hp=WAGON_TYPES[type].hp[lv-1]||0;
  if(isOwned(slot,type,lv)){
    slot.cur={id:'w'+Date.now()+i,type,lv};
    refreshDurability(hp);
    document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
    toast(`✔ 免费装配 ${WAGON_TYPES[type].name} Lv${lv}（已解锁）`,'ok');render();
    return;
  }
  const cost=getWagonCost(type,lv);
  if(GS.gold<cost)return toast('资金不足，解锁需 '+fmt(cost)+' 金币','err');
  GS.gold-=cost;
  slot.owned=slot.owned||{};slot.owned[key]=true;
  slot.cur={id:'w'+Date.now()+i,type,lv};
  refreshDurability(hp);
  statAdd('upgrades',1); // 成就统计
  document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
  toast(`已解锁并装配 ${WAGON_TYPES[type].name} Lv${lv}`,'ok');render();
}
// 卸下车厢（仅解除装配，解锁进度保留；载具必须保留至少一个已装配车厢）
function unloadWagon(i){
  if(GS.traveling)return toast('旅行中不可操作','info');
  if(getWagons().length<=1)return toast('载具必须保留至少一个车厢','err');
  const w=GS.vehicle.wagons[i];
  if(!w||!w.cur)return;
  if(isWagonLocked(i))return toast('该车厢正为已接任务提供容量，暂不可卸载','err');
  // 超载保护：卸下后剩余容量须能容纳现有货物与旅客（含已接任务占用）
  const fit=fitAfterSlot(i);
  if(getUsedCargo()+getTaskCargoUsed()>fit.cap)return toast('货舱空间不足：请先转移/卖出货物再卸下车厢','err');
  if(getPassUsed()+getTaskPassUsed()>fit.pass)return toast('旅客仓空间不足：请先完成任务让旅客下车再卸下车厢','err');
  w.cur=null;
  refreshDurability(0); // 卸下后耐久上限下降，当前耐久钳制到新上限
  toast('车厢已卸下（已解锁的车厢保留，可免费重新装配）','info');render();
}

function getIntelRange(){return isIntelUnlocked(GS.location)?1+Math.floor(getRepLevel(GS.location)/3):0}
function getNearbyCities(loc,range){
  if(range<=0)return[];
  const graph=buildGraph(),q=[{id:loc,d:0}],vis=new Set([loc]),out=[];
  while(q.length){const{id,d}=q.shift();if(d>=1&&d<=range)out.push(id);for(let v in graph[id]){if(!vis.has(v)&&d+1<=range){vis.add(v);q.push({id:v,d:d+1})}}}
  return out;
}

// —— 一般情报：物价行情（由实际物价驱动，纯文字）——
function genPriceIntel(nearby){
  const cityIds=nearby.filter(id=>{const c=getCity(id);return c&&c.goods.length>0});
  const cid=cityIds[Math.floor(Math.random()*cityIds.length)];
  const city=getCity(cid);
  const goods=city.goods.filter(g=>getDayPrice(cid,g,GS.day)!=null);
  const gid=goods[Math.floor(Math.random()*goods.length)];
  const it=getItem(gid);
  const price=getDayPrice(cid,gid,GS.day);
  const sell=getSellPrice(cid,gid,GS.day);
  let trend='平稳';
  const hist=getPriceHistory(cid,gid,30);
  if(hist.length>1){
    const avg=hist.reduce((a,h)=>a+h.price,0)/hist.length;
    const diff=(price-avg)/avg;
    trend=diff>0.08?'一路上涨':(diff<-0.08?'一路下跌':'不温不火');
  }
  const tpl=INTEL_TEMPLATES[Math.floor(Math.random()*INTEL_TEMPLATES.length)];
  return{cls:'intel',text:fillTpl(tpl,{city:getCityName(cid),item:it.name,icon:it.icon,price:fmt(price),sell:fmt(sell),trend})};
}
// —— 打听消息：生成一条情报（数量/概率/范围随本城声望扩展）——
function generateIntelMessages(){
  const range=getIntelRange();
  const nearby=[GS.location,...getNearbyCities(GS.location,range)];
  const ups=getUpcomingEvents().filter(ev=>ev.scope==='global'||ev.scope==='cost'||nearby.includes(ev.city));
  const acts=getActiveEvents().filter(ev=>ev.scope!=='global'&&ev.scope!=='cost'&&nearby.includes(ev.city));
  // 声望因子：本城声望等级提高 → 高级情报概率提升（封顶 40%/55%）
  const rep=getRepLevel(GS.location);
  const pBest=Math.min(0.40,0.18+rep*0.02);
  const pRare=Math.min(0.55,0.32+rep*0.015);
  const r=Math.random();
  if(ups.length>0&&r<pBest){
    const ev=ups[Math.floor(Math.random()*ups.length)];
    markEventKnown(ev);
    const city=ev.city?getCityName(ev.city):'全王国';
    const tpl=INTEL_UPCOMING_TPL[Math.floor(Math.random()*INTEL_UPCOMING_TPL.length)];
    return[{cls:'intel best',text:fillEvTpl(tpl,{city,evname:ev.name,evicon:ev.icon})}];
  }
  if(acts.length>0&&r<pBest+pRare){
    const ev=acts[Math.floor(Math.random()*acts.length)];
    markEventKnown(ev);
    const action=ev.target==='sell'?'出货':'进货';
    const tpl=INTEL_ACTIVE_TPL[Math.floor(Math.random()*INTEL_ACTIVE_TPL.length)];
    return[{cls:'intel rare',text:fillEvTpl(tpl,{city:getCityName(ev.city),evname:ev.name,evicon:ev.icon,action})}];
  }
  return[genPriceIntel(nearby)];
}
function doAskIntel(){
  if(!isIntelUnlocked(GS.location))return toast('请先解锁本城情报所','err');
  if(GS.traveling)return toast('旅行中不可操作','info');
  if(GS.gold<MSG_COST)return toast('资金不足，打听消息需 '+fmt(MSG_COST)+' 金币','err');
  GS.gold-=MSG_COST;
  // 本城声望每 5 级 +1 条消息
  const count=1+Math.floor(getRepLevel(GS.location)/5);
  for(let i=0;i<count;i++){
    const msgs=generateIntelMessages();
    for(const m of msgs)GS.intel.log.push(m);
  }
  render();
}

    <div class="station-card"><div class="sc-label">情报来源</div><div class="sc-val" style="font-size:13px">酒馆打听 · 商旅消息</div><div class="sc-label" style="margin-top:4px">本城声望提升后可获得更珍贵的情报</div></div>
    <div class="station-card"><div class="sc-label">情报范围</div><div class="sc-val">${unlocked?`Lv${range} · 周边${near.length}城`:'—'}</div><div class="sc-label" style="margin-top:4px">本城每3级声望 +1 范围，每5级 +1 条消息</div></div>

function getChartableItems(){
  const loc=GS.location,city=getCity(loc),wh=GS.warehouses[loc],s=new Set([...city.goods]);
  for(let k of Object.keys(GS.cargo))if(GS.cargo[k]>0)s.add(k);
  if(wh)for(let k of Object.keys(wh.items))if(wh.items[k]>0)s.add(k);return[...s];
}
function onChartSelect(){const sel=document.getElementById('chart-select');_chartItem=sel.value||null;if(_chartItem)drawChart()}
function switchMarket(tab){marketTab=tab;renderMarketCards()}
function renderMarketCards(){
  const loc=GS.location,city=getCity(loc),cont=document.getElementById('market-cards');
  if(!cont)return;
  document.querySelector('.buy-tab')?.classList.toggle('active',marketTab==='buy');
  document.querySelector('.sell-tab')?.classList.toggle('active',marketTab==='sell');
  const items=[];
  if(marketTab==='buy'){
    for(let gid of getBuyableGoods(loc)){
      const it=getItem(gid),price=getDayPrice(loc,gid,GS.day),yest=getDayPrice(loc,gid,Math.max(1,GS.day-1));
      const ch=yest&&price?price-yest:0,stock=getCurStock(loc,gid),max=getMaxStock(loc,gid);
      items.push({gid,it,price,ch,stock,max,type:'buy'});
    }
  }else{
    const wh=GS.warehouses[loc],seen=new Set();
    for(let gid of Object.keys(GS.cargo)){if(!GS.cargo[gid])continue;
      const it=getItem(gid),price=getDayPrice(loc,gid,GS.day),sPrice=getSellPrice(loc,gid,GS.day);
      if(!price)continue;
      const whHeld=wh?.items?.[gid]||0;items.push({gid,it,price,sPrice,held:GS.cargo[gid],whHeld,type:'sell'});seen.add(gid);
    }
    if(wh)for(let gid of Object.keys(wh.items)){if(seen.has(gid)||!wh.items[gid])continue;
      const it=getItem(gid),price=getDayPrice(loc,gid,GS.day),sPrice=getSellPrice(loc,gid,GS.day);
      if(!price)continue;items.push({gid,it,price,sPrice,held:0,whHeld:wh.items[gid],type:'sell'});
    }
  }
  let html='';
  for(let r of items){
    const isExp=expandedCard===r.gid;
    const chCls=r.ch>0?'up':(r.ch<0?'down':'flat'),chStr=r.ch>0?`+${r.ch}`:(r.ch<0?r.ch:0);
    html+=`<div class="item-card${isExp?' expanded':''}" data-gid="${r.gid}" onclick="toggleCard('${r.gid}')">`;
    html+=`<span class="ic-icon">${r.it.icon}</span><span class="ic-name">${r.it.name}</span>`;
    html+=`<span class="ic-cat">${r.it.cat==='basic'?'基础':'特产'}</span>`;
    if(r.type==='buy'){
      html+=`<div class="ic-price buy">${fmt(r.price)}</div>`;
      html+=`<div class="ic-change ${chCls}">${chStr}</div>`;
      html+=`<div class="ic-limit">库存 ${r.stock}/${r.max}</div>`;
      html+=`<div class="ic-cargo-info">🚛 ${getUsedCargo()+getTaskCargoUsed()}/${getVehicleCapacity()}</div>`;
      const afford=Math.floor(GS.gold/r.price);
      const maxBuy=Math.min(r.stock, afford, getCargoFree());
      html+=`<div class="ic-detail">${qtySliderHTML(r.gid,maxBuy,Math.min(1,maxBuy))}<div class="row"><button class="btn-action btn-buy" onclick="event.stopPropagation();doAction('buy','${r.gid}')">确认购入</button></div></div>`;
    }else{
      const cost=GS.buyPrice[r.gid]||r.price;
      html+=`<div class="ic-price2"><div class="ic-cost">成本：${fmt(cost)}</div><div class="ic-sell">当前售价：${fmt(r.sPrice)}</div></div>`;
      html+=`<div class="ic-cargo-info">🚛 ${r.held}件 ${r.whHeld>0?`<span class="wh-badge">仓${r.whHeld}</span>`:''}</div>`;
      html+=`<div class="ic-detail">${qtySliderHTML(r.gid,r.held,Math.min(1,r.held))}<div class="row"><button class="btn-action btn-sell" onclick="event.stopPropagation();doAction('sell','${r.gid}')">确认售出</button></div></div>`;
    }
    html+=`</div>`;
  }
  if(items.length===0)html=`<div class="empty">${marketTab==='buy'?'本城无可购物资':'目前没有可出售的物资'}</div>`;
  cont.innerHTML=html;
  if(!_chartItem){
    const buyItems=items.filter(i=>i.type==='buy');
    const first=buyItems[0]||items[0];
    if(first){_chartItem=first.gid;const sel=document.getElementById('chart-select');if(sel)sel.value=_chartItem;drawChart();}
  }
}
function toggleCard(gid){expandedCard=expandedCard===gid?null:gid;renderMarketCards();if(_chartItem)drawChart()}
function doAction(type,gid){
  const qty=getSliderVal(gid);
  if(type==='buy'){const r=buyItem(gid,qty);toast(r.msg,r.ok?'ok':'err');if(r.ok){delete sliderVals[gid];render();}return;}
  // 卖出前：同城同次 + 本城买入价<卖出价（顺价可套利）时弹窗确认 60% 惩罚
  const info=getSameVisitArbitrage(gid,qty);
  if(info){
    const unit60=Math.round(info.buy*0.6);
    showModal('⚠️ 同城倒卖警告',
      `本城该物资当前「买入价 ${fmt(info.buy)}」低于「卖出价 ${fmt(info.sPrice)}」\n本次出售中有 ${info.sameQty} 件为本城本次停留期间买入\n若确认出售，这 ${info.sameQty} 件将按当前买入价的 60%（${fmt(unit60)} 金/件）结算`,
      '确认出售',()=>{doSell(gid,qty);});
    return;
  }
  doSell(gid,qty);
}
function doSell(gid,qty){
  const r=sellItem(gid,qty);
  toast(r.msg,r.ok?'ok':'err');
  if(r.ok){delete sliderVals[gid];render();}
}
function getSliderVal(gid){const sl=document.getElementById('slider-'+gid);return sl?parseInt(sl.value)||1:1}
function qtySliderHTML(gid,maxVal,initVal){
  const base=sliderVals[gid]!==undefined?sliderVals[gid]:(initVal||1);
  const v=Math.max(1,Math.min(base,maxVal));
  return `<div class="qty-slider"><button class="qty-arrow" onclick="event.stopPropagation();setSliderDelta('${gid}',-1)">◀</button>
  <input type="range" id="slider-${gid}" min="1" max="${maxVal}" value="${v}" onclick="event.stopPropagation()" onpointerdown="window._draggingGid='${gid}'" oninput="document.getElementById('sv-${gid}').textContent=this.value;sliderVals['${gid}']=parseInt(this.value)||1" onpointerup="window._draggingGid=null;onSliderRelease()" onchange="event.stopPropagation()">
  <button class="qty-arrow" onclick="event.stopPropagation();setSliderDelta('${gid}',1)">▶</button>
  <span class="qty-val" id="sv-${gid}">${v}</span></div>`;
}
function setSliderDelta(gid,d){const sl=document.getElementById('slider-'+gid);if(sl){const v=Math.min(parseInt(sl.max),Math.max(1,(parseInt(sl.value)||1)+d));sl.value=v;document.getElementById('sv-'+gid).textContent=v;sliderVals[gid]=v;}}
function onSliderRelease(){window._draggingGid=null;if(window._pendingRefresh){window._pendingRefresh=false;render();}}

// ===== 折线图 =====
function drawChart(){
  if(!_chartItem)return;const canvas=document.getElementById('price-chart');if(!canvas)return;
  // 自适应宽度：填充左侧面板，避免右侧留白
  const parent=canvas.parentElement;
  const targetW=Math.max(320,parent.clientWidth-20);
  if(Math.abs(canvas.width-targetW)>1){canvas.width=targetW;}
  canvas.height=300;
  const loc=GS.location,hist=getPriceHistory(loc,_chartItem,_chartDays);
  const ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,padL=55,padR=25,padT=20,padB=35;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1b2a';ctx.fillRect(0,0,W,H);
  if(hist.length<2)return;
  const buyPrices=hist.map(h=>h.price),sellPrices=hist.map(h=>h.sell),allP=[...buyPrices,...sellPrices];
  const minP=Math.min(...allP),maxP=Math.max(...allP),range=maxP-minP||1;
  const pw=(W-padL-padR)/(hist.length-1),by=y=>padT+(H-padT-padB)*(1-(y-minP)/range),bx=i=>padL+i*pw;
  ctx.strokeStyle='#1a1a3a';ctx.lineWidth=0.5;for(let i=0;i<=4;i++){const y=padT+(H-padT-padB)*i/4;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke()}
  ctx.beginPath();ctx.strokeStyle='#ff9f43';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);for(let i=0;i<hist.length;i++){const x=bx(i),y=by(hist[i].sell);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();ctx.setLineDash([]);
  ctx.beginPath();ctx.strokeStyle='#26d98b';ctx.lineWidth=2;for(let i=0;i<hist.length;i++){const x=bx(i),y=by(hist[i].price);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();
  const last=hist[hist.length-1];ctx.beginPath();ctx.arc(bx(hist.length-1),by(last.price),5,0,Math.PI*2);ctx.fillStyle='#26d98b';ctx.fill();ctx.beginPath();ctx.arc(bx(hist.length-1),by(last.sell),4,0,Math.PI*2);ctx.fillStyle='#ff9f43';ctx.fill();
  ctx.fillStyle='#8b95a5';ctx.font='10px sans-serif';for(let i=0;i<=4;i++){const y=padT+(H-padT-padB)*i/4;ctx.fillText(fmt(Math.round(maxP-(maxP-minP)*i/4)),2,y+4)}
  const steps=hist.length<=30?5:(hist.length<=60?8:12);for(let i=0;i<hist.length;i+=Math.ceil(hist.length/steps))ctx.fillText(hist[i].day,bx(i),H-padB+14);
  ctx.font='10px sans-serif';ctx.fillStyle='#26d98b';ctx.fillRect(W-160,padT,10,3);ctx.fillStyle='#ff9f43';ctx.fillRect(W-80,padT,10,3);ctx.fillStyle='#8b95a5';ctx.fillText('买入价',W-147,padT-2);ctx.fillText('卖出价',W-67,padT-2);
  const curBuy=last.price,curSell=last.sell,buyPct=Math.round((hist.length-buyPrices.filter(p=>p>curBuy).length)/hist.length*100);
  const trend=getTrend(GS.location,_chartItem),spreadPct=Math.round((1-curSell/curBuy)*100);
  const cls=trend.cls==='up'?'color:var(--buy)':(trend.cls==='down'?'color:var(--red)':'color:var(--text2)');
  document.getElementById('chart-stats').innerHTML=`<span class="stat">买入 <b class="buy">${fmt(curBuy)}</b></span><span class="stat">卖出 <b class="sell">${fmt(curSell)}</b> (${spreadPct}%off)</span><span class="stat">${_chartDays}日最低 <b>${fmt(Math.min(...buyPrices))}</b></span><span class="stat">${_chartDays}日最高 <b>${fmt(Math.max(...buyPrices))}</b></span><span class="stat">分位 <b>${buyPct}%</b></span><span class="stat" style="${cls}">${trend.label}</span>`;
}

  html+=`<h3>🚛 载具 <span style="font-size:12px;color:var(--text2)">Lv${GS.vehicle.level} | 货舱 ${used+taskCargo}/${cap} | 旅客 ${passUsed}/${passCap} | ${getVehicleSpeed()}里/分</span></h3>`;

    const cfg=getWhConfig(loc);

      <button class="btn btn-primary btn-small" onclick="doUnlockWarehouse()" ${GS.gold<cfg.unlock?'disabled':''}>🔓 解锁仓库（${fmt(cfg.unlock)} 金/100 格）</button></div>`;
  }
  else{
    const whUsed=Object.values(wh.items).reduce((a,b)=>a+b,0);
    const exCost=getWhExpandCost(loc);
    html+=`<p style="font-size:12px;color:var(--text2);margin-bottom:6px">${whUsed}/${wh.capacity}格
      <button class="btn-sm btn-buy-sm" style="float:right" onclick="doExpandWarehouse()" ${GS.gold<exCost?'disabled':''}>扩建 +50 格（${fmt(exCost)} 金）</button></p><div class="wh-list">`;
    if(whUsed===0)html+=`<div class="empty">仓库为空</div>`;
    for(let[id,qty]of Object.entries(wh.items)){
      if(!qty)continue;const it=getItem(id);
      html+=`<div class="wh-row"><span>${it.icon} ${it.name} ×${qty}</span><div class="qty-inline"><input type="number" id="wqty-${id}" value="${Math.min(1,qty)}" min="1" max="${qty}" style="width:50px"><button class="btn-sm btn-buy-sm" onclick="doWhOut('${id}',parseInt(document.getElementById('wqty-${id}').value)||1)">→载具</button></div></div>`;
    }
    html+=`</div>`;
  }
  return html;
}

function bindEvents(){
  if(currentTab==='map'&&MAP.needCenter){MAP.needCenter=false;centerOn(GS.location);applyMapView();} // 首次地图挂载后按真实尺寸居中
  document.querySelectorAll('.city-node').forEach(circle=>{circle.onclick=function(e){e.stopPropagation();const destId=this.dataset.city;if(destId==='starfall')return toast('星陨城暂未开放','info');if(destId===GS.location&&!GS.traveling)return;if(GS.traveling)return toast('正在旅行中','info');const sp=shortestPath(GS.location,destId);if(!sp)return;const realSec=Math.round(sp.distance/getVehicleSpeed()*60);const destName=getCityName(destId);const durLoss=calcDurabilityLoss(sp.distance);showModal(`前往 ${destName}`,`${fmt(sp.distance)} 里路程 · 约 ${realSec} 秒抵达\n预计耐久 -${durLoss}点（当前耐久 ${Math.round(getDurabilityPct()*100)}%）`,'出发',()=>{const r=startTravel(destId);toast(r.msg,r.ok?'ok':'err');if(r.ok)render();});}});
  document.querySelectorAll('.chart-time button').forEach(b=>{b.onclick=function(){document.querySelectorAll('.chart-time button').forEach(x=>x.classList.remove('active'));this.classList.add('active');_chartDays=parseInt(this.dataset.days);drawChart();}});
}

// ===== 导航 + 定时 =====
document.querySelectorAll('nav button').forEach(btn=>{btn.addEventListener('click',function(){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));this.classList.add('active');currentTab=this.dataset.tab;render()})});
let _tickCount=0;
setInterval(()=>{
  _tickCount++;
  const arrived=advanceDay();
  const dragging=!!window._draggingGid;
  if(arrived&&!dragging){render();return;}
  if(arrived&&dragging){window._pendingRefresh=true;}
  if(window._pendingRefresh&&!dragging){window._pendingRefresh=false;render();return;}
  renderTopbar();
  // 事件横幅倒计时每秒刷新（不重渲染整个内容区）
  const eb=document.getElementById('event-board');
  if(eb)eb.innerHTML=renderEventBoard();
  // 旅行中：仅增量更新地图位置点与进度（不重建地图，避免城市页/路网动画闪烁）
  // 抵达时 advanceDay 返回 arrived → 上面已全量 render()
  if(!dragging&&GS.traveling&&currentTab==='map'){updateTravelUI();}
},1000);
markCityAsKnown(GS.location);
genTasks(GS.location);
normalizeVehicleDurability(); // 新账号按耐久公式补满
migrateLots(); // 新账号批次结构初始化
if(!GS.visitStamp[GS.location])GS.visitStamp[GS.location]=1; // 初始停留批次
document.querySelector('nav button[data-tab="map"]').classList.add('active');currentTab='map';render();
// 指令台：全局挂载，可键盘调用
window.runCmd=runCmd;
// 地图交互（缩放/拖拽，事件委托一次性绑定）
initMapInteract();
// 弹幕聊天室初始化（延迟到 DOM 就绪：chat-fab 位于脚本之后的 HTML 中）
function initChatUI(){initChatFab();chatLoad();startChatPolling();}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initChatUI);}else{initChatUI();}
// v8.0 登录门禁：未登录账号时弹出注册/登录界面（全屏遮罩挡住游戏，不可跳过）
// v8.15：已登录账号刷新后自动恢复在线会话——此前 ONLINE 不恢复，排行榜/聊天/存档都走离线分支导致数据"清空"
const __bootUser=localStorage.getItem(AUTH_KEY);
if(!__bootUser){const ao=document.getElementById('auth-overlay');if(ao){ao.style.display='flex';toggleAuth('login');}}
else{(async()=>{
  const online=await startOnline();
  if(online){await fullSync();}
  else if(getUsers().includes(__bootUser))window.__gsReady=true; // v8.20：服务器不可用时，本机离线账号允许本机保存
})();} // 拉取服务器世界与玩家存档并恢复在线状态
</script>
