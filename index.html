<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" class=""><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾尔希亚跑商</title>
<style>
/* ===== 主题 ===== */
:root{
  --bg:#0f1724; --panel:#192437; --card:#1e3048; --cardHover:#25405e;
  --accent:#ff6b6b; --gold:#f0c040; --green:#26d98b; --red:#ff5e5e;
  --text:#e2e6ed; --text2:#8b95a5; --text3:#566270;
  --buy:#26d98b; --sell:#ff9f43; --travel:#5b9bd5;
  --village:#5a8a5a; --town:#4a7a9a; --capital:#c09840; --frontier:#6a5070; --special:#8a5a8a;
  --radius:10px; --radius-sm:6px; --shadow:0 2px 12px rgba(0,0,0,0.3);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#app{max-width:1300px;margin:0 auto;padding:0 8px 20px}

/* ===== 顶部栏 ===== */
#topbar{display:flex;align-items:center;gap:16px;padding:8px 16px;background:var(--panel);border-radius:0 0 var(--radius) var(--radius);margin-bottom:8px;font-size:13px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);flex-wrap:wrap}
#topbar .t-stat{display:flex;align-items:center;gap:5px;white-space:nowrap}
#topbar .t-label{color:var(--text3);font-size:11px}
#topbar .t-val{color:var(--text);font-weight:600}
#topbar .t-gold{color:var(--gold);font-weight:700;font-size:15px}
#topbar .t-loc{color:var(--text);font-weight:600;display:flex;align-items:center;gap:4px}
#topbar .t-loc .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
#topbar .t-travel{color:var(--travel);animation:pulse 1.5s infinite}
#topbar .t-user{font-size:12px;color:var(--text2);white-space:nowrap}
#topbar .t-user b{color:var(--gold);font-weight:600}
#topbar .t-logout{margin-left:2px;padding:2px 9px;font-size:11px;border:1px solid rgba(240,120,120,.4);border-radius:6px;background:rgba(240,120,120,.08);color:#f0a0a0;cursor:pointer}
#topbar .t-logout:hover{background:rgba(240,120,120,.22);color:#fff}
#topbar .t-right{margin-left:auto;display:flex;align-items:center;gap:8px}
@keyframes pulse{50%{opacity:0.5}}
@keyframes fadeIn{from{opacity:0}}@keyframes scaleIn{from{transform:scale(0.8);opacity:0}to{transform:scale(1);opacity:1}}
#topbar .sep{width:1px;height:20px;background:var(--text3);opacity:0.3}

/* ===== 导航 ===== */
nav{display:flex;background:var(--panel);border-radius:var(--radius) var(--radius) 0 0;overflow:hidden}
nav button{flex:1;padding:10px;background:transparent;color:var(--text2);border:none;cursor:pointer;font-size:13px;transition:all 0.2s;position:relative;min-width:80px}
nav button.active{color:var(--text);background:var(--card);font-weight:600}
nav button.active::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--accent);border-radius:1px}
nav button:hover{color:var(--text);background:rgba(255,255,255,0.03)}

/* ===== 内容 ===== */
#content{background:var(--card);border-radius:0 0 var(--radius) var(--radius);padding:16px;min-height:500px;box-shadow:var(--shadow)}
#view-map,#view-city,#view-vehicle,#view-achrank{display:none}
#view-map.active,#view-city.active,#view-vehicle.active,#view-achrank.active{display:block}

/* ===== 地图（v7.9 交互式：缩放/平移/等高线/曲线路网/云雾） ===== */
.map-wrap{position:relative;background:radial-gradient(circle at 50% 44%,rgba(59,106,124,0.20) 0%,rgba(36,73,94,0.10) 40%,rgba(13,31,47,0) 72%),linear-gradient(165deg,#0d1f2f 0%,#143246 52%,#0c1c2a 100%);border-radius:var(--radius-sm);overflow:hidden;border:1px solid rgba(90,169,240,.10);cursor:grab}
.map-wrap:active{cursor:grabbing}
.map-wrap svg{display:block;width:100%;height:auto;touch-action:none}
.map-scene .iso,.map-scene .iso-f,.map-scene .iso-tex,.map-scene .road-line,.map-scene .road-flow,.map-scene .road-label,.map-scene .cloud,.map-scene .city-shield,.map-scene .mist{pointer-events:none}
.iso{fill:none;stroke:rgba(110,188,154,0.22);stroke-width:1;animation:isoBreathe 4.2s ease-in-out infinite}
.iso-tex{stroke:rgba(144,205,178,0.10);stroke-width:0.85;stroke-linecap:round}
.iso-f{fill:rgba(86,165,128,0.05)}
.iso-f1{fill:rgba(86,165,128,0.04);animation-delay:0s}
.iso-f2{fill:rgba(86,165,128,0.07);animation-delay:-0.8s}
.iso-f3{fill:rgba(86,165,128,0.10);animation-delay:-1.6s}
.iso-f4{fill:rgba(86,165,128,0.13);animation-delay:-2.4s}
@keyframes isoBreathe{0%,100%{stroke:rgba(110,188,154,0.18);filter:drop-shadow(0 0 0 rgba(120,210,175,0))}50%{stroke:rgba(158,236,201,0.45);filter:drop-shadow(0 0 5px rgba(120,220,180,0.28))}}
.city-node{cursor:pointer;transition:all 0.2s;stroke:rgba(7,16,24,0.72);stroke-width:1.35;paint-order:stroke fill}
.city-node:hover{filter:brightness(1.35)}
.city-node.closed{opacity:0.45;cursor:not-allowed}
.city-node.closed:hover{filter:none}
.city-node.tier-village{fill:var(--village)}
.city-node.tier-town{fill:var(--town)}
.city-node.tier-capital{fill:var(--capital)}
.city-node.tier-frontier{fill:var(--frontier)}
.city-node.tier-special{fill:var(--special)}
.city-node.current{stroke:var(--gold);stroke-width:2.6;animation:glow 2s infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px var(--gold))}50%{filter:drop-shadow(0 0 7px var(--gold))}}
.road-line{stroke:#5f83ab;stroke-width:2.35;fill:none;stroke-linecap:round}
.road-flow{stroke:#b8ddff;stroke-width:1.35;fill:none;stroke-linecap:round;stroke-dasharray:5 9;animation:roadFlow 3s linear infinite}
@keyframes roadFlow{from{stroke-dashoffset:14}to{stroke-dashoffset:0}}
.road-label{font-size:9px;fill:rgba(215,232,246,0.55);text-anchor:middle;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.city-label{font-size:13px;fill:#eef7ff;text-anchor:middle;pointer-events:none;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.95)}
.cloud{pointer-events:none;animation:cloudPulse 12s ease-in-out infinite}
.cloud:nth-child(odd){animation-delay:-4s}
@keyframes cloudPulse{0%,100%{opacity:0.012}50%{opacity:0.045}}
.map-tools{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:5}
.map-tools button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(90,169,240,.35);background:rgba(10,20,32,.75);color:var(--text);font-size:15px;cursor:pointer;line-height:1}
.map-tools button:hover{background:rgba(90,169,240,.25);color:#fff}
.map-info{display:flex;gap:12px;align-items:center;padding:8px 14px;margin-top:8px;background:rgba(0,0,0,0.45);border-radius:var(--radius-sm);font-size:12px;color:var(--text2)}
.map-info .city-name{color:var(--gold);font-weight:600;font-size:14px}
.map-hint{font-size:11px;color:var(--text3);margin-top:6px;text-align:center}

/* ===== 旅行进度条 ===== */
.travel-progress{flex:1;height:22px;background:var(--bg);border-radius:11px;overflow:hidden;position:relative}
.travel-progress .fill{height:100%;background:linear-gradient(90deg,var(--travel),#4a90d9);border-radius:11px;transition:width 1s linear}
.travel-progress .text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:600;color:#fff;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,0.5)}

/* ===== 城市双栏（左右各 50%） ===== */
.city-layout{display:flex;gap:14px;align-items:flex-start}
.city-left{flex:1 1 0;min-width:0;overflow:hidden}
.city-right{flex:1 1 0;min-width:0;display:flex;flex-direction:column;max-height:calc(100vh - 150px)}

/* ===== 车站栏目 ===== */
.station-panel{background:var(--panel);border-radius:var(--radius);padding:14px;margin-top:14px}
.station-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.station-card{background:var(--bg);border-radius:var(--radius-sm);padding:12px}
.station-card .sc-label{color:var(--text3);font-size:11px;margin-bottom:4px}
.station-card .sc-val{font-size:15px;font-weight:700;color:var(--text)}
.station-card .sc-val.warn{color:var(--sell)}
.station-card .sc-val.danger{color:var(--red)}
.dur-bar{height:8px;background:var(--card);border-radius:4px;overflow:hidden;margin-top:6px}
.dur-bar .fill{height:100%;border-radius:4px;background:var(--green);transition:width 0.3s}
.station-btn{width:100%;margin-top:10px}
.station-placeholder{font-size:11px;color:var(--text3);border:1px dashed var(--text3);border-radius:var(--radius-sm);padding:10px;text-align:center;margin-top:6px;background:var(--bg)}
.task-row{padding:10px 12px;background:var(--panel);border-radius:var(--radius-sm);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.task-section-label{font-size:12px;font-weight:700;color:var(--text2);margin:10px 0 6px}
.task-divider{border-top:1px solid var(--text3);margin:12px 0 4px;opacity:0.4}
/* 已接任务区：固定高度占位（无任务也保留），卡片固定宽，超出横向滑动 */
.task-board-active{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;min-height:160px;align-items:flex-start}
.task-board-active .task-card{flex:0 0 260px}
.task-active-empty{display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px;background:var(--bg);border:1px dashed var(--text3);border-radius:var(--radius-sm);min-height:110px}
/* 可接任务区：固定宽度卡片一字排开，不自适应宽度，超出横向滑动 */
.task-board-grid{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.task-card{position:relative;background:var(--panel);border:1px solid var(--text3);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:0 0 240px;min-height:170px;justify-content:space-between}
.task-top{display:flex;justify-content:space-between;align-items:center}
.task-rarity{font-size:12px;font-weight:700}
.task-refresh,.task-x{background:none;border:none;cursor:pointer;font-size:14px;color:var(--text2);padding:2px 4px;line-height:1}
.task-refresh:hover,.task-x:hover{color:var(--gold)}
.task-desc{font-size:13px;line-height:1.5;min-height:38px}
.task-meta{font-size:11px;color:var(--text3)}
.task-reward{font-size:12px;color:var(--gold)}
.task-slot-empty{border-style:dashed;background:var(--bg)}
.task-slot-empty-inner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--text3);font-size:12px;gap:4px}
/* ===== 车厢管理 ===== */
.wagon-panel{margin-top:12px}
.wagon-card{position:relative;background:var(--panel);border:1px solid var(--text3);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:0 0 180px;min-height:150px;justify-content:space-between}
.wagon-name{font-size:13px;font-weight:700}
.wagon-slot-empty{border-style:dashed;border-color:var(--accent);background:var(--bg);align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:all 0.2s}
.wagon-slot-empty:hover{border-color:var(--gold);background:rgba(255,215,0,0.06);transform:translateY(-2px)}
.wagon-slot-empty .wagon-plus{color:var(--accent)}
.wagon-plus{font-size:30px;color:var(--text3);line-height:1}
.core-card{border-color:var(--gold);background:linear-gradient(180deg,rgba(255,215,0,0.08),rgba(255,215,0,0.02));border-width:2px}
/* 车厢选择弹窗按钮化（v6.11）：类型=大卡片按钮、等级=带徽章价格按钮 */
.wagon-cat{display:flex;align-items:center;gap:10px;width:100%;background:var(--bg);border:2px solid var(--text3);border-radius:var(--radius-sm);padding:13px 15px;margin:7px 0;font-size:14px;font-weight:800;cursor:pointer;transition:all 0.15s;text-align:left}
.wagon-cat:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,0.3);border-color:var(--gold)}
.wagon-cat:active{transform:translateY(0)}
.wagon-cat .wc-arrow{margin-left:auto;font-size:18px;font-weight:900;opacity:0.6}
.wagon-opt{display:flex;align-items:center;gap:8px;width:100%;background:var(--panel);border:2px solid var(--text3);border-radius:var(--radius-sm);padding:10px 12px;margin:5px 0;font-size:13px;cursor:pointer;transition:all 0.15s;text-align:left}
.wagon-opt:hover{border-color:var(--gold);background:rgba(255,215,0,0.08);transform:translateX(4px)}
.wagon-opt:active{transform:translateX(0)}
.wagon-opt .wo-lv{flex:0 0 auto;background:var(--text3);color:var(--bg);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:800}
.wagon-opt .wo-price{margin-left:auto;font-weight:800;color:var(--gold);white-space:nowrap}
.wh-split{border-top:1px solid var(--text3);margin:14px 0;opacity:0.4}
/* ===== 新手引导面板（v6.14） ===== */
.tutorial-panel{background:linear-gradient(90deg,rgba(91,155,213,0.14),rgba(91,155,213,0.05));border:1px solid var(--travel);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tut-head{font-weight:800;color:var(--travel);white-space:nowrap}
.tut-progress{background:var(--travel);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;margin-left:6px}
.tut-body{flex:1;min-width:200px;font-size:13px;color:var(--text)}
.tut-btns{display:flex;gap:6px;align-items:center}
.tut-steps{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--text3)}
.tut-step{padding:2px 8px;border-radius:10px;background:var(--panel);border:1px solid var(--text3)}
.tut-step.tut-done{color:var(--green);border-color:var(--green);background:rgba(80,200,120,0.08)}
.tut-step.tut-cur{color:#111;background:var(--accent);border-color:var(--accent);font-weight:700}

/* ===== 认证覆盖层（v7.0 内测） ===== */
.auth-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:99999;display:flex;align-items:center;justify-content:center}
.auth-box{background:var(--panel);border:2px solid var(--gold);border-radius:var(--radius);padding:32px 36px;width:380px;max-width:95vw;text-align:center}
.auth-box h2{font-size:22px;color:var(--gold);margin-bottom:4px}
.auth-box .auth-sub{font-size:12px;color:var(--text3);margin-bottom:20px}
.auth-field{margin-bottom:14px;text-align:left}
.auth-field label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:600}
.auth-field input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--text3);border-radius:var(--radius-sm);color:var(--text);font-size:14px;outline:none;transition:border-color 0.15s}
.auth-field input:focus{border-color:var(--gold)}
.auth-err{color:var(--red);font-size:12px;margin-bottom:10px;min-height:18px}
.auth-btns{display:flex;gap:8px;justify-content:center;margin-top:4px}
.auth-toggle{font-size:12px;color:var(--text3);margin-top:14px}
.auth-toggle span{color:var(--travel);cursor:pointer;font-weight:600}
.auth-toggle span:hover{text-decoration:underline}

/* ===== 图表面板 ===== */
.chart-panel{background:var(--panel);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column}
.chart-panel canvas{width:100%;height:auto}
.chart-panel h4{font-size:13px;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.chart-panel h4 select{padding:4px 8px;background:var(--bg);color:var(--text);border:1px solid var(--text3);border-radius:4px;font-size:12px}
.chart-time{display:flex;margin-bottom:8px}
.chart-time button{padding:4px 16px;background:var(--bg);color:var(--text2);border:1px solid var(--text3);font-size:12px;cursor:pointer;transition:0.2s}
.chart-time button:first-child{border-radius:4px 0 0 4px}
.chart-time button:last-child{border-radius:0 4px 4px 0}
.chart-time button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chart-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;margin-top:8px;color:var(--text2)}
.chart-stats .stat{background:var(--bg);padding:4px 10px;border-radius:4px}
.chart-stats .stat b{color:var(--text)}
.chart-stats .stat .buy{color:var(--buy)}
.chart-stats .stat .sell{color:var(--sell)}
canvas{border-radius:var(--radius-sm);max-width:100%}

/* ===== 市场卡片 ===== */
.market-panel{background:var(--panel);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0}
.market-tabs{display:flex}
.market-tabs button{flex:1;padding:10px;background:var(--bg);color:var(--text2);border:none;cursor:pointer;font-size:13px;transition:0.2s}
.market-tabs button.active{background:var(--card);color:var(--text);font-weight:600}
.market-tabs button.buy-tab.active{border-bottom:2px solid var(--buy)}
.market-tabs button.sell-tab.active{border-bottom:2px solid var(--sell)}
.market-cards{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;overflow-y:auto;min-height:0}
.item-card{background:var(--bg);border-radius:var(--radius-sm);padding:10px;cursor:pointer;transition:all 0.2s;border:1px solid transparent;position:relative}
.item-card:hover{border-color:var(--text3);background:var(--cardHover)}
.item-card.expanded{border-color:var(--accent);background:var(--cardHover)}
.item-card .ic-icon{font-size:28px;display:block;margin-bottom:4px}
.item-card .ic-name{font-size:13px;font-weight:600;color:var(--text)}
.item-card .ic-cat{font-size:10px;color:var(--text3)}
.item-card .ic-price{font-size:16px;font-weight:700;margin:4px 0}
.item-card .ic-price.buy{color:var(--buy)}
.item-card .ic-price.sell{color:var(--sell)}
.item-card .ic-price2{font-size:12px;margin:4px 0;line-height:1.5}
.item-card .ic-price2 .ic-cost{color:var(--text3);font-weight:600}
.item-card .ic-price2 .ic-sell{color:var(--sell);font-weight:700;font-size:13px}
.item-card .ic-change{font-size:11px}
.item-card .ic-change.up{color:var(--buy)}
.item-card .ic-change.down{color:var(--red)}
.item-card .ic-change.flat{color:var(--text3)}
.item-card .ic-limit{font-size:10px;color:var(--text3);margin-top:2px}
.item-card .ic-detail{display:none;margin-top:8px;border-top:1px solid var(--text3);padding-top:8px}
.item-card.expanded .ic-detail{display:block}
.item-card .ic-detail .row{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:12px}
.item-card .ic-detail .btn-action{flex:1;padding:7px;border:none;border-radius:4px;color:#fff;font-size:13px;cursor:pointer;font-weight:600}
.item-card .ic-detail .btn-buy{background:var(--buy)}
.item-card .ic-detail .btn-sell{background:var(--sell)}
.item-card .ic-cargo-info{font-size:10px;color:var(--text3);margin-top:4px}
.wh-badge{display:inline-block;background:var(--sell);color:#fff;font-size:9px;padding:1px 6px;border-radius:8px;margin-left:4px}

/* ===== 数量滑块 ===== */
.qty-slider{display:flex;align-items:center;gap:4px;margin:6px 0}
.qty-slider .qty-arrow{width:26px;height:26px;border:none;border-radius:4px;background:var(--panel);color:var(--text);cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;transition:0.15s}
.qty-slider .qty-arrow:hover{background:var(--cardHover)}
.qty-slider input[type=range]{flex:1;height:6px;-webkit-appearance:none;background:var(--panel);border-radius:3px;outline:none;cursor:pointer}
.qty-slider input[type=range]::-webkit-slider-thumb{width:20px;height:20px;-webkit-appearance:none;background:var(--accent);border-radius:50%;cursor:pointer;border:2px solid #fff}
.qty-val{font-weight:700;font-size:16px;min-width:40px;text-align:center;color:var(--text)}

/* ===== Toast（居中偏上长条形） ===== */
#toast-container{position:fixed;top:12%;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{padding:10px 32px;border-radius:20px;color:#fff;font-size:14px;font-weight:600;animation:toastIn 0.35s ease;box-shadow:0 4px 20px rgba(0,0,0,0.5);min-width:200px;text-align:center}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
.toast.info{background:var(--travel)}
@keyframes toastIn{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ===== 居中确认弹窗 ===== */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.65);z-index:9998;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.2s}
.modal-box{background:var(--panel);border-radius:var(--radius);padding:24px;max-width:380px;width:90%;box-shadow:0 8px 40px rgba(0,0,0,0.6);text-align:center}
.modal-box h3{font-size:17px;margin-bottom:6px}
.modal-box p{color:var(--text2);font-size:13px;margin:8px 0 16px;white-space:pre-line}
.modal-box .modal-btns{display:flex;gap:10px;justify-content:center}
.modal-box .modal-btns button{padding:8px 28px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer}
.modal-box .btn-ok{background:var(--accent);color:#fff}
.modal-box .btn-cancel{background:var(--bg);color:var(--text2)}
.modal-box .nudge-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);margin:0 0 14px;cursor:pointer;justify-content:center}

/* ===== 载具仓库 ===== */
.wh-list{max-height:320px;overflow-y:auto}
.wh-list .wh-row{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:var(--bg);border-radius:4px;margin-bottom:4px;font-size:13px}
.wh-list .wh-row .qty-inline{display:flex;align-items:center;gap:6px}
.wh-list .wh-row input{width:60px;padding:3px 6px;background:var(--panel);color:var(--text);border:1px solid var(--text3);border-radius:3px;font-size:12px;text-align:center}
.wh-list .wh-row .btn-sm{padding:3px 10px;border:none;border-radius:3px;cursor:pointer;font-size:11px;font-weight:600}
.btn-buy-sm{background:var(--buy);color:#fff}
.btn-sell-sm{background:var(--sell);color:#fff}

/* ===== 事件横幅 ===== */
.event-board{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.event-chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--text3);color:var(--text);font-size:12px;padding:5px 12px;border-radius:16px;cursor:pointer;transition:all 0.2s}
.event-chip:hover{border-color:var(--accent);color:#fff;background:var(--cardHover)}
.event-chip.st-active{border-color:var(--green);color:var(--green)}
.event-chip.st-ending{border-color:var(--sell);color:var(--sell)}
.event-chip.st-upcoming{border-color:var(--travel);color:var(--travel)}
.event-chip.st-active:hover,.event-chip.st-ending:hover,.event-chip.st-upcoming:hover{color:#fff}
.ev-row{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.06);line-height:1.6;cursor:pointer;border-radius:var(--radius-sm)}
.ev-row:hover{background:var(--cardHover)}
.modal-box p{max-height:60vh;overflow-y:auto;margin:0}

/* ===== 情报所·聊天 ===== */
.intel-chat{display:flex;flex-direction:column;gap:6px;margin:10px 0;max-height:340px;overflow-y:auto}
.chat-msg{font-size:13px;line-height:1.7;padding:8px 12px;border-radius:10px;background:var(--card);color:var(--text);max-width:92%;border-left:3px solid var(--text3)}
.chat-msg.sys{color:var(--text2);font-size:12px;text-align:center;background:transparent;border-left:none}
.chat-msg.intel{border-left-color:var(--travel)}
.chat-msg.best{border-left-color:var(--gold);background:linear-gradient(135deg,rgba(240,192,64,0.10),var(--card))}
.chat-msg.rare{border-left-color:var(--accent);background:linear-gradient(135deg,rgba(255,107,107,0.08),var(--card))}

/* ===== 通用 ===== */
.btn{padding:8px 18px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s}
.btn:disabled{opacity:0.4;cursor:default}
.btn-primary{background:var(--accent);color:#fff}
.btn-small{padding:4px 12px;font-size:11px}
h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.empty{text-align:center;color:var(--text3);padding:40px;font-size:13px}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--text3);border-radius:3px}

// Toast 通知（居中偏上长条形）
function toast(msg,type='info'){const c=document.getElementById('toast-container');const d=document.createElement('div');d.className='toast '+type;d.textContent=msg;c.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity 0.3s';setTimeout(()=>d.remove(),300)},2000)}
// 居中确认弹窗（msg 中的 \n 渲染为换行）
function showModal(title,msg,btnText,onOk){const ov=document.createElement('div');ov.className='modal-overlay';ov.innerHTML=`<div class="modal-box"><h3>${title}</h3><p>${String(msg).replace(/\n/g,'<br>')}</p><div class="modal-btns"><button class="btn-cancel">取消</button><button class="btn-ok">${btnText}</button></div></div>`;document.body.appendChild(ov);ov.querySelector('.btn-ok').onclick=()=>{ov.remove();onOk();};ov.querySelector('.btn-cancel').onclick=()=>ov.remove();ov.onclick=function(e){if(e.target===ov)ov.remove()}}
// 双按钮选择弹窗（私人事件等需要抉择的场景）
function showChoice(title,msg,btn1,btn2,on1,on2){const ov=document.createElement('div');ov.className='modal-overlay';ov.innerHTML=`<div class="modal-box"><h3>${title}</h3><p>${String(msg).replace(/\n/g,'<br>')}</p><div class="modal-btns"><button class="btn-ok" id="ch-1">${btn1}</button><button class="btn-cancel" id="ch-2">${btn2}</button></div></div>`;document.body.appendChild(ov);ov.querySelector('#ch-1').onclick=()=>{ov.remove();if(on1)on1();};ov.querySelector('#ch-2').onclick=()=>{ov.remove();if(on2)on2();};ov.onclick=function(e){if(e.target===ov){ov.remove();if(on2)on2();}}}

// ===== 静态数据 =====
const CITIES=[
  {id:'greentown',name:'绿田村',tier:'village',x:180,y:120,goods:['grain','flour','cup','hemp']},
  {id:'rivertown',name:'溪木村',tier:'village',x:260,y:160,goods:['cup','candle','hemp','tissue']},

  {id:'purplefield',name:'紫穗原',tier:'town',x:280,y:460,goods:['grain','flour','cloth','soap','beer','wool','cheese']},
  {id:'windoasis',name:'风语绿洲',tier:'town',x:520,y:420,goods:['hemp','pottery','tissue','salt','spice','leather','carpet']},
  {id:'moonvalley',name:'月影谷',tier:'town',x:700,y:340,goods:['pottery','tissue','soap','hemp','herb','moon_crystal','oil']},
  {id:'dawncapital',name:'晨曦王都',tier:'capital',x:500,y:300,goods:['grain','flour','cloth','ironware','pottery','cup','tissue','soap']},
  {id:'frostfort',name:'霜岭堡',tier:'frontier',x:780,y:140,goods:['cloth','candle','ironware','cup','fur','ginseng','ivory']},
  {id:'starfall',name:'星陨城',tier:'special',x:560,y:500,cityType:'special',goods:[]}

const ROADS=[['greentown','rivertown',2],['greentown','milltown',2],['rivertown','pasturetown',2],['milltown','pasturetown',2],['greentown','oaktown',10],['milltown','purplefield',12],['pasturetown','saltbay',14],['oaktown','ironfort',15],['oaktown','dawncapital',20],['purplefield','dawncapital',16],['purplefield','saltbay',14],['saltbay','dawncapital',18],['saltbay','windoasis',22],['dawncapital','moonvalley',25],['ironfort','moonvalley',20],['ironfort','frostfort',40],['moonvalley','frostfort',35],['dawncapital','frostfort',60],['windoasis','oaktown',25],['saltbay','starfall',50],['frostfort','starfall',45]];
const ITEMS={grain:{id:'grain',name:'谷物',cat:'basic',icon:'🌾'},flour:{id:'flour',name:'面粉',cat:'basic',icon:'🌾'},cloth:{id:'cloth',name:'粗布',cat:'basic',icon:'🧵'},ironware:{id:'ironware',name:'铁器',cat:'basic',icon:'🔧'},pottery:{id:'pottery',name:'陶器',cat:'basic',icon:'🏺'},cup:{id:'cup',name:'木杯',cat:'basic',icon:'🥤'},tissue:{id:'tissue',name:'纸巾',cat:'basic',icon:'🧻'},soap:{id:'soap',name:'肥皂',cat:'basic',icon:'🧼'},candle:{id:'candle',name:'蜡烛',cat:'basic',icon:'🕯'},salt:{id:'salt',name:'食盐',cat:'basic',icon:'🧂'},hemp:{id:'hemp',name:'麻绳',cat:'basic',icon:'🪢'},oak:{id:'oak',name:'橡木',cat:'special',icon:'🪵'},mushroom:{id:'mushroom',name:'菌菇',cat:'special',icon:'🍄'},honey:{id:'honey',name:'野蜂蜜',cat:'special',icon:'🍯'},iron_ingot:{id:'iron_ingot',name:'铁锭',cat:'special',icon:'⛏'},steel_blade:{id:'steel_blade',name:'精钢刃',cat:'special',icon:'⚔'},fish:{id:'fish',name:'海鱼',cat:'special',icon:'🐟'},pearl:{id:'pearl',name:'珍珠',cat:'special',icon:'💎'},sailcloth:{id:'sailcloth',name:'帆布',cat:'special',icon:'⛵'},beer:{id:'beer',name:'麦酒',cat:'special',icon:'🍺'},wool:{id:'wool',name:'羊毛',cat:'special',icon:'🧶'},cheese:{id:'cheese',name:'奶酪',cat:'special',icon:'🧀'},spice:{id:'spice',name:'香料',cat:'special',icon:'🌶'},leather:{id:'leather',name:'皮革',cat:'special',icon:'👜'},carpet:{id:'carpet',name:'毛毯',cat:'special',icon:'🧣'},herb:{id:'herb',name:'药草',cat:'special',icon:'🌿'},moon_crystal:{id:'moon_crystal',name:'月光水晶',cat:'special',icon:'💠'},oil:{id:'oil',name:'精油',cat:'special',icon:'💧'},fur:{id:'fur',name:'毛皮',cat:'special',icon:'🦊'},ginseng:{id:'ginseng',name:'雪参',cat:'special',icon:'🌱'},ivory:{id:'ivory',name:'猛犸牙',cat:'special',icon:'🦷'}};

// ===== 工具 =====
function fmt(n){return n.toLocaleString()}
function getCity(id){return CITIES.find(c=>c.id===id)}
function getCityName(id){const c=getCity(id);return c?c.name:id}
function getItem(id){return ITEMS[id]}
// 城市梯度（发育阶段）：1=新手村 2=初期 3=中期 4=后期
//   新手村 village：greentown/rivertown/milltown/pasturetown
//   初期 town：oaktown/ironfort/saltbay/purplefield（新手村近邻）
//   中期 town：windoasis/moonvalley
//   后期：dawncapital(王都)/frostfort(边疆)/starfall(特殊)
function cityStage(id){
  const c=getCity(id);if(!c)return 1;
  const t=c.tier;
  if(t==='village')return 1;
  if(t==='town')return(['oaktown','ironfort','saltbay','purplefield'].includes(id)?2:3);
  return 4;
}

// ===== 价格引擎（v1.6 两级模型：中枢价 + 日内抖动 + 独立买卖） =====
function buildBasePrices(){
  const p={};
  for(let c of CITIES){p[c.id]={};
    for(let k of Object.keys(ITEMS)){

//   village：基础 50~80（短时间可搬空，中期收益小，引导玩家转战城镇）

function r10(a,b){return a+Math.floor(Math.random()*((b-a)/10+1))*10}

      else if(c.tier==='special')lim[c.id][gid]=high?r10(40,70):r10(100,180);
      else if(ITEMS[gid].cat==='basic')lim[c.id][gid]=r10(120,200);
      else if(high)lim[c.id][gid]=r10(30,50);
      else lim[c.id][gid]=r10(60,120);
    }

}

function seededRnd(seed){let x=Math.sin(seed)*43758.5453;return x-Math.floor(x)}
// ============================================================
// v3.1 股市风格价格引擎（挂靠 2 小时中枢）
// 正式规格：中枢价每 2 现实小时调整一次，游戏日为日内波动刻度。
// 每件物资在每座城市拥有一条完全独立的市场剧本：
//   正常物价带 → 极小概率突破(1.5%/中枢周期) → 趋势段(4~6 个中枢周期,
//   每中枢 12%~18%，累积约翻倍/减半，现实持续数小时)
//   → 王国调控(2~3 个中枢周期拉回正常带) → 小概率永久改变物价带(漂移)
// 物资之间相互独立：每 (城市,物资) 走独立确定性种子。
// 正式模式：游戏日=10 分钟，中枢周期=12 游戏日=2 小时。
// ============================================================
const CENTRAL_PERIOD=12;      // 一个中枢周期的游戏日数（正式：中枢 2 小时 ÷ 游戏日 10 分钟 = 12 游戏日）
const BREAKOUT_PROB=0.015;    // 每中枢周期发生突破的概率（极小）
const SHIFT_PROB=0.15;        // 突破后永久改变物价带的概率（小概率）
const MAX_EVENT_SPAN=9;       // 单次事件最大覆盖中枢数（趋势 6 + 调控 3）
// 稳定种子工具：salt 用于区分 买入/卖出/事件流 等独立序列
function mkSeed(cityId,itemId,hub,salt){return (cityId.charCodeAt(0)*1e4+itemId.charCodeAt(0)*1e2+hub*31+salt*17)}
// —— 基础物价带：正常波动范围（基础物资窄、特产宽，激进版）——
// center 可选：默认取 BASE_PRICES；卖出价引擎以 base×0.95 为中心
function getBaseBand(cityId,itemId,center){
  const base=center!==undefined?center:BASE_PRICES[cityId]?.[itemId];
  if(!base)return null;
  const it=ITEMS[itemId];
  let w=0.25;
  if(it&&it.cat==='special')w=['moon_crystal','ivory','ginseng','pearl','steel_blade'].includes(itemId)?0.60:0.45;
  return{min:Math.round(base*(1-w)),max:Math.round(base*(1+w))};
}
// —— 单中枢市场剧本（接口①：事件系统可读取/扩展）——
// 突破事件以"中枢周期"为节拍：一次突破影响后续 4~6 个中枢（现实数小时），概率极小
function getClusterEvent(cityId,itemId,hub,salt){
  const ev={breakout:false,shift:false};
  if(seededRnd(mkSeed(cityId,itemId,hub,1+salt*50))>=BREAKOUT_PROB)return ev;
  ev.breakout=true;
  ev.dir=seededRnd(mkSeed(cityId,itemId,hub,2+salt*50))<0.5?1:-1;                 // 突破方向
  ev.trendHubs=Math.floor(4+seededRnd(mkSeed(cityId,itemId,hub,3+salt*50))*3);     // 趋势段 4~6 个中枢周期
  ev.hubStep=0.12+seededRnd(mkSeed(cityId,itemId,hub,4+salt*50))*0.06;             // 每中枢 12%~18%（累积约翻倍/减半）
  ev.interHubs=Math.floor(2+seededRnd(mkSeed(cityId,itemId,hub,5+salt*50))*2);     // 王国调控段 2~3 个中枢周期
  const s=seededRnd(mkSeed(cityId,itemId,hub,6+salt*50));
  ev.shift=s<SHIFT_PROB;                                                          // 是否永久漂移
  if(ev.shift){
    ev.shiftDir=seededRnd(mkSeed(cityId,itemId,hub,7+salt*50))<0.7?ev.dir:-ev.dir;
    ev.shiftAmp=0.25+seededRnd(mkSeed(cityId,itemId,hub,8+salt*50))*0.35;          // +25%~60%（或按比例下移）
  }
  return ev;
}
// —— 链式物价带：前序突破完全结束（趋势+调控）后，漂移累积进后续正常范围 ——
function getEffectiveBand(cityId,itemId,hub,salt,center){
  let band=getBaseBand(cityId,itemId,center);
  if(!band)return null;
  for(let h=0;h<hub;h++){
    const ev=getClusterEvent(cityId,itemId,h,salt);
    if(ev.shift&&h+ev.trendHubs+ev.interHubs<hub){
      const k=ev.shiftDir>0?1+ev.shiftAmp:1-ev.shiftAmp*0.6;
      band={min:Math.round(band.min*k),max:Math.round(band.max*k)};
    }
  }
  return band;
}
// —— 正常段中枢价：物价带内确定性取值（该中枢周期固定）——
function normalHubPrice(cityId,itemId,hub,band,salt){
  const mid=(band.min+band.max)/2,rad=(band.max-band.min)/2;
  return mid+(seededRnd(mkSeed(cityId,itemId,hub,50+salt))-0.5)*rad;
}
// —— 向前回溯当前中枢是否处于某个未结束的突破事件中 ——
function findActiveEvent(cityId,itemId,hub,salt){
  for(let h=hub;h>=Math.max(0,hub-MAX_EVENT_SPAN);h--){
    const ev=getClusterEvent(cityId,itemId,h,salt);
    if(ev.breakout){
      const k=hub-h;
      if(k<=ev.trendHubs+ev.interHubs)return{ev,k};
      return null;   // 该突破已结束，更早的不可能覆盖当前
    }
  }
  return null;
}
// —— 核心价格函数（接口②：任意 (city,item,day) 求价，买卖走独立种子）——
// 中枢价 2 现实小时一跳（游戏日内 ±2.5% 抖动）；multiplier：事件乘数注入点
function priceFor(cityId,itemId,day,salt,center,multiplier){
  if(multiplier===undefined)multiplier=1;
  if(!BASE_PRICES[cityId]||!BASE_PRICES[cityId][itemId])return null;
  const hub=Math.floor(day/CENTRAL_PERIOD);
  const band=getEffectiveBand(cityId,itemId,hub,salt,center);
  if(!band)return null;
  const act=findActiveEvent(cityId,itemId,hub,salt);
  let hubBase;
  if(!act){
    hubBase=normalHubPrice(cityId,itemId,hub,band,salt);
  }else{
    const{ev,k}=act;
    const breakoutBase=ev.dir>0?band.max*1.2:band.min*0.8;
    if(k===0){hubBase=breakoutBase;}                                                   // 突破中枢
    else if(k<=ev.trendHubs){hubBase=breakoutBase*Math.pow(1+ev.dir*ev.hubStep,k);}    // 趋势段（跨多个中枢）
    else{                                                                              // 王国调控段：线性拉回
      const trendEnd=breakoutBase*Math.pow(1+ev.dir*ev.hubStep,ev.trendHubs);
      const target=(band.min+band.max)/2;
      hubBase=trendEnd+(target-trendEnd)*((k-ev.trendHubs)/ev.interHubs);
    }
  }
  const jitter=(seededRnd((cityId.charCodeAt(0)*1e3+itemId.charCodeAt(0)+day+Math.floor(salt/7))*37031)-0.5)*0.05;
  return Math.round(hubBase*(1+jitter)*multiplier);
}
function getDayPrice(cityId,itemId,day){return priceFor(cityId,itemId,day,0,undefined,getItemMult(cityId,itemId,day,'buy'))}
function getSellPrice(cityId,itemId,day){
  const base=BASE_PRICES[cityId]?.[itemId];if(base==null)return null;
  return Math.round(priceFor(cityId,itemId,day,100,Math.round(base*(1-getSpreadRate(cityId,day))),getItemMult(cityId,itemId,day,'sell'))*getRepSellBonus(cityId));
}
function getPriceHistory(cityId,itemId,days=120){
  const h=[];for(let d=Math.max(1,GS.day-days+1);d<=GS.day;d++){
    const p=getDayPrice(cityId,itemId,d),s=getSellPrice(cityId,itemId,d);
    if(p!==null&&s!==null)h.push({day:d,price:p,sell:s});
  }return h;
}
// —— 当前市场阶段判定（接口③：UI 标注 / 事件系统消费）——
function getMarketPhase(cityId,itemId,day){
  const hub=Math.floor(day/CENTRAL_PERIOD);
  const act=findActiveEvent(cityId,itemId,hub,0);
  if(!act)return{phase:'normal'};
  const{ev,k}=act;
  if(k===0)return{phase:'breakout',dir:ev.dir};
  if(k<=ev.trendHubs)return{phase:'trend',dir:ev.dir};
  return{phase:'intervention'};
}
// —— 趋势标注：基于市场阶段 + 当前价在物价带中的位置 ——
function getTrend(cityId,itemId){
  if(!BASE_PRICES[cityId]||!BASE_PRICES[cityId][itemId])return{label:'数据不足',cls:''};
  const day=GS.day,hub=Math.floor(day/CENTRAL_PERIOD);
  const band=getEffectiveBand(cityId,itemId,hub,0);if(!band)return{label:'数据不足',cls:''};
  const ph=getMarketPhase(cityId,itemId,day);
  const price=getDayPrice(cityId,itemId,day);
  if(ph.phase==='breakout')return ph.dir>0?{label:'📈 突破涨停',cls:'up'}:{label:'📉 突破跌停',cls:'down'};
  if(ph.phase==='trend')return ph.dir>0?{label:'📈 暴涨中',cls:'up'}:{label:'📉 暴跌中',cls:'down'};
  if(ph.phase==='intervention')return{label:'🏛 王国调控中',cls:'flat'};
  const pos=(price-band.min)/((band.max-band.min)||1);
  if(pos>0.85)return{label:'📈 高位运行',cls:'up'};
  if(pos<0.15)return{label:'📉 低位运行',cls:'down'};
  return{label:'📊 平稳波动',cls:'flat'};
}

function evSeed(id,hub){let x=0;for(let i=0;i<id.length;i++)x+=id.charCodeAt(i)*(i+1);return Math.sin((x+hub*29)*7.31)*43758.5453}
function evRnd(s){return s-Math.floor(s)}
function eventStartHub(ev,hub){return evRnd(evSeed(ev.id,hub))<ev.freq}
// —— 当前中枢编号：与事件状态同源（gameStartTime + getHubMs 时间轴）——
// v8.17：不再依赖 GS.day，杜绝玩家间（存档/离线/指令造成的）天数分叉导致事件与价格不一致
function getEventHubNow(){return Math.floor((Date.now()-GS.gameStartTime)/getHubMs())}
// —— 当前生效的公共事件（确定性，按中枢周期回溯）——
function getActiveEvents(){
  const hub=getEventHubNow(),out=[];
  for(const ev of EVENT_TABLE){
    for(let h=hub;h>=Math.max(0,hub-EVENT_MAX_HUBS);h--){
      if(eventStartHub(ev,h)){
        if(hub>=h&&hub<h+ev.hubs)out.push({...ev,startHub:h,remainHubs:h+ev.hubs-hub});
        break;
      }
    }
  }
  return out;
}
// —— 时间常量与状态 ——
const HUB_MS=7200000;           // 正式：1 中枢周期 = 2 现实小时（游戏日=10 分钟 × 12）
// v8.12（B2）：事件中枢时长随世界流速缩放——GM timescale 加速时事件周期同步加速，事件时间轴与游戏日一致
function getHubMs(){return HUB_MS/(GS.timeScale||1)}
const UPCOMING_WINDOW=300000;    // 预告窗口：事件开始前 5 分钟内显示"将要进行"
const ENDING_WINDOW=120000;      // 结束窗口：剩余 2 分钟内显示"即将结束"
// —— 将要进行的事件（确定性预告：未来最近触发实例，距开始 ≤ 预告窗口）——
function getUpcomingEvents(){
  const hub=getEventHubNow(),out=[];
  for(const ev of EVENT_TABLE){
    for(let h=hub+1;h<=hub+1+EVENT_MAX_HUBS;h++){
      if(eventStartHub(ev,h)){
        const startMs=GS.gameStartTime+h*getHubMs();
        if(startMs>Date.now()&&startMs-Date.now()<=UPCOMING_WINDOW)out.push({...ev,startHub:h});
        break;
      }
    }
  }
  return out;
}
// —— 事件状态：进行中 / 即将结束 / 将要进行（已结束返回 null，不显示）——
function getEventStatus(ev){
  const startMs=GS.gameStartTime+ev.startHub*getHubMs();
  const endMs=startMs+ev.hubs*getHubMs();
  const now=Date.now();
  if(now<startMs){
    if(startMs-now<=UPCOMING_WINDOW)return{label:'将要进行',cls:'st-upcoming',remain:null};
    return null;
  }
  const remain=endMs-now;
  if(remain<=0)return null;
  return remain<=ENDING_WINDOW
    ?{label:'即将结束',cls:'st-ending',remain:Math.round(remain/1000)}
    :{label:'进行中',cls:'st-active',remain:Math.round(remain/1000)};
}
function fmtCountdown(sec){const m=Math.floor(sec/60),s=sec%60;return m>0?`${m}分${s}秒`:`${s}秒`}
// —— 价格乘数：global/city/item 事件叠加，buy/sell 可独立生效 ——
// mode：'buy' 或 'sell'；事件 target 字段控制作用面（buy/sell/both，缺省=both）
function getItemMult(city,item,day,mode){
  let m=1;
  for(const ev of getActiveEvents()){
    if(!ev.mult)continue;
    if(ev.target&&ev.target!=='both'&&ev.target!==mode)continue;
    if(ev.scope==='global'&&ev.items&&ev.items.includes(item))m*=ev.mult;
    else if(ev.scope==='city'&&ev.city===city&&(!ev.item||ev.item===item))m*=ev.mult;
    else if(ev.scope==='item'&&ev.city===city&&ev.item===item)m*=ev.mult;
  }
  return m;
}
// —— 买卖价差率：基础 5% + 事件加成 ——
function getSpreadRate(city,day){
  let s=0.05;
  for(const ev of getActiveEvents()){if(ev.spread&&(!ev.city||ev.city===city))s+=ev.spread;}
  return s;
}
// —— 维修费用乘数 ——
function getRepairMult(day){
  let m=1;
  for(const ev of getActiveEvents()){if(ev.repairMul)m*=ev.repairMul;}

}

// 获得渠道：到达城市→该城进行中事件；情报所打听消息→随机事件情报（markEventKnown）
function markEvsKnown(list){

    if(ev.city)GS.knownEvents[ev.id+':'+ev.startHub]=true;
  }
}

// 玩家事件列表：
// 进行中 = 全局始终可见 + 已标记已知的 city/item；
// 预告   = 仅已标记已知（未从情报所获得的预告一律不可见）
function getPlayerEvents(){
  const out=[];
  for(const ev of getActiveEvents()){
    const isGlobal=ev.scope==='global'||ev.scope==='cost';
    if(isGlobal||GS.knownEvents[ev.id+':'+ev.startHub])out.push(ev);
  }
  for(const ev of getUpcomingEvents()){
    if(GS.knownEvents[ev.id+':'+ev.startHub])out.push(ev);
  }
  return out;
}
// —— 用户友好文案：去除 desc 中括号内的补充说明 ——
function getPublicDesc(ev){
  let d=ev.desc||'';d=d.replace(/（[^）]*）/g,'').trim();
  if(!d&&ev.mult)d=`价格 ×${ev.mult}`;
  if(!d&&ev.repairMul)d=`维修费用 ×${ev.repairMul}`;

  return d;
}
// —— 事件剩余现实时间（秒，精确到秒，基于 Date.now 连续计算）——
function getEventCountdown(ev){
  const startMs=GS.gameStartTime+ev.startHub*getHubMs();
  const endMs=startMs+ev.hubs*getHubMs();
  return Math.max(0,Math.round((endMs-Date.now())/1000));

// 出发时以确定性种子判定，抵达时结算（网页内弹窗）
function rollPrivateEvent(sp,destId){
  if(sp.distance<=4)return null;                       // 新手村短途不触发
  const r=seededRnd(sp.distance*7919+GS.day*104729+destId.charCodeAt(0)*31);
  if(r<0.08)return{type:'rob',pct:0.1+seededRnd(r*7)*0.2};       // 劫匪 8%：损失10%~30%
  if(r<0.12)return{type:'breakdown'};                            // 载具故障 4%：耐久−30
  if(r<0.17)return{type:'merchant'};                             // 偶遇行商 5%：某物资 ×1.15 收购
  if(r<0.22)return{type:'repairman'};                            // 偶遇工匠 5%：下次维修半价
  if(r<0.26)return{type:'bump'};                                 // 道路颠簸 4%：耐久−10
  if(r<0.30)return{type:'buyer'};                                // 货主急购 4%：某物资 ×1.3 收购
  return null;
}
function applyCargoLoss(pct){
  const ids=Object.keys(GS.cargo).filter(id=>GS.cargo[id]>0);
  if(ids.length===0)return;
  for(const id of ids){
    const lost=Math.max(1,Math.floor(GS.cargo[id]*pct));
    GS.cargo[id]-=lost;if(GS.cargo[id]<=0){delete GS.cargo[id];delete GS.buyPrice[id];}
  }
}

// ===== 路径 =====
function buildGraph(){const g={};for(let c of CITIES)g[c.id]={};for(let[a,b,d]of ROADS){g[a][b]=d;g[b][a]=d}return g}
function shortestPath(from,to){
  const graph=buildGraph(),dist={},prev={},visited=new Set();
  for(let c of CITIES)dist[c.id]=Infinity;dist[from]=0;
  while(visited.size<CITIES.length){let u=null;for(let c of CITIES){if(!visited.has(c.id)&&(u===null||dist[c.id]<dist[u]))u=c.id}if(u===null||dist[u]===Infinity)break;visited.add(u);for(let v in graph[u]){const alt=dist[u]+graph[u][v];if(alt<dist[v]){dist[v]=alt;prev[v]=u}}}
  if(dist[to]===Infinity)return null;const path=[to];let cur=to;while(cur!==from){cur=prev[cur];path.unshift(cur)}return{path,distance:dist[to]};
}

// 离线模式（file:// 或服务器不可用）回退 localStorage 单机玩法

let __netState='ok',__retryTimer=null;
function netDot(){ // 顶栏状态点：🟢 在线 / 🔴 重连中 / ⚪ 离线模式
  if(!ONLINE)return'⚪';

function netHit(){
  if(window.__netState==='down'){window.__netState='ok';renderTopbar();toast('✅ 网络已恢复','ok');}
  window.__netState='ok';
}
function netMiss(){
  if(!ONLINE||window.__netState==='down')return;
  window.__netState='down';renderTopbar();
  toast('⚠ 连接中断，正在尝试重连…','info');
  if(!__retryTimer){
    __retryTimer=setInterval(async()=>{
      const w=await NET.get('/api/world');
      if(w&&w.ok){
        clearInterval(__retryTimer);__retryTimer=null;
        await fullSync(); // 恢复后拉取最新世界与存档

      }
    },10000);
  }
}
const NET={
  async get(url){try{const r=await fetch(url);const j=await r.json();netHit();return j}catch(e){netMiss();return null}},
  async post(url,body){try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();netHit();return j}catch(e){netMiss();return null}}
};
// v7.8：断线恢复/多端冲突后的全量同步（服务器较新→拉取覆盖；本地较新→上传）
async function fullSync(){
  if(!ONLINE)return;
  const user=localStorage.getItem(AUTH_KEY);if(!user)return;
  const w=await NET.get('/api/world');
  if(w&&w.ok&&w.world){
    applyWorld(w.world);
    if(w.world.timeScale&&w.world.timeScale!==GS.timeScale)GS.timeScale=w.world.timeScale;
  }
  await syncPlayer(user); // v8.19：统一合并（服务器档 vs 本机离线档，取新）
  advanceDay();render();
}
// v8.19：玩家存档"服务器↔本机"合并——本机离线档较新则恢复并上传（保留离线完成的教程/任务进度），否则恢复服务器档
async function syncPlayer(user){
  const pl=await NET.get('/api/player/'+encodeURIComponent(user));
  const server=pl&&pl.ok&&pl.gs?pl.gs:null;
  const local=getStoredGS(user)||null;
  if(!server&&!local){window.__gsReady=true;return;} // 全新玩家：无存档可合并，允许后续正常保存
  const serverAt=server?(server.__savedAt||0):0;
  const localAt=local?(local.__savedAt||0):0;
  const useLocal=!!local&&localAt>serverAt;
  const src=useLocal?local:server;
  applySaved(src);
  window.__gsReady=true; // v8.20：玩家存档已恢复，此后自动保存生效
  if(useLocal){
    const up=JSON.parse(JSON.stringify(GS));
    delete up.__basePrices;delete up.__purchaseLimits; // 世界数据随服务器，不随玩家档上传
    await NET.post('/api/save',{user,gs:up,clientSaveTime:GS.__savedAt});
  }
}

function getStoredGS(user){try{return JSON.parse(localStorage.getItem(GS_PREFIX+user)||'null')}catch(e){return null}}

}
function applySaved(saved){

  GS.vehicle.wagons=GS.vehicle.wagons||[];
  if(!GS.vehicle.wagons.length)GS.vehicle.wagons=[{cur:{id:'w0',type:'balanced',lv:1},owned:{balanced_1:true}}];
  if(!GS.vehicle.core)GS.vehicle.core={lv:0,speed:0,dura:0};
  GS.cargo=saved.cargo;GS.buyPrice=saved.buyPrice;GS.lots=saved.lots||{};GS.visitStamp=saved.visitStamp||{};
  GS.cityStocks=saved.cityStocks||initCityStocks();GS.lastStockRefill=saved.lastStockRefill||Date.now();
  // v8.10（B1）：离线世界持久化——世界起始时间/基础价格/限购随存档恢复，刷新后世界连续不重洗。
  // 老存档无 gameStartTime 时按已保存天数反推世界起始，保证天数连续；在线模式随后由 applyWorld 以服务器为准覆盖。
  // v8.18：在线模式世界时间锚点始终以服务器 worldStart 为准——此前存档无 gameStartTime 时
  // 反推值会把锚点重置为"现在"（新账号 day=1 → 每次刷新天数归 1）。
  if(ONLINE){ /* 保留 applyWorld 设置的 worldStart，在线统一以服务器为准 */ }
  else if(saved.gameStartTime)GS.gameStartTime=saved.gameStartTime;
  else GS.gameStartTime=Date.now()-(Math.max(1,saved.day||1)-1)*(600000/(GS.timeScale||1));
  if(saved.__basePrices)BASE_PRICES=saved.__basePrices;

  GS.achievements=saved.achievements||{};GS.visitedCities=saved.visitedCities||[GS.location];

  GS.pendingEvent=saved.pendingEvent;GS.repairDisc=saved.repairDisc;
  GS.intel=saved.intel||{unlocked:{},log:[]};GS.knownEvents=saved.knownEvents||{};
  GS.justArrived=saved.justArrived||false;GS.tutorial=saved.tutorial||{step:6};
  GS.__savedAt=saved.__savedAt||Date.now();

function applyWorld(world){
  if(!world)return;
  if(world.basePrices)BASE_PRICES=world.basePrices;
  if(world.purchaseLimits)PURCHASE_LIMITS=world.purchaseLimits;
  if(world.worldStart)GS.gameStartTime=world.worldStart;
  if(world.timeScale)GS.timeScale=world.timeScale;
  if(world.stocks)GS.cityStocks=world.stocks;
  else if(world.purchaseLimits){ // perPlayer：按服务器限购对齐库存结构（不覆盖玩家已消耗库存，仅补齐缺失项）
    GS.cityStocks=GS.cityStocks||{};
    for(const c of CITIES){
      GS.cityStocks[c.id]=GS.cityStocks[c.id]||{};
      for(const gid of c.goods){if(GS.cityStocks[c.id][gid]==null)GS.cityStocks[c.id][gid]=world.purchaseLimits[c.id]?.[gid]||100;}
    }
  }
}
// 连接服务器并获取/创建共享世界；成功则开启在线模式
// v7.4：服务器自动运行世界；库存每人独立、每现实 30 分钟同时刷新；timeScale 世界流速
async function startOnline(){
  if(location.protocol!=='http:'&&location.protocol!=='https:')return false; // file:// 离线
  if(window.__netStarted)return ONLINE;
  const w=await NET.get('/api/world');
  if(!w||!w.ok){ONLINE=false;return false;} // 失败可重试（如服务器尚未启动）
  if(w.world)applyWorld(w.world);
  else{
    // 兜底：服务器尚未自动建世界时由客户端创建
    const created={basePrices:BASE_PRICES,purchaseLimits:PURCHASE_LIMITS,worldStart:Date.now()};
    const r=await NET.post('/api/world',created);
    if(!r||!r.ok){ONLINE=false;return false;}
    applyWorld(created);
  }
  ONLINE=true;window.__netStarted=true;
  // 在线期间轮询世界：同步 timeScale 流速与 GM 广播
  setInterval(async()=>{
    const w2=await NET.get('/api/world');
    if(w2&&w2.ok&&w2.world){
      if(w2.world.timeScale&&w2.world.timeScale!==GS.timeScale){GS.timeScale=w2.world.timeScale;render();toast('⏱ 世界时间流速已调整为 ×'+w2.world.timeScale,'ok');}
      if(w2.world.lastBroadcast&&w2.world.lastBroadcast.ts&&(!window.__lastBc||window.__lastBc<w2.world.lastBroadcast.ts)){
        window.__lastBc=w2.world.lastBroadcast.ts;
        toast('📢 '+w2.world.lastBroadcast.msg,'ok');
      }
    }
  },60000);
  return true;
}
// 自动存档：在线→服务器（400ms 防抖合并连续渲染 + 多端冲突检测），离线→localStorage
let __saveSeq=0,__saveTimer=null;
window.__gsReady=false; // v8.20：玩家存档确立前禁止自动保存，防止刷新瞬间的初始档覆盖真实进度
function autoSave(){
  const user=localStorage.getItem(AUTH_KEY);
  if(!user)return;
  if(!window.__gsReady)return; // v8.20：存档未加载/未确立前不保存
  if(ONLINE){
    GS.__savedAt=Date.now();
    const seq=++__saveSeq;
    clearTimeout(__saveTimer);
    __saveTimer=setTimeout(async()=>{
      if(seq!==__saveSeq)return;
      const r=await NET.post('/api/save',{user,gs:GS,clientSaveTime:GS.__savedAt});
      if(r&&r.conflict){
        toast('⚠ 检测到其他设备登录，正在同步最新存档…','info');
        fullSync();
      }
    },400);
  }else{
    if(!getUsers().includes(user))return; // v8.19：服务器账号的离线保存不写本机，避免初始档冒充"新档"覆盖服务器
    GS.__basePrices=BASE_PRICES;GS.__purchaseLimits=PURCHASE_LIMITS; // v8.10（B1）：离线存档附带世界价格/限购，刷新后不重洗
    GS.__savedAt=Date.now(); // v8.19：离线保存也更新保存时间戳，重连后 fullSync 才能识别"本地较新→上传"
    saveGS(user,GS);
  }
}

async function doRegister(){
  const u=document.getElementById('auth-user').value.trim(),p=document.getElementById('auth-pass').value;
  if(u.length<3||u.length>12)return authErr('用户名需 3~12 个字符');
  if(p.length<4)return authErr('密码至少 4 位');
  const online=await startOnline();
  let ok=true;
  if(online){
    const r=await NET.post('/api/register',{user:u,pass:p});
    if(!r||!r.ok)return authErr(r&&r.err?r.err:'注册失败（服务器不可用？）');
    const pl=await NET.get('/api/player/'+encodeURIComponent(u));
    if(pl&&pl.ok&&pl.gs)applySaved(pl.gs);
  }else{
    const users=getUsers();
    if(users.includes(u))return authErr('该用户名已被注册');
    users.push(u);saveUsers(users);
    localStorage.setItem(GS_PREFIX+u+'_pwd',p);
    resetGameState(); // v8.12（D）：新注册离线账号使用全新开局存档，避免残留上一账号数据
    saveGS(u,GS);
  }
  localStorage.setItem(AUTH_KEY,u);
  window.__gsReady=true; // v8.20：账号存档已确立，允许自动保存
  document.getElementById('auth-overlay').style.display='none';
  toast('🎉 注册成功！欢迎来到全王国，'+u,'ok');
  render();
}
async function doLogin(){
  const u=document.getElementById('auth-user').value.trim(),p=document.getElementById('auth-pass').value;
  const online=await startOnline();

  if(online){
    const r=await NET.post('/api/login',{user:u,pass:p});

    await syncPlayer(u); // v8.19：登录合并本地离线进度与服务器存档，完成教程不再丢失
  }else{
    const users=getUsers();
    if(!users.includes(u))return authErr('该用户名未注册，请先注册');

  render();
}

// 用法：点击右下角 🛠 打开指令台，或浏览器控制台运行 runCmd("...")
// 本地指令（无需密码，仅影响本账号）：/help /addgold /addcargo /addmat /repair /core /wagon /setrep /stock /day
// GM 指令（需世界管理密码，服务器执行）：/gm <密码> timescale|setday|givegold|giveitem|broadcast ...
const CMD_HELP=[
  '/help                          显示本帮助',
  '/addgold <金额>                给自己加金币',
  '/addcargo <物品id> <数量>      给自己加货物（如 grain、salt、ironware…）',
  '/addmat <类型> <数量>          加升级材料（gear/repair_kit/fuel_tank/engine）',
  '/repair                        车辆耐久修满',
  '/core <等级>                   载具核心直接升到指定等级（附带速度/耐久加成）',
  '/wagon <类型> <等级>           第 1 车厢位装指定车厢（cargo/pass/balanced/engine）',
  '/setrep <城市id> <经验>        设置某城市声望经验（如 greentown 5000）',
  '/stock <城市id> <物品id> <数量> 设置自己在该城该物品的库存',
  '/day <天数>                    本地推进到指定天数（在线由世界天数主导）',
  '/gold                          查看当前金币',
  '/gm <密码> timescale <0.1~100> 世界时间流速倍率（全服生效，1=正式10分钟/日）',
  '/gm <密码> setday <天数>       设置世界天数（全服生效）',
  '/gm <密码> givegold <玩家> <金额> 给指定玩家发钱（在线存档生效）',
  '/gm <密码> giveitem <玩家> <物品id> <数量> 给指定玩家发物资',
  '/gm <密码> broadcast <消息>    全服广播（在线玩家 60 秒内收到）'
];
function cmdOut(msg){const el=document.getElementById('cmd-out');if(el){const d=document.createElement('div');d.textContent=msg;el.appendChild(d);el.scrollTop=el.scrollHeight;}}
function runCmd(line){
  if(!line||!line.trim())return;
  const p=line.trim().split(/\s+/);
  const c=(p[0]||'').toLowerCase();
  const arg=(i,d)=>{const v=parseFloat(p[i]);return isNaN(v)?d:v};
  if(c==='/help'||c==='/h'||c==='help'){CMD_HELP.forEach(x=>cmdOut(x));return;}
  if(c==='/gold'){cmdOut('💰 当前金币：'+GS.gold);return;}
  if(c==='/addgold'){const n=Math.floor(arg(1,0));GS.gold+=n;cmdOut('💰 +'+n+' 金币 → '+GS.gold);render();return;}
  if(c==='/addcargo'){const it=(p[1]||''),n=Math.floor(arg(2,0));if(!it)return cmdOut('用法：/addcargo <物品id> <数量>');GS.cargo[it]=(GS.cargo[it]||0)+n;cmdOut('📦 +'+n+' '+it+'（现有 '+GS.cargo[it]+'）');render();return;}
  if(c==='/addmat'){const t=(p[1]||''),n=Math.floor(arg(2,0));if(!['gear','repair_kit','fuel_tank','engine'].includes(t))return cmdOut('材料类型：gear/repair_kit/fuel_tank/engine');GS.materials[t]=(GS.materials[t]||0)+n;cmdOut('🧰 +'+n+' '+t);render();return;}
  if(c==='/repair'){GS.vehicle.durability=getDurabilityMax();cmdOut('🔧 耐久已修满');render();return;}
  if(c==='/core'){const n=Math.floor(arg(1,0));GS.vehicle.core=GS.vehicle.core||{lv:0,speed:0,dura:0};GS.vehicle.core.lv=n;GS.vehicle.core.speed=n;GS.vehicle.core.dura=n;cmdOut('⚙️ 载具核心 → Lv'+n+'（疾驰+'+n+' 速 / 强化+'+n*50+' 耐久）');render();return;}
  if(c==='/wagon'){const t=(p[1]||''),lv=Math.floor(arg(2,1));if(!WAGON_TYPES[t])return cmdOut('车厢类型：cargo/pass/balanced/engine');const slots=GS.vehicle.wagons||[];if(!slots.length)return cmdOut('无车厢位');const s=slots[0];const fit=fitAfterSlot(0,t,lv);if(getUsedCargo()+getTaskCargoUsed()>fit.cap||getPassUsed()+getTaskPassUsed()>fit.pass)return cmdOut('⚠ 现有货物/旅客超出该车厢容量，未装配');s.cur={id:'w'+t+'_'+lv,type:t,lv:lv};s.owned=s.owned||{};s.owned[t+'_'+lv]=true;cmdOut('🚛 第1车厢位已装 '+WAGON_TYPES[t].name+' Lv'+lv);render();return;}
  if(c==='/setrep'){const city=(p[1]||''),exp=Math.floor(arg(2,0));if(!CITIES.some(x=>x.id===city))return cmdOut('未知城市：'+city);GS.reputation[city]=GS.reputation[city]||{level:0,exp:0};const r=GS.reputation[city];r.exp=0;r.level=0;addRep(city,exp);cmdOut('⭐ '+city+' 声望经验='+exp+' → 等级 '+getRepLevel(city));render();return;}
  if(c==='/stock'){const city=(p[1]||''),it=(p[2]||''),n=Math.floor(arg(3,0));if(!city||!it)return cmdOut('用法：/stock <城市id> <物品id> <数量>');GS.cityStocks=GS.cityStocks||{};GS.cityStocks[city]=GS.cityStocks[city]||{};GS.cityStocks[city][it]=n;cmdOut('📦 '+city+' '+it+' 库存 → '+n);render();return;}
  if(c==='/day'){if(ONLINE)return cmdOut('📅 在线模式天数由世界锚点统一驱动，/day 仅离线可用');const n=Math.floor(arg(1,1));GS.day=Math.max(1,n);cmdOut('📅 本地天数 → '+n);render();return;}
  if(c==='/gm'||c==='/admin'){
    const key=(p[1]||''),sub=(p[2]||'').toLowerCase();
    if(!key)return cmdOut('用法：/gm <密码> <指令> …（密码见服务器控制台或 world.json）');
    const payload={key:key,cmd:sub};
    if(sub==='timescale'){payload.x=arg(3,1);}
    else if(sub==='setday'){payload.n=Math.floor(arg(3,1));}
    else if(sub==='givegold'){payload.user=(p[3]||'');payload.amt=Math.floor(arg(4,0));}
    else if(sub==='giveitem'){payload.user=(p[3]||'');payload.item=(p[4]||'');payload.qty=Math.floor(arg(5,0));}
    else if(sub==='broadcast'){payload.msg=p.slice(3).join(' ');}
    else return cmdOut('GM 指令：timescale / setday / givegold / giveitem / broadcast');
    if(!ONLINE)return cmdOut('❌ 当前为离线模式，GM 指令仅在线可用');
    cmdOut('⏳ 正在执行 GM 指令…');
    NET.post('/api/admin',payload).then(r=>{
      if(r&&r.ok)cmdOut('✅ '+r.msg);
      else cmdOut('❌ '+(r&&r.err?r.err:'执行失败'));
    });
    return;
  }
  cmdOut('❓ 未知指令：'+c+'（输入 /help 查看帮助）');
}

const CHAT={msgs:[],since:0,firstPull:true,histOpen:false,panelOpen:false};

function chatStamp(ts){const d=ts?new Date(ts):new Date();const p=n=>(n<10?'0':'')+n;return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
function chatEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function chatSend(){

    if(CHAT.firstPull){
      const r0=await NET.get('/api/chat?since=0');
      if(r0&&r0.ok&&r0.msgs){CHAT.firstPull=false;for(const m of r0.msgs)chatAdd(m,false);}

function startChatPolling(){

// 通用可拖动（el=目标元素，handle=拖动手柄；onClick 在无位移的点击时触发）
function makeDraggable(el,handle,opts){
  let sx=0,sy=0,ox=0,oy=0,drag=false,moved=false;
  handle.addEventListener('mousedown',e=>{
    drag=true;moved=false;sx=e.clientX;sy=e.clientY;
    const r=el.getBoundingClientRect();ox=r.left;oy=r.top;
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.abs(dx)+Math.abs(dy)>6)moved=true;
    el.style.left=Math.min(Math.max(0,ox+dx),window.innerWidth-el.offsetWidth)+'px';
    el.style.top=Math.min(Math.max(0,oy+dy),window.innerHeight-el.offsetHeight)+'px';
    el.style.right='auto';el.style.bottom='auto';
  });
  window.addEventListener('mouseup',()=>{
    if(drag&&!moved&&opts&&opts.onClick)opts.onClick();
    drag=false;
  });
}

function getCurrentGameDay(){const e=(Date.now()-GS.gameStartTime)/(600000/(GS.timeScale||1));return Math.max(1,Math.floor(e)+1)}
