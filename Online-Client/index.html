// ===== 响应式状态容器初始化 =====
State.init({
  day: 1, gold: 10000, location: 'greentown',
  timeScale: 1, gameStartTime: Date.now(),
  vehicle: {level:1,speed:5,durability:100,durabilityMax:100,passengers:0,core:{lv:0,speed:0,dura:0},wagons:[{cur:{id:'w0',type:'balanced',lv:1},owned:{balanced_1:true}}]},
  cargo: {}, buyPrice: {}, lots: {}, visitStamp: {},
  // vNext：中转面板（交易单），buy/sell 分离；任何锚点变化将触发清空
  tradeDraft: {buy:{cityId:null,day:null,hub:null,items:{}},sell:{cityId:null,day:null,hub:null,items:{}}},
  cityStocks: {}, lastStockRefill: Date.now(),
  warehouses: {}, reputation: {},
  materials: {gear:0,repair_kit:0,fuel_tank:0,engine:0},
  tasks: {board:[],active:[]}, traveling: null, pendingEvent: null, repairDisc: null,
  intel: {unlocked:{},log:[]}, knownEvents: {},
  justArrived: false, tutorial: {step:0},
  stats: {bought:0,sold:0,tasks:0,travels:0,distance:0,visits:1,income:0,upgrades:0,reps:0},
  achievements: {}, visitedCities: ['greentown'],
  __savedAt: 0, __loaded: false
});

// ===== 清理误注入的调试 DOM（避免阻塞点击） =====
// 注意：这些误注入节点可能出现在文档末尾（在本脚本执行之后才被浏览器解析出来），
// 所以要在 DOMContentLoaded 后再清理一次。
function cleanupInjectedDom(){
  try{
    // 删除“没有绑定事件”的静态 modal overlay（会导致弹窗无法点击关闭）
    document.querySelectorAll('.modal-overlay').forEach(function(ov){
      const ok = ov.querySelector('.btn-ok');
      const cancel = ov.querySelector('.btn-cancel');
      if(ok && cancel && ok.onclick==null && cancel.onclick==null){
        ov.remove();
      }
    });
    // 删除浏览器检查器注入的辅助层（class 名包含 trae-browser-inspect-）
    document.querySelectorAll('[class*=\"trae-browser-inspect-\"]').forEach(function(el){ el.remove(); });
  }catch(e){}
}
document.addEventListener('DOMContentLoaded', function(){
  cleanupInjectedDom();
  setTimeout(cleanupInjectedDom, 0);
});

// ===== 状态订阅 + EventBus 桥接（v9.0） =====
State.subscribe('gold', function(newGold, oldGold){
  EventBus.emit(EventBus.EVENTS.GOLD_CHANGED, {gold: newGold});
});
State.subscribe('location', function(newLoc){
  EventBus.emit(EventBus.EVENTS.LOCATION_CHANGED, {location: newLoc});
});
State.subscribe('day', function(day){
  EventBus.emit(EventBus.EVENTS.DAY_CHANGED, {day: day});
});
State.subscribe('traveling', function(traveling){
  if(traveling){
    EventBus.emit(EventBus.EVENTS.TRAVEL_START, traveling);
  }else{
    EventBus.emit(EventBus.EVENTS.TRAVEL_ARRIVE, {});
  }
});

// ===== vNext：中转面板锚点变化 → 提示并清空（buy/sell 两个 draft 同时清空） =====
let __draftLastHub = (window.TradeGraph&&TradeGraph.hub)?TradeGraph.hub(State.get('day')):0;
function clearDraftOnAnchorChange(reason){
  if(!window.TradeDraft||!TradeDraft.anyNonEmpty||!TradeDraft.anyNonEmpty())return;
  showModal('⚠ 物价已更新',
    `由于游戏日/中枢点/城市/面板发生变化，为避免按旧价成交，已清空中转面板内容。`,
    '知道了',()=>{
      TradeDraft.clearAll(reason||'anchor-change');
      // 若当前在城市页，立即刷新市场区域
      if(currentTab==='city')renderMarketCards();
    });
}
State.subscribe('location', function(){
  clearDraftOnAnchorChange('location');
});
State.subscribe('day', function(day){
  const h=(window.TradeGraph&&TradeGraph.hub)?TradeGraph.hub(day):Math.floor((Math.max(1,day)-1)/12);
  if(h!==__draftLastHub){ __draftLastHub=h; clearDraftOnAnchorChange('hub'); }
  else clearDraftOnAnchorChange('day');
});

// 事件图鉴（始终展示全部14条定义，不受城市限制）
function catalogDetail(id){document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());showEventDetail(id);}
function showEventCatalog(){
  const rows=EVENT_TABLE.map(ev=>{
    let scopeTxt;if(ev.scope==='global'||ev.scope==='cost')scopeTxt='全王国';else if(ev.scope==='city')scopeTxt=ev.item?`${getCityName(ev.city)}·${getItem(ev.item)?.name||ev.item}`:`${getCityName(ev.city)}·全城`;else scopeTxt=`${getCityName(ev.city)}·${getItem(ev.item)?.name||ev.item}`;
    const targetTxt=ev.target?({buy:'仅买入',sell:'仅卖出',both:'买卖'}[ev.target]):'买卖';
    const inst=getPlayerEvents().find(e=>e.id===ev.id);
    const stTxt=inst&&getEventStatus(inst)?getEventStatus(inst).label:'';
    return `<div class="ev-row" onclick="catalogDetail('${ev.id}')" title="查看详情">${ev.icon} <b>${ev.name}</b> <span style="color:var(--gold);font-size:11px">${stTxt}</span> <span style="color:var(--text3);font-size:11px">${scopeTxt} · ${targetTxt} · ${ev.hubs}周期</span><br><span style="color:var(--text2);font-size:12px">${ev.desc}</span></div>`;
  }).join('');
  showModal('📖 事件图鉴（'+EVENT_TABLE.length+' 条）',rows,'知道了',()=>{});
}
// 事件详情弹窗（用户友好文案，状态标签，无括号补充；已结束事件不出现）
function showEventDetail(id){
  const ev=EVENT_TABLE.find(e=>e.id===id);if(!ev)return;
  let span;if(ev.scope==='global'||ev.scope==='cost')span='全王国';else if(ev.scope==='city')span=ev.item?`${getCityName(ev.city)} · ${getItem(ev.item)?.name||ev.item}`:`${getCityName(ev.city)} · 全城`;else span=`${getCityName(ev.city)} · ${getItem(ev.item)?.name||ev.item}`;
  const effectTxt=getPublicDesc(ev);
  const inst=getPlayerEvents().find(e=>e.id===id);
  const st=inst?getEventStatus(inst):null;
  let statusRow='';
  if(st)statusRow=`\n状态：${st.label}${st.remain!=null?` · 剩余 ${fmtCountdown(st.remain)}`:''}`;
  showModal(ev.icon+' '+ev.name,
    `影响范围：${span}\n效果：${effectTxt}${statusRow}`,
    '知道了',()=>{});
}
// ===== 私人事件（旅行途中） =====
// 出发时以确定性种子判定，抵达时结算（网页内弹窗）
function rollPrivateEvent(sp,destId){
  if(sp.distance<=4)return null;                       // 新手村短途不触发
  const r=seededRnd(sp.distance*7919+GS.day*104729+destId.charCodeAt(0)*31);
  if(r<0.08)return{type:'rob',pct:0.1+seededRnd(r*7)*0.2};       // 劫匪 8%：损失10%~30%
  if(r<0.12)return{type:'breakdown'};                            // 载具故障 4%：耐久−30
  if(r<0.17)return{type:'merchant'};                             // 偶遇行商 5%：某物资 ×1.15 收购
  if(r<0.22)return{type:'repairman'};                            // 偶遇工匠 5%：下次维修半价
  if(r<0.26)return{type:'bump'};                                 // 道路颠簸 4%：耐久−10
  if(r<0.30)return{type:'buyer'};                                // 货主急购 4%：某物资 ×1.3 收购
  return null;
}
function applyCargoLoss(pct){
  const ids=Object.keys(GS.cargo).filter(id=>GS.cargo[id]>0);
  if(ids.length===0)return;
  State.batch(function(){
    var cargo = State.get('cargo') || {};
    var buyPrice = State.get('buyPrice') || {};
    for(const id of ids){
      const lost=Math.max(1,Math.floor(cargo[id]*pct));
      cargo[id]-=lost;
      if(cargo[id]<=0){delete cargo[id];delete buyPrice[id];}
    }
    State.set('cargo', cargo);
    State.set('buyPrice', buyPrice);
  });
  EventBus.emit(EventBus.EVENTS.CARGO_CHANGED, {reason:'loss'});
}
function showPrivateEvent(){
  const pe=GS.pendingEvent;if(!pe)return;State.set('pendingEvent',null);
  if(pe.type==='rob'){
    let val=0;for(const id in GS.cargo)val+=(GS.cargo[id]||0)*((GS.buyPrice[id])||0);
    const ransom=Math.round(val*0.2);
    showChoice('🏴 路遇劫匪',`损失 ${Math.round(pe.pct*100)}% 的货物（按各物资比例扣除）\n或花费 ${fmt(ransom)} 金币赎买免于损失`,
      ransom>GS.gold?'强行突围':`赎买 ${fmt(ransom)} 金币`,'硬抗损失',()=>{
        if(GS.gold>=ransom){State.set('gold',GS.gold-ransom);toast('破财消灾，货物保住','ok');}
        else{applyCargoLoss(pe.pct);toast('突围失败，货物被劫','err');}
        render();
      },()=>{applyCargoLoss(pe.pct);toast('货物被劫走一部分','err');render();});
  }else if(pe.type==='breakdown'){
    const loss=30;
    const veh = GS.vehicle;
    veh.durability = Math.max(0, veh.durability-loss);
    State.set('vehicle', veh);
    EventBus.emit(EventBus.EVENTS.DAMAGE_TAKEN, {type:'breakdown', loss:loss});
    showModal('🔧 载具故障',`旅途颠簸，车辆故障\n耐久 −${loss} 点（当前 ${Math.round(getDurabilityPct()*100)}%）`,'继续赶路',()=>render());
  }else if(pe.type==='merchant'){
    // v8.10 修复：真正"收购"——按当前城卖出价 ×1.15 全量买断该货物并扣货。
    // 仅遍历 GS.cargo（玩家自有货物）；任务物资在 GS.tasks 内管理、不占 cargo，天然不会计入。
    const ids=Object.keys(GS.cargo).filter(id=>GS.cargo[id]>0);
    if(ids.length===0){showModal('🛒 偶遇行商','行商想收购你的货物，但你两手空空','可惜',()=>render());return;}
    const id=ids[Math.floor(seededRnd(GS.day*13+ids.length)*ids.length)];
    const qty=GS.cargo[id];
    const sPrice=getSellPrice(GS.location,id,GS.day)||getDayPrice(GS.location,id,GS.day);
    const unit=Math.round(sPrice*1.15);
    const gain=unit*qty;
    State.set('gold', GS.gold+gain);
    State.batch(function(){
      var cargo = State.get('cargo') || {};
      var buyPrice = State.get('buyPrice') || {};
      var lots = State.get('lots') || {};
      delete cargo[id];delete buyPrice[id];delete lots[id];
      State.set('cargo', cargo);
      State.set('buyPrice', buyPrice);
      State.set('lots', lots);
    });
    EventBus.emit(EventBus.EVENTS.ITEM_SOLD, {itemId:id, qty:qty, revenue:gain});
    showModal('🛒 偶遇行商',`行商看中你的 ${getItem(id).name}×${qty}\n以高于市价 15% 收购（${fmt(unit)} 金/件），入账 ${fmt(gain)} 金币`,'成交',()=>render());
  }else if(pe.type==='repairman'){
    State.set('repairDisc', 0.5);
    showModal('🔧 偶遇工匠',`一位走南闯北的工匠为你的车做了检查\n下次维修享受 5 折优惠`,'多谢',()=>render());
  }else if(pe.type==='bump'){
    const veh = GS.vehicle;
    veh.durability = Math.max(0, veh.durability-10);
    State.set('vehicle', veh);
    EventBus.emit(EventBus.EVENTS.DAMAGE_TAKEN, {type:'bump', loss:10});
    showModal('🪨 道路颠簸',`一段碎石路颠得车辆吱呀作响\n耐久 −10 点（当前 ${Math.round(getDurabilityPct()*100)}%）`,'继续赶路',()=>render());
  }else if(pe.type==='buyer'){
    // v8.10 修复：真正"收购"——按当前城卖出价 ×1.30 全量买断该货物并扣货（同 merchant，仅玩家自有货物）
    const ids=Object.keys(GS.cargo).filter(id=>GS.cargo[id]>0);
    if(ids.length===0){showModal('💰 货主急购','有人出高价收购，可惜你车上没货','可惜',()=>render());return;}
    const id=ids[Math.floor(seededRnd(GS.day*31+ids.length)*ids.length)];
    const qty=GS.cargo[id];
    const sPrice=getSellPrice(GS.location,id,GS.day)||getDayPrice(GS.location,id,GS.day);
    const unit=Math.round(sPrice*1.3);
    const gain=unit*qty;
    State.set('gold', GS.gold+gain);
    State.batch(function(){
      var cargo = State.get('cargo') || {};
      var buyPrice = State.get('buyPrice') || {};
      var lots = State.get('lots') || {};
      delete cargo[id];delete buyPrice[id];delete lots[id];
      State.set('cargo', cargo);
      State.set('buyPrice', buyPrice);
      State.set('lots', lots);
    });
    EventBus.emit(EventBus.EVENTS.ITEM_SOLD, {itemId:id, qty:qty, revenue:gain});
    showModal('💰 货主急购',`${getItem(id).name} 在这边紧俏得很\n对方以高于市价 30% 收购（${fmt(unit)} 金/件）×${qty}，入账 ${fmt(gain)} 金币`,'成交',()=>render());
  }
}

// ===== 库存系统 =====
// v7.2 起库存随【游戏日】刷新（正式：10 分钟/日），原 STOCK_REFILL_MS=30000 已废弃移除
function initCityStocks(){
  const s={};
  for(let c of CITIES){s[c.id]={};
    for(let gid of c.goods){s[c.id][gid]=PURCHASE_LIMITS[c.id]?.[gid]||100}
  }return s;
}

// ===== 在线世界同步（v7.1 共享世界 / v7.2 库存独立） =====
// 服务器为世界权威：价格种子/购买限额/世界起始时间共享；玩家存档存服务器 players/
// v7.2：库存按玩家独立（不共享），随【服务器游戏日】同时刷新；留 stockMode 接口（默认 perPlayer，未来可切 shared）
// 单机模式使用 localStorage；在线模式连接失败时不再静默写入本地档。
const AUTH_KEY='_auth_user',USERS_KEY='_auth_users',GS_PREFIX='_gs_';
let ONLINE=false;
// v7.8：网络状态机（ok=正常 / down=断开重连中）；断线自动重连 + 恢复后全量同步
let __netState='ok',__retryTimer=null;
function netDot(){ // 顶栏状态点：🟢 在线 / 🔴 重连中 / ⚪ 离线模式
  if(!ONLINE)return'⚪';
  return window.__netState==='down'?'🔴':'🟢';
}
function netHit(){
  if(window.__netState==='down'){window.__netState='ok';renderTopbar();toast('✅ 网络已恢复','ok');}
  window.__netState='ok';
}
function netMiss(){
  if(!ONLINE||window.__netState==='down')return;
  window.__netState='down';renderTopbar();
  toast('⚠ 连接中断，正在尝试重连…','info');
  if(!__retryTimer){
    __retryTimer=setInterval(async()=>{
      const w=await NET.get('/api/world');
      if(w&&w.ok){
        clearInterval(__retryTimer);__retryTimer=null;
        await fullSync(); // 恢复后拉取最新世界与存档
        renderTopbar();toast('✅ 已重新连接，数据已同步','ok');
      }
    },10000);
  }
}
const NET={
  async get(url){try{const r=await fetch(url);const j=await r.json();netHit();return j}catch(e){netMiss();return null}},
  async post(url,body){try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();netHit();return j}catch(e){netMiss();return null}}
};
// v7.8：断线恢复/多端冲突后的全量同步（服务器较新→拉取覆盖；本地较新→上传）
async function fullSync(){
  if(!ONLINE)return;
  const user=localStorage.getItem(AUTH_KEY);if(!user)return;
  const w=await NET.get('/api/world');
  if(w&&w.ok&&w.world){
    applyWorld(w.world);
    if(w.world.timeScale&&w.world.timeScale!==GS.timeScale)GS.timeScale=w.world.timeScale;
  }
  await syncPlayer(user); // v8.19：统一合并（服务器档 vs 本机离线档，取新）
  advanceDay();render();
}
// v8.19：玩家存档"服务器↔本机"合并——本机离线档较新则恢复并上传（保留离线完成的教程/任务进度），否则恢复服务器档
async function syncPlayer(user){
  const pl=await NET.get('/api/player/'+encodeURIComponent(user));
  const server=pl&&pl.ok&&pl.gs?pl.gs:null;
  // v8.24：服务器账号（不在本机离线用户列表）忽略本机残留档——
  // 本机档可能是历史版本自动保存的初始档（时间戳较新），误用会覆盖服务器真实存档导致"刷新后信息回归初始"
  const local=(!getUsers().includes(user))?null:(getStoredGS(user)||null);
  if(!server&&!local){
    // v8.24：仅当服务器明确确认无存档（pl.ok）才算全新玩家，允许创建档；
    // 网络失败（pl 为 null）不置 __loaded，防止初始档被上传覆盖服务器真实存档
    if(pl&&pl.ok){GS.__loaded=true;}
    window.__gsReady=true;
    return;
  }
  const serverAt=server?(server.__savedAt||0):0;
  const localAt=local?(local.__savedAt||0):0;
  const useLocal=!!local&&localAt>serverAt;
  const src=useLocal?local:server;
  GS.__lastServerAt=src?(src.__savedAt||0):0; // v8.25：记录已知的服务器存档版本（并发保护基准，与时钟无关）
  applySaved(src);
  window.__gsReady=true; // v8.20：玩家存档已恢复，此后自动保存生效
  if(useLocal){
    const up=JSON.parse(JSON.stringify(GS));
    delete up.__basePrices;delete up.__purchaseLimits; // 世界数据随服务器，不随玩家档上传
    delete up.day;delete up.gameStartTime; // v8.26：游戏日由服务器 worldStart 统一计算
    const r=await NET.post('/api/save',{user,gs:up,clientSaveTime:GS.__savedAt,lastServerAt:GS.__lastServerAt});
    if(r&&r.ok)GS.__lastServerAt=GS.__savedAt;
  }
}

function applyWorld(world){

  try{
    if(world.tradeRoads && window.TradeGraph && TradeGraph.setRoads){

    }
  }catch(e){}
  // P1/P3：产地买入差异化与卖出封顶/封底（world 下发覆盖默认，缺省则用模块默认值）
  try{
    if(world.sourceConfig && window.SourcePricing && SourcePricing.setSourceConfig){
      SourcePricing.setSourceConfig(world.sourceConfig);
    }
    if(world.sellExceptions && window.PriceExceptions && PriceExceptions.setExceptions){
      PriceExceptions.setExceptions(world.sellExceptions);
    }
  }catch(e){}
  State.batch(function(){
    if(world.worldStart)State.set('gameStartTime', world.worldStart);
    if(world.timeScale)State.set('timeScale', world.timeScale);
    if(world.stocks)State.set('cityStocks', world.stocks);
    else if(world.purchaseLimits){
      // perPlayer：按服务器限购对齐库存结构（不覆盖玩家已消耗库存，仅补齐缺失项）
      var stocks = State.get('cityStocks') || {};
      for(const c of CITIES){
        stocks[c.id] = stocks[c.id] || {};
        for(const gid of c.goods){
          if(stocks[c.id][gid]==null) stocks[c.id][gid] = world.purchaseLimits[c.id]?.[gid]||100;
        }
      }

    }
  });
}
// 连接服务器并获取/创建共享世界；成功则开启在线模式
// v7.4：服务器自动运行世界；库存每人独立、每现实 30 分钟同时刷新；timeScale 世界流速
async function startOnline(){
  // 运行模式只由 runtime.js 决定；单机模式绝不探测 /api。
  if(!Runtime.isOnline)return false;
  if(window.__netStarted)return ONLINE;
  const w=await NET.get('/api/world');
  if(!w||!w.ok){ONLINE=false;return false;} // 失败可重试（如服务器尚未启动）
  if(w.world)applyWorld(w.world);
  else{
    // 兜底：服务器尚未自动建世界时由客户端创建
    const created={basePrices:BASE_PRICES,purchaseLimits:PURCHASE_LIMITS,tradeRoads:window.ROADS||[],worldStart:Date.now(),sourceConfig:(window.SourcePricing&&SourcePricing.DEFAULT_SOURCE_CONFIG)||{},sellExceptions:(window.PriceExceptions&&PriceExceptions.DEFAULT_SELL_EXCEPTIONS)||{}};
    const r=await NET.post('/api/world',created);
    if(!r||!r.ok){ONLINE=false;return false;}
    applyWorld(created);
  }
  ONLINE=true;window.__netStarted=true;
  // 在线期间轮询世界：同步 timeScale 流速与 GM 广播
  setInterval(async()=>{
    const w2=await NET.get('/api/world');
    if(w2&&w2.ok&&w2.world){
      if(w2.world.timeScale&&w2.world.timeScale!==GS.timeScale){GS.timeScale=w2.world.timeScale;render();toast('⏱ 世界时间流速已调整为 ×'+w2.world.timeScale,'ok');}
      if(w2.world.lastBroadcast&&w2.world.lastBroadcast.ts&&(!window.__lastBc||window.__lastBc<w2.world.lastBroadcast.ts)){
        window.__lastBc=w2.world.lastBroadcast.ts;
        toast('📢 '+w2.world.lastBroadcast.msg,'ok');
      }
    }
  },60000);
  return true;
}
// 自动存档：在线→服务器（400ms 防抖合并连续渲染 + 多端冲突检测），离线→localStorage
let __saveSeq=0,__saveTimer=null;
window.__gsReady=false; // v8.20：玩家存档确立前禁止自动保存，防止刷新瞬间的初始档覆盖真实进度
function autoSave(){
  const user=localStorage.getItem(AUTH_KEY);
  if(!user)return;
  if(!window.__gsReady)return; // v8.20：存档未加载/未确立前不保存
  if(ONLINE){
    if(!GS.__loaded)return; // v8.24：未从真实存档加载前不上传，防止初始档覆盖服务器
    GS.__savedAt=Date.now();
    const seq=++__saveSeq;
    clearTimeout(__saveTimer);
    __saveTimer=setTimeout(async()=>{
      if(seq!==__saveSeq)return;
      // v8.26：游戏日由服务器 worldStart 统一计算并下发，玩家存档不携带 day/gameStartTime
      const up=JSON.parse(JSON.stringify(GS));
      delete up.day;delete up.gameStartTime;
      const r=await NET.post('/api/save',{user,gs:up,clientSaveTime:GS.__savedAt,lastServerAt:GS.__lastServerAt||0});
      if(r&&r.ok)GS.__lastServerAt=GS.__savedAt; // v8.25：保存成功更新已知版本
      else if(r&&r.conflict){
        toast('⚠ 检测到其他设备登录，正在同步最新存档…','info');
        fullSync();
      }
    },400);
  }else{
    if(!getUsers().includes(user))return; // v8.19：服务器账号的离线保存不写本机，避免初始档冒充"新档"覆盖服务器
    GS.__basePrices=BASE_PRICES;GS.__purchaseLimits=PURCHASE_LIMITS; // v8.10（B1）：离线存档附带世界价格/限购，刷新后不重洗
    GS.__savedAt=Date.now(); // v8.19：离线保存也更新保存时间戳，重连后 fullSync 才能识别"本地较新→上传"
    saveGS(user,GS);
  }
}
// v8.16：关键操作立即保存——任务/引导进度不再依赖 400ms 防抖窗口，刷新/关页不丢
function saveNow(){
  const user=localStorage.getItem(AUTH_KEY);
  if(!user)return;
  if(!window.__gsReady)return; // v8.20：存档未确立前不保存
  if(ONLINE){
    if(!GS.__loaded)return; // v8.24：未从真实存档加载前不上传，防止初始档覆盖服务器
    GS.__savedAt=Date.now();
    // v8.26：玩家存档不携带 day/gameStartTime（游戏日由服务器 worldStart 统一计算）
    const up=JSON.parse(JSON.stringify(GS));
    delete up.day;delete up.gameStartTime;
    NET.post('/api/save',{user,gs:up,clientSaveTime:GS.__savedAt,lastServerAt:GS.__lastServerAt||0}).then(r=>{
      if(r&&r.ok)GS.__lastServerAt=GS.__savedAt; // v8.25
      else if(r&&r.conflict&&ONLINE)fullSync();
    });
  }else{
    if(!getUsers().includes(user))return; // v8.19：服务器账号不写本机离线档
    GS.__basePrices=BASE_PRICES;GS.__purchaseLimits=PURCHASE_LIMITS;
    GS.__savedAt=Date.now(); // v8.19：离线保存更新保存时间戳（重连后 fullSync 才能识别本地较新）
    saveGS(user,GS);
  }
}

async function doRegister(){
  const u=document.getElementById('auth-user').value.trim(),p=document.getElementById('auth-pass').value;
  if(u.length<3||u.length>12)return authErr('用户名需 3~12 个字符');
  if(p.length<4)return authErr('密码至少 4 位');
  const online=await startOnline();
  if(Runtime.isOnline&&!online)return showOnlineUnavailable();
  let ok=true;
  if(online){
    const r=await NET.post('/api/register',{user:u,pass:p});
    if(!r||!r.ok)return authErr(r&&r.err?r.err:'注册失败（服务器不可用？）');
    const pl=await NET.get('/api/player/'+encodeURIComponent(u));
    if(pl&&pl.ok&&pl.gs)applySaved(pl.gs);
    else if(pl&&pl.ok)GS.__loaded=true; // v8.25：服务器确认无档=新玩家，允许建档；网络失败（pl=null）不置 loaded
  }else{
    const users=getUsers();
    if(users.includes(u))return authErr('该用户名已被注册');
    users.push(u);saveUsers(users);
    localStorage.setItem(GS_PREFIX+u+'_pwd',p);
    resetGameState(); // v8.12（D）：新注册离线账号使用全新开局存档，避免残留上一账号数据
    saveGS(u,GS);
    GS.__loaded=true; // v8.25：离线新账号建档
  }
  localStorage.setItem(AUTH_KEY,u);
  window.__gsReady=true; // v8.20：账号存档已确立，允许自动保存
  document.getElementById('auth-overlay').style.display='none';
  toast('🎉 注册成功！欢迎来到全王国，'+u,'ok');
  render();
}
async function doLogin(){
  const u=document.getElementById('auth-user').value.trim(),p=document.getElementById('auth-pass').value;
  const online=await startOnline();
  if(Runtime.isOnline&&!online)return showOnlineUnavailable();
  let ok=true;
  if(online){
    const r=await NET.post('/api/login',{user:u,pass:p});
    if(!r||!r.ok)return authErr(r&&r.err?r.err:'登录失败');
    await syncPlayer(u); // v8.19：登录合并存档；v8.25：__loaded 仅由 syncPlayer 按服务器确认状态设置
  }else{

}

// 导出文件不包含密码，只包含当前账号的游戏状态和格式版本。
function exportLocalSave(){
  if(!Runtime.isStandalone)return toast('在线模式不能导出本地存档','info');
  const user=localStorage.getItem(AUTH_KEY);
  if(!user)return toast('请先登录单机账号','info');
  saveNow();
  const payload={
    format:'wandertrade-save',
    version:1,
    exportedAt:Date.now(),
    user:user,
    state:getStoredGS(user)||State.snapshot()
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='wandertrade-'+user+'-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);

function importLocalSave(){
  if(!Runtime.isStandalone)return toast('在线模式不能导入本地存档','info');
  const user=localStorage.getItem(AUTH_KEY);
  if(!user)return toast('请先登录单机账号','info');
  const input=document.createElement('input');
  input.type='file';input.accept='application/json,.json';
  input.onchange=function(){
    const file=input.files&&input.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(){
      try{
        const payload=JSON.parse(String(reader.result||''));
        if(!payload||payload.format!=='wandertrade-save'||payload.version!==1||!payload.state){
          throw new Error('unsupported save format');
        }
        showModal('导入单机存档','导入将覆盖当前账号「'+user+'」的本地进度。建议先导出当前存档作为备份。','确认导入',function(){
          saveGS(user,payload.state);
          applySaved(payload.state);
          window.__gsReady=true;
          render();
          toast('单机存档导入成功','ok');
        });
      }catch(e){toast('存档文件无效或版本不受支持','err');}
    };
    reader.readAsText(file,'UTF-8');
  };
  input.click();
}

// 用法：点击右下角 🛠 打开指令台，或浏览器控制台运行 runCmd("...")
// 本地指令（无需密码，仅影响本账号）：/help /addgold /addcargo /addmat /repair /core /wagon /setrep /stock /day
// GM 指令（需世界管理密码，服务器执行）：/gm <密码> timescale|setday|givegold|giveitem|broadcast ...
const CMD_HELP=[
  '/help                          显示本帮助',
  '/addgold <金额>                给自己加金币',
  '/addcargo <物品id> <数量>      给自己加货物（如 grain、salt、ironware…）',
  '/addmat <类型> <数量>          加升级材料（gear/repair_kit/fuel_tank/engine）',
  '/repair                        车辆耐久修满',
  '/core <等级>                   载具核心直接升到指定等级（附带速度/耐久加成）',
  '/wagon <类型> <等级>           第 1 车厢位装指定车厢（cargo/pass/balanced/engine）',
  '/setrep <城市id> <经验>        设置某城市声望经验（如 greentown 5000）',
  '/stock <城市id> <物品id> <数量> 设置自己在该城该物品的库存',
  '/day <天数>                    本地推进到指定天数（在线由世界天数主导）',

  '/gm <密码> setday <天数>       设置世界天数（全服生效）',
  '/gm <密码> givegold <玩家> <金额> 给指定玩家发钱（在线存档生效）',

  '/gm <密码> broadcast <消息>    全服广播（在线玩家 60 秒内收到）'
];
function cmdOut(msg){const el=document.getElementById('cmd-out');if(el){const d=document.createElement('div');d.textContent=msg;el.appendChild(d);el.scrollTop=el.scrollHeight;}}
function runCmd(line){
  if(!line||!line.trim())return;
  const p=line.trim().split(/\s+/);
  const c=(p[0]||'').toLowerCase();
  const arg=(i,d)=>{const v=parseFloat(p[i]);return isNaN(v)?d:v};
  if(c==='/help'||c==='/h'||c==='help'){CMD_HELP.forEach(x=>cmdOut(x));return;}
  if(c==='/gold'){cmdOut('💰 当前金币：'+GS.gold);return;}
  if(c==='/addgold'){const n=Math.floor(arg(1,0));GS.gold+=n;cmdOut('💰 +'+n+' 金币 → '+GS.gold);render();return;}
  if(c==='/addcargo'){const it=(p[1]||''),n=Math.floor(arg(2,0));if(!it)return cmdOut('用法：/addcargo <物品id> <数量>');GS.cargo[it]=(GS.cargo[it]||0)+n;cmdOut('📦 +'+n+' '+it+'（现有 '+GS.cargo[it]+'）');render();return;}
  if(c==='/addmat'){const t=(p[1]||''),n=Math.floor(arg(2,0));if(!['gear','repair_kit','fuel_tank','engine'].includes(t))return cmdOut('材料类型：gear/repair_kit/fuel_tank/engine');GS.materials[t]=(GS.materials[t]||0)+n;cmdOut('🧰 +'+n+' '+t);render();return;}
  if(c==='/repair'){GS.vehicle.durability=getDurabilityMax();cmdOut('🔧 耐久已修满');render();return;}
  if(c==='/core'){const n=Math.floor(arg(1,0));GS.vehicle.core=GS.vehicle.core||{lv:0,speed:0,dura:0};GS.vehicle.core.lv=n;GS.vehicle.core.speed=n;GS.vehicle.core.dura=n;cmdOut('⚙️ 载具核心 → Lv'+n+'（疾驰+'+n+' 速 / 强化+'+n*50+' 耐久）');render();return;}
  if(c==='/wagon'){const t=(p[1]||''),lv=Math.floor(arg(2,1));if(!WAGON_TYPES[t])return cmdOut('车厢类型：cargo/pass/balanced/engine');const slots=GS.vehicle.wagons||[];if(!slots.length)return cmdOut('无车厢位');const s=slots[0];const fit=fitAfterSlot(0,t,lv);if(getUsedCargo()+getTaskCargoUsed()>fit.cap||getPassUsed()+getTaskPassUsed()>fit.pass)return cmdOut('⚠ 现有货物/旅客超出该车厢容量，未装配');s.cur={id:'w'+t+'_'+lv,type:t,lv:lv};s.owned=s.owned||{};s.owned[t+'_'+lv]=true;cmdOut('🚛 第1车厢位已装 '+WAGON_TYPES[t].name+' Lv'+lv);render();return;}
  if(c==='/setrep'){const city=(p[1]||''),exp=Math.floor(arg(2,0));if(!CITIES.some(x=>x.id===city))return cmdOut('未知城市：'+city);GS.reputation[city]=GS.reputation[city]||{level:0,exp:0};const r=GS.reputation[city];r.exp=0;r.level=0;addRep(city,exp);cmdOut('⭐ '+city+' 声望经验='+exp+' → 等级 '+getRepLevel(city));render();return;}
  if(c==='/stock'){const city=(p[1]||''),it=(p[2]||''),n=Math.floor(arg(3,0));if(!city||!it)return cmdOut('用法：/stock <城市id> <物品id> <数量>');GS.cityStocks=GS.cityStocks||{};GS.cityStocks[city]=GS.cityStocks[city]||{};GS.cityStocks[city][it]=n;cmdOut('📦 '+city+' '+it+' 库存 → '+n);render();return;}
  if(c==='/day'){if(ONLINE)return cmdOut('📅 在线模式天数由世界锚点统一驱动，/day 仅离线可用');const n=Math.floor(arg(1,1));GS.day=Math.max(1,n);cmdOut('📅 本地天数 → '+n);render();return;}
  if(c==='/gm'||c==='/admin'){
    const key=(p[1]||''),sub=(p[2]||'').toLowerCase();
    if(!key)return cmdOut('用法：/gm <密码> <指令> …（密码见服务器控制台或 world.json）');
    const payload={key:key,cmd:sub};
    if(sub==='timescale'){payload.x=arg(3,1);}
    else if(sub==='setday'){payload.n=Math.floor(arg(3,1));}
    else if(sub==='givegold'){payload.user=(p[3]||'');payload.amt=Math.floor(arg(4,0));}
    else if(sub==='giveitem'){payload.user=(p[3]||'');payload.item=(p[4]||'');payload.qty=Math.floor(arg(5,0));}
    else if(sub==='broadcast'){payload.msg=p.slice(3).join(' ');}
    else return cmdOut('GM 指令：timescale / setday / givegold / giveitem / broadcast');
    if(!ONLINE)return cmdOut('❌ 当前为离线模式，GM 指令仅在线可用');
    cmdOut('⏳ 正在执行 GM 指令…');
    NET.post('/api/admin',payload).then(r=>{
      if(r&&r.ok)cmdOut('✅ '+r.msg);
      else cmdOut('❌ '+(r&&r.err?r.err:'执行失败'));
    });
    return;
  }
  cmdOut('❓ 未知指令：'+c+'（输入 /help 查看帮助）');
}

const CHAT={msgs:[],since:0,firstPull:true,histOpen:false,panelOpen:false};
const CHAT_KEY='_chat_history';
function chatStamp(ts){const d=ts?new Date(ts):new Date();const p=n=>(n<10?'0':'')+n;return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
function chatEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function chatAdd(m,danmaku){

async function chatSend(){
  const inp=document.getElementById('chat-input');

  if(!user)return toast('请先登录账号再发言','info');

    // 若尚未拉取过历史（如登录后立即发言），先补拉一次历史（不弹幕）
    if(CHAT.firstPull){
      const r0=await NET.get('/api/chat?since=0');
      if(r0&&r0.ok&&r0.msgs){CHAT.firstPull=false;for(const m of r0.msgs)chatAdd(m,false);}
    }
    const r=await NET.post('/api/chat',{user,loc,msg});
    if(r&&r.ok)chatAdd({id:r.id,user,loc,msg,ts:Date.now()},true);
    else toast('消息发送失败（服务器不可用？）','err');
  }else{
    const lastId=CHAT.msgs.length?CHAT.msgs[CHAT.msgs.length-1].id||0:0;
    chatAdd({id:lastId+1,user,loc,msg,ts:Date.now()},true);
  }
  if(inp)inp.value='';
}

// 在线聊天轮询（3 秒）：首拉只入历史不弹幕，之后增量弹幕
function startChatPolling(){
  if(window.__chatPoll)return;
  const poll=async()=>{
    if(!ONLINE)return;
    const r=await NET.get('/api/chat?since='+CHAT.since);
    if(r&&r.ok&&r.msgs&&r.msgs.length){
      const first=CHAT.firstPull;CHAT.firstPull=false;
      for(const m of r.msgs)chatAdd(m,!first);
    }
  };
  poll(); // 登录后首个成功轮询即拉历史
  window.__chatPoll=setInterval(poll,3000);
}
// 通用可拖动（el=目标元素，handle=拖动手柄；onClick 在无位移的点击时触发）
function makeDraggable(el,handle,opts){
  let sx=0,sy=0,ox=0,oy=0,drag=false,moved=false;
  handle.addEventListener('mousedown',e=>{
    drag=true;moved=false;sx=e.clientX;sy=e.clientY;
    const r=el.getBoundingClientRect();ox=r.left;oy=r.top;
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.abs(dx)+Math.abs(dy)>6)moved=true;
    el.style.left=Math.min(Math.max(0,ox+dx),window.innerWidth-el.offsetWidth)+'px';
    el.style.top=Math.min(Math.max(0,oy+dy),window.innerHeight-el.offsetHeight)+'px';
    el.style.right='auto';el.style.bottom='auto';
  });
  window.addEventListener('mouseup',()=>{
    if(drag&&!moved&&opts&&opts.onClick)opts.onClick();
    drag=false;
  });
}

// ===== 游戏状态（v9.0：由 state.js 的 State.init() 统一管理） =====
// 注意：不要再在此处定义 const GS = {...} —— 会遮蔽 state.js 创建的响应式 Proxy
// 正式：1 游戏日 = 10 分钟（600000ms）；timeScale 为世界时间流速倍率（GM 指令可调）
function getCurrentGameDay(){const e=(Date.now()-GS.gameStartTime)/(600000/(GS.timeScale||1));return Math.max(1,Math.floor(e)+1)}
// 库存刷新（v7.4 正式）：每【现实 30 分钟】补满——每个玩家库存独立，仅共享刷新节奏（在线以服务器为准）
const STOCK_REFILL_MS=1800000;
function refillStocks(){
  const now=Date.now();
  if(now-(GS.lastStockRefill||0)>=STOCK_REFILL_MS){
    GS.lastStockRefill=now;
    for(let c of CITIES){
      if(!GS.cityStocks[c.id])GS.cityStocks[c.id]={};
      for(let gid of c.goods)GS.cityStocks[c.id][gid]=PURCHASE_LIMITS[c.id]?.[gid]||100;
    }
  }
}
function advanceDay(){
  const nd=getCurrentGameDay();let r=false;
  if(ONLINE){
    if(nd!==GS.day){r=nd>GS.day;State.set('day',nd);}
  }else if(nd>GS.day){State.set('day',nd);r=true}
  refillStocks();
  if(GS.traveling&&Date.now()>=GS.traveling.arrivalTime){
    State.batch(function(){
      var travel = GS.traveling;
      State.set('pendingEvent', travel.pendingEvent||null);
      State.set('location', travel.to);
      State.set('traveling', null);
      State.set('justArrived', true);
      var vs = State.get('visitStamp') || {};
      vs[travel.to] = (vs[travel.to]||0)+1;
      State.set('visitStamp', vs);
    });
    r=true;
  }
  return r;
}
// ===== 车厢系统（v6.10） =====
// 车辆容量/速度/耐久损耗由所挂载的车厢决定；载具等级=车厢位（Lv1=1 → Lv10=10）
// 四类车厢 × 5 级：货运(大货舱但降速)、载客(大旅客仓且略提速)、均衡(两者兼顾+降耗)、动力(大幅提速+降耗)
// 非动力车厢损耗随等级梯度增加（容量越大损耗越高）；费用指数分布（1级几万/4级大几十万/5级小几百万）
const WAGON_TYPES={
  cargo:{name:'货运车厢',icon:'📦',cap:[60,120,200,300,450],pass:[0,0,0,0,0],spd:0.95,dur:[1.2,1.35,1.5,1.65,1.8],hp:[40,70,110,160,230],base:30000,color:'var(--accent)'},
  pass:{name:'载客车厢',icon:'🧳',cap:[0,0,0,0,0],pass:[8,12,16,20,25],spd:1.05,dur:[1.2,1.35,1.5,1.65,1.8],hp:[30,55,85,120,170],base:30000,color:'var(--travel)'},
  balanced:{name:'均衡车厢',icon:'⚖️',cap:[30,60,100,150,220],pass:[4,6,8,10,12],spd:0.97,dur:[1.1,1.22,1.34,1.46,1.58],hp:[35,60,95,140,200],base:45000,color:'var(--green)'},
  engine:{name:'动力车厢',icon:'⚙️',cap:[0,0,0,0,0],pass:[0,0,0,0,0],spd:[1.1,1.2,1.3,1.45,1.6],dur:[0.85,0.75,0.65,0.55,0.45],hp:[25,45,70,100,140],base:60000,color:'var(--gold)'}
};
// 费用梯度（指数分布）：1级几万 → 4级大几十万 → 5级小几百万（货运 base 3万：3万/9万/24万/60万/180万）
const WAGON_COST_MUL=[1,3,8,20,60];
// 每节车厢位独立解锁（v6.12）：{cur:当前装配, owned:已购买车厢集合}
// 已购买的车厢可免费更换装配；未购买的车厢需花金币购买解锁；各车厢位进度互不影响
// 当前装配的车厢（仅统计有效车厢位，避免超槽位旧存档造成容量与 UI 不一致）
function getWagons(){return (GS.vehicle.wagons||[]).slice(0,getWagonSlots()).filter(w=>w&&w.cur).map(w=>w.cur)}
// 装配/卸载后的容量预测（用于更换车厢与卸车时的超载保护）
function fitAfterSlot(i,type,lv){
  let cap=0,pass=0;
  (GS.vehicle.wagons||[]).slice(0,getWagonSlots()).forEach((w,idx)=>{
    if(idx===i||!w||!w.cur)return; // idx===i 将被新装配替换
    cap+=getWagonCap(w.cur);pass+=getWagonPass(w.cur);
  });
  if(type){cap+=getWagonCap({type,lv});pass+=getWagonPass({type,lv});}
  return{cap,pass};
}
// v9.x：车厢更换/卸载不再因任务“硬锁定”，而是在执行操作时做容量合法性校验：
// 若卸下/更换后会导致【玩家货物 + 旅客 + 任务占用】超出新容量，则拒绝并提示。
function wagonKey(type,lv){return type+'_'+lv}
function getOwnedCount(w){return w&&w.owned?Object.keys(w.owned).length:0}
function isOwned(w,type,lv){return !!(w&&w.owned&&w.owned[wagonKey(type,lv)])}
function getWagonSlots(){return Math.max(1,GS.vehicle.level)} // 车厢位=载具等级（Lv1=1、Lv10=10）
function getWagonCap(w){return WAGON_TYPES[w.type].cap[w.lv-1]||0}
function getWagonPass(w){return WAGON_TYPES[w.type].pass[w.lv-1]||0}
function getWagonSpdMul(w){const s=WAGON_TYPES[w.type].spd;return Array.isArray(s)?s[w.lv-1]:s}
function getWagonDurMul(w){return WAGON_TYPES[w.type].dur[w.lv-1]}
// v8.10（C1）：耐久损耗倍率由"全部相乘"改为加权求和（1+Σ(倍率-1)，下限 0.2）。
// 修复全货运车队 1.8^10≈357× 的耐久爆炸；前期单节数值不变，后期"容量高损耗高"梯度仍清晰。
function getWagonDurMulAll(){let mul=1;for(const w of getWagons())mul+=getWagonDurMul(w)-1;return Math.max(0.2,mul)}
function getWagonCost(type,lv){return Math.round(WAGON_TYPES[type].base*WAGON_COST_MUL[lv-1])}
function getVehicleSpeed(){
  let mul=1;for(const w of getWagons())mul*=getWagonSpdMul(w);
  const coreSpeed=GS.vehicle.core?GS.vehicle.core.speed:0; // 载具核心：基础速度加成
  return Math.round((GS.vehicle.speed+coreSpeed)*mul);
}
function getVehicleCapacity(){return getWagons().reduce((s,w)=>s+getWagonCap(w),0)}
// 旅客仓：与货舱独立，物资不可占用旅客仓、旅客同理
function getPassCapacity(){return getWagons().reduce((s,w)=>s+getWagonPass(w),0)}
function getPassUsed(){return GS.vehicle.passengers}
function getUsedCargo(){let s=0;for(let v of Object.values(GS.cargo))s+=v;return s}
// 已接任务占用的容量：deliver 占货舱 qty 格（任务货物），escort 占旅客仓 qty 格（多人）
// 任务货物在任务内管理，不在玩家 cargo 中，无法转移仓库；完成/放弃后自动释放
function getTaskCargoUsed(){return (GS.tasks.active||[]).filter(t=>t.capType==='cargo'&&!t.delivered).reduce((s,t)=>s+t.qty,0)}
function getTaskPassUsed(){return (GS.tasks.active||[]).filter(t=>t.capType==='pass'&&!t.delivered).reduce((s,t)=>s+t.qty,0)}
function getCargoFree(){return getVehicleCapacity()-getUsedCargo()-getTaskCargoUsed()}
function getPassFree(){return getPassCapacity()-getPassUsed()-getTaskPassUsed()}
function wagonRequired(){
  return{
    cargo: getUsedCargo()+getTaskCargoUsed(),
    pass:  getPassUsed()+getTaskPassUsed()
  };
}
function wagonFitMsg(req,fit){
  return `当前占用：货舱 ${req.cargo} / 旅客 ${req.pass}\n操作后容量：货舱 ${fit.cap} / 旅客 ${fit.pass}\n\n请先转移/卖出货物或完成任务释放占用后再操作。`;
}
// 注：getMaxStock 唯一实现在"库存上限"定义处（含声望加成与顺价收紧）；此处无重复定义（v8.12 清理死代码）
function getCurStock(cityId,itemId){return Math.min(GS.cityStocks[cityId]?.[itemId]||0,getMaxStock(cityId,itemId))}

// ===== 车辆耐久系统 =====
// 耐久为点数池：载具升级白值 + 核心强化耐久 + 所有车厢耐久总和
// 载具升级白值：Lv1=100，每级 +20；核心强化：core.dura × 50；车厢：各车厢 hp
function getDurabilityMaxByLevel(lv){return 100+(lv-1)*20}
function getWagonHp(w){return WAGON_TYPES[w.type].hp[w.lv-1]||0}
function getWagonHpAll(){return getWagons().reduce((s,w)=>s+getWagonHp(w),0)}
function getCoreDurability(){return (GS.vehicle.core&&GS.vehicle.core.dura||0)*50}
function getDurabilityMax(){return getDurabilityMaxByLevel(GS.vehicle.level)+getCoreDurability()+getWagonHpAll()}
// 变更耐久上限后刷新：保持当前耐久在 [0, max] 内；added 为新增上限点数（可同步补充当前耐久）
function refreshDurability(added=0){
  var veh = State.get('vehicle') || {};
  veh.durability=Math.max(0,Math.min(getDurabilityMax(),veh.durability+added));
  veh.durabilityMax=getDurabilityMax();
  State.set('vehicle', veh);
}
function normalizeVehicleDurability(){
  var veh = State.get('vehicle') || {};
  const oldMax=veh.durabilityMax||0;
  const newMax=getDurabilityMax();
  if(veh.durability>=oldMax){veh.durability=newMax;}
  else{veh.durability=Math.min(veh.durability,newMax);}
  veh.durabilityMax=newMax;
  State.set('vehicle', veh);
}
function getDurability(){return GS.vehicle.durability}
function getDurabilityPct(){return Math.min(1,GS.vehicle.durability/getDurabilityMax())}
// 损耗率分阶段：耐久越低消耗越快（点/里）；再 × 车厢耐久倍率（非动力车厢掉更快、动力车厢掉更慢）
function getDurabilityRate(){const p=getDurabilityPct();const base=p>0.7?0.5:(p>0.4?0.8:(p>0.2?1.2:1.8));return base*getWagonDurMulAll()}
function calcDurabilityLoss(dist){return Math.round(dist*getDurabilityRate())}
// 耐久状态标签
function getDurabilityState(){
  const p=getDurabilityPct();
  if(p>0.7)return{label:'良好 🟢',cls:''};
  if(p>0.4)return{label:'磨损 ⚠️',cls:'warn'};
  if(p>0.2)return{label:'严重 🟠',cls:'warn'};
  return{label:'危险 🔴',cls:'danger'};
}
// 耐久颜色（进度条填充色）
function getDurabilityColor(){
  const p=getDurabilityPct();
  return p>0.7?'var(--green)':(p>0.2?'var(--sell)':'var(--red)');
}
// 维修费用：修复量 × 基础单价(60) × 等级系数 × 事件乘数（等级越高越贵；v6.5 货币量级）
function getRepairCost(){
  const need=getDurabilityMax()-GS.vehicle.durability;
  const unit=60,levelFactor=1+(GS.vehicle.level-1)*0.25;
  return Math.round(need*unit*levelFactor*getRepairMult(GS.day));
}

// ===== 操作 =====
// —— 货物批次（数组）：用于同城同次倒卖限制与成本展示 ——
// GS.lots[gid] = [ {city, qty, cost, stamp}, ... ]
// stamp = 买入时该城的"停留批次号"（GS.visitStamp[city]）；离开城市再返回后 stamp 递增，
// 旧批次不再属于"同城同次"，从而消除同城倒卖惩罚。
function migrateLots(){
  var lots = State.get('lots') || {};
  var changed = false;
  for(const gid of Object.keys(lots)){
    const e=lots[gid];
    if(Array.isArray(e))continue;
    const arr=[];
    for(const cid of Object.keys(e||{})){
      if(e[cid]&&e[cid].qty>0)arr.push({city:cid,qty:e[cid].qty,cost:e[cid].cost||0,stamp:0});
    }
    if(arr.length){lots[gid]=arr;changed=true;}
    else{delete lots[gid];changed=true;}
  }
  if(changed)State.set('lots', lots);
}
function addLots(gid,city,qty,cost){
  var lots = State.get('lots') || {};
  var vs = State.get('visitStamp') || {};
  if(!vs[city])vs[city]=1;
  const stamp=vs[city];
  if(!lots[gid])lots[gid]=[];
  const b=lots[gid].find(function(x){return x.city===city&&x.stamp===stamp;});
  if(b){b.cost=Math.round((b.cost*b.qty+cost*qty)/(b.qty+qty));b.qty+=qty;}
  else{lots[gid].push({city:city,qty:qty,cost:cost,stamp:stamp});}
  State.batch(function(){
    State.set('lots', lots);
    State.set('visitStamp', vs);
  });
}
// 判断本次卖出是否触发"同城同次 + 本城买入价<卖出价（顺价可套利）"的 60% 惩罚确认
function getSameVisitArbitrage(gid,qty){
  const arr=GS.lots[gid];
  if(!arr||!arr.length)return null;
  const buy=getDayPrice(GS.location,gid,GS.day)||0;
  const sPrice=getSellPrice(GS.location,gid,GS.day)||0;
  if(!(buy<sPrice))return null; // 非"顺价可套利"（买入价高于等于卖出价）时无惩罚判定
  const curStamp=GS.visitStamp[GS.location];
  let sameQty=0;
  for(const b of arr){if(b.city===GS.location&&b.stamp===curStamp)sameQty+=b.qty;}
  if(sameQty<=0)return null;
  return{sameQty:Math.min(sameQty,qty),buy,sPrice};
}
// 卖出时按批次扣除：同城同次批次受惩罚（顺价套利 60% / 普通 80%），其余批次按正常售价
// 返回 {revenue, sameQty, arbitrage}
function consumeLots(gid,qty){
  const sPrice=getSellPrice(GS.location,gid,GS.day)||0;
  const buy=getDayPrice(GS.location,gid,GS.day)||0;
  const arbitrage=buy<sPrice;
  const curStamp=GS.visitStamp[GS.location];
  let remaining=qty,revenue=0,sameQty=0;
  var lots = State.get('lots') || {};
  const arr = lots[gid] || [];
  for(const b of arr){
    if(remaining<=0)break;
    if(b.city===GS.location&&b.stamp===curStamp){
      const take=Math.min(b.qty,remaining);
      const rate=arbitrage?Math.round(buy*0.6):Math.round(b.cost*0.8);
      revenue+=take*rate;sameQty+=take;b.qty-=take;remaining-=take;
    }
  }
  for(const b of arr){
    if(remaining<=0)break;
    if(b.qty<=0)continue;
    const take=Math.min(b.qty,remaining);
    revenue+=take*sPrice;b.qty-=take;remaining-=take;
  }
  lots[gid]=(arr).filter(function(b){return b.qty>0;});
  if(!lots[gid].length)delete lots[gid];
  State.set('lots', lots);
  return{revenue:revenue,sameQty:sameQty,arbitrage:arbitrage};
}
function buyItem(itemId,qty,opts){
  opts=opts||{};
  if(!opts.skipAdvance)advanceDay();
  if(GS.traveling)return{ok:false,msg:'旅行中不可交易'};
  const city=GS.location,cityObj=getCity(city);
  if(!getBuyableGoods(city).includes(itemId))return{ok:false,msg:'该城不可购买此物资（声望不足或非本城货物）'};
  const price=getDayPrice(city,itemId,GS.day);if(!price)return{ok:false,msg:'价格数据异常'};
  const total=price*qty;
  const taxRate=(window.Tax&&Tax.getRate)?Tax.getRate(getRepLevel(city)):0;
  const tax=(window.Tax&&Tax.calc)?Tax.calc(total,taxRate):0;
  const pay=total+tax;
  if(GS.gold<pay)return{ok:false,msg:'资金不足'};
  const stock=getCurStock(city,itemId);if(qty>stock)return{ok:false,msg:'库存不足'};
  if(getCargoFree()<qty)return{ok:false,msg:'载具容量不足'};
  const oldQty=GS.cargo[itemId]||0,oldCost=GS.buyPrice[itemId]||0;
  const newQty=oldQty+qty;
  const newCost=Math.round((oldCost*oldQty+total)/newQty);
  addLots(itemId,city,qty,price);
  State.batch(function(){
    var cargo = State.get('cargo') || {};
    var buyPrice = State.get('buyPrice') || {};
    cargo[itemId] = newQty;
    buyPrice[itemId] = newCost;
    State.set('cargo', cargo);
    State.set('buyPrice', buyPrice);
    var cs = State.get('cityStocks') || {};
    if(!cs[city])cs[city]={};
    cs[city][itemId] = stock-qty;
    State.set('cityStocks', cs);
  });
  State.set('gold', GS.gold-pay);
  EventBus.emit(EventBus.EVENTS.ITEM_BOUGHT, {itemId:itemId, qty:qty, price:price, total:total, taxRate:taxRate, tax:tax, pay:pay});
  const repGain=qty;
  addRep(city,repGain);
  statAdd('bought',qty);
  if(GS.tutorial&&GS.tutorial.step===1&&ITEMS[itemId].cat==='basic')advanceTutorial(1);
  const taxNote=tax>0?` · 税${fmt(tax)}（${Math.round(taxRate*100)}%）`:'';
  return{ok:true,msg:`购入${qty}件${getItem(itemId).name}${taxNote}${repGain>0?` · ⭐本城声望 +${repGain}`:''}`};
}
function sellItem(itemId,qty,opts){
  opts=opts||{};
  if(!opts.skipAdvance)advanceDay();
  if(GS.traveling)return{ok:false,msg:'旅行中不可交易'};
  const held=GS.cargo[itemId]||0;if(held<qty)return{ok:false,msg:'持有不足'};
  const sPrice=getSellPrice(GS.location,itemId,GS.day);if(!sPrice)return{ok:false,msg:'价格异常'};
  const{revenue,sameQty,arbitrage}=consumeLots(itemId,qty);
  const city=GS.location;
  const taxRate=(window.Tax&&Tax.getRate)?Tax.getRate(getRepLevel(city)):0;
  const tax=(window.Tax&&Tax.calc)?Tax.calc(revenue,taxRate):0;
  const net=revenue-tax;
  const remaining=held-qty;
  State.batch(function(){
    var cargo = State.get('cargo') || {};
    var buyPrice = State.get('buyPrice') || {};
    if(remaining<=0){
      delete cargo[itemId];
      delete buyPrice[itemId];
    }else{
      cargo[itemId]=remaining;
    }
    State.set('cargo', cargo);
    State.set('buyPrice', buyPrice);
  });
  State.set('gold', GS.gold+net);
  EventBus.emit(EventBus.EVENTS.ITEM_SOLD, {itemId:itemId, qty:qty, revenue:revenue, taxRate:taxRate, tax:tax, net:net});
  const repGain=Math.floor(revenue/1000);
  addRep(GS.location,repGain);
  statAdd('sold',qty);statAdd('income',revenue);
  if(GS.tutorial&&GS.tutorial.step===5)advanceTutorial(5);
  const sameNote=sameQty>0?`（其中${sameQty}件同城同次买入按${arbitrage?'当前买入价60%':'买入价80%'}结算）`:'';
  const taxNote=tax>0?` · 税${fmt(tax)}（${Math.round(taxRate*100)}%）`:'';
  return{ok:true,msg:`售出${qty}件${getItem(itemId).name}，得${fmt(net)}金${taxNote}${sameNote}${repGain>0?` · ⭐本城声望 +${repGain}`:''}`};
}
function startTravel(destId){
  advanceDay();if(GS.traveling)return{ok:false,msg:'已在旅行中'};
  if(destId===GS.location)return{ok:false,msg:'已在目标城市'};
  if(destId==='starfall')return{ok:false,msg:'星陨城暂未开放，无法前往'};
  const sp=shortestPath(GS.location,destId);if(!sp)return{ok:false,msg:'无可用路径'};
  if(getDurability()<=0)return{ok:false,msg:'车辆耐久不足，请先维修'};
  const realSec=Math.round(sp.distance/getVehicleSpeed()*60);
  const durLoss=calcDurabilityLoss(sp.distance);
  const veh = GS.vehicle;
  State.batch(function(){
    veh.durability = Math.max(0, veh.durability-durLoss);
    State.set('vehicle', veh);
    State.set('traveling', {to:destId,startedAt:Date.now(),arrivalTime:Date.now()+realSec*1000,routeDistance:sp.distance,pendingEvent:rollPrivateEvent(sp,destId)});
  });
  statAdd('travels',1);statAdd('distance',Math.round(sp.distance));
  if(GS.tutorial&&GS.tutorial.step===3)advanceTutorial(3);
  return{ok:true,msg:`出发！${fmt(sp.distance)}里，耐久-${durLoss}点`};
}
// 维修车辆（网页内确认弹窗）
function doRepair(){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const cur=GS.vehicle.durability,max=getDurabilityMax();
  if(cur>=max)return toast('车辆耐久完整，无需维修','info');
  const disc=GS.repairDisc||1;
  const cost=Math.round(getRepairCost()*disc);

// ===== 仓库系统（v6.15：分级解锁 + 指数扩建） =====
// 初始无仓库；按城市阶段分级解锁（新手村 500 / 中期 5000 / 高级 50000），初始 100 格
// 扩建 +50 格/次，费用指数增长：解锁价 × 阶段系数^已扩建次数（新手村×1.5、中期×2~2.5、高级×3，越后期越贵）
function getWhConfig(cityId){
  const st=cityStage(cityId);
  if(st===1)return{unlock:500,coef:1.5};
  if(st===2)return{unlock:5000,coef:2};
  if(st===3)return{unlock:5000,coef:2.5};
  return{unlock:50000,coef:3};
}
function getWhExpandCost(cityId){
  const w=GS.warehouses[cityId];if(!w)return 0;
  const cfg=getWhConfig(cityId);
  return Math.round(cfg.unlock*Math.pow(cfg.coef,w.buildCount||0));
}
function doUnlockWarehouse(){
  if(GS.traveling)return toast('旅行中不可操作','info');
  if(GS.warehouses[GS.location])return toast('本城已有仓库','info');
  const cfg=getWhConfig(GS.location);
  if(GS.gold<cfg.unlock)return toast('资金不足，解锁需 '+fmt(cfg.unlock)+' 金币','err');
  var wh = State.get('warehouses') || {};
  wh[GS.location] = {capacity:100,items:{},buildCount:0};
  State.set('warehouses', wh);
  State.set('gold', GS.gold-cfg.unlock);
  toast(`🏪 仓库已解锁！（${getCityName(GS.location)} · 100 格）`,'ok');render();
}
function doExpandWarehouse(){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const w=GS.warehouses[GS.location];if(!w)return toast('本城无仓库，请先解锁','info');
  const cost=getWhExpandCost(GS.location);
  if(GS.gold<cost)return toast('资金不足，扩建需 '+fmt(cost)+' 金币','err');
  var wh = State.get('warehouses') || {};
  wh[GS.location].capacity += 50;
  wh[GS.location].buildCount = (wh[GS.location].buildCount||0)+1;
  State.set('warehouses', wh);
  State.set('gold', GS.gold-cost);
  toast(`🏪 仓库扩建成功！容量 ${w.capacity-50} → ${w.capacity} 格`,'ok');render();
}
function doWhIn(itemId,qty){if(GS.traveling)return toast('旅行中不可操作','info');const wh=GS.warehouses[GS.location];if(!wh)return toast('无仓库','err');const held=GS.cargo[itemId]||0;if(qty>held)return;const used=Object.values(wh.items).reduce((a,b)=>a+b,0);if(used+qty>wh.capacity)return toast('仓库满','err');State.batch(function(){var cargo=State.get('cargo')||{};var warehouses=State.get('warehouses')||{};var w=warehouses[GS.location];cargo[itemId]=held-qty;if(cargo[itemId]<=0)delete cargo[itemId];w.items[itemId]=(w.items[itemId]||0)+qty;State.set('cargo',cargo);State.set('warehouses',warehouses);});toast('已存入仓库','ok');render()}
function doWhOut(itemId,qty){if(GS.traveling)return toast('旅行中不可操作','info');const wh=GS.warehouses[GS.location];if(!wh||!(wh.items[itemId])||wh.items[itemId]<qty)return toast('库存不足','err');if(getCargoFree()<qty)return toast('载具满','err');State.batch(function(){var cargo=State.get('cargo')||{};var warehouses=State.get('warehouses')||{};var w=warehouses[GS.location];w.items[itemId]-=qty;if(w.items[itemId]<=0)delete w.items[itemId];cargo[itemId]=(cargo[itemId]||0)+qty;State.set('cargo',cargo);State.set('warehouses',warehouses);});toast('已装入载具','ok');render()}

// ===== 升级素材道具（任务系统产出，用于载具升级） =====
const MATERIALS={gear:{name:'精密齿轮',icon:'⚙️'},repair_kit:{name:'维修套件',icon:'🧰'},fuel_tank:{name:'燃油舱',icon:'🛢️'},engine:{name:'引擎核心',icon:'🔩'}};
function getMat(id){return MATERIALS[id]||{name:id,icon:'📦'}}

// ===== 城市声望系统（每城独立，长期养成） =====
// GS.reputation:{ [cityId]:{ level, exp } }；获取：本城交易额（买按数量、卖按税收折算）+ 完成本城任务
// 效果：① 逐步解锁该城可购物资类型（REP_GOODS，本城特产）② 提升库存上限（每级+15%）
//      ③ 卖出价差减免（每级+1%）④ 情报所联动：range/高级情报概率/消息条数
// 注：声望为长期养成，升级需求 = tierBase × 2^等级（village 3000 / town 8000 / capital 15000 起步，指数增长）
const REP_GOODS={
  oaktown:{2:['mushroom'],3:['honey']},
  ironfort:{2:['steel_blade']},
  saltbay:{2:['sailcloth'],3:['pearl']},
  purplefield:{2:['cheese'],3:['beer']},
  windoasis:{2:['carpet'],3:['leather']},
  moonvalley:{2:['herb'],3:['moon_crystal']},
  frostfort:{2:['fur'],3:['ginseng']}
};
function getRepLevel(cityId){return GS.reputation[cityId]?GS.reputation[cityId].level:0}
function getRepExp(cityId){return GS.reputation[cityId]?GS.reputation[cityId].exp:0}
// 升级阈值：按城市等级差异，指数增长（v6.5 货币量级放大后同步 ×10）
//   village: Lv1=3000 → Lv2=6000 → ...（新手村低门槛）
//   town:    Lv1=8000 → Lv2=16000 → ... → Lv8=1024000（百万级）
//   capital: Lv1=15000 → ...
function getRepTierBase(cityId){
  const c=getCity(cityId);const t=c?c.tier:'town';
  return t==='village'?3000:(t==='capital'?15000:(t==='special'?10000:8000));
}
function getRepExpNeed(cityId){
  const lv=getRepLevel(cityId);
  return Math.round(getRepTierBase(cityId)*Math.pow(2,lv));
}
function addRep(cityId,exp){
  if(exp<=0)return;
  var rep = State.get('reputation') || {};
  if(!rep[cityId])rep[cityId]={level:0,exp:0};
  const r=rep[cityId];r.exp+=exp;let ups=0;
  while(r.exp>=getRepExpNeed(cityId)){r.exp-=getRepExpNeed(cityId);r.level++;ups++}
  State.set('reputation', rep);
  if(ups>0){statAdd('reps',ups);EventBus.emit(EventBus.EVENTS.REPUTATION_GAIN,{cityId:cityId,level:r.level});toast(`⭐ ${getCityName(cityId)}声望提升至 Lv${r.level}！`,'ok');}
}
// 本城可购物资 = 基础清单 + 声望逐步解锁的本城特产（REP_GOODS）
function getBuyableGoods(cityId){
  const city=getCity(cityId);if(!city)return[];
  const lv=getRepLevel(cityId),set=new Set(city.goods);
  const g=REP_GOODS[cityId];if(g)for(const k of Object.keys(g)){if(Number(k)>lv)g[k].forEach(id=>set.delete(id));}
  return[...set];
}
// 库存上限：基础 ×（1+0.15×声望等级）；本城买入价<卖出价（顺价可套利）时临时收紧库存
function getMaxStock(cityId,itemId){
  const base=PURCHASE_LIMITS[cityId]?.[itemId]||100;
  let cap=Math.round(base*(1+0.15*getRepLevel(cityId)));
  const buy=getDayPrice(cityId,itemId,GS.day),sell=getSellPrice(cityId,itemId,GS.day);
  if(buy!=null&&sell!=null&&buy<sell){
    const gap=(sell-buy)/buy;
    cap=Math.round(cap*(gap>0.1?0.3:0.5)); // 顺价套利：库存上限临时收紧到五成/三成，抑制同城倒卖
  }
  return cap;
}
// 卖出价差减免：每级声望 +1%（视为更熟悉本城市场）
function getRepSellBonus(cityId){return 1+getRepLevel(cityId)*0.01}

// ===== 任务系统（送货 / 送客 · 多任务 · 任务自带货物/旅客） =====
// 每城任务板：抵达城市刷新 5 个任务位（slot）
// 送货：描述显示实际物资，接取后统一为"任务货物"（占货舱 qty 格），无需玩家备货
// 送客：可多人（qty 1~3），占旅客仓 qty 格
// 多任务：车辆容量允许即可接取多个任务
// 接取后任务位不消失，清空内容显示【查看更多任务】按钮，刷新计次继承
// 刷新：每任务位每城免费 2 次，第 3 次起 1000 金并逐次翻倍
// 任务货物/旅客在任务内管理，无法转移仓库；完成或放弃后释放容量
const TASK_RARITY=[
  {id:'common',name:'普通',goldMul:1,repMul:250,color:'var(--text2)'},
  {id:'rare',name:'稀有',goldMul:1.6,repMul:600,color:'var(--travel)'},
  {id:'epic',name:'史诗',goldMul:2.6,repMul:1500,color:'var(--accent)'},
  {id:'legend',name:'传说',goldMul:4.2,repMul:3000,color:'var(--gold)'}
];
// 声望等级 → 稀有度权重表（普通/稀有/史诗/传说），高稀有度低频
const RARITY_TABLE=[
  [0.72,0.25,0.03,0],     // Lv0
  [0.65,0.28,0.06,0.01],  // Lv1
  [0.58,0.30,0.10,0.02],  // Lv2
  [0.50,0.32,0.15,0.03],  // Lv3
  [0.42,0.34,0.19,0.05]   // Lv4+
];
function getRarity(id){return TASK_RARITY.find(r=>r.id===id)||TASK_RARITY[0]}
function rollRarity(){
  // 稀有度按城市梯度封顶：新手村仅普通/稀有（无史诗传说）、初期无传说、中期起开放传说
  const st=cityStage(GS.location);
  if(st===1)return Math.random()<0.72?TASK_RARITY[0]:TASK_RARITY[1];
  if(st===2){const r=Math.random();return r<0.60?TASK_RARITY[0]:(r<0.90?TASK_RARITY[1]:TASK_RARITY[2]);}
  let rep=Math.min(4,getRepLevel(GS.location));
  const c=getCity(GS.location);
  if(c&&c.tier==='capital')rep=Math.min(4,rep+1); // 王都基础稀有度更高（更高级的城市有更高级的任务）
  if(st===3)rep=Math.min(3,rep); // 中期最高到 Lv3 档（传说权重 3%）
  const table=RARITY_TABLE[Math.floor(rep)];
  let r=Math.random(),acc=0;
  for(let i=0;i<TASK_RARITY.length;i++){acc+=table[i];if(r<acc)return TASK_RARITY[i];}
  return TASK_RARITY[0];
}
// 素材产出：稀有 20% / 史诗 45% / 传说 80%；普通任务不产素材
function pickMat(){
  const r=Math.random();
  if(r<0.45)return'gear';
  if(r<0.70)return'repair_kit';
  if(r<0.90)return'fuel_tank';
  return'engine';
}
function rollMat(R){
  if(R.id==='legend')return Math.random()<0.8?[{id:pickMat(),qty:1}]:[];
  if(R.id==='epic')return Math.random()<0.45?[{id:pickMat(),qty:1}]:[];
  if(R.id==='rare')return Math.random()<0.2?[{id:pickMat(),qty:1}]:[];
  return[];
}
// 送客人数：与任务稀有度挂钩（旅游团/大迁徙），高级城市放大人数
//   common 1~3 · rare 4~8 · epic 10~25 · legend 30~60（×城市系数）
//   王都(×2)传说可达 60~120 人（百人团），需高等级载具旅客仓才能接取
function getCityTierMul(cityId){
  const c=getCity(cityId);const t=c?c.tier:'town';
  return t==='capital'?2:(t==='special'?1.5:1);
}
function rollPassQty(R,cityId){
  const mul=getCityTierMul(cityId);
  let n;
  if(R.id==='legend')n=30+Math.floor(Math.random()*31);
  else if(R.id==='epic')n=10+Math.floor(Math.random()*16);
  else if(R.id==='rare')n=4+Math.floor(Math.random()*5);
  else n=1+Math.floor(Math.random()*3);
  return Math.round(n*mul);
}
function rollTask(cityId,seq){
  const R=rollRarity();
  const st=cityStage(cityId);
  // 目的地限制：仅同阶段及下一阶段城市（新手村只出近邻任务，不出长距离）
  const others=CITIES.filter(c=>c.id!==cityId&&!(c.cityType==='special')&&cityStage(c.id)<=Math.min(4,st+1));
  const to=others[Math.floor(Math.random()*others.length)];
  // 任务金币按【城市阶段 × 距离】计酬（v8.11 与跑商并重）：
  //   新手村：100金/里（2~14里 → 200~1400）· 初期：350 · 中期：1000 · 后期：3000
  //   后期传说长距离最高约 75 万金，与跑商一车利润相当——任务与跑商并行成两条收入线
  const unit=[100,350,1000,3000][st-1];
  const ext=[40,80,150,250][st-1]; // 按件附加（deliver 每件；escort 每人 ×5）
  const dist=(shortestPath(cityId,to.id)||{distance:20}).distance;
  const gold=Math.round(dist*unit*R.goldMul),rep=R.repMul;
  const mats=rollMat(R);
  const id='t'+Date.now()+seq+Math.floor(Math.random()*999);
  if(Math.random()<0.5){
    const goods=getCity(cityId).goods;
    const gid=goods.length?goods[Math.floor(Math.random()*goods.length)]:null;
    if(gid){ // 空货物城（如未开放的特殊城）走送客分支，避免取到 undefined 崩溃
      const qty=5+Math.floor(Math.random()*15);
      return{id,rarity:R.id,type:'deliver',capType:'cargo',from:cityId,to:to.id,item:gid,qty,
        rewardGold:gold+qty*ext,rewardRep:rep+Math.floor(qty/2),rewardMats:mats,
        desc:`运送${getItem(gid).icon}${getItem(gid).name}×${qty}至${getCityName(to.id)}（${dist}里）`,delivered:false};
    }
  }
  const pq=rollPassQty(R,cityId); // 送客人数按稀有度+城市等级（按人计酬 ext×5/人）
  return{id,rarity:R.id,type:'escort',capType:'pass',from:cityId,to:to.id,item:null,qty:pq,
    rewardGold:gold+pq*ext*5,rewardRep:rep,rewardMats:mats,
    desc:`护送${pq}位商客至${getCityName(to.id)}（${dist}里 · 占旅客仓${pq}格）`,delivered:false};
}
// 任务板 slot：{id, state:'task'|'empty', t, refreshCount}
function genTasks(cityId){
  var tasks = State.get('tasks') || {};
  tasks.board = [];
  for(let i=0;i<5;i++)tasks.board.push({id:'s'+Date.now()+i,state:'task',t:rollTask(cityId,i),refreshCount:0});
  State.set('tasks', tasks);
}
// v8.14：任务板兜底——注册/登录/存档迁移后 board 可能为空（被服务器空存档或 resetGameState 清空），
// 渲染前若为空则补足 5 个任务位，避免新手引导卡在"今日暂无委托"。
function ensureTaskBoard(cityId){
  if(!GS.tasks)State.set('tasks',{board:[],active:[]});
  if(!Array.isArray(GS.tasks.board)||GS.tasks.board.length===0){
    var tasks = State.get('tasks') || {};
    tasks.board = [];
    for(let i=0;i<5;i++)tasks.board.push({id:'s'+Date.now()+i,state:'task',t:rollTask(cityId,i),refreshCount:0});
    State.set('tasks', tasks);
  }
}
function getSlotCost(slot){return(slot.refreshCount||0)<2?0:1000*Math.pow(2,(slot.refreshCount||0)-2)}
// —— 付费刷新"今日不再提示" ——
function refreshNudgeKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function isRefreshNudgeOff(){return localStorage.getItem('_refresh_nudge')===refreshNudgeKey();}
function setRefreshNudgeOff(){localStorage.setItem('_refresh_nudge',refreshNudgeKey());}
function doRollSlot(slot){
  const cost=getSlotCost(slot);
  if(cost>0){
    if(GS.gold<cost)return toast('资金不足，刷新需 '+fmt(cost)+' 金币','err');
    State.set('gold', GS.gold-cost);
  }
  slot.refreshCount=(slot.refreshCount||0)+1;
  slot.state='task';
  slot.t=rollTask(GS.location,Math.floor(Math.random()*999));
  toast(cost>0?`已花 ${fmt(cost)} 金币刷新任务`:'已免费刷新任务','ok');render();
}
// 刷新任务位（免费2次后付费，逐次翻倍）；付费前弹窗确认，支持"今日不再提示"
function rollSlot(slot){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const cost=getSlotCost(slot);
  if(cost<=0||isRefreshNudgeOff()){doRollSlot(slot);return;}
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML=`<div class="modal-box"><h3>🔄 付费刷新任务</h3><p>本次刷新将花费 <b style="color:var(--gold)">${fmt(cost)}</b> 金币<br>（前 2 次免费，之后每次费用翻倍）</p>
  <label class="nudge-check"><input type="checkbox" id="nudge-off"> 今日不再提示</label>
  <div class="modal-btns"><button class="btn-cancel">取消</button><button class="btn-ok">确认刷新</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('.btn-ok').onclick=()=>{const c=document.getElementById('nudge-off');if(c&&c.checked)setRefreshNudgeOff();ov.remove();doRollSlot(slot);};
  ov.querySelector('.btn-cancel').onclick=()=>ov.remove();
  ov.onclick=function(e){if(e.target===ov)ov.remove()};
}
function refreshTask(sid){const s=GS.tasks.board.find(x=>x.id===sid);if(s&&s.state==='task')rollSlot(s);}
function viewMoreTask(sid){const s=GS.tasks.board.find(x=>x.id===sid);if(s&&s.state==='empty')rollSlot(s);}
function acceptTask(sid){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const slot=GS.tasks.board.find(x=>x.id===sid);if(!slot||slot.state!=='task')return;
  const t=slot.t;
  if(t.capType==='cargo'&&getCargoFree()<t.qty)return toast('货舱空间不足，无法装载任务货物','err');
  if(t.capType==='pass'&&getPassFree()<t.qty)return toast('旅客仓空间不足，无法载客','err');
  State.batch(function(){
    var tasks = State.get('tasks') || {};
    tasks.active = tasks.active || [];
    tasks.active.push(t);
    var board = tasks.board || [];
    var bs = board.find(function(x){return x.id===sid;});
    if(bs){bs.state='empty';bs.t=null;}
    State.set('tasks', tasks);
  });
  if(GS.tutorial&&GS.tutorial.step===2)advanceTutorial(2);
  toast(`已接取任务：${t.desc}`,'ok');render();saveNow();
}
function abandonTask(tid){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const t=(GS.tasks.active||[]).find(x=>x.id===tid);if(!t)return;
  showModal('🚫 放弃任务',`确定放弃「${t.desc}」吗？\n${t.capType==='pass'?'商客将下车，旅客仓空间会释放。':'任务货物将被清空，货舱空间会释放。'}`,
    '确认放弃',()=>{
      var tasks = State.get('tasks') || {};
      tasks.active = (tasks.active||[]).filter(function(x){return x.id!==tid;});
      State.set('tasks', tasks);
      toast('任务已放弃','info');render();saveNow();
    });
}
function completeTask(tid){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const t=(GS.tasks.active||[]).find(x=>x.id===tid);if(!t)return;
  if(!t.delivered)return toast('尚未抵达目的地，无法领取奖励','info');
  State.set('gold', GS.gold+t.rewardGold);
  addRep(t.from,t.rewardRep);
  if(t.rewardMats&&t.rewardMats.length){
    var mats = State.get('materials') || {};
    for(const m of t.rewardMats)mats[m.id]=(mats[m.id]||0)+m.qty;
    State.set('materials', mats);
  }
  State.batch(function(){
    var tasks = State.get('tasks') || {};
    tasks.active = (tasks.active||[]).filter(x=>x.id!==tid);
    State.set('tasks', tasks);
  });
  EventBus.emit(EventBus.EVENTS.TASK_COMPLETE, {taskId:tid, rewardGold:t.rewardGold});
  const matTxt=(t.rewardMats||[]).map(m=>`${getMat(m.id).icon}${getMat(m.id).name}×${m.qty}`).join('、');
  statAdd('tasks',1);

}
// 生成任务卡（mode='active' 已接 / 'open' 可接；open 需传 slotId 用于刷新/接取）
function taskCardHtml(t,mode,slotId){
  const R=getRarity(t.rarity);
  const matTxt=(t.rewardMats||[]).map(m=>getMat(m.id).icon+getMat(m.id).name+'×'+m.qty).join(' ');
  const capTxt=t.capType==='cargo'?`任务货物占货舱 ${t.qty} 格`:`旅客占旅客仓 ${t.qty} 格`;
  let reason='';
  if(mode==='open'){
    if(t.capType==='cargo'&&getCargoFree()<t.qty)reason='货舱空间不足';
    else if(t.capType==='pass'&&getPassFree()<t.qty)reason='旅客仓空间不足';
  }
  const canAccept=!reason;
  const topBtn=mode==='open'
    ?`<button class="task-refresh" onclick="refreshTask('${slotId}')" title="刷新任务">🔄</button>`
    :`<button class="task-x" onclick="abandonTask('${t.id}')" title="放弃任务">✖</button>`;
  const mainBtn=mode==='active'
    ?`<button class="btn btn-primary station-btn" onclick="completeTask('${t.id}')" ${t.delivered?'':'disabled'} style="margin-top:8px">✅ 领取奖励</button>`
    :`<button class="btn station-btn" style="background:${canAccept?'var(--accent)':'var(--card)'};color:${canAccept?'#111':'var(--text3)'}" onclick="acceptTask('${slotId}')" ${canAccept?'':'disabled'}>${canAccept?'📥 接取':'⛔ '+reason}</button>`;
  return `<div class="task-card rarity-${t.rarity}" style="border-color:${R.color}">
    <div class="task-top"><span class="task-rarity" style="color:${R.color}">${R.name}</span>${topBtn}</div>
    <div class="task-desc">${t.desc}</div>
    <div class="task-meta">📍${getCityName(t.from)} → 🏁${getCityName(t.to)} · ${capTxt}${mode==='active'&&t.delivered?' · 已抵达':''}${t.to==='starfall'?' · <span style="color:var(--red)">目的地暂未开放</span>':''}</div>
    <div class="task-reward">💰${fmt(t.rewardGold)} · ⭐${t.rewardRep}声望${matTxt?' · '+matTxt:''}</div>
    ${mainBtn}
  </div>`;
}

function getUpgradeCost(){
  const lv=GS.vehicle.level;
  return{gold:4000*lv*lv,gear:Math.ceil(lv/2),repair_kit:lv>=2?Math.floor((lv-1)/2):0};
}
function doUpgradeVehicle(){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const lv=GS.vehicle.level,cost=getUpgradeCost();
  if(GS.gold<cost.gold)return toast('资金不足，升级需 '+fmt(cost.gold)+' 金币','err');
  if((GS.materials.gear||0)<cost.gear)return toast('精密齿轮不足，完成本城任务可获得','err');
  if((GS.materials.repair_kit||0)<cost.repair_kit)return toast('维修套件不足，完成本城任务可获得','err');
  const newSlots=getWagonSlots()+1;
  const oldMax=getDurabilityMax(),newMax=getDurabilityMaxByLevel(lv+1)+getCoreDurability()+getWagonHpAll();
  showModal('🚛 载具升级',
    `升级至 Lv${lv+1}\n车厢位 ${getWagonSlots()} → ${newSlots} · 耐久上限 ${oldMax} → ${newMax}\n消耗：${fmt(cost.gold)} 金币 · ⚙️精密齿轮×${cost.gear}${cost.repair_kit?' · 🧰维修套件×'+cost.repair_kit:''}`,
    '确认升级',()=>{
      var veh = GS.vehicle;
      veh.level++;
      while(veh.wagons.length<getWagonSlots())veh.wagons.push({cur:null,owned:{}});
      veh.durability=getDurabilityMax();veh.durabilityMax=getDurabilityMax();
      var mats = State.get('materials') || {};
      mats.gear = (mats.gear||0) - cost.gear;
      mats.repair_kit = (mats.repair_kit||0) - cost.repair_kit;
      State.batch(function(){
        State.set('vehicle', veh);
        State.set('materials', mats);
      });
      State.set('gold', GS.gold-cost.gold);
      statAdd('upgrades',1);
      toast('🚛 载具升级成功！车厢位 +1 · 耐久上限 +20','ok');render();
    });
}

// ===== 地图视图 =====
// ===== 交互式地图（v7.9：缩放/平移/当前城居中/等高线/曲线路网/云雾） =====
// 视口状态：g 元素 transform="translate(px,py) scale(s)"，世界坐标直接使用城市 x/y
let MAP={s:0.8,px:0,py:0,init:false,drag:null};
const MAP_VW=850,MAP_VH=520; // 视口像素（viewBox 尺寸）
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function mapSeed(key){let h=0;for(let i=0;i<key.length;i++){h=(h*31+key.charCodeAt(i))>>>0}return mulberry32(h+7)}
function mapWorldRange(){
  const xs=CITIES.map(c=>c.x),ys=CITIES.map(c=>c.y);
  return{x1:Math.min(...xs)-70,y1:Math.min(...ys)-70,x2:Math.max(...xs)+70,y2:Math.max(...ys)+70};
}
function mapWrapSize(){const w=document.getElementById('map-wrap');return w?[w.clientWidth,w.clientHeight]:[MAP_VW,MAP_VH]}
// v8.13：地图坐标统一为 SVG viewBox 单位（850×520）。
// svg 为 width:100%/height:auto，容器宽高比恒为 850:520，像素→单位系数 k=容器宽/850。
function mapUnitK(){const rw=mapWrapSize()[0];return rw/MAP_VW||1}
function clampMap(){
  const R=mapWorldRange();
  // 以 SVG viewBox（850×520）为边界限制平移区间，保证地图完整可见；
  // 修复此前混用容器像素导致地图边缘被裁且拖不回来的问题。
  const minPx=Math.min(MAP_VW-R.x2*MAP.s,-R.x1*MAP.s),maxPx=Math.max(MAP_VW-R.x2*MAP.s,-R.x1*MAP.s);
  const minPy=Math.min(MAP_VH-R.y2*MAP.s,-R.y1*MAP.s),maxPy=Math.max(MAP_VH-R.y2*MAP.s,-R.y1*MAP.s);
  MAP.px=Math.max(minPx,Math.min(maxPx,MAP.px));
  MAP.py=Math.max(minPy,Math.min(maxPy,MAP.py));
}
function centerOn(cid){
  const c=getCity(cid);if(!c)return;
  MAP.px=MAP_VW/2-c.x*MAP.s;MAP.py=MAP_VH/2-c.y*MAP.s;clampMap();
}
function applyMapView(){
  const g=document.querySelector('.map-scene');
  if(g)g.setAttribute('transform',`translate(${MAP.px.toFixed(1)},${MAP.py.toFixed(1)}) scale(${MAP.s})`);
}
function initMapView(){
  const R=mapWorldRange();
  MAP.sMin=Math.min(MAP_VW/(R.x2-R.x1),MAP_VH/(R.y2-R.y1))*0.9; // 留 10% 观察边距，边缘城市也能在最小缩放下看全地图
  MAP.sMax=Math.min(4,MAP.sMin*4);
  MAP.s=Math.max(MAP.sMin,MAP.sMin*1.9);
  MAP.needCenter=true; // 挂载后按真实容器尺寸居中
}
function mapZoomAt(cx,cy,k){
  const wrap=document.getElementById('map-wrap');if(!wrap)return;
  const rect=wrap.getBoundingClientRect();
  const kk=mapUnitK(); // 像素 → SVG 单位（缩放锚点跟随鼠标）
  const ux=(cx-rect.left)/kk,uy=(cy-rect.top)/kk;
  const wx=(ux-MAP.px)/MAP.s,wy=(uy-MAP.py)/MAP.s;
  const ns=Math.max(MAP.sMin,Math.min(MAP.sMax,MAP.s*k));
  if(ns===MAP.s)return;
  MAP.px=ux-wx*ns;MAP.py=uy-wy*ns;MAP.s=ns;clampMap();applyMapView();
}
function mapZoom(k){ // 按钮：以地图中心缩放
  const wrap=document.getElementById('map-wrap');
  if(wrap){const r=wrap.getBoundingClientRect();mapZoomAt(r.left+r.width/2,r.top+r.height/2,k);}
}
function mapCenter(){ // 回到当前位置：重置为默认缩放并居中，避免缩得太小时无法居中
  if(!MAP.sMin)initMapView();
  MAP.s=Math.max(MAP.sMin,MAP.sMin*1.9);
  centerOn(GS.location);
  applyMapView();
}
// 等高线地形（确定性生成一次：基于全局高度场的统一等值线，适配城市分布，避免局部圆环互相覆盖）
let MAP_DECO=null;
function mapPolyArea(pts){
  let a=0;
  for(let i=0;i<pts.length;i++){
    const p=pts[i],q=pts[(i+1)%pts.length];
    a+=p.x*q.y-q.x*p.y;
  }
  return Math.abs(a/2);
}
function mapNearestCityDist(x,y){
  let d1=1e9,d2=1e9;
  for(const c of CITIES){
    const d=Math.hypot(x-c.x,y-c.y);
    if(d<d1){d2=d1;d1=d;}
    else if(d<d2)d2=d;
  }
  return[d1,d2];
}
function pointSegDist(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1;
  const len2=dx*dx+dy*dy||1;
  let t=((px-x1)*dx+(py-y1)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  const qx=x1+dx*t,qy=y1+dy*t;
  return Math.hypot(px-qx,py-qy);
}
function pickTerrainPeaks(R){
  const pts=[],stepX=88,stepY=72,edge=60;
  for(let y=R.y1+edge;y<=R.y2-edge;y+=stepY){
    for(let x=R.x1+edge;x<=R.x2-edge;x+=stepX){
      const[d1,d2]=mapNearestCityDist(x,y);

      const score=d1*1.15+d2*0.35+centerBias*18;
      pts.push({x,y,score});

  pts.sort((a,b)=>b.score-a.score);
  const peaks=[];
  for(const p of pts){
    if(peaks.every(q=>Math.hypot(q.x-p.x,q.y-p.y)>150)){
      peaks.push({
        x:p.x,y:p.y,

        sy:64+peaks.length*8

    if(peaks.length>=5)break;

  }

function terrainHeightAt(x,y,R,peaks){
  const nx=(x-R.x1)/(R.x2-R.x1),ny=(y-R.y1)/(R.y2-R.y1);
  let h=0.07
    +0.028*Math.sin(nx*Math.PI*1.45)
    +0.022*Math.cos((ny*1.25+nx*0.42)*Math.PI*2)
    +0.018*Math.sin((nx+ny)*Math.PI*2.2);
  for(const p of peaks){
    const dx=(x-p.x)/p.sx,dy=(y-p.y)/p.sy;
    h+=p.amp*Math.exp(-(dx*dx+dy*dy))*0.82;
  }
  // 王都周边：低丘陵，范围广、起伏缓
  const dc=getCity('dawncapital');
  const dh=Math.hypot((x-dc.x)/220,(y-dc.y)/155);
  h+=0.105*Math.exp(-(dh*dh))*(0.7+0.3*Math.sin(x*0.03+y*0.022));
  h+=0.05*Math.exp(-(Math.hypot((x-(dc.x-120))/170,(y-(dc.y+15))/120)**2));
  // 霜岭堡北侧：高山脊，线密且起伏强
  const ff=getCity('frostfort');
  const ridgeA=pointSegDist(x,y,ff.x-160,ff.y-120,ff.x+30,ff.y-205);
  const ridgeB=pointSegDist(x,y,ff.x-70,ff.y-55,ff.x+170,ff.y-145);
  const northBoost=1+Math.max(0,(ff.y-y))/150;
  h+=0.22*Math.exp(-(ridgeA*ridgeA)/(28*28))*northBoost;
  h+=0.18*Math.exp(-(ridgeB*ridgeB)/(24*24))*northBoost;
  h+=0.05*Math.exp(-(ridgeA*ridgeA)/(70*70))*Math.sin((x+y)*0.05+0.8);
  // 盐湾港附近：沿海缓坡，地势整体更柔和、更开阔
  const sb=getCity('saltbay');
  const coast=pointSegDist(x,y,sb.x-190,sb.y+82,sb.x+170,sb.y+128);
  const coastB=pointSegDist(x,y,sb.x-130,sb.y+36,sb.x+220,sb.y+72);
  h+=0.05*Math.exp(-(coast*coast)/(78*78));
  h+=0.03*Math.exp(-(coastB*coastB)/(96*96));
  h-=0.08*Math.exp(-((x-sb.x)*(x-sb.x))/(260*260)-((y-(sb.y+126))*(y-(sb.y+126)))/(170*170));
  // 星陨城周边：断裂地貌，沿裂谷产生折线状高差
  const sf=getCity('starfall');

  const faultB=pointSegDist(x,y,sf.x-92,sf.y+92,sf.x+90,sf.y-65);
  const along=((x-sf.x)*0.72+(y-sf.y)*0.48)/44;
  h+=0.15*Math.exp(-(faultA*faultA)/(22*22))*(0.68+0.32*Math.sin(along));
  h+=0.11*Math.exp(-(faultB*faultB)/(18*18))*(0.65+0.35*Math.cos(along*1.35));
  h+=0.05*Math.exp(-(Math.hypot((x-sf.x)/130,(y-sf.y)/96)**2));
  for(const c of CITIES){
    const dx=(x-c.x)/54,dy=(y-c.y)/40;
    h-=0.058*Math.exp(-(dx*dx+dy*dy)); // 城市周边压低，形成更真实的盆地/缓坡
  }
  return Math.max(0,Math.min(1,h));
}
function contourEdgePoint(edge,x,y,step,tl,tr,br,bl,level){
  const lerp=(a,b,va,vb)=>{
    const t=(level-va)/((vb-va)||1e-6);
    return a+(b-a)*Math.max(0,Math.min(1,t));
  };
  if(edge===0)return{x:lerp(x,x+step,tl,tr),y};
  if(edge===1)return{x:x+step,y:lerp(y,y+step,tr,br)};
  if(edge===2)return{x:lerp(x,x+step,bl,br),y:y+step};

function stitchContourSegments(segs,step){
  const keyOf=p=>`${Math.round(p.x*2)}_${Math.round(p.y*2)}`;

  const add=(k,ref)=>{if(!adj.has(k))adj.set(k,[]);adj.get(k).push(ref);};
  segs.forEach((s,i)=>{add(keyOf(s[0]),{i});add(keyOf(s[1]),{i});});

}
function genMapDeco(){

  const enx=Math.ceil((ER.x2-ER.x1)/step),eny=Math.ceil((ER.y2-ER.y1)/step);

    field[gy]=[];

      const idx=(tl>=lv?1:0)|(tr>=lv?2:0)|(br>=lv?4:0)|(bl>=lv?8:0);
      for(const pair of table[idx]){

      const closed=Math.hypot(path[0].x-path[path.length-1].x,path[0].y-path[path.length-1].y)<=step*0.75;

  const ox=ER.x1,oy=ER.y1,ow=ER.x2-ER.x1,oh=ER.y2-ER.y1;
  MAP_DECO=`<defs>
  <radialGradient id="mapCoreLight" cx="50%" cy="46%" r="62%"><stop offset="0%" stop-color="var(--map-core-light)" stop-opacity="0.15"/><stop offset="60%" stop-color="var(--map-bg-mid)" stop-opacity="0.05"/><stop offset="100%" stop-color="var(--map-bg-mid)" stop-opacity="0"/></radialGradient>
  <radialGradient id="cityShieldGrad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="var(--map-shield-light)" stop-opacity="0.15"/><stop offset="60%" stop-color="var(--map-shield-light)" stop-opacity="0.06"/><stop offset="100%" stop-color="var(--map-shield-light)" stop-opacity="0"/></radialGradient>
  <radialGradient id="mistGrad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="var(--map-mist-center)" stop-opacity="0.10"/><stop offset="60%" stop-color="var(--map-mist-edge)" stop-opacity="0.05"/><stop offset="100%" stop-color="var(--map-mist-edge)" stop-opacity="0"/></radialGradient>
  <filter id="cityShieldBlur" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="mistBlur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect x="${ox}" y="${oy}" width="${ow}" height="${oh}" fill="url(#mapCoreLight)"/>
  <ellipse cx="${ox+120}" cy="${cy0}" rx="230" ry="${oh*0.42}" fill="url(#mistGrad)" class="mist" filter="url(#mistBlur)"/>
  <ellipse cx="${ox+ow-120}" cy="${cy0}" rx="230" ry="${oh*0.42}" fill="url(#mistGrad)" class="mist" filter="url(#mistBlur)"/>
  <ellipse cx="${cx0}" cy="${oy+96}" rx="${ow*0.42}" ry="160" fill="url(#mistGrad)" class="mist" filter="url(#mistBlur)"/>
  <ellipse cx="${cx0}" cy="${oy+oh-96}" rx="${ow*0.42}" ry="160" fill="url(#mistGrad)" class="mist" filter="url(#mistBlur)"/>

// 流动云雾（确定性生成一次：高斯模糊云团 + 缓慢循环平移 + 呼吸透明度）
let MAP_CLOUDS=null;
function genMapClouds(){
  if(MAP_CLOUDS)return MAP_CLOUDS;
  const rnd=mulberry32(20260812);
  const R=mapWorldRange();
  const ER={x1:R.x1-220,y1:R.y1-180,x2:R.x2+220,y2:R.y2+180};
  const w=ER.x2-ER.x1,h=ER.y2-ER.y1;
  const cx=(R.x1+R.x2)/2,cy=(R.y1+R.y2)/2;
  let out='';
  for(let i=0;i<8;i++){
    let ex=0,ey=0;
    const side=i%4;

    if(side===1){ex=ER.x2-40-rnd()*110;ey=ER.y1+rnd()*h;}
    if(side===2){ex=ER.x1+rnd()*w;ey=ER.y1+20+rnd()*90;}
    if(side===3){ex=ER.x1+rnd()*w;ey=ER.y2-20-rnd()*90;}

  }

// 曲线路网：按里数分段三次贝塞尔（长路多弯、边缘路大弧度；确定性种子，结果缓存）
let MAP_CURVES={};
function roadCurve(a,b,x1,y1,x2,y2,d){
  // v8.22：key 按端点归一化——地图绘制用 ROADS 顺序、旅行点用 shortestPath 方向（可能相反），
  // 方向敏感 key 会让两者生成形状不同的曲线，导致旅行点"偏移出路网"
  const key=a<b?a+'|'+b:b+'|'+a;
  if(MAP_CURVES[key])return MAP_CURVES[key];
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len;
  const rnd=mapSeed(key);
  const distLi=d||10;
  // 里数越长弧度越大（短途近似直路，长途蜿蜒绕行）：振幅 0.10~0.34
  const amp=Math.min(0.34,0.10+distLi*0.006);
  const segs=distLi>22?3:(distLi>9?2:1); // 长路拆多段 → 多个弯道
  let pd='',cxs=0,cys=0;
  const curves=[];
  for(let s=0;s<segs;s++){
    const t0=s/segs,t1=(s+1)/segs;
    const p0x=x1+dx*t0,p0y=y1+dy*t0;
    const p1x=x1+dx*t1,p1y=y1+dy*t1;
    const off=(rnd()-0.5)*len*amp*2;
    const mx=(p0x+p1x)/2,my=(p0y+p1y)/2;
    const c1x=mx+nx*off,c1y=my+ny*off;
    const c2x=mx+nx*off*0.55,c2y=my+ny*off*0.55;
    pd+=(s===0?`M ${p0x.toFixed(1)} ${p0y.toFixed(1)}`:'')+` C ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p1x.toFixed(1)} ${p1y.toFixed(1)}`;
    curves.push({p0:[p0x,p0y],c1:[c1x,c1y],c2:[c2x,c2y],p1:[p1x,p1y]});
    cxs+=mx;cys+=my;
  }
  MAP_CURVES[key]={d:pd,curves,cx:cxs/segs,cy:cys/segs};

// 三次贝塞尔求点 / 沿曲线组按【弧长】取点（旅行位置跟随路网，匀速沿曲线行进）
function bezierPt(p0,c1,c2,p1,t){
  const u=1-t;
  return [u*u*u*p0[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p1[0],
          u*u*u*p0[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p1[1]];
}
function bezierLen(c){
  let L=0,px=c.p0[0],py=c.p0[1];
  for(let i=1;i<=24;i++){
    const p=bezierPt(c.p0,c.c1,c.c2,c.p1,i/24);
    L+=Math.hypot(p[0]-px,p[1]-py);px=p[0];py=p[1];
  }

}
function pointOnCurves(curves,frac){
  if(!curves||!curves.length)return null;
  const n=curves.length;
  if(!curves._len){ // 缓存各段弧长与总长
    curves._seg=[];curves._len=0;
    for(let i=0;i<n;i++){curves._seg[i]=bezierLen(curves[i]);curves._len+=curves._seg[i];}
  }
  if(curves._len<=0)return bezierPt(curves[0].p0,curves[0].c1,curves[0].c2,curves[0].p1,0);
  let target=Math.max(0,Math.min(1,frac))*curves._len,acc=0;
  for(let i=0;i<n;i++){
    const L=curves._seg[i];
    if(acc+L>=target||i===n-1){

      return bezierPt(curves[i].p0,curves[i].c1,curves[i].c2,curves[i].p1,t);
    }
    acc+=L;
  }
  return bezierPt(curves[n-1].p0,curves[n-1].c1,curves[n-1].c2,curves[n-1].p1,1);

// v8.23：路上取点——曲线方向由首次生成（ROADS 顺序）决定，若旅行方向与该段曲线反向则用 1-frac，
// 修复"旅行点从目的地反向行进、与路线完全不符"（v8.22 归一化 key 后引入）
function ptOnRoad(a,b,segFrac,cityPos){
  const seg=buildGraph()[a][b];
  const rc=roadCurve(a,b,cityPos[a].x,cityPos[a].y,cityPos[b].x,cityPos[b].y,seg);
  const p0=rc.curves[0].p0;
  const fwd=Math.abs(p0[0]-cityPos[a].x)<0.5&&Math.abs(p0[1]-cityPos[a].y)<0.5;

    cities+=`<circle cx="${c.x}" cy="${c.y}" r="${r}" class="${cls} tier-${c.tier}" data-city="${c.id}"/>`;
    names+=`<text x="${c.x}" y="${c.y+r+14}" class="city-label">${c.name}${closed?'（暂未开放）':''}</text>`;
  }
  // 旅行中：当前位置点（沿曲线路网插值，非直线）
  let travelDot='',sp=null;
  if(GS.traveling){
    sp=shortestPath(GS.location,GS.traveling.to);
    if(sp&&sp.path.length>1){
      const totalDist=sp.distance,elapsed=(Date.now()-GS.traveling.startedAt)/1000,totalTime=(GS.traveling.arrivalTime-GS.traveling.startedAt)/1000;
      const progress=Math.min(1,Math.max(0,elapsed/totalTime));
      let accDist=0,targetDist=progress*totalDist,px=0,py=0;
      for(let i=0;i<sp.path.length-1;i++){
        const a=sp.path[i],b=sp.path[i+1];
        const seg=buildGraph()[a][b];
        if(accDist+seg>=targetDist){
          const segFrac=(targetDist-accDist)/seg;
          const pt=ptOnRoad(a,b,segFrac,cityPos); // v8.23：方向对齐
          if(pt){px=pt[0];py=pt[1]}
          break;
        }
        accDist+=seg;
        if(i===sp.path.length-2){px=cityPos[sp.path[i+1]].x;py=cityPos[sp.path[i+1]].y}
      }
      if(px&&py)travelDot=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="7" fill="var(--map-travel-dot)" stroke="var(--map-travel-dot-border)" stroke-width="2" data-travel-dot="1"><animate attributeName="r" values="7;10;7" dur="1.5s" repeatCount="indefinite"/></circle>`;
    }
  }
  // 流动云雾（放在路网与城市下层，避免和可交互元素混为一体）
  const clouds=genMapClouds();
  const view=`translate(${MAP.px.toFixed(1)},${MAP.py.toFixed(1)}) scale(${MAP.s})`;
  let info='',hint='';
  if(GS.traveling){
    const elapsed=Date.now()-GS.traveling.startedAt,total=GS.traveling.arrivalTime-GS.traveling.startedAt;
    const pct=Math.min(100,Math.max(0,Math.round(elapsed/total*100)));
    const curDist=Math.round(sp.distance*pct/100),totalDist=sp.distance;
    info=`<div class="map-info"><span class="city-name">→ ${getCityName(GS.traveling.to)}</span>
    <div class="travel-progress"><div class="fill" id="travel-fill" style="width:${pct}%"></div><div class="text" id="travel-text">${fmt(curDist)} 里 / ${fmt(totalDist)} 里</div></div>
    <span style="font-size:10px;color:var(--text3)">来自 ${getCityName(sp?.path?.[0]||GS.location)}</span></div>`;hint='<p class="map-hint">旅行中… 蓝色圆点为当前位置 · 拖动地图/滚轮缩放</p>';
  }else{
    const cc=getCity(loc);info=`<div class="map-info">📍 当前：<span class="city-name">${cc.name}</span><span style="margin-left:8px">${cc.tier==='village'?'新手村':(cc.tier==='capital'?'王都':(cc.tier==='frontier'?'边陲':'城镇'))}</span><span style="margin-left:auto;color:var(--text3)">拖动地图 · 滚轮缩放 · ⌖ 回到当前位置</span></div>`;hint='<p class="map-hint">点击城市节点发起旅行 · 相邻新手村约 24 秒抵达</p>';
  }
  return `<div class="map-wrap" id="map-wrap"><svg viewBox="0 0 ${MAP_VW} ${MAP_VH}"><g class="map-scene" transform="${view}">${deco}${clouds}${cityShields}${roads}${rlabels}${cities}${names}${travelDot}</g></svg>
  <div class="map-tools"><button title="放大" onclick="mapZoom(1.25)">＋</button><button title="缩小" onclick="mapZoom(0.8)">－</button><button title="回到当前位置" onclick="mapCenter()">⌖</button></div></div>${info}${hint}`;
}
// 旅行中仅增量更新位置点与进度（不重建整个地图，避免路网/云雾动画被重启而"一抽一抽"）
function updateTravelUI(){
  if(!GS.traveling||currentTab!=='map')return;
  const dot=document.querySelector('#map-wrap [data-travel-dot]');
  const sp=shortestPath(GS.location,GS.traveling.to);
  if(sp&&sp.path.length>1){
    const cityPos={};for(let c of CITIES)cityPos[c.id]={x:c.x,y:c.y};
    const totalDist=sp.distance,elapsed=(Date.now()-GS.traveling.startedAt)/1000,totalTime=(GS.traveling.arrivalTime-GS.traveling.startedAt)/1000;
    const progress=Math.min(1,Math.max(0,elapsed/totalTime));
    let accDist=0,targetDist=progress*totalDist,px=0,py=0;
    for(let i=0;i<sp.path.length-1;i++){
      const a=sp.path[i],b=sp.path[i+1];
      const seg=buildGraph()[a][b];
      if(accDist+seg>=targetDist){
        const segFrac=(targetDist-accDist)/seg;
        const pt=ptOnRoad(a,b,segFrac,cityPos); // v8.23：方向对齐
        if(pt){px=pt[0];py=pt[1]}
        break;
      }
      accDist+=seg;
      if(i===sp.path.length-2){px=cityPos[sp.path[i+1]].x;py=cityPos[sp.path[i+1]].y}
    }
    if(dot&&px&&py){dot.setAttribute('cx',px.toFixed(1));dot.setAttribute('cy',py.toFixed(1));}
    const fill=document.getElementById('travel-fill');

    if(fill)fill.style.width=Math.round(progress*100)+'%';

}

// 车厢管理：最前为载具核心 slot，其后车厢一字排开（v6.12 每节独立解锁，已购可免费更换）

  const slots=getWagonSlots(),wagons=GS.vehicle.wagons;

        <div class="task-meta">${caps.join(' · ')}</div>
        <div class="task-meta" style="font-size:10px;color:var(--text3)">已解锁 ${ownedN} 种车厢 · 免费更换</div>
        <button class="btn station-btn" style="background:var(--accent);color:#111;margin-top:8px" onclick="replaceWagon(${i})">🔁 更换车厢</button>

        <div class="task-meta">已解锁 ${ownedN} 种车厢</div>
        <button class="btn station-btn" style="background:var(--accent);color:#111;margin-top:8px" onclick="replaceWagon(${i})">🔁 重新装配（免费）</button>
      </div>`;
    }else{
      cards+=`<div class="wagon-card wagon-slot-empty" onclick="replaceWagon(${i})">
        <div class="wagon-plus">＋</div>
        <div class="task-meta">空车厢位 · 需购买解锁</div>
        <button class="btn station-btn" style="background:var(--accent);color:#111;margin-top:8px" onclick="replaceWagon(${i})">＋ 解锁车厢</button>
