// v9.13.2：noAutoSub 步骤不自动切市场页签；旅行中显示无遮罩等待提示
function showTutorialGuide(step){
  const s=TUTORIAL_STEPS[step];if(!s||!window.Guide)return;
  if(s.noAutoTab!==true&&s.tab){
    const b=document.querySelector('nav button[data-tab="'+s.tab+'"]');
    if(b&&currentTab!==s.tab)b.click(); // click → render 同步完成，目标 DOM 就绪
  }
  if(s.noAutoSub!==true&&s.sub&&window.switchMarket&&currentTab==='city')switchMarket(s.sub);
  // 等视图/卡片渲染完成再定位目标（市场卡片经 setTimeout 刷新）
  setTimeout(function(){
    if(GS.traveling){tutGuideWaiting(s);return;} // v9.13.2：旅行中无遮罩提示等待
    Guide.show(tutGuideOpts(s));
  },120);
}
// v9.13.1：同步引导目标/文案到当前阶段（玩家切换视图/加入中转面板后调用）——
//          目标变化时重建引导（如 step1：城市按钮 → 物资卡片 → 确认购入）；
//          视图未就绪（sel 命中为空，如点击城市后 view-city 尚未渲染）时延后重试
// v9.13.2：旅行中切为无遮罩等待提示；重建时携带动作按钮与内容 DOM 变化监听
function syncTutorialGuide(step, attempt){
  const s=TUTORIAL_STEPS[step];if(!s||!window.Guide||!Guide.isActive())return;
  if(GS.traveling){ // v9.13.2：旅行中无遮罩等待（已在等待态则不重复重建，避免闪烁）
    const bb=document.getElementById('tut-bubble');
    const d=bb&&bb.querySelector('#tut-bubble-desc');
    if(!d||d.textContent.indexOf('正在前往')<0)tutGuideWaiting(s);
    return;
  }
  if(typeof s.sel!=='function')return;
  let target=null;try{target=s.sel();}catch(e){}
  const n=(attempt||0);
  if(!target){
    if(n<4)setTimeout(function(){syncTutorialGuide(step,n+1);},150);
    return;
  }
  // v9.13.4：比较「文案快照」而非仅目标元素——MutationObserver 回调先 refresh() 切高光、后 onChange 同步，
  // 若只比较 .tut-target 会因目标已切换而短路，导致气泡文字停留在上一阶段（点城市页→点物资时文字不同步）。
  const opts=tutGuideOpts(s);
  const snap=window.Guide.snapshot();
  const textSame = snap && snap.desc===opts.desc;
  const cur=document.querySelector('.tut-target');
  if(cur!==target || !textSame)Guide.show(opts);
}

  if(!window.Guide||!Guide.isActive()){

  const steps=TUTORIAL_STEPS.slice(1).map((x,i)=>`<span class="tut-step ${i+1<st?'tut-done':(i+1===st?'tut-cur':'')}">${i+1<st?'✔':x.icon} ${x.title}</span>`).join('');
  return `<div class="tutorial-panel"><div class="tut-head">🎓 新手引导 <span class="tut-progress">${st}/5</span></div>

}

        <button class="btn station-btn" style="background:var(--accent);color:#111;margin-top:8px" onclick="replaceWagon(${i})">＋ 解锁车厢</button>

// 更换车厢：两级选择（先类型 → 再等级）；已购买的车厢免费装配，未购买需金币解锁（每节独立）
function replaceWagon(i){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const w=GS.vehicle.wagons[i]||{cur:null,owned:{}};
  let opts='';
  for(const[type,T]of Object.entries(WAGON_TYPES)){
    const caps=[];const c=T.cap[0],p=T.pass[0];
    if(c>0)caps.push(`货舱${c}起`);
    if(p>0)caps.push(`旅客${p}起`);
    caps.push(`损耗${T.dur[0]}~${T.dur[4]}`);
    const hasType=Object.keys(w.owned||{}).some(k=>k.startsWith(type+'_'));
    const lockTag=T.locked?' <span style="font-size:10px;color:var(--sell)">🔒 即将开放</span>':'';
    opts+=`<div class="wagon-cat" style="border-color:${T.color}" onclick="showWagonLevels(${i},'${type}')"><span style="font-size:20px">${T.icon}</span><span style="flex:1"><span style="color:${T.color}">${T.name}${lockTag}${hasType?' <span style="font-size:10px;color:var(--green)">✔ 已解锁</span>':''}</span><br><span style="font-size:11px;color:var(--text3);font-weight:600">${caps.join(' · ')}</span></span><span class="wc-arrow" style="color:${T.color}">›</span></div>`;
  }
  showModal('🚂 选择车厢类型（已解锁的免费装配）',opts,'关闭',()=>{});
}
function showWagonLevels(i,type){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const T=WAGON_TYPES[type];
  if(T&&T.locked)return showModal('🛡️ 武装车厢','武装车厢为后续版本预留（占位），敬请期待后续战斗/护卫玩法更新。','知道了',()=>{}); // v9.11.14：占位拦截
  const w=GS.vehicle.wagons[i]||{cur:null,owned:{}};
  let opts=`<div class="wagon-cat" onclick="backToWagonTypes(${i})"><span style="font-size:16px">↩</span><span style="flex:1">返回类型选择</span><span class="wc-arrow">‹</span></div>`;
  for(let lv=1;lv<=5;lv++){
    const cost=getWagonCost(type,lv);
    const caps=[];const c=T.cap[lv-1],p=T.pass[lv-1],sp=Array.isArray(T.spd)?T.spd[lv-1]:T.spd,du=T.dur[lv-1];
    if(c>0)caps.push(`货舱${c}`);
    if(p>0)caps.push(`旅客${p}`);
    if(Array.isArray(T.spd))caps.push(`时速×${sp}`);
    else if(sp!==1)caps.push(`时速×${sp}`);
    caps.push(`损耗×${du}`);
    caps.push(`耐久+${T.hp[lv-1]}`);
    const owned=isOwned(w,type,lv);
    const curFlag=w.cur&&w.cur.type===type&&w.cur.lv===lv?'（当前）':'';
    opts+=`<div class="wagon-opt" onclick="buyWagon(${i},'${type}',${lv})"><span class="wo-lv">Lv${lv}</span><span>${caps.join(' · ')}</span><span class="wo-price" style="color:${owned?'var(--green)':'var(--gold)'}">${owned?'✔ 免费装配'+curFlag:fmt(cost)+' 金解锁'}</span></div>`;
  }
  showModal(`🚂 ${T.icon} ${T.name}`,opts,'关闭',()=>{});
}
// v8.21：返回车厢类型选择——先移除当前等级面板再打开类型面板，避免 showModal 叠加导致"又生成一个面板"
function backToWagonTypes(i){
  document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
  replaceWagon(i);
}
function buyWagon(i,type,lv){
  if(i<0||i>=getWagonSlots())return toast('车厢位不存在','err');
  if(WAGON_TYPES[type]&&WAGON_TYPES[type].locked)return toast('武装车厢为后续版本预留，暂不可解锁','err'); // v9.11.14：占位拦截
  var veh = State.get('vehicle') || {};
  veh.wagons = veh.wagons || [];
  const slot=veh.wagons[i]||{cur:null,owned:{}};
  if(!veh.wagons[i])veh.wagons[i]=slot;
  const key=wagonKey(type,lv);
  const fit=fitAfterSlot(i,type,lv);
  const req=wagonRequired();
  if(req.cargo>fit.cap)return showModal('🚫 无法更换车厢','货舱空间不足。\n\n'+wagonFitMsg(req,fit),'知道了',()=>{});
  if(req.pass>fit.pass)return showModal('🚫 无法更换车厢','旅客仓空间不足。\n\n'+wagonFitMsg(req,fit),'知道了',()=>{});
  const hp=WAGON_TYPES[type].hp[lv-1]||0;
  if(isOwned(slot,type,lv)){
    slot.cur={id:'w'+Date.now()+i,type,lv};
    veh.wagons[i] = slot;
    State.set('vehicle', veh);
    refreshDurability(hp);
    document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
    toast(`✔ 免费装配 ${WAGON_TYPES[type].name} Lv${lv}（已解锁）`,'ok');render();
    return;
  }
  const cost=getWagonCost(type,lv);
  if(GS.gold<cost)return toast('资金不足，解锁需 '+fmt(cost)+' 金币','err');
  slot.owned=slot.owned||{};slot.owned[key]=true;
  slot.cur={id:'w'+Date.now()+i,type,lv};
  veh.wagons[i] = slot;
  State.set('vehicle', veh);
  State.set('gold', GS.gold-cost);
  refreshDurability(hp);
  statAdd('upgrades',1);
  document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
  toast(`已解锁并装配 ${WAGON_TYPES[type].name} Lv${lv}`,'ok');render();
}
// 卸下车厢（仅解除装配，解锁进度保留；载具必须保留至少一个已装配车厢）
function unloadWagon(i){
  if(GS.traveling)return toast('旅行中不可操作','info');
  if(getWagons().length<=1)return showModal('🚫 无法卸下车厢','载具必须保留至少一个已装配车厢。','知道了',()=>{});
  var veh = State.get('vehicle') || {};
  veh.wagons = veh.wagons || [];
  const w=veh.wagons[i];
  if(!w||!w.cur)return;
  const fit=fitAfterSlot(i);
  const req=wagonRequired();
  if(req.cargo>fit.cap)return showModal('🚫 无法卸下车厢','货舱空间不足。\n\n'+wagonFitMsg(req,fit),'知道了',()=>{});

function getNearbyCities(loc,range){
  if(range<=0)return[];
  const graph=buildGraph(),q=[{id:loc,d:0}],vis=new Set([loc]),out=[];
  while(q.length){const{id,d}=q.shift();if(d>=1&&d<=range)out.push(id);for(let v in graph[id]){if(!vis.has(v)&&d+1<=range){vis.add(v);q.push({id:v,d:d+1})}}}
  return out;
}

function genPriceIntel(nearby){
  const cityIds=nearby.filter(id=>{const c=getCity(id);return c&&c.goods.length>0});
  const cid=cityIds[Math.floor(Math.random()*cityIds.length)];
  const city=getCity(cid);
  const goods=city.goods.filter(g=>getBaseBuyPrice(cid,g,GS.day)!=null);
  const gid=goods[Math.floor(Math.random()*goods.length)];
  const it=getItem(gid);
  // v9.10.4：行情情报展示纯中枢价（折扣/加成独立，在结算时体现）
  const price=getBaseBuyPrice(cid,gid,GS.day);
  const sell=getBaseSellPrice(cid,gid,GS.day);
  let trend='平稳';
  const hist=getPriceHistory(cid,gid,30);
  if(hist.length>1){
    const avg=hist.reduce((a,h)=>a+h.price,0)/hist.length;
    const diff=(price-avg)/avg;
    trend=diff>0.08?'一路上涨':(diff<-0.08?'一路下跌':'不温不火');
  }
  const tpl=INTEL_TEMPLATES[Math.floor(Math.random()*INTEL_TEMPLATES.length)];
  return{cls:'intel',text:fillTpl(tpl,{city:getCityName(cid),item:it.name,icon:it.icon,price:fmt(price),sell:fmt(sell),trend})};
}

// v9.11.6：返回 {msgs, evs}——evs 为本条消息中新获得的事件（供 doAskIntel 汇总弹窗）
function generateIntelMessages(){
  // v9.11.9：本城已抽事件去重——离开本城前，抽到过的事件不再重复出现（到达新城市时清空）
  if(!GS.intel.drawn)GS.intel.drawn={};
  const drawn=GS.intel.drawn;
  const range=getIntelRange();
  const nearby=[GS.location,...getNearbyCities(GS.location,range)];
  const ups=getUpcomingEvents().filter(ev=>(ev.scope==='global'||ev.scope==='cost'||nearby.includes(ev.city))&&!drawn[ev.id+':'+ev.startHub]);
  const acts=getActiveEvents().filter(ev=>ev.scope!=='global'&&ev.scope!=='cost'&&nearby.includes(ev.city)&&!drawn[ev.id+':'+ev.startHub]);
  // v9.11.8：事件概率平衡——保持"小概率惊喜"：事件总概率 8%（0 声望）→ 20%（声望 10 级封顶），
  //           物价情报仍保持常见（每类事件独立区间，不互相挤占）
  const rep=getRepLevel(GS.location);
  const pBest=Math.min(0.08,0.03+rep*0.005); // 预告事件：3% → 8%
  const pRare=Math.min(0.12,0.05+rep*0.007); // 进行中事件：5% → 12%
  const r=Math.random();
  if(ups.length>0&&r<pBest){
    const ev=ups[Math.floor(Math.random()*ups.length)];
    drawn[ev.id+':'+ev.startHub]=true; // v9.11.9：本城已抽记录
    const fresh=markEventKnown(ev);
    const city=ev.city?getCityName(ev.city):'全王国';
    const tpl=INTEL_UPCOMING_TPL[Math.floor(Math.random()*INTEL_UPCOMING_TPL.length)];
    return{msgs:[{cls:'intel best',text:fillEvTpl(tpl,{city,evname:ev.name,evicon:ev.icon})}],evs:fresh?[ev]:[]};
  }
  // v9.11.8：补 r>=pBest——无预告事件（ups 空）时进行中事件按独立区间 pRare 抽，避免区间重叠虚高
  if(acts.length>0&&r>=pBest&&r<pBest+pRare){
    const ev=acts[Math.floor(Math.random()*acts.length)];
    drawn[ev.id+':'+ev.startHub]=true; // v9.11.9：本城已抽记录
    const fresh=markEventKnown(ev);
    const action=ev.target==='sell'?'出货':'进货';
    const tpl=INTEL_ACTIVE_TPL[Math.floor(Math.random()*INTEL_ACTIVE_TPL.length)];
    return{msgs:[{cls:'intel rare',text:fillEvTpl(tpl,{city:getCityName(ev.city),evname:ev.name,evicon:ev.icon,action})}],evs:fresh?[ev]:[]};
  }
  return{msgs:[genPriceIntel(nearby)],evs:[]};
}
function doAskIntel(){

// ===== 载具仓库面板（车站面板置顶，载具栏与仓库栏在下方） =====
function renderVehicleWh(){
  const loc=GS.location,used=getUsedCargo(),cap=getVehicleCapacity();
  const taskCargo=getTaskCargoUsed();
  const wh=GS.warehouses[loc];
  const passUsed=getPassUsed()+getTaskPassUsed(),passCap=getPassCapacity();
  let html=renderStation(); // 顶部：车站（耐久/维修/升级 + 车厢管理）
  html+=`<div class="wh-split"></div>`;
  html+=`<h3>🚛 载具 <span style="font-size:12px;color:var(--text2)">Lv${GS.vehicle.level} | 货舱 ${used+taskCargo}/${cap} | 旅客 ${passUsed}/${passCap} | ${getVehicleSpeed()}里/分</span></h3>`;
  if(taskCargo>0)html+=`<div class="empty" style="padding:6px;font-size:12px">📦 任务货物占用 ${taskCargo} 格（完成或放弃任务后释放，不可转入仓库）</div>`;
  html+=`<div class="wh-list">`;
  if(Object.keys(GS.cargo).length===0)html+=`<div class="empty">载具为空</div>`;
  for(let[id,qty]of Object.entries(GS.cargo)){
    if(!qty)continue;const it=getItem(id),cost=GS.buyPrice[id]||getDayPrice(loc,id,GS.day);
    html+=`<div class="wh-row"><span>${it.icon} ${it.name} ×${qty}</span><span style="font-size:10px;color:var(--text3)">成本${fmt(cost)}</span><div class="qty-inline"><input type="number" id="vqty-${id}" value="${Math.min(1,qty)}" min="1" max="${qty}" style="width:50px"><button class="btn-sm btn-sell-sm" onclick="doWhIn('${id}',parseInt(document.getElementById('vqty-${id}').value)||1)">→仓库</button></div></div>`;
  }
  html+=`</div>`;
  html+=`<h3 style="margin-top:14px">🏪 ${getCityName(loc)} 仓库</h3>`;
  if(!wh){
    const cfg=getWhConfig(loc);
    html+=`<div class="empty">本城暂无仓库，可花金币解锁（初始 100 格）
      <button class="btn btn-primary btn-small" onclick="doUnlockWarehouse()" ${GS.gold<cfg.unlock?'disabled':''}>🔓 解锁仓库（${fmt(cfg.unlock)} 金/100 格）</button></div>`;
  }
  else{
    const whUsed=Object.values(wh.items).reduce((a,b)=>a+b,0);
    const exCost=getWhExpandCost(loc);
    html+=`<p style="font-size:12px;color:var(--text2);margin-bottom:6px">${whUsed}/${wh.capacity}格
      <button class="btn-sm btn-buy-sm" style="float:right" onclick="doExpandWarehouse()" ${GS.gold<exCost?'disabled':''}>扩建 +50 格（${fmt(exCost)} 金）</button></p><div class="wh-list">`;
    if(whUsed===0)html+=`<div class="empty">仓库为空</div>`;
    for(let[id,qty]of Object.entries(wh.items)){
      if(!qty)continue;const it=getItem(id);
      html+=`<div class="wh-row"><span>${it.icon} ${it.name} ×${qty}</span><div class="qty-inline"><input type="number" id="wqty-${id}" value="${Math.min(1,qty)}" min="1" max="${qty}" style="width:50px"><button class="btn-sm btn-buy-sm" onclick="doWhOut('${id}',parseInt(document.getElementById('wqty-${id}').value)||1)">→载具</button></div></div>`;
    }
    html+=`</div>`;
  }
  return html;
}

// ===== 事件绑定 =====
function bindEvents(){
  if(currentTab==='map'&&MAP.needCenter){MAP.needCenter=false;centerOn(GS.location);applyMapView();} // 首次地图挂载后按真实尺寸居中
  document.querySelectorAll('.city-node').forEach(circle=>{circle.onclick=function(e){e.stopPropagation();const destId=this.dataset.city;if(destId===GS.location&&!GS.traveling)return;if(GS.traveling)return toast('正在旅行中','info');const sp=shortestPath(GS.location,destId);if(!sp)return;const realSec=Math.round(sp.distance/getVehicleSpeed()*60);const destName=getCityName(destId);const durLoss=calcDurabilityLoss(sp.distance);showModal(`前往 ${destName}`,`${fmt(sp.distance)} 里路程 · 约 ${realSec} 秒抵达\n预计耐久 -${durLoss}点（当前耐久 ${Math.round(getDurabilityPct()*100)}%）`,'出发',()=>{const r=startTravel(destId);toast(r.msg,r.ok?'ok':'err');if(r.ok)render();});}});
  document.querySelectorAll('.chart-time button').forEach(b=>{b.onclick=function(){document.querySelectorAll('.chart-time button').forEach(x=>x.classList.remove('active'));this.classList.add('active');_chartDays=parseInt(this.dataset.days);drawChart();}});
}

// ===== 导航 + 定时 =====
document.querySelectorAll('nav button').forEach(btn=>{btn.addEventListener('click',function(){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));this.classList.add('active');currentTab=this.dataset.tab;render()})});
let _tickCount=0;
setInterval(()=>{
  _tickCount++;
  const arrived=advanceDay();
  settleOverdueTasks(); // v9.4：到点自动失败（含倒计时刷新前的结算）
  const dragging=!!window._draggingGid;
  if(arrived&&!dragging){render();return;}
  if(arrived&&dragging){window._pendingRefresh=true;}
  if(window._pendingRefresh&&!dragging){window._pendingRefresh=false;render();return;}
  renderTopbar();
  // 事件横幅倒计时每秒刷新（不重渲染整个内容区）
  const eb=document.getElementById('event-board');
  if(eb)eb.innerHTML=renderEventBoard();
  // 已接任务倒计时每秒局部刷新（仅城市页）
  if(currentTab==='city')updateTaskTimers();
  if(window.Starfall)Starfall.tick(); // v9.9：星陨城活动倒计时/轮播/惰性轮转
  // 旅行中：仅增量更新地图位置点与进度（不重建地图，避免城市页/路网动画闪烁）
  // 抵达时 advanceDay 返回 arrived → 上面已全量 render()
  if(!dragging&&GS.traveling&&currentTab==='map'){updateTravelUI();}
},1000);
markCityAsKnown(GS.location);
genTasks(GS.location);
normalizeVehicleDurability(); // 新账号按耐久公式补满
migrateLots(); // 新账号批次结构初始化
if(!GS.visitStamp[GS.location])GS.visitStamp[GS.location]=1; // 初始停留批次
document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.querySelector('nav button[data-tab="map"]').classList.add('active');currentTab='map';render();
// 指令台：全局挂载，可键盘调用
window.runCmd=runCmd;
// 地图交互（缩放/拖拽，事件委托一次性绑定）
initMapInteract();
// 弹幕聊天室初始化（延迟到 DOM 就绪：chat-fab 位于脚本之后的 HTML 中）
function initChatUI(){initChatFab();chatLoad();startChatPolling();}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initChatUI);}else{initChatUI();}
// 登录门禁：在线与单机共享同一入口，但使用彼此隔离的持久化来源。
const __authSub=document.querySelector('.auth-sub');
if(__authSub)__authSub.textContent=(Runtime.isStandalone?'单机模式 · 存档保存在当前浏览器':'在线模式 · 存档保存在服务器')+' · '+APP_VERSION; // v9.14.1：登录页展示版本号
const __bootUser=localStorage.getItem(AUTH_KEY);
if(!__bootUser){const ao=document.getElementById('auth-overlay');if(ao){ao.style.display='flex';toggleAuth('login');}}
else{(async()=>{
  if(Runtime.isStandalone){
    // 单机启动只读取 localStorage，不发起任何 /api 请求。
    if(getUsers().includes(__bootUser)){
      applySaved(getStoredGS(__bootUser)); // v9.13.0：无存档时也初始化（ensureCityStocks 补库存）
      window.__gsReady=true;render();
    }else{
      localStorage.removeItem(AUTH_KEY);
      const ao=document.getElementById('auth-overlay');if(ao){ao.style.display='flex';toggleAuth('login');}
    }
    return;
  }
  const online=await startOnline();
  if(!online)return showOnlineUnavailable();
  if(needForceRelogin()){ forceReloginForVersion(); return; } // v9.14.1：发版后强制重登一次
  await fullSync();
})();} // 在线模式失败时保持门禁，由玩家明确选择是否切换单机模式
</script>
