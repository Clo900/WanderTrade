<script>
/* ================================================
 * 游戏引擎
 * ================================================ */

// ===== 响应式状态容器初始化 =====
State.init({
  day: 1, gold: 10000, location: 'greentown',
  timeScale: 1, gameStartTime: Date.now(),
  vehicle: {level:1,speed:5,durability:100,durabilityMax:100,passengers:0,core:{lv:0,speed:0,dura:0},wagons:[{cur:{id:'w0',type:'balanced',lv:1},owned:{balanced_1:true}}]},
  cargo: {}, buyPrice: {}, lots: {}, visitStamp: {},
  // vNext：中转面板（交易单），buy/sell 分离；任何锚点变化将触发清空
  tradeDraft: {buy:{cityId:null,day:null,hub:null,items:{}},sell:{cityId:null,day:null,hub:null,items:{}}},
  cityStocks: {}, lastStockRefill: Date.now(),
  warehouses: {}, reputation: {},
  materials: {gear:0,repair_kit:0,fuel_tank:0,engine:0,staralloy:0}, // v9.9：星陨合金
  mailbox: [], // v9.9：邮箱（在线由服务端投递，本地仅缓存展示）
  tasks: {board:[],active:[]}, taskBadLog: {abandonAt:[],failAt:[]}, traveling: null, pendingEvent: null, repairDisc: null,
  intel: {unlocked:{},log:[],drawn:{}}, knownEvents: {}, eventSeen: {}, // v9.11.9：drawn=本城已抽事件（离开城市清空）
  nickname: '', titles: {owned:{},equipped:null}, // v9.10.3：昵称（全服唯一）/ 称号栏（owned+当前装备）
  justArrived: false, tutorial: {step:0},
  stats: {bought:0,sold:0,tasks:0,travels:0,distance:0,visits:1,income:0,upgrades:0,reps:0,everDebt:0,debtPaid:0}, // v9.10.3：everDebt/debtPaid 供「无债一身轻」
  achievements: {}, visitedCities: ['greentown'],
  __savedAt: 0, __loaded: false,
  __clockOffset: 0 // v9.4：服务器时间校准偏移（ms）；单机为 0，在线由 serverNow 校准
});

// ===== 清理误注入的调试 DOM（避免阻塞点击） =====
// 注意：这些误注入节点可能出现在文档末尾（在本脚本执行之后才被浏览器解析出来），
// 所以要在 DOMContentLoaded 后再清理一次。
function cleanupInjectedDom(){
  try{
    // 删除“没有绑定事件”的静态 modal overlay（会导致弹窗无法点击关闭）
    document.querySelectorAll('.modal-overlay').forEach(function(ov){
      const ok = ov.querySelector('.btn-ok');
      const cancel = ov.querySelector('.btn-cancel');
      if(ok && cancel && ok.onclick==null && cancel.onclick==null){
        ov.remove();
      }
    });
    // 删除浏览器检查器注入的辅助层（class 名包含 trae-browser-inspect-）
    document.querySelectorAll('[class*=\"trae-browser-inspect-\"]').forEach(function(el){ el.remove(); });
  }catch(e){}
}
document.addEventListener('DOMContentLoaded', function(){
  cleanupInjectedDom();
  setTimeout(cleanupInjectedDom, 0);
});

// ===== 状态订阅 + EventBus 桥接（v9.0） =====
State.subscribe('gold', function(newGold, oldGold){
  EventBus.emit(EventBus.EVENTS.GOLD_CHANGED, {gold: newGold});
});
State.subscribe('location', function(newLoc){
  EventBus.emit(EventBus.EVENTS.LOCATION_CHANGED, {location: newLoc});
});
State.subscribe('day', function(day){
  EventBus.emit(EventBus.EVENTS.DAY_CHANGED, {day: day});
});
State.subscribe('traveling', function(traveling){
  if(traveling){
    EventBus.emit(EventBus.EVENTS.TRAVEL_START, traveling);
  }else{
    EventBus.emit(EventBus.EVENTS.TRAVEL_ARRIVE, {});
  }
});

// ===== vNext：中转面板锚点变化 → 提示并清空（buy/sell 两个 draft 同时清空） =====
let __draftLastHub = (window.TradeGraph&&TradeGraph.hub)?TradeGraph.hub(State.get('day')):0;
function clearDraftOnAnchorChange(reason){
  if(!window.TradeDraft||!TradeDraft.anyNonEmpty||!TradeDraft.anyNonEmpty())return;
  showModal('⚠ 物价已更新',
    `由于游戏日/中枢点/城市/面板发生变化，为避免按旧价成交，已清空中转面板内容。`,
    '知道了',()=>{
      TradeDraft.clearAll(reason||'anchor-change');
      // 若当前在城市页，立即刷新市场区域
      if(currentTab==='city')renderMarketCards();
    });
}
State.subscribe('location', function(){
  clearDraftOnAnchorChange('location');
});
State.subscribe('day', function(day){
  const h=(window.TradeGraph&&TradeGraph.hub)?TradeGraph.hub(day):Math.floor((Math.max(1,day)-1)/12);
  if(h!==__draftLastHub){ __draftLastHub=h; clearDraftOnAnchorChange('hub'); }
  else clearDraftOnAnchorChange('day');
});

// 事件详情弹窗（用户友好文案，状态标签，无括号补充；已结束事件不出现）
// v9.10.2：事件收集由成就面板"事件见闻录"分支承载（renderEventCatalog），不再提供"查看全部事件定义"的图鉴入口
function showEventDetail(id){
  const ev=EVENT_TABLE.find(e=>e.id===id);if(!ev)return;
  markEventsSeen([ev]); // v9.10.2：查看详情即见证（与横幅可见同一口径）
  let span;if(ev.scope==='global'||ev.scope==='cost')span='全王国';else if(ev.scope==='city')span=ev.item?`${getCityName(ev.city)} · ${getItem(ev.item)?.name||ev.item}`:`${getCityName(ev.city)} · 全城`;else span=`${getCityName(ev.city)} · ${getItem(ev.item)?.name||ev.item}`;
  const effectTxt=getPublicDesc(ev);
  const inst=getPlayerEvents().find(e=>e.id===id);
  const st=inst?getEventStatus(inst):null;
  let statusRow='';
  if(st)statusRow=`\n状态：${st.label}${st.remain!=null?` · 剩余 ${fmtCountdown(st.remain)}`:''}`;
  showModal(ev.icon+' '+ev.name,
    `影响范围：${span}\n效果：${effectTxt}${statusRow}`,
    '知道了',()=>{});
}
// ===== 私人事件（旅行途中） =====
// 出发时以确定性种子判定，抵达时结算（网页内弹窗）
function rollPrivateEvent(sp,destId){
  if(sp.distance<=4)return null;                       // 新手村短途不触发
  const r=seededRnd(sp.distance*7919+GS.day*104729+destId.charCodeAt(0)*31);
  if(r<0.08)return{type:'rob',pct:0.1+seededRnd(r*7)*0.2};       // 劫匪 8%：损失10%~30%
  if(r<0.12)return{type:'breakdown'};                            // 载具故障 4%：耐久−30
  if(r<0.17)return{type:'merchant'};                             // 偶遇行商 5%：某物资 ×1.15 收购
  if(r<0.22)return{type:'repairman'};                            // 偶遇工匠 5%：下次维修半价
  if(r<0.26)return{type:'bump'};                                 // 道路颠簸 4%：耐久−10
  if(r<0.30)return{type:'buyer'};                                // 货主急购 4%：某物资 ×1.3 收购
  return null;
}
function applyCargoLoss(pct){
  const ids=Object.keys(GS.cargo).filter(id=>GS.cargo[id]>0);
  if(ids.length===0)return;
  State.batch(function(){
    var cargo = State.get('cargo') || {};
    var buyPrice = State.get('buyPrice') || {};
    for(const id of ids){
      const lost=Math.max(1,Math.floor(cargo[id]*pct));
      cargo[id]-=lost;
      if(cargo[id]<=0){delete cargo[id];delete buyPrice[id];}
    }
    State.set('cargo', cargo);
    State.set('buyPrice', buyPrice);
  });
  EventBus.emit(EventBus.EVENTS.CARGO_CHANGED, {reason:'loss'});
}
function showPrivateEvent(){
  const pe=GS.pendingEvent;if(!pe)return;State.set('pendingEvent',null);
  if(pe.type==='rob'){
    let val=0;for(const id in GS.cargo)val+=(GS.cargo[id]||0)*((GS.buyPrice[id])||0);
    const ransom=Math.round(val*0.2);
    // v9.8：欠债系统——赎买允许欠债（金币不足也扣款为负），"硬抗损失"仍为备选
    showChoice('🏴 路遇劫匪',`损失 ${Math.round(pe.pct*100)}% 的货物（按各物资比例扣除）\n或花费 ${fmt(ransom)} 金币赎买免于损失`,
      `赎买 ${fmt(ransom)} 金币`,'硬抗损失',()=>{
        State.set('gold',GS.gold-ransom);
        toast('破财消灾，货物保住'+(GS.gold<0?'（金币已负债，需卖货或完成任务还清）':''),'ok');
        render();
      },()=>{applyCargoLoss(pe.pct);toast('货物被劫走一部分','err');render();});
  }else if(pe.type==='breakdown'){
    const loss=30;
    const veh = GS.vehicle;
    veh.durability = Math.max(0, veh.durability-loss);
    State.set('vehicle', veh);
    EventBus.emit(EventBus.EVENTS.DAMAGE_TAKEN, {type:'breakdown', loss:loss});
    showModal('🔧 载具故障',`旅途颠簸，车辆故障\n耐久 −${loss} 点（当前 ${Math.round(getDurabilityPct()*100)}%）`,'继续赶路',()=>render());
  }else if(pe.type==='merchant'){
    // v8.10 修复：真正"收购"——按当前城卖出价 ×1.15 全量买断该货物并扣货。
    // 仅遍历 GS.cargo（玩家自有货物）；任务物资在 GS.tasks 内管理、不占 cargo，天然不会计入。
    const ids=Object.keys(GS.cargo).filter(id=>GS.cargo[id]>0);
    if(ids.length===0){showModal('🛒 偶遇行商','行商想收购你的货物，但你两手空空','可惜',()=>render());return;}
    const id=ids[Math.floor(seededRnd(GS.day*13+ids.length)*ids.length)];
    const qty=GS.cargo[id];
    const sPrice=getSellPrice(GS.location,id,GS.day)||getDayPrice(GS.location,id,GS.day);
    const unit=Math.round(sPrice*1.15);
    const gain=unit*qty;
    State.set('gold', GS.gold+gain);
    State.batch(function(){
      var cargo = State.get('cargo') || {};
      var buyPrice = State.get('buyPrice') || {};
      var lots = State.get('lots') || {};
      delete cargo[id];delete buyPrice[id];delete lots[id];
      State.set('cargo', cargo);
      State.set('buyPrice', buyPrice);
      State.set('lots', lots);
    });
    EventBus.emit(EventBus.EVENTS.ITEM_SOLD, {itemId:id, qty:qty, revenue:gain});
    showModal('🛒 偶遇行商',`行商看中你的 ${getItem(id).name}×${qty}\n以高于市价 15% 收购（${fmt(unit)} 金/件），入账 ${fmt(gain)} 金币`,'成交',()=>render());
  }else if(pe.type==='repairman'){
    State.set('repairDisc', 0.5);
    showModal('🔧 偶遇工匠',`一位走南闯北的工匠为你的车做了检查\n下次维修享受 5 折优惠`,'多谢',()=>render());
  }else if(pe.type==='bump'){
    const veh = GS.vehicle;
    veh.durability = Math.max(0, veh.durability-10);
    State.set('vehicle', veh);
    EventBus.emit(EventBus.EVENTS.DAMAGE_TAKEN, {type:'bump', loss:10});
    showModal('🪨 道路颠簸',`一段碎石路颠得车辆吱呀作响\n耐久 −10 点（当前 ${Math.round(getDurabilityPct()*100)}%）`,'继续赶路',()=>render());
  }else if(pe.type==='buyer'){
    // v8.10 修复：真正"收购"——按当前城卖出价 ×1.30 全量买断该货物并扣货（同 merchant，仅玩家自有货物）
    const ids=Object.keys(GS.cargo).filter(id=>GS.cargo[id]>0);
    if(ids.length===0){showModal('💰 货主急购','有人出高价收购，可惜你车上没货','可惜',()=>render());return;}
    const id=ids[Math.floor(seededRnd(GS.day*31+ids.length)*ids.length)];
    const qty=GS.cargo[id];
    const sPrice=getSellPrice(GS.location,id,GS.day)||getDayPrice(GS.location,id,GS.day);
    const unit=Math.round(sPrice*1.3);
    const gain=unit*qty;
    State.set('gold', GS.gold+gain);
    State.batch(function(){
      var cargo = State.get('cargo') || {};
      var buyPrice = State.get('buyPrice') || {};
      var lots = State.get('lots') || {};
      delete cargo[id];delete buyPrice[id];delete lots[id];
      State.set('cargo', cargo);
      State.set('buyPrice', buyPrice);
      State.set('lots', lots);
    });
    EventBus.emit(EventBus.EVENTS.ITEM_SOLD, {itemId:id, qty:qty, revenue:gain});
    showModal('💰 货主急购',`${getItem(id).name} 在这边紧俏得很\n对方以高于市价 30% 收购（${fmt(unit)} 金/件）×${qty}，入账 ${fmt(gain)} 金币`,'成交',()=>render());
  }
}

// ===== 库存系统 =====
// v7.2 起库存随【游戏日】刷新（正式：10 分钟/日），原 STOCK_REFILL_MS=30000 已废弃移除
function initCityStocks(){
  const s={};
  for(let c of CITIES){s[c.id]={};
    for(let gid of c.goods){s[c.id][gid]=PURCHASE_LIMITS[c.id]?.[gid]||100}
  }return s;
}

// ===== 在线世界同步（v7.1 共享世界 / v7.2 库存独立） =====
// 服务器为世界权威：价格种子/购买限额/世界起始时间共享；玩家存档存服务器 players/
// v7.2：库存按玩家独立（不共享），随【服务器游戏日】同时刷新；留 stockMode 接口（默认 perPlayer，未来可切 shared）
// 单机模式使用 localStorage；在线模式连接失败时不再静默写入本地档。
const AUTH_KEY='_auth_user',USERS_KEY='_auth_users',GS_PREFIX='_gs_';
let ONLINE=false;
// v7.8：网络状态机（ok=正常 / down=断开重连中）；断线自动重连 + 恢复后全量同步
let __netState='ok',__retryTimer=null;
function netDot(){ // 顶栏状态点：🟢 在线 / 🔴 重连中 / ⚪ 离线模式
  if(!ONLINE)return'⚪';
  return window.__netState==='down'?'🔴':'🟢';
}
function netHit(){
  if(window.__netState==='down'){window.__netState='ok';renderTopbar();toast('✅ 网络已恢复','ok');}
  window.__netState='ok';
}
function netMiss(){
  if(!ONLINE||window.__netState==='down')return;
  window.__netState='down';renderTopbar();
  toast('⚠ 连接中断，正在尝试重连…','info');
  if(!__retryTimer){
    __retryTimer=setInterval(async()=>{
      const w=await NET.get('/api/world');

async function syncPlayer(user){
  const pl=await NET.get('/api/player/'+encodeURIComponent(user));
  const server=pl&&pl.ok&&pl.gs?pl.gs:null;
  // v8.24：服务器账号（不在本机离线用户列表）忽略本机残留档——
  // 本机档可能是历史版本自动保存的初始档（时间戳较新），误用会覆盖服务器真实存档导致"刷新后信息回归初始"
  const local=(!getUsers().includes(user))?null:(getStoredGS(user)||null);
  if(!server&&!local){
    // v8.24：仅当服务器明确确认无存档（pl.ok）才算全新玩家，允许创建档；
    // 网络失败（pl 为 null）不置 __loaded，防止初始档被上传覆盖服务器真实存档
    if(pl&&pl.ok){GS.__loaded=true;}
    window.__gsReady=true;
    return;
  }
  const serverAt=server?(server.__savedAt||0):0;
  const localAt=local?(local.__savedAt||0):0;
  const useLocal=!!local&&localAt>serverAt;
  const src=useLocal?local:server;
  GS.__lastServerAt=src?(src.__savedAt||0):0; // v8.25：记录已知的服务器存档版本（并发保护基准，与时钟无关）
  applySaved(src);

  if(pl&&pl.ok&&pl.nickname)State.set('nickname', pl.nickname);
  window.__gsReady=true; // v8.20：玩家存档已恢复，此后自动保存生效
  if(useLocal){
    const up=JSON.parse(JSON.stringify(GS));
    delete up.__basePrices;delete up.__purchaseLimits; // 世界数据随服务器，不随玩家档上传
    delete up.day;delete up.gameStartTime; // v8.26：游戏日由服务器 worldStart 统一计算
    delete up.mailbox; // v9.9：邮箱由服务端投递（结算/GM），不随玩家档上传，避免旧档覆盖新邮件
    const r=await NET.post('/api/save',{user,gs:up,clientSaveTime:GS.__savedAt,lastServerAt:GS.__lastServerAt});
    if(r&&r.ok)GS.__lastServerAt=GS.__savedAt;
  }
}

function mergeWorldTable(oldT,newT){
  const out={};
  for(const c of CITIES){
    const oldC=(oldT&&oldT[c.id])||{},newC=(newT&&newT[c.id])||{};
    out[c.id]={};

}

async function doRegister(){

  if(!nick||nick.length>20)return authErr('昵称需 1~20 个字符（可含中文）');
  if(p.length<4)return authErr('密码至少 4 位');
  const online=await startOnline();
  if(Runtime.isOnline&&!online)return showOnlineUnavailable();

    const r=await NET.post('/api/register',{user:u,nickname:nick,pass:p});

// 导出文件不包含密码，只包含当前账号的游戏状态和格式版本。
function exportLocalSave(){
  if(!Runtime.isStandalone)return toast('在线模式不能导出本地存档','info');
  const user=localStorage.getItem(AUTH_KEY);
  if(!user)return toast('请先登录单机账号','info');
  saveNow();
  const payload={
    format:'wandertrade-save',
    version:1,
    exportedAt:Date.now(),
    user:user,
    state:getStoredGS(user)||State.snapshot()
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='wandertrade-'+user+'-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);

function importLocalSave(){
  if(!Runtime.isStandalone)return toast('在线模式不能导入本地存档','info');
  const user=localStorage.getItem(AUTH_KEY);
  if(!user)return toast('请先登录单机账号','info');
  const input=document.createElement('input');
  input.type='file';input.accept='application/json,.json';
  input.onchange=function(){
    const file=input.files&&input.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=function(){
      try{
        const payload=JSON.parse(String(reader.result||''));
        if(!payload||payload.format!=='wandertrade-save'||payload.version!==1||!payload.state){
          throw new Error('unsupported save format');
        }
        showModal('导入单机存档','导入将覆盖当前账号「'+user+'」的本地进度。建议先导出当前存档作为备份。','确认导入',function(){
          saveGS(user,payload.state);
          applySaved(payload.state);
          window.__gsReady=true;
          render();
          toast('单机存档导入成功','ok');
        });
      }catch(e){toast('存档文件无效或版本不受支持','err');}
    };
    reader.readAsText(file,'UTF-8');
  };
  input.click();
}

// ===== 成就系统（v9.10.3：Ⅰ/Ⅱ/Ⅲ 分级 + 趣味成就） =====
// v9.11.10：成就配置（名称/描述/目标/奖励）已抽取至 src/data/achievements.js（策划统一修改入口），
//           新增成就只需在该配置文件追加条目，metric 见文件内清单；此处仅保留判定与解锁逻辑。
// 分级成就：tiers[n].goal 为第 n 级目标；非分级成就：goal 为单目标。
// 解锁记录：GS.achievements[id] 存 Ⅰ 级时间戳（旧档兼容），Ⅱ/Ⅲ 级存 id+'#t2'/'#t3'。
function statAdd(k,n){var s=State.get('stats')||{};s[k]=(s[k]||0)+n;State.set('stats',s);}
// v9.10.3：欠债追踪（成就「无债一身轻」）——金币由正转负记 everDebt，由负转正记 debtPaid
State.subscribe('gold',function(val){
  if(typeof val!=='number'||!GS.stats)return;
  const st=GS.stats;
  if(val<0&&!st.everDebt){st.everDebt=1;State.set('stats',st);}
  else if(val>=0&&st.everDebt&&!st.debtPaid){st.debtPaid=1;State.set('stats',st);}
});
// v9.11.10：进度值按配置的 metric 计算（成就配置见 src/data/achievements.js；新维度在此注册）
function achieveVal(a){
  switch(a.metric){
    case'tutorial':return (!GS.tutorial||GS.tutorial.step>=6)?1:0;
    case'visitedCount':return GS.visitedCities.length;
    case'income':return GS.stats.income;
    case'tasksDone':return GS.stats.tasks;
    case'goodsSold':return GS.stats.sold;
    case'travels':return GS.stats.travels;
    case'distance':return GS.stats.distance;
    case'gold':return GS.gold;
    case'maxRepLevel':return Math.max(...CITIES.map(c=>getRepLevel(c.id)));
    case'coreLevel':return GS.vehicle.core?(GS.vehicle.core.lv||0):0;
    case'wagonCount':return (GS.vehicle.wagons||[]).length;
    case'eventSeenCount':return Object.keys(GS.eventSeen||{}).length;
    case'cargoUsed':return getUsedCargo();
    case'repLevel3Cities':return CITIES.filter(c=>getRepLevel(c.id)>=3).length;
    case'debtPaid':return GS.stats.debtPaid||0;
    case'matKinds':return Object.keys(GS.materials||{}).filter(k=>(GS.materials[k]||0)>0).length;
  }
  return 0;
}
function achieveGoal(a,n){return a.tiers?a.tiers[(n||1)-1].goal:(a.goal||1);}
function achieveProgress(a,n){
  const goal=achieveGoal(a,n||1);
  if(goal<=0)return 0;
  return Math.max(0,Math.min(1,achieveVal(a)/goal));
}
function achTierCount(a){return a.tiers?a.tiers.length:1;}
function isAchUnlocked(a,n){
  n=n||1;
  const ach=GS.achievements||{};
  if(n===1)return !!ach[a.id];
  return !!ach[a.id+'#t'+n];
}
function fmtReward(r){
  const parts=[];
  if(r.gold)parts.push('💰'+fmt(r.gold));
  for(const m in (r.mats||{}))parts.push(getMat(m).icon+getMat(m).name+'×'+r.mats[m]);
  if(r.title&&window.Titles&&Titles.TITLES[r.title])parts.push('🎖️'+Titles.TITLES[r.title].name);
  return parts.join(' ');
}
function unlockAchievement(id,n){
  n=n||1;
  var achievements=State.get('achievements')||{};
  if(isAchUnlocked({id:id},n))return;
  if(n===1)achievements[id]=Date.now();
  else achievements[id+'#t'+n]=Date.now();
  State.set('achievements',achievements);
  const a=ACHIEVEMENTS.find(x=>x.id===id);
  if(!a)return;
  const r=(a.tiers?a.tiers[n-1].reward:a.reward)||{};
  const parts=[];
  if(r.gold){State.set('gold',GS.gold+r.gold);parts.push('💰'+fmt(r.gold)+'金币');}
  if(r.mats){
    var mats=State.get('materials')||{};
    for(const m in r.mats){mats[m]=(mats[m]||0)+r.mats[m];parts.push(getMat(m).icon+getMat(m).name+'×'+r.mats[m]);}
    State.set('materials',mats);
  }
  if(r.title&&window.Titles)Titles.unlock(r.title); // v9.10.3：成就奖励称号（unlock 自带提示）
  const tierTag=a.tiers?(' '+(['Ⅰ','Ⅱ','Ⅲ'][n-1]||'')+' 级'):'';
  EventBus.emit(EventBus.EVENTS.ACHIEVEMENT,{id:id,tier:n,name:a.name,reward:r});
  toast(`🏆 成就解锁：${a.name}${tierTag}！${parts.join('、')}`,'ok');
}
function checkAchievements(){
  State.silent(function(){
    if(!GS.stats)State.set('stats',{bought:0,sold:0,tasks:0,travels:0,distance:0,visits:1,income:0,upgrades:0,reps:0,everDebt:0,debtPaid:0});
    if(!GS.achievements)State.set('achievements',{});
    if(!GS.visitedCities||!GS.visitedCities.length)State.set('visitedCities',[GS.location]);
    if(!GS.eventSeen)State.set('eventSeen',{}); // v9.10.2：事件见闻录兜底
    if(!GS.titles)State.set('titles',{owned:{},equipped:null}); // v9.10.3：称号栏兜底
  });
  for(const a of ACHIEVEMENTS){
    const n=achTierCount(a);
    for(let i=1;i<=n;i++){
      if(isAchUnlocked(a,i))continue;
      if(achieveProgress(a,i)>=1)unlockAchievement(a.id,i);
    }
  }
  // v9.10.3：兼容旧档——已完成新手引导（或已获初来乍到成就）但尚无称号的玩家补发「新手上路」
  if(window.Titles&&GS.titles&&!GS.titles.owned.novice&&(GS.achievements.first_step||(GS.tutorial&&GS.tutorial.step>=6)))Titles.unlock('novice');
}

let achTierSel={}; // 分级成就当前查看等级（内存态；未切换时默认=最低未完成等级）
function achDefaultTier(a){
  const n=achTierCount(a);
  for(let i=1;i<=n;i++){ if(!isAchUnlocked(a,i)) return i; }
  return n; // 全部完成 → 显示最高级
}
function achTierNav(id,dir){
  const a=ACHIEVEMENTS.find(x=>x.id===id);
  if(!a||!a.tiers)return;
  const n=achTierCount(a);
  let cur=achTierSel[id]||achDefaultTier(a);
  let next=Math.max(1,Math.min(n,cur+dir));
  if(next===cur)return;
  achTierSel[id]=next;
  const g=document.getElementById('ach-grid');
  if(g&&achView==='ach')g.innerHTML=achCardsHTML();
}
function achCardHTML(a){
  const n=achTierCount(a),multi=!!a.tiers;
  const sel=multi?(achTierSel[a.id]||achDefaultTier(a)):1;
  const t=multi?a.tiers[sel-1]:a;
  const doneCur=isAchUnlocked(a,sel),doneAll=isAchUnlocked(a,n);
  const prog=doneCur?1:achieveProgress(a,sel);
  const roman=['Ⅰ','Ⅱ','Ⅲ'];
  const goalText=multi?(a.desc+' ≥ '+fmt(t.goal)):a.desc;
  const titleBadge=t.title?` <span class="ach-goal-title">${Titles.badgeHTML(t.title)}</span>`:'';
  // v9.11.2：等级是名字的一部分（跟在名字后）；◀ ▶ 置于名称行左右两端
  const state=doneAll?'🎉':(doneCur?'✅':'');
  const nameInner=`${a.name}${multi?`<span class="ach-tier-num ${doneCur?'done':''}" title="${doneCur?'当前等级已完成':''}">${roman[sel-1]}</span>`:''}${state?`<span class="ach-state" title="${doneAll?'全部等级已完成':'当前等级已完成'}">${state}</span>`:''}`;
  const navBtn=(dir,label,dis)=>multi?`<button class="ach-nav-btn" onclick="achTierNav('${a.id}',${dir})" ${dis?'disabled':''} title="${label}">${dir<0?'◀':'▶'}</button>`:'';
  return `<div class="ach-card ${doneAll?'done':''}"><div class="ach-icon">${a.icon}</div><div class="ach-body">
    <div class="ach-head">
      ${navBtn(-1,'上一级',sel<=1)}
      <span class="ach-name">${nameInner}</span>
      ${navBtn(1,'下一级',sel>=n)}
    </div>
    <div class="ach-goal">${goalText}${titleBadge}</div>
    <div class="ach-prog"><div class="ach-prog-track"><div class="ach-prog-bar" style="width:${Math.round(prog*100)}%"></div></div><span>${Math.round(prog*100)}%</span></div>
    <div class="ach-reward">${fmtReward(t.reward)}</div>
  </div></div>`;
}
function achCardsHTML(){return ACHIEVEMENTS.map(achCardHTML).join('');}
function renderAchievements(){
  checkAchievements();
  let units=0,unlocked=0;
  for(const a of ACHIEVEMENTS){
    const n=achTierCount(a);units+=n;
    for(let i=1;i<=n;i++){if(isAchUnlocked(a,i))unlocked++;}
  }
  const pct=units?Math.round(unlocked/units*100):0;
  return `<div class="view-head"><h2>🏆 成就系统</h2><span class="sub">${unlocked}/${units} 项已解锁</span></div>
  <div class="ach-bar-wrap"><div class="ach-track"><div class="ach-bar" style="width:${pct}%"></div></div><span>${pct}%</span></div>
  <div class="ach-grid" id="ach-grid">${achCardsHTML()}</div>`;
}
// ===== 排行榜（v7.5：在线全服 / 离线本机多账号） =====
let rankType='gold';
let achView='ach'; // v9.10.3：成就面板视图 'ach'=成就 / 'events'=事件见闻录
function setRankType(t){rankType=t;render();}
function setAchView(v){achView=v;const el=document.getElementById('view-achrank');if(el){el.innerHTML=renderAchRank();loadRankings();}}
function renderRankings(){
  const types=[['gold','💰 金币'],['distance','🛣️ 里程'],['tasks','📜 任务'],['rep','⭐ 声望']];
  return `<div class="view-head"><h2>📊 排行榜</h2><span class="sub">${ONLINE?'全服实时排名':'本机多账号排名'}</span></div>
  <div class="rank-type">${types.map(t=>`<button class="${t[0]===rankType?'active':''}" onclick="setRankType('${t[0]}')">${t[1]}</button>`).join('')}</div>
  <div id="rank-list"><div class="empty">加载中…</div></div>`;
}
function loadRankings(){
  const el=document.getElementById('rank-list');if(!el)return;
  const draw=rows=>{
    if(!rows||!rows.length){el.innerHTML='<div class="empty">暂无数据，快去创造纪录吧！</div>';return;}
    const medals=['🥇','🥈','🥉'];
    el.innerHTML=rows.map((r,i)=>{
      const vTxt=rankType==='gold'?'💰'+fmt(r.gold):rankType==='distance'?fmt(r.distance)+'里':rankType==='tasks'?r.tasks+'单':'Lv'+r.rep;
      const mine=r.user===localStorage.getItem(AUTH_KEY);
      return `<div class="rank-row ${i<3?'top':''}"><span class="rank-no">${medals[i]||(i+1)}</span><span class="rank-user">${r.user}${mine?' <span style="color:var(--accent)">(我)</span>':''}</span><span class="rank-val">${vTxt}</span></div>`;
    }).join('');
  };
  if(ONLINE){
    NET.get('/api/rankings?type='+rankType).then(r=>{if(r&&r.ok)draw(r.rows);else el.innerHTML='<div class="empty">排行榜暂不可用</div>';});
  }else{
    const users=getUsers(),rows=[];
    for(const u of users){
      const saved=getStoredGS(u);if(!saved)continue;
      const st=saved.stats||{};let rep=0;
      for(const c in (saved.reputation||{}))rep+=(saved.reputation[c].level||0);
      rows.push({user:u,gold:saved.gold||0,distance:st.distance||0,tasks:st.tasks||0,rep:rep});
    }
    rows.sort((a,b)=>b[rankType]-a[rankType]);
    draw(rows.slice(0,20));
  }
}
// 合并页签：排行榜（上）+ 成就/事件见闻录（下，分段控件切换，v9.10.3）
function achViewTabs(){
  return `<div class="seg">${[['ach','🏆 成就'],['events','📖 事件见闻录']].map(t=>`<button class="seg-btn ${t[0]===achView?'active':''}" onclick="setAchView('${t[0]}')">${t[1]}</button>`).join('')}</div>`;
}
function renderAchRank(){return renderRankings()+achViewTabs()+(achView==='ach'?renderAchievements():renderEventCatalog());}
// 事件见闻录（v9.10.2）：成就面板分支——见证过的事件从未知变为解锁显示；未见证隐藏名称/描述（不透剧）
function renderEventCatalog(){
  const seen=GS.eventSeen||{};
  const unlocked=EVENT_TABLE.filter(ev=>seen[ev.id]).length;
  const pct=Math.round(unlocked/EVENT_TABLE.length*100);
  let html=`<div class="view-head"><h2>📖 事件见闻录</h2><span class="sub">${unlocked}/${EVENT_TABLE.length} 已见证</span></div>
  <div class="ach-bar-wrap"><div class="ach-track"><div class="ach-bar" style="width:${pct}%"></div></div><span>${pct}%</span></div>
  <div class="ach-grid ev-grid">`;
  for(const ev of EVENT_TABLE){
    const got=!!seen[ev.id];
    if(got){
      html+=`<div class="ach-card done"><div class="ach-icon">${ev.icon}</div><div class="ach-body">
        <div class="ach-name">${ev.name} <span style="color:var(--gold)">✅</span></div>
        <div class="ach-desc">${ev.desc}</div>
      </div></div>`;
    }else{
      html+=`<div class="ach-card"><div class="ach-icon">❓</div><div class="ach-body">
        <div class="ach-name" style="color:var(--text3)">？？？ 未知事件</div>
        <div class="ach-desc" style="color:var(--text3)">旅行经过或到情报所打听消息，可记录见闻</div>
      </div></div>`;
    }
  }
  html+='</div>';
  return html;
}

// ===== 后台指令系统（v7.4 GM/作弊，在线可用） =====
// 用法：点击右下角 🛠 打开指令台，或浏览器控制台运行 runCmd("...")
// 本地指令（无需密码，仅影响本账号）：/help /addgold /addcargo /addmat /repair /core /wagon /setrep /stock /day
// GM 指令（需世界管理密码，服务器执行）：/gm <密码> timescale|setday|givegold|giveitem|broadcast ...
const CMD_HELP=[
  '/help                          显示本帮助',
  '/addgold <金额>                给自己加金币',
  '/addcargo <物品id> <数量>      给自己加货物（如 grain、salt、ironware…）',
  '/addmat <类型> <数量>          加升级材料（gear/repair_kit/fuel_tank/engine）',
  '/repair                        车辆耐久修满',
  '/core <等级>                   载具核心直接升到指定等级（附带速度/耐久加成）',
  '/wagon <类型> <等级>           第 1 车厢位装指定车厢（cargo/pass/balanced/engine）',
  '/setrep <城市id> <经验>        设置某城市声望经验（如 greentown 5000）',
  '/stock <城市id> <物品id> <数量> 设置自己在该城该物品的库存',
  '/day <天数>                    本地推进到指定天数（在线由世界天数主导）',
  '/gold                          查看当前金币',
  '/time                          查看服务器时间校准状态（nowMs/clockOffset）',
  '/gm <密码> timescale <0.1~100> 世界时间流速倍率（全服生效，1=正式10分钟/日）',
  '/gm <密码> setday <天数>       设置世界天数（全服生效）',
  '/gm <密码> givegold <玩家> <金额> 给指定玩家发钱（在线存档生效）',
  '/gm <密码> giveitem <玩家> <物品id> <数量> 给指定玩家发物资',
  '/gm <密码> broadcast <消息>    全服跑马灯公告（单机免密：/gm broadcast <消息> 本地演示）',
  '/gm <密码> starfall start|end|next|status|cycle <建设期h> <间隙期h>  星陨城活动：立即开始/结束/进入下一期/查看状态/改周期（单机免密码：/gm starfall start）',
  '/gm <密码> mail <玩家> <金币> <星陨合金>  给指定玩家发奖励邮件（单机免密：/gm mail <金币> <合金> 投递本地测试邮件）'
];
function cmdOut(msg){const el=document.getElementById('cmd-out');if(el){const d=document.createElement('div');d.textContent=msg;el.appendChild(d);el.scrollTop=el.scrollHeight;}}
function runCmd(line){
  if(!line||!line.trim())return cmdOut('❌ 指令有误：未输入任何指令');
  const p=line.trim().split(/\s+/);
  const c=(p[0]||'').toLowerCase();
  const arg=(i,d)=>{const v=parseFloat(p[i]);return isNaN(v)?d:v};
  if(c==='/help'||c==='/h'||c==='help'){CMD_HELP.forEach(x=>cmdOut(x));return;}
  if(c==='/gold'){cmdOut('💰 当前金币：'+GS.gold);return;}
  if(c==='/time'){const off=GS.__clockOffset||0;cmdOut(`🕐 nowMs=${nowMs()} · clockOffset=${off>0?'+':''}${off}ms · 本地=${Date.now()}`);return;}
  if(c==='/addgold'){const n=Math.floor(arg(1,0));GS.gold+=n;cmdOut('💰 +'+n+' 金币 → '+GS.gold);render();return;}
  if(c==='/addcargo'){const it=(p[1]||''),n=Math.floor(arg(2,0));if(!it)return cmdOut('用法：/addcargo <物品id> <数量>');GS.cargo[it]=(GS.cargo[it]||0)+n;cmdOut('📦 +'+n+' '+it+'（现有 '+GS.cargo[it]+'）');render();return;}
  if(c==='/addmat'){const t=(p[1]||''),n=Math.floor(arg(2,0));if(!['gear','repair_kit','fuel_tank','engine','staralloy'].includes(t))return cmdOut('材料类型：gear/repair_kit/fuel_tank/engine/staralloy');GS.materials[t]=(GS.materials[t]||0)+n;cmdOut('🧰 +'+n+' '+t);render();return;}
  if(c==='/repair'){GS.vehicle.durability=getDurabilityMax();cmdOut('🔧 耐久已修满');render();return;}
  if(c==='/core'){const n=Math.floor(arg(1,0));GS.vehicle.core=GS.vehicle.core||{lv:0,speed:0,dura:0};GS.vehicle.core.lv=n;GS.vehicle.core.speed=n;GS.vehicle.core.dura=n;cmdOut('⚙️ 载具核心 → Lv'+n+'（疾驰+'+n+' 速 / 强化+'+n*50+' 耐久）');render();return;}
  if(c==='/wagon'){const t=(p[1]||''),lv=Math.floor(arg(2,1));if(!WAGON_TYPES[t])return cmdOut('车厢类型：cargo/pass/balanced/engine');const slots=GS.vehicle.wagons||[];if(!slots.length)return cmdOut('无车厢位');const s=slots[0];const fit=fitAfterSlot(0,t,lv);if(getUsedCargo()+getTaskCargoUsed()>fit.cap||getPassUsed()+getTaskPassUsed()>fit.pass)return cmdOut('⚠ 现有货物/旅客超出该车厢容量，未装配');s.cur={id:'w'+t+'_'+lv,type:t,lv:lv};s.owned=s.owned||{};s.owned[t+'_'+lv]=true;cmdOut('🚛 第1车厢位已装 '+WAGON_TYPES[t].name+' Lv'+lv);render();return;}
  if(c==='/setrep'){const city=(p[1]||''),exp=Math.floor(arg(2,0));if(!CITIES.some(x=>x.id===city))return cmdOut('未知城市：'+city);GS.reputation[city]=GS.reputation[city]||{level:0,exp:0};const r=GS.reputation[city];r.exp=0;r.level=0;addRep(city,exp);cmdOut('⭐ '+city+' 声望经验='+exp+' → 等级 '+getRepLevel(city));render();return;}
  if(c==='/stock'){const city=(p[1]||''),it=(p[2]||''),n=Math.floor(arg(3,0));if(!city||!it)return cmdOut('用法：/stock <城市id> <物品id> <数量>');GS.cityStocks=GS.cityStocks||{};GS.cityStocks[city]=GS.cityStocks[city]||{};GS.cityStocks[city][it]=n;cmdOut('📦 '+city+' '+it+' 库存 → '+n);render();return;}
  if(c==='/day'){if(ONLINE)return cmdOut('📅 在线模式天数由世界锚点统一驱动，/day 仅离线可用');const n=Math.floor(arg(1,1));GS.day=Math.max(1,n);cmdOut('📅 本地天数 → '+n);render();return;}
  if(c==='/gm'||c==='/admin'){
    const GM_SUB=['timescale','setday','givegold','giveitem','broadcast','starfall','mail'];
    let key=(p[1]||''),sub=(p[2]||'').toLowerCase();
    // v9.9.1：单机模式 starfall 免密码——输入 "/gm starfall start" 时 key 位被误判为子指令名，做一次前移纠偏
    if(!ONLINE&&!GM_SUB.includes(sub)&&GM_SUB.includes(key.toLowerCase())){
      sub=key.toLowerCase();key='';
    }
    const LOCAL_GM=['starfall','mail','broadcast']; // v9.9.1：单机模式免密可用的 GM 子指令
    if(!key&&!LOCAL_GM.includes(sub))return cmdOut('❌ 指令有误：用法：/gm <密码> <指令> …（单机 starfall/mail/broadcast 指令可省略密码）');
    const payload={key:key,cmd:sub};
    if(sub==='timescale'){payload.x=arg(3,1);}
    else if(sub==='setday'){payload.n=Math.floor(arg(3,1));}
    else if(sub==='givegold'){payload.user=(p[3]||'');payload.amt=Math.floor(arg(4,0));}
    else if(sub==='giveitem'){payload.user=(p[3]||'');payload.item=(p[4]||'');payload.qty=Math.floor(arg(5,0));}
    else if(sub==='broadcast'){payload.msg=p.slice(3).join(' ');}
    else if(sub==='starfall'){ // v9.9：星陨城活动 start/end/next；v9.9.1：免密格式下 action 前移到 p[2]；v9.10.2：cycle <建设期h> <间隙期h>
      payload.action=((key?p[3]:p[2])||'').toLowerCase();
      if(payload.action==='cycle'){payload.runH=key?p[4]:p[3];payload.interH=key?p[5]:p[4];}
    }
    else if(sub==='mail'){payload.user=(p[3]||'');payload.gold=Math.floor(arg(4,0));payload.alloy=Math.floor(arg(5,0));} // v9.9：GM 邮件发放
    else return cmdOut('❌ 指令有误：未知 GM 指令 "'+(sub||'<空>')+'"（可用：timescale / setday / givegold / giveitem / broadcast / starfall / mail）');
    if(!ONLINE){
      // v9.9.1：单机模式 starfall/mail/broadcast 免密本地可用（内测）；其余 GM 指令仅在线
      if(sub==='starfall'&&window.Starfall){Starfall.adminCmd(payload.action,cmdOut,payload);return;}
      if(sub==='mail'&&window.Mailbox){
        const g=Math.floor(arg(key?3:2,0)),a=Math.floor(arg(key?4:3,0));
        Mailbox.localDeliver({title:'本地测试邮件',from:'GM',body:'本地投递的测试邮件，可测试已读/领取/删除/满仓清理。',attachments:{gold:g,mats:a>0?{staralloy:a}:{}}});
        cmdOut('📮 已投递本地测试邮件（金币 '+g+'，星陨合金 '+a+'）');
        return;
      }
      if(sub==='broadcast'){
        const msg=(key?p.slice(3):p.slice(2)).join(' ').trim();
        if(!msg)return cmdOut('❌ 指令有误：/gm broadcast <消息>');
        if(window.showBroadcast)showBroadcast(msg);
        cmdOut('📢 已发布公告：'+msg);
        return;
      }
      return cmdOut('❌ 当前为离线模式，GM 指令仅在线可用（starfall/mail/broadcast 子指令单机可用）');
    }
    cmdOut('⏳ 正在执行 GM 指令…');
    NET.post('/api/admin',payload).then(r=>{
      if(r&&r.ok)cmdOut('✅ '+r.msg);
      else cmdOut('❌ '+(r&&r.err?r.err:'执行失败'));
    });
    return;
  }
  cmdOut('❌ 指令有误：未知指令 "'+c+'"（输入 /help 查看可用指令）');
}

// ===== 弹幕聊天室（v7.6 全服聊天） =====
const CHAT={msgs:[],since:0,firstPull:true,histOpen:false,panelOpen:false};
const CHAT_KEY='_chat_history';
function chatStamp(ts){const d=ts?new Date(ts):new Date();const p=n=>(n<10?'0':'')+n;return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
function chatEsc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
// v9.10.3：聊天/弹幕统一渲染——显示昵称（回退用户名），昵称上方显示称号徽章（若有）
function chatTitleHTML(m){return (m&&m.title&&window.Titles)?Titles.badgeHTML(m.title):'';}
// v9.11.4：聊天历史单条消息三行结构——第一行时间戳，第二行称号（独立），第三行昵称〈地点〉：内容
function chatMsgHTML(m){
  const nick=(m&&m.nickname)||(m&&m.user)||'未知';
  const loc=m&&m.loc?chatEsc(m.loc):'';
  const t=chatTitleHTML(m);
  return `<div class="ch-msg">
    <div class="ch-time">[${chatStamp(m&&m.ts)}]</div>
    ${t?`<div class="ch-top">${t}</div>`:''}
    <div class="ch-main"><span class="ch-nick">${chatEsc(nick)}${loc?`<span class="ch-loc">〈${loc}〉</span>`:''}：</span><span class="ch-text">${chatEsc((m&&m.msg)||'')}</span></div>
  </div>`;
}
function danmakuHTML(m){
  const nick=(m&&m.nickname)||(m&&m.user)||'未知';
  const loc=m&&m.loc?chatEsc(m.loc):'';
  const t=chatTitleHTML(m);
  // v9.11.4：弹幕中称号与消息同一行，出现在昵称前面
  return `<div class="dk-text">${t?`<span class="dk-title">${t}</span>`:''}${chatEsc(nick)}${loc?`〈${loc}〉`:''}：${chatEsc((m&&m.msg)||'')}</div>`;
}
// 本地/旧消息补齐昵称与称号（服务端新消息自带 nickname/title 字段）
function chatNorm(m){
  if(!m)return m;
  if(!m.nickname)m.nickname=(GS&&GS.nickname)||m.user||'';
  if(!m.title&&window.Titles)m.title=Titles.equippedId();
  return m;
}
function chatSave(){
  const u=localStorage.getItem(AUTH_KEY);if(!u)return;
  localStorage.setItem(CHAT_KEY+'_'+u,JSON.stringify(CHAT.msgs.slice(-200)));
}
function chatLoad(){
  const u=localStorage.getItem(AUTH_KEY);if(!u)return;
  try{CHAT.msgs=JSON.parse(localStorage.getItem(CHAT_KEY+'_'+u)||'[]');}catch(e){CHAT.msgs=[];}
  if(CHAT.msgs.length){const last=CHAT.msgs[CHAT.msgs.length-1];CHAT.since=last.id||0;}
}
function chatAdd(m,danmaku){
  if(!m)return;
  m=chatNorm(m);
  CHAT.msgs.push(m);if(CHAT.msgs.length>300)CHAT.msgs=CHAT.msgs.slice(-300);
  if(m.id>CHAT.since)CHAT.since=m.id;
  if(danmaku)spawnDanmaku(m);
  if(CHAT.histOpen)renderChatHist();
  chatSave();
}
function spawnDanmaku(m){
  const layer=document.getElementById('danmaku-layer');if(!layer)return;
  const el=document.createElement('div');
  el.className='danmaku';

// 通用可拖动（el=目标元素，handle=拖动手柄；onClick 在无位移的点击时触发；opts.bottomAnchored=保持底部锚定拖动）
function makeDraggable(el,handle,opts){
  let sx=0,sy=0,ox=0,oy=0,drag=false,moved=false;
  handle.addEventListener('mousedown',e=>{
    drag=true;moved=false;sx=e.clientX;sy=e.clientY;
    const r=el.getBoundingClientRect();ox=r.left;oy=r.top;
    e.preventDefault();
  });
  window.addEventListener('mousemove',e=>{
    if(!drag)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!moved&&Math.abs(dx)+Math.abs(dy)>6)moved=true;
    if(opts&&opts.bottomAnchored){
      // v9.11.5：底部锚定元素——保持 bottom 定位，顶部/底部均不越出视口
      const h=el.offsetHeight;
      el.style.left=Math.min(Math.max(0,ox+dx),window.innerWidth-el.offsetWidth)+'px';
      el.style.bottom=Math.min(Math.max(0,window.innerHeight-(oy+dy+h)),Math.max(0,window.innerHeight-h))+'px';
      el.style.top='auto';el.style.right='auto';
    }else{
      el.style.left=Math.min(Math.max(0,ox+dx),window.innerWidth-el.offsetWidth)+'px';
      el.style.top=Math.min(Math.max(0,oy+dy),window.innerHeight-el.offsetHeight)+'px';
      el.style.right='auto';el.style.bottom='auto';
    }
  });
  window.addEventListener('mouseup',()=>{
    if(drag&&!moved&&opts&&opts.onClick)opts.onClick();
    drag=false;
  });
}

// ===== 游戏状态（v9.0：由 state.js 的 State.init() 统一管理） =====
// 注意：不要再在此处定义 const GS = {...} —— 会遮蔽 state.js 创建的响应式 Proxy
// 正式：1 游戏日 = 10 分钟（600000ms）；timeScale 为世界时间流速倍率（GM 指令可调）
function getCurrentGameDay(){const e=(Date.now()-GS.gameStartTime)/(600000/(GS.timeScale||1));return Math.max(1,Math.floor(e)+1)}
// 库存刷新（v7.4 正式）：每【现实 30 分钟】补满——每个玩家库存独立，仅共享刷新节奏（在线以服务器为准）
const STOCK_REFILL_MS=1800000;
function refillStocks(){
  const now=Date.now();
  if(now-(GS.lastStockRefill||0)>=STOCK_REFILL_MS){
    GS.lastStockRefill=now;
    for(let c of CITIES){
      if(!GS.cityStocks[c.id])GS.cityStocks[c.id]={};
      for(let gid of c.goods)GS.cityStocks[c.id][gid]=PURCHASE_LIMITS[c.id]?.[gid]||100;
    }
  }
}
function advanceDay(){
  const nd=getCurrentGameDay();let r=false;
  if(ONLINE){
    if(nd!==GS.day){r=nd>GS.day;State.set('day',nd);}
  }else if(nd>GS.day){State.set('day',nd);r=true}
  refillStocks();
  if(GS.traveling&&Date.now()>=GS.traveling.arrivalTime){
    State.batch(function(){
      var travel = GS.traveling;
      State.set('pendingEvent', travel.pendingEvent||null);
      State.set('location', travel.to);
      State.set('traveling', null);
      State.set('justArrived', true);
      var vs = State.get('visitStamp') || {};
      vs[travel.to] = (vs[travel.to]||0)+1;
      State.set('visitStamp', vs);
    });
    r=true;
  }
  return r;
}
// ===== 车厢系统（v6.10） =====
// 车辆容量/速度/耐久损耗由所挂载的车厢决定；载具等级=车厢位（Lv1=1 → Lv10=10）
// 四类车厢 × 5 级：货运(大货舱但降速)、载客(大旅客仓且略提速)、均衡(两者兼顾+降耗)、动力(大幅提速+降耗)
// 非动力车厢损耗随等级梯度增加（容量越大损耗越高）；费用指数分布（1级几万/4级大几十万/5级小几百万）
const WAGON_TYPES={
  cargo:{name:'货运车厢',icon:'📦',cap:[60,120,200,300,450],pass:[0,0,0,0,0],spd:0.95,dur:[1.2,1.35,1.5,1.65,1.8],hp:[40,70,110,160,230],base:30000,color:'var(--accent)'},
  pass:{name:'载客车厢',icon:'🧳',cap:[0,0,0,0,0],pass:[8,12,16,20,25],spd:1.05,dur:[1.2,1.35,1.5,1.65,1.8],hp:[30,55,85,120,170],base:30000,color:'var(--travel)'},
  balanced:{name:'均衡车厢',icon:'⚖️',cap:[30,60,100,150,220],pass:[4,6,8,10,12],spd:0.97,dur:[1.1,1.22,1.34,1.46,1.58],hp:[35,60,95,140,200],base:45000,color:'var(--green)'},
  engine:{name:'动力车厢',icon:'⚙️',cap:[0,0,0,0,0],pass:[0,0,0,0,0],spd:[1.1,1.2,1.3,1.45,1.6],dur:[0.85,0.75,0.65,0.55,0.45],hp:[25,45,70,100,140],base:60000,color:'var(--gold)'}
};
// 费用梯度（指数分布）：1级几万 → 4级大几十万 → 5级小几百万（货运 base 3万：3万/9万/24万/60万/180万）
const WAGON_COST_MUL=[1,3,8,20,60];
// 每节车厢位独立解锁（v6.12）：{cur:当前装配, owned:已购买车厢集合}
// 已购买的车厢可免费更换装配；未购买的车厢需花金币购买解锁；各车厢位进度互不影响
// 当前装配的车厢（仅统计有效车厢位，避免超槽位旧存档造成容量与 UI 不一致）
function getWagons(){return (GS.vehicle.wagons||[]).slice(0,getWagonSlots()).filter(w=>w&&w.cur).map(w=>w.cur)}
// 装配/卸载后的容量预测（用于更换车厢与卸车时的超载保护）
function fitAfterSlot(i,type,lv){
  let cap=0,pass=0;
  (GS.vehicle.wagons||[]).slice(0,getWagonSlots()).forEach((w,idx)=>{
    if(idx===i||!w||!w.cur)return; // idx===i 将被新装配替换
    cap+=getWagonCap(w.cur);pass+=getWagonPass(w.cur);
  });
  if(type){cap+=getWagonCap({type,lv});pass+=getWagonPass({type,lv});}
  return{cap,pass};
}
// v9.x：车厢更换/卸载不再因任务“硬锁定”，而是在执行操作时做容量合法性校验：
// 若卸下/更换后会导致【玩家货物 + 旅客 + 任务占用】超出新容量，则拒绝并提示。
function wagonKey(type,lv){return type+'_'+lv}
function getOwnedCount(w){return w&&w.owned?Object.keys(w.owned).length:0}
function isOwned(w,type,lv){return !!(w&&w.owned&&w.owned[wagonKey(type,lv)])}
function getWagonSlots(){return Math.max(1,GS.vehicle.level)} // 车厢位=载具等级（Lv1=1、Lv10=10）
function getWagonCap(w){return WAGON_TYPES[w.type].cap[w.lv-1]||0}
function getWagonPass(w){return WAGON_TYPES[w.type].pass[w.lv-1]||0}
function getWagonSpdMul(w){const s=WAGON_TYPES[w.type].spd;return Array.isArray(s)?s[w.lv-1]:s}
function getWagonDurMul(w){return WAGON_TYPES[w.type].dur[w.lv-1]}
// v8.10（C1）：耐久损耗倍率由"全部相乘"改为加权求和（1+Σ(倍率-1)，下限 0.2）。
// 修复全货运车队 1.8^10≈357× 的耐久爆炸；前期单节数值不变，后期"容量高损耗高"梯度仍清晰。
function getWagonDurMulAll(){let mul=1;for(const w of getWagons())mul+=getWagonDurMul(w)-1;return Math.max(0.2,mul)}
function getWagonCost(type,lv){return Math.round(WAGON_TYPES[type].base*WAGON_COST_MUL[lv-1])}
function getVehicleSpeed(){
  let mul=1;for(const w of getWagons())mul*=getWagonSpdMul(w);
  const coreSpeed=GS.vehicle.core?GS.vehicle.core.speed:0; // 载具核心：基础速度加成
  return Math.round((GS.vehicle.speed+coreSpeed)*mul);
}
function getVehicleCapacity(){return getWagons().reduce((s,w)=>s+getWagonCap(w),0)}
// 旅客仓：与货舱独立，物资不可占用旅客仓、旅客同理
function getPassCapacity(){return getWagons().reduce((s,w)=>s+getWagonPass(w),0)}
function getPassUsed(){return GS.vehicle.passengers}
function getUsedCargo(){let s=0;for(let v of Object.values(GS.cargo))s+=v;return s}
// 已接任务占用的容量：deliver 占货舱 qty 格（任务货物），escort 占旅客仓 qty 格（多人）
// 任务货物在任务内管理，不在玩家 cargo 中，无法转移仓库；完成/放弃后自动释放
function getTaskCargoUsed(){return (GS.tasks.active||[]).filter(t=>t.capType==='cargo'&&!t.delivered).reduce((s,t)=>s+t.qty,0)}
function getTaskPassUsed(){return (GS.tasks.active||[]).filter(t=>t.capType==='pass'&&!t.delivered).reduce((s,t)=>s+t.qty,0)}
function getCargoFree(){return getVehicleCapacity()-getUsedCargo()-getTaskCargoUsed()}
function getPassFree(){return getPassCapacity()-getPassUsed()-getTaskPassUsed()}
function wagonRequired(){

// 注：getMaxStock 唯一实现在"库存上限"定义处（含声望加成与顺价收紧）；此处无重复定义（v8.12 清理死代码）

// ===== 车辆耐久系统 =====
// 耐久为点数池：载具升级白值 + 核心强化耐久 + 所有车厢耐久总和
// 载具升级白值：Lv1=100，每级 +20；核心强化：core.dura × 50；车厢：各车厢 hp
function getDurabilityMaxByLevel(lv){return 100+(lv-1)*20}
function getWagonHp(w){return WAGON_TYPES[w.type].hp[w.lv-1]||0}
function getWagonHpAll(){return getWagons().reduce((s,w)=>s+getWagonHp(w),0)}
function getCoreDurability(){return (GS.vehicle.core&&GS.vehicle.core.dura||0)*50}
function getDurabilityMax(){return getDurabilityMaxByLevel(GS.vehicle.level)+getCoreDurability()+getWagonHpAll()}
// 变更耐久上限后刷新：保持当前耐久在 [0, max] 内；added 为新增上限点数（可同步补充当前耐久）
function refreshDurability(added=0){
  var veh = State.get('vehicle') || {};
  veh.durability=Math.max(0,Math.min(getDurabilityMax(),veh.durability+added));
  veh.durabilityMax=getDurabilityMax();
  State.set('vehicle', veh);
}
function normalizeVehicleDurability(){
  var veh = State.get('vehicle') || {};
  const oldMax=veh.durabilityMax||0;
  const newMax=getDurabilityMax();
  if(veh.durability>=oldMax){veh.durability=newMax;}
  else{veh.durability=Math.min(veh.durability,newMax);}
  veh.durabilityMax=newMax;
  State.set('vehicle', veh);
}
function getDurability(){return GS.vehicle.durability}
function getDurabilityPct(){return Math.min(1,GS.vehicle.durability/getDurabilityMax())}
// 损耗率分阶段：耐久越低消耗越快（点/里）；再 × 车厢耐久倍率（非动力车厢掉更快、动力车厢掉更慢）
function getDurabilityRate(){const p=getDurabilityPct();const base=p>0.7?0.5:(p>0.4?0.8:(p>0.2?1.2:1.8));return base*getWagonDurMulAll()}
function calcDurabilityLoss(dist){return Math.round(dist*getDurabilityRate())}
// 耐久状态标签
function getDurabilityState(){
  const p=getDurabilityPct();
  if(p>0.7)return{label:'良好 🟢',cls:''};
  if(p>0.4)return{label:'磨损 ⚠️',cls:'warn'};
  if(p>0.2)return{label:'严重 🟠',cls:'warn'};

}
// 耐久颜色（进度条填充色）
function getDurabilityColor(){

}
// 维修费用：修复量 × 基础单价(60) × 等级系数 × 事件乘数（等级越高越贵；v6.5 货币量级）
function getRepairCost(){
  const need=getDurabilityMax()-GS.vehicle.durability;
  const unit=60,levelFactor=1+(GS.vehicle.level-1)*0.25;
  return Math.round(need*unit*levelFactor*getRepairMult(GS.day));
}

// ===== 操作 =====
// —— 货物批次（数组）：用于同城同次倒卖限制与成本展示 ——
// GS.lots[gid] = [ {city, qty, cost, stamp}, ... ]
// stamp = 买入时该城的"停留批次号"（GS.visitStamp[city]）；离开城市再返回后 stamp 递增，
// 旧批次不再属于"同城同次"，从而消除同城倒卖惩罚。
function migrateLots(){
  var lots = State.get('lots') || {};
  var changed = false;
  for(const gid of Object.keys(lots)){
    const e=lots[gid];
    if(Array.isArray(e))continue;
    const arr=[];
    for(const cid of Object.keys(e||{})){
      if(e[cid]&&e[cid].qty>0)arr.push({city:cid,qty:e[cid].qty,cost:e[cid].cost||0,stamp:0});
    }
    if(arr.length){lots[gid]=arr;changed=true;}
    else{delete lots[gid];changed=true;}
  }
  if(changed)State.set('lots', lots);
}
function addLots(gid,city,qty,cost){
  var lots = State.get('lots') || {};
  var vs = State.get('visitStamp') || {};
  if(!vs[city])vs[city]=1;
  const stamp=vs[city];
  if(!lots[gid])lots[gid]=[];
  const b=lots[gid].find(function(x){return x.city===city&&x.stamp===stamp;});
  if(b){b.cost=Math.round((b.cost*b.qty+cost*qty)/(b.qty+qty));b.qty+=qty;}
  else{lots[gid].push({city:city,qty:qty,cost:cost,stamp:stamp});}
  State.batch(function(){
    State.set('lots', lots);
    State.set('visitStamp', vs);
  });
}
// 判断本次卖出是否触发"同城同次 + 本城买入价<卖出价（顺价可套利）"的 60% 惩罚确认
function getSameVisitArbitrage(gid,qty){
  const arr=GS.lots[gid];
  if(!arr||!arr.length)return null;
  const buy=getDayPrice(GS.location,gid,GS.day)||0;
  const sPrice=getSellPrice(GS.location,gid,GS.day)||0;
  if(!(buy<sPrice))return null; // 非"顺价可套利"（买入价高于等于卖出价）时无惩罚判定
  const curStamp=GS.visitStamp[GS.location];
  let sameQty=0;
  for(const b of arr){if(b.city===GS.location&&b.stamp===curStamp)sameQty+=b.qty;}
  if(sameQty<=0)return null;
  return{sameQty:Math.min(sameQty,qty),buy,sPrice};
}
// 卖出时按批次扣除：同城同次批次受惩罚（顺价套利 60% / 普通 80%），其余批次按正常售价
// 返回 {revenue, sameQty, arbitrage}
function consumeLots(gid,qty){
  const sPrice=getSellPrice(GS.location,gid,GS.day)||0;
  const buy=getDayPrice(GS.location,gid,GS.day)||0;
  const arbitrage=buy<sPrice;
  const curStamp=GS.visitStamp[GS.location];
  let remaining=qty,revenue=0,sameQty=0;
  var lots = State.get('lots') || {};
  const arr = lots[gid] || [];
  for(const b of arr){
    if(remaining<=0)break;
    if(b.city===GS.location&&b.stamp===curStamp){
      const take=Math.min(b.qty,remaining);
      const rate=arbitrage?Math.round(buy*0.6):Math.round(b.cost*0.8);
      revenue+=take*rate;sameQty+=take;b.qty-=take;remaining-=take;
    }
  }
  for(const b of arr){
    if(remaining<=0)break;
    if(b.qty<=0)continue;
    const take=Math.min(b.qty,remaining);
    revenue+=take*sPrice;b.qty-=take;remaining-=take;
  }
  lots[gid]=(arr).filter(function(b){return b.qty>0;});
  if(!lots[gid].length)delete lots[gid];
  State.set('lots', lots);
  return{revenue:revenue,sameQty:sameQty,arbitrage:arbitrage};
}
function buyItem(itemId,qty,opts){
  opts=opts||{};
  if(!opts.skipAdvance)advanceDay();
  if(GS.traveling)return{ok:false,msg:'旅行中不可交易'};
  const city=GS.location,cityObj=getCity(city);
  if(!getBuyableGoods(city).includes(itemId))return{ok:false,msg:'该城不可购买此物资（声望不足或非本城货物）'};
  const price=getDayPrice(city,itemId,GS.day);if(!price)return{ok:false,msg:'价格数据异常'};
  const total=price*qty;
  const taxRate=(window.Tax&&Tax.getRate)?Tax.getRate(getRepLevel(city)):0;
  const tax=(window.Tax&&Tax.calc)?Tax.calc(total,taxRate):0;
  const pay=total+tax;
  // C1：serverLedger 模式（在线服务端已结算）跳过资金/库存/容量校验与资金/货物/库存变更，仅做本地轻记账
  if(!opts.serverLedger){
    if(GS.gold<pay)return{ok:false,msg:'资金不足'};
    const stock=getCurStock(city,itemId);if(qty>stock)return{ok:false,msg:'库存不足'};
    if(getCargoFree()<qty)return{ok:false,msg:'载具容量不足'};
  }
  const oldQty=GS.cargo[itemId]||0,oldCost=GS.buyPrice[itemId]||0;
  const newQty=oldQty+qty;
  const newCost=Math.round((oldCost*oldQty+total)/newQty);
  addLots(itemId,city,qty,price);
  State.batch(function(){
    var buyPrice = State.get('buyPrice') || {};
    buyPrice[itemId] = newCost;
    State.set('buyPrice', buyPrice);
    if(!opts.serverLedger){
      var cargo = State.get('cargo') || {};
      cargo[itemId] = newQty;
      State.set('cargo', cargo);
      var cs = State.get('cityStocks') || {};
      if(!cs[city])cs[city]={};
      cs[city][itemId] = getCurStock(city,itemId)-qty;
      State.set('cityStocks', cs);
    }
  });
  if(!opts.serverLedger)State.set('gold', GS.gold-pay);
  EventBus.emit(EventBus.EVENTS.ITEM_BOUGHT, {itemId:itemId, qty:qty, price:price, total:total, taxRate:taxRate, tax:tax, pay:pay});
  const repGain=qty;
  addRep(city,repGain);
  statAdd('bought',qty);
  if(GS.tutorial&&GS.tutorial.step===1&&ITEMS[itemId].cat==='basic')advanceTutorial(1);
  const taxNote=tax>0?` · 税${fmt(tax)}（${Math.round(taxRate*100)}%）`:'';
  return{ok:true,msg:`购入${qty}件${getItem(itemId).name}${taxNote}${repGain>0?` · ⭐本城声望 +${repGain}`:''}`};
}
function sellItem(itemId,qty,opts){
  opts=opts||{};
  if(!opts.skipAdvance)advanceDay();
  if(GS.traveling)return{ok:false,msg:'旅行中不可交易'};
  const held=GS.cargo[itemId]||0;
  // C1：serverLedger 模式持仓校验已由服务端完成
  if(!opts.serverLedger&&held<qty)return{ok:false,msg:'持有不足'};
  const sPrice=getSellPrice(GS.location,itemId,GS.day);
  if(!sPrice){
    // v9.5：拒收提示（getSellPrice 对拒收物资返回 null）
    if(window.DemandEngine){
      const hubNow=Math.floor(GS.day/CENTRAL_PERIOD);
      const ds=DemandEngine.getDemandState(GS.location,itemId,hubNow);
      if(ds==='reject'){
        const reason=DemandEngine.getRejectReason(GS.location,itemId)||'本城不收购此物资';
        return{ok:false,msg:'本城无人收购：'+reason};
      }
    }
    return{ok:false,msg:'价格异常'};
  }
  // C1：serverLedger 模式的批次结算结果（含惩罚）由调用方在服务端结算前真实计算并传入，此处复用避免二次扣 lots
  const lr = opts.serverLedger ? (opts.lotsResult||{revenue:0,sameQty:0,arbitrage:false}) : consumeLots(itemId,qty);
  const{revenue,sameQty,arbitrage}=lr;
  const city=GS.location;
  const taxRate=(window.Tax&&Tax.getRate)?Tax.getRate(getRepLevel(city)):0;
  const tax=(window.Tax&&Tax.calc)?Tax.calc(revenue,taxRate):0;
  const net=revenue-tax;
  const remaining=held-qty;
  State.batch(function(){
    var buyPrice = State.get('buyPrice') || {};
    if(opts.serverLedger){
      if(!(GS.cargo[itemId]>0))delete buyPrice[itemId];
    }else{
      var cargo = State.get('cargo') || {};
      if(remaining<=0){
        delete cargo[itemId];
        delete buyPrice[itemId];
      }else{
        cargo[itemId]=remaining;
      }
      State.set('cargo', cargo);
    }
    State.set('buyPrice', buyPrice);
  });
  if(!opts.serverLedger)State.set('gold', GS.gold+net);
  EventBus.emit(EventBus.EVENTS.ITEM_SOLD, {itemId:itemId, qty:qty, revenue:revenue, taxRate:taxRate, tax:tax, net:net});
  const repGain=Math.floor(revenue/1000);
  addRep(GS.location,repGain);
  statAdd('sold',qty);statAdd('income',revenue);
  if(GS.tutorial&&GS.tutorial.step===5)advanceTutorial(5);
  const sameNote=sameQty>0?`（其中${sameQty}件同城同次买入按${arbitrage?'当前买入价60%':'买入价80%'}结算）`:'';
  const taxNote=tax>0?` · 税${fmt(tax)}（${Math.round(taxRate*100)}%）`:'';
  return{ok:true,msg:`售出${qty}件${getItem(itemId).name}，得${fmt(net)}金${taxNote}${sameNote}${repGain>0?` · ⭐本城声望 +${repGain}`:''}`};
}
function startTravel(destId){
  advanceDay();if(GS.traveling)return{ok:false,msg:'已在旅行中'};
  if(destId===GS.location)return{ok:false,msg:'已在目标城市'};
  // v9.9：星陨城开放通行（活动面板由 Starfall 模块接管城市界面）
  const sp=shortestPath(GS.location,destId);if(!sp)return{ok:false,msg:'无可用路径'};
  if(getDurability()<=0)return{ok:false,msg:'车辆耐久不足，请先维修'};
  const realSec=Math.round(sp.distance/getVehicleSpeed()*60);
  const durLoss=calcDurabilityLoss(sp.distance);
  // T1：离开接取城市时，为 from===当前城 且未启动的任务启动倒计时（按出发时实际时速快照计算）
  startTaskTimers(GS.location);
  const veh = GS.vehicle;
  State.batch(function(){
    veh.durability = Math.max(0, veh.durability-durLoss);
    State.set('vehicle', veh);
    State.set('traveling', {to:destId,startedAt:Date.now(),arrivalTime:Date.now()+realSec*1000,routeDistance:sp.distance,pendingEvent:rollPrivateEvent(sp,destId)});
  });
  statAdd('travels',1);statAdd('distance',Math.round(sp.distance));
  if(GS.tutorial&&GS.tutorial.step===3)advanceTutorial(3);
  return{ok:true,msg:`出发！${fmt(sp.distance)}里，耐久-${durLoss}点`};
}

// ===== 仓库系统（v6.15：分级解锁 + 指数扩建） =====
// 初始无仓库；按城市阶段分级解锁（新手村 500 / 中期 5000 / 高级 50000），初始 100 格
// 扩建 +50 格/次，费用指数增长：解锁价 × 阶段系数^已扩建次数（新手村×1.5、中期×2~2.5、高级×3，越后期越贵）
function getWhConfig(cityId){
  const st=cityStage(cityId);
  if(st===1)return{unlock:500,coef:1.5};
  if(st===2)return{unlock:5000,coef:2};
  if(st===3)return{unlock:5000,coef:2.5};
  return{unlock:50000,coef:3};
}
function getWhExpandCost(cityId){
  const w=GS.warehouses[cityId];if(!w)return 0;
  const cfg=getWhConfig(cityId);
  return Math.round(cfg.unlock*Math.pow(cfg.coef,w.buildCount||0));
}
function doUnlockWarehouse(){
  if(GS.traveling)return toast('旅行中不可操作','info');
  if(GS.warehouses[GS.location])return toast('本城已有仓库','info');

}
function doExpandWarehouse(){

function doWhIn(itemId,qty){if(GS.traveling)return toast('旅行中不可操作','info');const wh=GS.warehouses[GS.location];if(!wh)return toast('无仓库','err');const held=GS.cargo[itemId]||0;if(qty>held)return;const used=Object.values(wh.items).reduce((a,b)=>a+b,0);if(used+qty>wh.capacity)return toast('仓库满','err');State.batch(function(){var cargo=State.get('cargo')||{};var warehouses=State.get('warehouses')||{};var w=warehouses[GS.location];cargo[itemId]=held-qty;if(cargo[itemId]<=0)delete cargo[itemId];w.items[itemId]=(w.items[itemId]||0)+qty;State.set('cargo',cargo);State.set('warehouses',warehouses);});toast('已存入仓库','ok');render()}

// ===== 升级素材道具（任务系统产出，用于载具升级） =====
const MATERIALS={gear:{name:'精密齿轮',icon:'⚙️'},repair_kit:{name:'维修套件',icon:'🧰'},fuel_tank:{name:'燃油舱',icon:'🛢️'},engine:{name:'引擎核心',icon:'🔩'},staralloy:{name:'星陨合金',icon:'💫'}};
function getMat(id){return MATERIALS[id]||{name:id,icon:'📦'}}

// ===== 城市声望系统（每城独立，长期养成） =====
// GS.reputation:{ [cityId]:{ level, exp } }；获取：本城交易额（买按数量、卖按税收折算）+ 完成本城任务
// 效果：① 逐步解锁该城可购物资类型（REP_GOODS，本城特产）② 提升库存上限（每级+15%）
//      ③ 卖出价差减免（每级+1%）④ 情报所联动：range/高级情报概率/消息条数
// 注：声望为长期养成，升级需求 = tierBase × 2^等级（village 3000 / town 8000 / capital 15000 起步，指数增长）
const REP_GOODS={
  oaktown:{2:['mushroom'],3:['honey']},
  ironfort:{2:['steel_blade']},
  saltbay:{2:['sailcloth'],3:['pearl']},
  purplefield:{2:['cheese'],3:['beer']},
  windoasis:{2:['carpet'],3:['leather']},
  moonvalley:{2:['herb'],3:['moon_crystal']},
  frostfort:{2:['fur'],3:['ginseng']}
};
function getRepLevel(cityId){return GS.reputation[cityId]?GS.reputation[cityId].level:0}
function getRepExp(cityId){return GS.reputation[cityId]?GS.reputation[cityId].exp:0}
// 升级阈值：按城市等级差异，指数增长（v6.5 货币量级放大后同步 ×10）
//   village: Lv1=3000 → Lv2=6000 → ...（新手村低门槛）
//   town:    Lv1=8000 → Lv2=16000 → ... → Lv8=1024000（百万级）
//   capital: Lv1=15000 → ...
function getRepTierBase(cityId){
  const c=getCity(cityId);const t=c?c.tier:'town';
  return t==='village'?3000:(t==='capital'?15000:(t==='special'?10000:8000));
}
function getRepExpNeed(cityId){
  const lv=getRepLevel(cityId);
  return Math.round(getRepTierBase(cityId)*Math.pow(2,lv));
}
function addRep(cityId,exp){
  if(exp<=0)return;
  var rep = State.get('reputation') || {};
  if(!rep[cityId])rep[cityId]={level:0,exp:0};
  const r=rep[cityId];r.exp+=exp;let ups=0;
  while(r.exp>=getRepExpNeed(cityId)){r.exp-=getRepExpNeed(cityId);r.level++;ups++}
  State.set('reputation', rep);
  if(ups>0){statAdd('reps',ups);EventBus.emit(EventBus.EVENTS.REPUTATION_GAIN,{cityId:cityId,level:r.level});toast(`⭐ ${getCityName(cityId)}声望提升至 Lv${r.level}！`,'ok');}
}
// 本城可购物资 = 基础清单 + 声望逐步解锁的本城特产（REP_GOODS）
function getBuyableGoods(cityId){
  const city=getCity(cityId);if(!city)return[];
  const lv=getRepLevel(cityId),set=new Set(city.goods);
  const g=REP_GOODS[cityId];if(g)for(const k of Object.keys(g)){if(Number(k)>lv)g[k].forEach(id=>set.delete(id));}
  return[...set];
}
// 库存上限：基础 ×（1+0.15×声望等级）；本城买入价<卖出价（顺价可套利）时临时收紧库存
function getMaxStock(cityId,itemId){
  const base=PURCHASE_LIMITS[cityId]?.[itemId]||100;
  let cap=Math.round(base*(1+0.15*getRepLevel(cityId)));
  const buy=getDayPrice(cityId,itemId,GS.day),sell=getSellPrice(cityId,itemId,GS.day);
  if(buy!=null&&sell!=null&&buy<sell){
    const gap=(sell-buy)/buy;
    cap=Math.round(cap*(gap>0.1?0.3:0.5)); // 顺价套利：库存上限临时收紧到五成/三成，抑制同城倒卖
  }
  return cap;
}
// 卖出价差减免：每级声望 +1%（视为更熟悉本城市场）
function getRepSellBonus(cityId){return 1+getRepLevel(cityId)*0.01}

// ===== 任务系统（送货 / 送客 · 多任务 · 任务自带货物/旅客） =====
// 每城任务板：抵达城市刷新 5 个任务位（slot）
// 送货：描述显示实际物资，接取后统一为"任务货物"（占货舱 qty 格），无需玩家备货
// 送客：可多人（qty 1~3），占旅客仓 qty 格
// 多任务：车辆容量允许即可接取多个任务
// 接取后任务位不消失，清空内容显示【查看更多任务】按钮，刷新计次继承
// 刷新：每任务位每城免费 2 次，第 3 次起 1000 金并逐次翻倍
// 任务货物/旅客在任务内管理，无法转移仓库；完成或放弃后释放容量
const TASK_RARITY=[
  {id:'common',name:'普通',goldMul:1,repMul:250,color:'var(--text2)'},
  {id:'rare',name:'稀有',goldMul:1.6,repMul:600,color:'var(--travel)'},
  {id:'epic',name:'史诗',goldMul:2.6,repMul:1500,color:'var(--accent)'},
  {id:'legend',name:'传说',goldMul:4.2,repMul:3000,color:'var(--gold)'}
];
// 声望等级 → 稀有度权重表（普通/稀有/史诗/传说），高稀有度低频
const RARITY_TABLE=[
  [0.72,0.25,0.03,0],     // Lv0
  [0.65,0.28,0.06,0.01],  // Lv1
  [0.58,0.30,0.10,0.02],  // Lv2
  [0.50,0.32,0.15,0.03],  // Lv3
  [0.42,0.34,0.19,0.05]   // Lv4+
];
function getRarity(id){return TASK_RARITY.find(r=>r.id===id)||TASK_RARITY[0]}
// 计算当前城市的稀有度权重 [普通, 稀有, 史诗, 传说]（不含不良记录惩罚）
// 稀有度按城市梯度封顶：新手村仅普通/稀有（无史诗传说）、初期无传说、中期起开放传说
function rarityWeights(){
  const st=cityStage(GS.location);
  if(st===1)return[0.72,0.28,0,0];
  if(st===2)return[0.60,0.30,0.10,0];
  let rep=Math.min(4,getRepLevel(GS.location));
  const c=getCity(GS.location);
  if(c&&c.tier==='capital')rep=Math.min(4,rep+1); // 王都基础稀有度更高（更高级的城市有更高级的任务）
  if(st===3)rep=Math.min(3,rep); // 中期最高到 Lv3 档（传说权重 3%）
  return RARITY_TABLE[Math.floor(rep)].slice();
}
function rollRarity(){
  const w=rarityWeights();
  // 24h 不良记录：抑制史诗/传说刷新权重（付费刷新不提高概率，无法被绕开）
  const debuff=TaskBadRecord.getDebuff(TaskBadRecord.getLog(), TaskConfig.TASK_BAD_RECORD_CONFIG);
  if(debuff){w[2]*=debuff.rareWeightMult;w[3]*=debuff.rareWeightMult;}
  const sum=w.reduce(function(a,b){return a+b;},0)||1;
  let r=Math.random()*sum,acc=0;
  for(let i=0;i<TASK_RARITY.length;i++){acc+=w[i];if(r<acc)return TASK_RARITY[i];}
  return TASK_RARITY[0];
}
// 素材产出：稀有 20% / 史诗 45% / 传说 80%；普通任务不产素材
function pickMat(){
  const r=Math.random();
  if(r<0.45)return'gear';
  if(r<0.70)return'repair_kit';
  if(r<0.90)return'fuel_tank';
  return'engine';
}
function rollMat(R){
  if(R.id==='legend')return Math.random()<0.8?[{id:pickMat(),qty:1}]:[];
  if(R.id==='epic')return Math.random()<0.45?[{id:pickMat(),qty:1}]:[];
  if(R.id==='rare')return Math.random()<0.2?[{id:pickMat(),qty:1}]:[];
  return[];
}
// 送客人数：与任务稀有度挂钩（旅游团/大迁徙），高级城市放大人数
//   common 1~3 · rare 4~8 · epic 10~25 · legend 30~60（×城市系数）
//   王都(×2)传说可达 60~120 人（百人团），需高等级载具旅客仓才能接取
function getCityTierMul(cityId){
  const c=getCity(cityId);const t=c?c.tier:'town';
  return t==='capital'?2:(t==='special'?1.5:1);
}
function rollPassQty(R,cityId){
  const mul=getCityTierMul(cityId);
  let n;
  if(R.id==='legend')n=30+Math.floor(Math.random()*31);
  else if(R.id==='epic')n=10+Math.floor(Math.random()*16);
  else if(R.id==='rare')n=4+Math.floor(Math.random()*5);
  else n=1+Math.floor(Math.random()*3);
  return Math.round(n*mul);
}
// 生成任务的限时字段初始值（T1：未离开接取城，不计时）
function rollTask(cityId,seq){
  const R=rollRarity();
  const st=cityStage(cityId);
  // 目的地限制：仅同阶段及下一阶段城市（新手村只出近邻任务，不出长距离）
  const others=CITIES.filter(c=>c.id!==cityId&&!(c.cityType==='special')&&cityStage(c.id)<=Math.min(4,st+1));
  const to=others[Math.floor(Math.random()*others.length)];
  // 任务金币按【城市阶段 × 距离】计酬（v8.11 与跑商并重）：
  //   新手村：100金/里（2~14里 → 200~1400）· 初期：350 · 中期：1000 · 后期：3000
  //   后期传说长距离最高约 75 万金，与跑商一车利润相当——任务与跑商并行成两条收入线
  const unit=[100,350,1000,3000][st-1];
  const ext=[40,80,150,250][st-1]; // 按件附加（deliver 每件；escort 每人 ×5）
  const dist=(shortestPath(cityId,to.id)||{distance:20}).distance;
  const baseGold=Math.round(dist*unit*R.goldMul),rep=R.repMul;
  const mats=rollMat(R);
  const quality=TaskReward.rollQuality(R.id, TaskConfig);
  const urgency=TaskReward.rollUrgency(R.id, TaskConfig);
  const goldMult=TaskReward.qualityMult(quality,TaskConfig)*TaskReward.getUrgency(urgency,TaskConfig).goldMult;
  const id='t'+Date.now()+seq+Math.floor(Math.random()*999);
  const base={
    id:id, rarity:R.id, quality:quality, urgency:urgency,
    from:cityId, to:to.id, dist:dist, rewardRep:rep, rewardMats:mats, delivered:false,
    timerStarted:false, speedSnapshot:null, timeLimitSeconds:null, deadlineTimestamp:null, status:'active'
  };
  if(Math.random()<0.5){
    const goods=getCity(cityId).goods;
    const gid=goods.length?goods[Math.floor(Math.random()*goods.length)]:null;
    if(gid){ // 空货物城（如未开放的特殊城）走送客分支，避免取到 undefined 崩溃
      const qty=5+Math.floor(Math.random()*15);
      const rewardGoldBase=baseGold+qty*ext;
      base.type='deliver';base.capType='cargo';base.item=gid;base.qty=qty;
      base.rewardGoldBase=rewardGoldBase;
      base.rewardGold=Math.floor(rewardGoldBase*goldMult);
      base.rewardRep=rep+Math.floor(qty/2);
      base.desc=`运送${getItem(gid).icon}${getItem(gid).name}×${qty}至${getCityName(to.id)}（${dist}里）`;
      return base;
    }
  }
  const pq=rollPassQty(R,cityId); // 送客人数按稀有度+城市等级（按人计酬 ext×5/人）
  const rewardGoldBase=baseGold+pq*ext*5;
  base.type='escort';base.capType='pass';base.item=null;base.qty=pq;
  base.rewardGoldBase=rewardGoldBase;
  base.rewardGold=Math.floor(rewardGoldBase*goldMult);
  base.desc=`护送${pq}位商客至${getCityName(to.id)}（${dist}里 · 占旅客仓${pq}格）`;
  return base;
}
// 旧存档任务补齐新字段（quality 默认 C，rewardGoldBase 缺失时回退 rewardGold）
function normalizeTask(t){
  if(!t)return t;
  if(!t.quality)t.quality='C';
  if(!t.urgency)t.urgency='standard';
  if(t.rewardGoldBase==null)t.rewardGoldBase=t.rewardGold||0;
  if(t.rewardGold==null)t.rewardGold=Math.floor(t.rewardGoldBase*TaskReward.qualityMult(t.quality,TaskConfig)*TaskReward.getUrgency(t.urgency,TaskConfig).goldMult);
  if(t.timerStarted==null)t.timerStarted=false;
  if(t.speedSnapshot==null)t.speedSnapshot=null;
  if(t.timeLimitSeconds==null)t.timeLimitSeconds=null;
  if(t.deadlineTimestamp==null)t.deadlineTimestamp=null;
  if(t.status==null)t.status='active';
  return t;
}
function normalizeTasksState(){

// v9.4：任务时间权威——在线模式以服务器时间校准（serverNow → clockOffset），单机使用本地时间
function nowMs(){return Date.now() + (GS.__clockOffset || 0)}
// v9.4：严重超时自动失败（到点即失败，含离线上线结算）
// 遍历已启动计时的任务：now > deadline + 宽限 → 执行失败结算（扣罚金、计不良记录、移除任务、汇总提示）
function settleOverdueTasks(){
  const now = nowMs();
  const grace = TaskConfig.TASK_TIME_CONFIG.LATE_GRACE_SECONDS * 1000;
  var tasks = State.get('tasks') || {};
  var act = tasks.active || [];
  const overdue = act.filter(function(t){ return t.timerStarted && t.deadlineTimestamp && now > t.deadlineTimestamp + grace; });
  if(!overdue.length) return;
  const cfg = TaskConfig.TASK_PENALTY_CONFIG;
  let totalPenalty = 0;
  const ids = new Set();
  for(const t of overdue){
    const penalty = Math.max(Math.round((t.rewardGoldBase || t.rewardGold || 0) * cfg.PENALTY_GOLD_RATE), cfg.MIN_PENALTY_GOLD);
    // v9.8：欠债系统——罚金全额累计，可扣成负数
    totalPenalty += penalty;
    TaskBadRecord.record('fail', now, TaskConfig.TASK_BAD_RECORD_CONFIG);
    ids.add(t.id);
  }
  tasks.active = act.filter(function(t){ return !ids.has(t.id); });
  State.batch(function(){
    State.set('gold', GS.gold - totalPenalty);
    State.set('tasks', tasks);
  });
  const badCount = TaskBadRecord.count(TaskBadRecord.getLog());
  const debuff = TaskBadRecord.getDebuff(TaskBadRecord.getLog(), TaskConfig.TASK_BAD_RECORD_CONFIG);
  let msg = `❌ ${overdue.length} 个任务严重超时失败！共扣除违约金 ${fmt(totalPenalty)} 金币 · 24h 违约记录 ${badCount} 次`;
  if(debuff) msg += ` · 任务金币×${debuff.goldMult}，史诗/传说刷新×${debuff.rareWeightMult}`;
  toast(msg, 'err');
  saveNow();
}
// T1：离开接取城市时启动相关任务倒计时（按出发时实际时速快照计算，之后换车厢不回改时限）
function startTaskTimers(fromCityId){
  var tasks = State.get('tasks') || {};
  var changed = false;
  const speed = getVehicleSpeed();
  for(const t of (tasks.active||[])){
    if(t.timerStarted) continue;
    if(t.from !== fromCityId) continue;
    const dist = (shortestPath(t.from, t.to)||{distance:0}).distance;
    const urgMult = TaskReward.getUrgency(t.urgency||'standard', TaskConfig).timeMult;
    const timeLimit = TaskTimer.computeTimeLimit(dist, speed, TaskConfig.TASK_TIME_CONFIG, urgMult);
    t.timerStarted = true;
    t.speedSnapshot = speed;
    t.timeLimitSeconds = timeLimit;
    t.deadlineTimestamp = TaskTimer.computeDeadline(nowMs(), timeLimit);
    t.status = 'active';
    changed = true;
  }
  if(changed) State.set('tasks', tasks);
}
// 秒数 → X分X秒 / X秒
function fmtClock(s){
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s/60), sec = s%60;
  return m>0 ? `${m}分${sec}秒` : `${sec}秒`;
}
// 计算单个任务的倒计时展示状态（初始渲染与每秒刷新共用，避免口径漂移）
function taskCdState(t, now){
  if(!t.timerStarted || !t.deadlineTimestamp){
    return {text:`时限：${taskTimeLimitMinutes(t)} 分钟（未出发，不计时）`, cls:'', pct:null};
  }
  const status = TaskTimer.resolveStatus(now, t.deadlineTimestamp, TaskConfig.TASK_TIME_CONFIG.LATE_GRACE_SECONDS);
  const remain = TaskTimer.remainingSeconds(now, t.deadlineTimestamp);
  const total = t.timeLimitSeconds || 1;
  const pct = Math.max(0, Math.min(1, remain/total));
  let text, cls;
  if(status==='ontime'){
    if(pct>0.6){text=`⏱️ ${fmtClock(remain)} · 🟢 时间充裕`;cls='cd-ok';}
    else if(pct>0.3){text=`⏱️ ${fmtClock(remain)} · 🟡 时间适中`;cls='cd-ok';}
    else if(pct>0.1){text=`⏱️ ${fmtClock(remain)} · 🟠 即将到期`;cls='cd-warn';}
    else{text=`⏱️ ${fmtClock(remain)} · 🔴 紧急`;cls='cd-danger';}
  }else if(status==='late'){
    const over = Math.max(0, Math.ceil((now - t.deadlineTimestamp)/1000));
    text=`⚠️ 已延误 ${over} 秒 · 仅30%金币`;cls='cd-danger';
  }else{
    text='❌ 已失效（严重超时）';cls='cd-dead';
  }
  return {text:text, cls:cls, pct:status==='ontime'?pct:0};
}

// 生成任务卡（mode='active' 已接 / 'open' 可接；open 需传 slotId 用于刷新/接取）

  const act=GS.tasks.active||[];

  const badLog=TaskBadRecord.getLog();
  const badCount=TaskBadRecord.count(badLog);
  const debuff=TaskBadRecord.getDebuff(badLog, TaskConfig.TASK_BAD_RECORD_CONFIG);
  let badWarn='';
  if(badCount>0){
    if(debuff){
      badWarn=`<div class="task-bad-warn">⚠️ 24h 违约记录 ${badCount} 次：任务金币 ×${debuff.goldMult} · 史诗/传说刷新权重 ×${debuff.rareWeightMult}</div>`;

      badWarn=`<div class="task-bad-info">📋 24h 违约记录 ${badCount} 次（放弃/超时；累计达 10/20/30 时任务收益下降、高级任务刷新率降低）</div>`;
    }
  }
  // 上层：已接任务（多任务，无任务也保留高度占位）
  const upper=act.length
    ?`<div class="task-board-active">${act.map(t=>taskCardHtml(t,'active')).join('')}</div>`
    :`<div class="task-board-active task-active-empty">📌 暂无进行中的任务，可在下方任务板接取</div>`;
  // 下层：任务位（任务卡 / 查看更多）
  const rows=GS.tasks.board.map(slot=>{
    if(slot.state==='empty'){

  return `<div class="station-panel"><h3>📋 任务板 <span style="font-size:12px;color:var(--text2)">抵达${getCityName(GS.location)}刷新 · 每任务免费刷新2次</span></h3>

  ${legend}

  ${upper}
  <div class="task-divider"></div>
  <div class="task-section-label">📋 城市内可接任务（5）</div>
  ${grid}

}

// ===== 载具升级（金币 + 素材；v6.8 只加车厢位 + 耐久上限） =====
// 车厢位：Lv1=1、每级 +1（Lv10=10）；耐久上限每级 +20；消耗机制不变（金币+素材）
function getUpgradeCost(){
  const lv=GS.vehicle.level;
  return{gold:4000*lv*lv,gear:Math.ceil(lv/2),repair_kit:lv>=2?Math.floor((lv-1)/2):0};
}
function doUpgradeVehicle(){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const lv=GS.vehicle.level,cost=getUpgradeCost();
  if(GS.gold<cost.gold)return toast('资金不足，升级需 '+fmt(cost.gold)+' 金币','err');
  if((GS.materials.gear||0)<cost.gear)return toast('精密齿轮不足，完成本城任务可获得','err');
  if((GS.materials.repair_kit||0)<cost.repair_kit)return toast('维修套件不足，完成本城任务可获得','err');
  const newSlots=getWagonSlots()+1;
  const oldMax=getDurabilityMax(),newMax=getDurabilityMaxByLevel(lv+1)+getCoreDurability()+getWagonHpAll();
  showModal('🚛 载具升级',
    `升级至 Lv${lv+1}\n车厢位 ${getWagonSlots()} → ${newSlots} · 耐久上限 ${oldMax} → ${newMax}\n消耗：${fmt(cost.gold)} 金币 · ⚙️精密齿轮×${cost.gear}${cost.repair_kit?' · 🧰维修套件×'+cost.repair_kit:''}`,
    '确认升级',()=>{
      var veh = GS.vehicle;
      veh.level++;
      while(veh.wagons.length<getWagonSlots())veh.wagons.push({cur:null,owned:{}});
      veh.durability=getDurabilityMax();veh.durabilityMax=getDurabilityMax();
      var mats = State.get('materials') || {};
      mats.gear = (mats.gear||0) - cost.gear;
      mats.repair_kit = (mats.repair_kit||0) - cost.repair_kit;
      State.batch(function(){
        State.set('vehicle', veh);
        State.set('materials', mats);
      });
      State.set('gold', GS.gold-cost.gold);
      statAdd('upgrades',1);
      toast('🚛 载具升级成功！车厢位 +1 · 耐久上限 +20','ok');render();
    });
}

// 步骤推进：仅当当前步骤匹配时前进（顺序教学）
function advanceTutorial(n){
  if(!GS.tutorial||GS.tutorial.step!==n)return;
  var tut = State.get('tutorial') || {};
  tut.step = n+1;
  if(tut.step>=6){tut.step=6;toast('🎓 新手教程完成！愿商路顺遂','ok');if(window.Titles)Titles.unlock('novice');} // v9.10.3：完成教程送称号「新手上路」
  else toast(`✅ 完成「${TUTORIAL_STEPS[n].title}」，下一步：${TUTORIAL_STEPS[tut.step].title}`,'ok');
  State.set('tutorial', tut);
  saveNow();
}
function startTutorial(){var tut=State.get('tutorial')||{step:0};tut.step=1;State.set('tutorial',tut);render();toast('🎓 新手引导开始：购买基础物资','ok');}
function skipTutorial(){var tut=State.get('tutorial')||{step:0};tut.step=6;State.set('tutorial',tut);render();if(window.Titles)Titles.unlock('novice');toast('已跳过新手引导，可在任意城市自由探索','info');}
function goTutorial(){
  const s=TUTORIAL_STEPS[GS.tutorial.step];
  if(s&&s.tab){const b=document.querySelector('nav button[data-tab="'+s.tab+'"]');if(b)b.click();}
}
function renderTutorial(){
  // v8.19：step 缺失/非数字一律视为已完成（不显示教程），防止服务器旧档/异常结构导致教程复现
  const st=GS.tutorial&&typeof GS.tutorial.step==='number'?GS.tutorial.step:6;
  if(st>=6)return '';
  if(st===0)return `<div class="tutorial-panel"><div class="tut-head">🎓 新手引导</div>
    <div class="tut-body">欢迎来到全王国！跟随 5 步学会跑商：<b>买物资 → 接任务 → 前往目的地 → 完成任务 → 卖物资</b></div>
    <div class="tut-btns"><button class="btn btn-primary" onclick="startTutorial()">🚀 开始引导</button></div></div>`;
  const s=TUTORIAL_STEPS[st];
  const steps=TUTORIAL_STEPS.slice(1).map((x,i)=>`<span class="tut-step ${i+1<st?'tut-done':(i+1===st?'tut-cur':'')}">${i+1<st?'✔':x.icon} ${x.title}</span>`).join('');
  return `<div class="tutorial-panel"><div class="tut-head">🎓 新手引导 <span class="tut-progress">${st}/5</span></div>
    <div class="tut-body"><b>${s.icon} ${s.title}</b>：${s.desc}</div>
    <div class="tut-btns"><button class="btn btn-primary" onclick="goTutorial()">${s.btn}</button><button class="btn" onclick="skipTutorial()">跳过教程</button></div>
    <div class="tut-steps">${steps}</div></div>`;
}

function replaceWagon(i){
  if(GS.traveling)return toast('旅行中不可操作','info');

function buyWagon(i,type,lv){
  if(i<0||i>=getWagonSlots())return toast('车厢位不存在','err');
  var veh = State.get('vehicle') || {};
  veh.wagons = veh.wagons || [];
  const slot=veh.wagons[i]||{cur:null,owned:{}};
  if(!veh.wagons[i])veh.wagons[i]=slot;
  const key=wagonKey(type,lv);
  const fit=fitAfterSlot(i,type,lv);
  const req=wagonRequired();
  if(req.cargo>fit.cap)return showModal('🚫 无法更换车厢','货舱空间不足。\n\n'+wagonFitMsg(req,fit),'知道了',()=>{});
  if(req.pass>fit.pass)return showModal('🚫 无法更换车厢','旅客仓空间不足。\n\n'+wagonFitMsg(req,fit),'知道了',()=>{});
  const hp=WAGON_TYPES[type].hp[lv-1]||0;
  if(isOwned(slot,type,lv)){
    slot.cur={id:'w'+Date.now()+i,type,lv};
    veh.wagons[i] = slot;
    State.set('vehicle', veh);
    refreshDurability(hp);
    document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
    toast(`✔ 免费装配 ${WAGON_TYPES[type].name} Lv${lv}（已解锁）`,'ok');render();
    return;
  }
  const cost=getWagonCost(type,lv);
  if(GS.gold<cost)return toast('资金不足，解锁需 '+fmt(cost)+' 金币','err');
  slot.owned=slot.owned||{};slot.owned[key]=true;
  slot.cur={id:'w'+Date.now()+i,type,lv};
  veh.wagons[i] = slot;
  State.set('vehicle', veh);
  State.set('gold', GS.gold-cost);
  refreshDurability(hp);
  statAdd('upgrades',1);
  document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
  toast(`已解锁并装配 ${WAGON_TYPES[type].name} Lv${lv}`,'ok');render();
}

function unloadWagon(i){

function openCoreUpgrade(){
  if(GS.traveling)return toast('旅行中不可操作','info');
  var veh = State.get('vehicle') || {};
  veh.core = veh.core || {lv:0,speed:0,dura:0};
  const core=veh.core;
  const n=core.lv+1;
  const has=(m)=>GS.materials[m]||0;
  showChoice('⚙️ 载具核心',
    `核心 Lv${core.lv}（升级材料随次数递增，当前需 ×${n}）\n当前加成：疾驰 +${core.speed} 速 · 强化 +${core.dura*50} 耐久\n\n持有：🧰维修套件${has('repair_kit')} · 🛢️燃油舱${has('fuel_tank')} · 🔩引擎核心${has('engine')}`,
    `⚡ 疾驰（基础速度+1：🛢️×${n} + 🔩×${n}）`,
    `🛡 强化（耐久上限+50：🧰×${n} + 🔩×${n}）`,
    ()=>{
      if(has('fuel_tank')<n||has('engine')<n)return toast('材料不足，完成高稀有度任务可获得','err');
      var mats = State.get('materials') || {};
      mats.fuel_tank -= n; mats.engine -= n;
      veh.core.lv++; veh.core.speed++;
      State.batch(function(){
        State.set('vehicle', veh);
        State.set('materials', mats);
      });
      statAdd('upgrades',1);
      toast('⚡ 载具核心升级：基础速度 +1','ok');render();
    },
    ()=>{
      if(has('repair_kit')<n||has('engine')<n)return toast('材料不足，完成高稀有度任务可获得','err');
      var mats2 = State.get('materials') || {};
      mats2.repair_kit -= n; mats2.engine -= n;
      veh.core.lv++; veh.core.dura++;

      });
      refreshDurability(50);
      statAdd('upgrades',1);
      toast('🛡 载具核心升级：耐久上限 +50','ok');render();
    }
  );
}

function getNearbyCities(loc,range){
  if(range<=0)return[];
  const graph=buildGraph(),q=[{id:loc,d:0}],vis=new Set([loc]),out=[];
  while(q.length){const{id,d}=q.shift();if(d>=1&&d<=range)out.push(id);for(let v in graph[id]){if(!vis.has(v)&&d+1<=range){vis.add(v);q.push({id:v,d:d+1})}}}
  return out;
}

  const hist=getPriceHistory(cid,gid,30);
  if(hist.length>1){
    const avg=hist.reduce((a,h)=>a+h.price,0)/hist.length;
    const diff=(price-avg)/avg;
    trend=diff>0.08?'一路上涨':(diff<-0.08?'一路下跌':'不温不火');
  }
  const tpl=INTEL_TEMPLATES[Math.floor(Math.random()*INTEL_TEMPLATES.length)];
  return{cls:'intel',text:fillTpl(tpl,{city:getCityName(cid),item:it.name,icon:it.icon,price:fmt(price),sell:fmt(sell),trend})};
}
// —— 打听消息：生成一条情报（数量/概率/范围随本城声望扩展）——
// v9.11.6：返回 {msgs, evs}——evs 为本条消息中新获得的事件（供 doAskIntel 汇总弹窗）
function generateIntelMessages(){
  // v9.11.9：本城已抽事件去重——离开本城前，抽到过的事件不再重复出现（到达新城市时清空）
  if(!GS.intel.drawn)GS.intel.drawn={};
  const drawn=GS.intel.drawn;
  const range=getIntelRange();
  const nearby=[GS.location,...getNearbyCities(GS.location,range)];
  const ups=getUpcomingEvents().filter(ev=>(ev.scope==='global'||ev.scope==='cost'||nearby.includes(ev.city))&&!drawn[ev.id+':'+ev.startHub]);
  const acts=getActiveEvents().filter(ev=>ev.scope!=='global'&&ev.scope!=='cost'&&nearby.includes(ev.city)&&!drawn[ev.id+':'+ev.startHub]);
  // v9.11.8：事件概率平衡——保持"小概率惊喜"：事件总概率 8%（0 声望）→ 20%（声望 10 级封顶），
  //           物价情报仍保持常见（每类事件独立区间，不互相挤占）
  const rep=getRepLevel(GS.location);
  const pBest=Math.min(0.08,0.03+rep*0.005); // 预告事件：3% → 8%
  const pRare=Math.min(0.12,0.05+rep*0.007); // 进行中事件：5% → 12%
  const r=Math.random();
  if(ups.length>0&&r<pBest){
    const ev=ups[Math.floor(Math.random()*ups.length)];
    drawn[ev.id+':'+ev.startHub]=true; // v9.11.9：本城已抽记录
    const fresh=markEventKnown(ev);
    const city=ev.city?getCityName(ev.city):'全王国';
    const tpl=INTEL_UPCOMING_TPL[Math.floor(Math.random()*INTEL_UPCOMING_TPL.length)];
    return{msgs:[{cls:'intel best',text:fillEvTpl(tpl,{city,evname:ev.name,evicon:ev.icon})}],evs:fresh?[ev]:[]};
  }
  // v9.11.8：补 r>=pBest——无预告事件（ups 空）时进行中事件按独立区间 pRare 抽，避免区间重叠虚高
  if(acts.length>0&&r>=pBest&&r<pBest+pRare){
    const ev=acts[Math.floor(Math.random()*acts.length)];
    drawn[ev.id+':'+ev.startHub]=true; // v9.11.9：本城已抽记录
    const fresh=markEventKnown(ev);
    const action=ev.target==='sell'?'出货':'进货';
    const tpl=INTEL_ACTIVE_TPL[Math.floor(Math.random()*INTEL_ACTIVE_TPL.length)];
    return{msgs:[{cls:'intel rare',text:fillEvTpl(tpl,{city:getCityName(ev.city),evname:ev.name,evicon:ev.icon,action})}],evs:fresh?[ev]:[]};
  }
  return{msgs:[genPriceIntel(nearby)],evs:[]};
}
function doAskIntel(){
  if(!isIntelUnlocked(GS.location))return toast('请先解锁本城情报所','err');
  if(GS.traveling)return toast('旅行中不可操作','info');
  if(GS.gold<MSG_COST)return toast('资金不足，打听消息需 '+fmt(MSG_COST)+' 金币','err');
  State.set('gold', GS.gold-MSG_COST);
  // 本城声望每 5 级 +1 条消息
  const count=1+Math.floor(getRepLevel(GS.location)/5);
  let got=[];
  for(let i=0;i<count;i++){
    const r=generateIntelMessages();
    for(const m of r.msgs)GS.intel.log.push(m);
    if(r.evs&&r.evs.length)got=got.concat(r.evs);
  }
  render();
  if(got.length)showEventIntelPopup(got); // v9.11.6：抽出事件 → 记录到事件列表的同时弹窗告知
}
// v9.11.6：情报所抽出事件 → 弹窗告知玩家获得了哪些事件信息（已记录到事件列表）
function showEventIntelPopup(evs){
  const rows=evs.map(ev=>{
    const st=getEventStatus(ev);
    const city=ev.city?getCityName(ev.city):'全王国';
    const desc=getPublicDesc(ev);
    const stTxt=st?st.label:'';
    return `<div class="intel-pop-ev">
      <div class="intel-pop-head"><span class="intel-pop-name">${ev.icon} ${ev.name}</span><span class="intel-pop-city">〈${city}〉</span>${stTxt?`<span class="intel-pop-st ${st.cls}">${stTxt}</span>`:''}</div>
      <div class="intel-pop-desc">${desc}</div>
      <div class="intel-pop-link" onclick="showEventDetail('${ev.id}')">查看详情 ›</div>
    </div>`;
  }).join('');
  showModal('🔍 情报所 · 获得事件情报',
    `<div class="intel-pop">${rows}<div class="intel-pop-note">事件信息已记录到事件列表，可在页面上方横幅随时查看。</div></div>`,
    '知道了');
}
function renderIntel(){
  const unlocked=isIntelUnlocked(GS.location),range=getIntelRange(),near=getNearbyCities(GS.location,range);
  let body='';
  if(!unlocked){
    body=`<div class="empty">本城酒馆掌柜愿为你留意四方风声\n解锁本城情报所后可向酒馆打听消息，获得物价与事件情报</div>`;
  }else{
    const log=GS.intel.log||[];
    body=`<div class="intel-chat">`+
      (log.length?[...log].reverse().map(m=>`<div class="chat-msg ${m.cls}">${m.text}</div>`).join(''):`<div class="chat-msg sys">还没有消息，向酒馆打听打听吧。</div>`)+
      `</div>`;
  }
  return `<div class="station-panel"><h3>🔍 情报所 <span style="font-size:12px;color:var(--text2)">${unlocked?`本城已解锁 · 范围 Lv${range}`:'本城未解锁'}</span></h3>
  <div class="station-grid">

      <button class="btn station-btn" style="background:${unlocked?'var(--card)':'var(--accent)'};color:${unlocked?'var(--text)':'#111'}" onclick="${unlocked?'doAskIntel()':'doUnlockIntel()'}">${unlocked?'🍺 打听消息 '+fmt(MSG_COST)+' 金':'💰 解锁本城情报所 '+fmt(INTEL_COST)+' 金'}</button></div>
    <div class="station-card"><div class="sc-label">情报来源</div><div class="sc-val" style="font-size:13px">酒馆打听 · 商旅消息</div><div class="sc-label" style="margin-top:4px">本城声望提升后可获得更珍贵的情报</div></div>
    <div class="station-card"><div class="sc-label">情报范围</div><div class="sc-val">${unlocked?`Lv${range} · 周边${near.length}城`:'—'}</div><div class="sc-label" style="margin-top:4px">本城每3级声望 +1 范围，每5级 +1 条消息</div></div>
  </div>
  ${body}
  </div>`;
}
