// 更换车厢：两级选择（先类型 → 再等级）；已购买的车厢免费装配，未购买需金币解锁（每节独立）
function replaceWagon(i){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const w=GS.vehicle.wagons[i]||{cur:null,owned:{}};
  let opts='';
  for(const[type,T]of Object.entries(WAGON_TYPES)){
    const caps=[];const c=T.cap[0],p=T.pass[0];
    if(c>0)caps.push(`货舱${c}起`);
    if(p>0)caps.push(`旅客${p}起`);
    caps.push(`损耗${T.dur[0]}~${T.dur[4]}`);
    const hasType=Object.keys(w.owned||{}).some(k=>k.startsWith(type+'_'));
    opts+=`<div class="wagon-cat" style="border-color:${T.color}" onclick="showWagonLevels(${i},'${type}')"><span style="font-size:20px">${T.icon}</span><span style="flex:1"><span style="color:${T.color}">${T.name}${hasType?' <span style="font-size:10px;color:var(--green)">✔ 已解锁</span>':''}</span><br><span style="font-size:11px;color:var(--text3);font-weight:600">${caps.join(' · ')}</span></span><span class="wc-arrow" style="color:${T.color}">›</span></div>`;
  }
  showModal('🚂 选择车厢类型（已解锁的免费装配）',opts,'关闭',()=>{});
}
function showWagonLevels(i,type){
  if(GS.traveling)return toast('旅行中不可操作','info');
  const T=WAGON_TYPES[type];
  const w=GS.vehicle.wagons[i]||{cur:null,owned:{}};
  let opts=`<div class="wagon-cat" onclick="backToWagonTypes(${i})"><span style="font-size:16px">↩</span><span style="flex:1">返回类型选择</span><span class="wc-arrow">‹</span></div>`;
  for(let lv=1;lv<=5;lv++){
    const cost=getWagonCost(type,lv);
    const caps=[];const c=T.cap[lv-1],p=T.pass[lv-1],sp=Array.isArray(T.spd)?T.spd[lv-1]:T.spd,du=T.dur[lv-1];
    if(c>0)caps.push(`货舱${c}`);
    if(p>0)caps.push(`旅客${p}`);
    if(Array.isArray(T.spd))caps.push(`时速×${sp}`);
    else if(sp!==1)caps.push(`时速×${sp}`);
    caps.push(`损耗×${du}`);
    caps.push(`耐久+${T.hp[lv-1]}`);
    const owned=isOwned(w,type,lv);
    const curFlag=w.cur&&w.cur.type===type&&w.cur.lv===lv?'（当前）':'';
    opts+=`<div class="wagon-opt" onclick="buyWagon(${i},'${type}',${lv})"><span class="wo-lv">Lv${lv}</span><span>${caps.join(' · ')}</span><span class="wo-price" style="color:${owned?'var(--green)':'var(--gold)'}">${owned?'✔ 免费装配'+curFlag:fmt(cost)+' 金解锁'}</span></div>`;

// v8.21：返回车厢类型选择——先移除当前等级面板再打开类型面板，避免 showModal 叠加导致"又生成一个面板"
function backToWagonTypes(i){
  document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
  replaceWagon(i);
}
function buyWagon(i,type,lv){
  if(i<0||i>=getWagonSlots())return toast('车厢位不存在','err');
  var veh = State.get('vehicle') || {};
  veh.wagons = veh.wagons || [];
  const slot=veh.wagons[i]||{cur:null,owned:{}};
  if(!veh.wagons[i])veh.wagons[i]=slot;
  const key=wagonKey(type,lv);
  const fit=fitAfterSlot(i,type,lv);
  const req=wagonRequired();
  if(req.cargo>fit.cap)return showModal('🚫 无法更换车厢','货舱空间不足。\n\n'+wagonFitMsg(req,fit),'知道了',()=>{});
  if(req.pass>fit.pass)return showModal('🚫 无法更换车厢','旅客仓空间不足。\n\n'+wagonFitMsg(req,fit),'知道了',()=>{});
  const hp=WAGON_TYPES[type].hp[lv-1]||0;
  if(isOwned(slot,type,lv)){
    slot.cur={id:'w'+Date.now()+i,type,lv};
    veh.wagons[i] = slot;
    State.set('vehicle', veh);
    refreshDurability(hp);
    document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
    toast(`✔ 免费装配 ${WAGON_TYPES[type].name} Lv${lv}（已解锁）`,'ok');render();
    return;
  }
  const cost=getWagonCost(type,lv);
  if(GS.gold<cost)return toast('资金不足，解锁需 '+fmt(cost)+' 金币','err');
  slot.owned=slot.owned||{};slot.owned[key]=true;
  slot.cur={id:'w'+Date.now()+i,type,lv};
  veh.wagons[i] = slot;
  State.set('vehicle', veh);
  State.set('gold', GS.gold-cost);
  refreshDurability(hp);
  statAdd('upgrades',1);
  document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
  toast(`已解锁并装配 ${WAGON_TYPES[type].name} Lv${lv}`,'ok');render();
}
// 卸下车厢（仅解除装配，解锁进度保留；载具必须保留至少一个已装配车厢）
function unloadWagon(i){
  if(GS.traveling)return toast('旅行中不可操作','info');
  if(getWagons().length<=1)return showModal('🚫 无法卸下车厢','载具必须保留至少一个已装配车厢。','知道了',()=>{});
  var veh = State.get('vehicle') || {};
  veh.wagons = veh.wagons || [];
  const w=veh.wagons[i];
  if(!w||!w.cur)return;
  const fit=fitAfterSlot(i);
  const req=wagonRequired();
  if(req.cargo>fit.cap)return showModal('🚫 无法卸下车厢','货舱空间不足。\n\n'+wagonFitMsg(req,fit),'知道了',()=>{});
  if(req.pass>fit.pass)return showModal('🚫 无法卸下车厢','旅客仓空间不足。\n\n'+wagonFitMsg(req,fit),'知道了',()=>{});
  w.cur=null;
  veh.wagons[i] = w;
  State.set('vehicle', veh);
  refreshDurability(0);
  toast('车厢已卸下（已解锁的车厢保留，可免费重新装配）','info');render();
}

    `⚡ 疾驰（基础速度+1：🛢️×${n} + 🔩×${n}）`,

// 解锁后可在本城向酒馆打听消息：1000 金币/条，聊天式返回

function isIntelUnlocked(cityId){return !!GS.intel.unlocked[cityId]}
function getIntelRange(){return isIntelUnlocked(GS.location)?1+Math.floor(getRepLevel(GS.location)/3):0}
function getNearbyCities(loc,range){
  if(range<=0)return[];
  const graph=buildGraph(),q=[{id:loc,d:0}],vis=new Set([loc]),out=[];
  while(q.length){const{id,d}=q.shift();if(d>=1&&d<=range)out.push(id);for(let v in graph[id]){if(!vis.has(v)&&d+1<=range){vis.add(v);q.push({id:v,d:d+1})}}}
  return out;
}

function genPriceIntel(nearby){
  const cityIds=nearby.filter(id=>{const c=getCity(id);return c&&c.goods.length>0});
  const cid=cityIds[Math.floor(Math.random()*cityIds.length)];
  const city=getCity(cid);
  const goods=city.goods.filter(g=>getDayPrice(cid,g,GS.day)!=null);
  const gid=goods[Math.floor(Math.random()*goods.length)];
  const it=getItem(gid);
  const price=getDayPrice(cid,gid,GS.day);
  const sell=getSellPrice(cid,gid,GS.day);
  let trend='平稳';
  const hist=getPriceHistory(cid,gid,30);
  if(hist.length>1){
    const avg=hist.reduce((a,h)=>a+h.price,0)/hist.length;
    const diff=(price-avg)/avg;
    trend=diff>0.08?'一路上涨':(diff<-0.08?'一路下跌':'不温不火');
  }
  const tpl=INTEL_TEMPLATES[Math.floor(Math.random()*INTEL_TEMPLATES.length)];
  return{cls:'intel',text:fillTpl(tpl,{city:getCityName(cid),item:it.name,icon:it.icon,price:fmt(price),sell:fmt(sell),trend})};
}
// —— 打听消息：生成一条情报（数量/概率/范围随本城声望扩展）——
function generateIntelMessages(){
  const range=getIntelRange();
  const nearby=[GS.location,...getNearbyCities(GS.location,range)];
  const ups=getUpcomingEvents().filter(ev=>ev.scope==='global'||ev.scope==='cost'||nearby.includes(ev.city));
  const acts=getActiveEvents().filter(ev=>ev.scope!=='global'&&ev.scope!=='cost'&&nearby.includes(ev.city));
  // 声望因子：本城声望等级提高 → 高级情报概率提升（封顶 40%/55%）
  const rep=getRepLevel(GS.location);
  const pBest=Math.min(0.40,0.18+rep*0.02);
  const pRare=Math.min(0.55,0.32+rep*0.015);
  const r=Math.random();
  if(ups.length>0&&r<pBest){
    const ev=ups[Math.floor(Math.random()*ups.length)];
    markEventKnown(ev);
    const city=ev.city?getCityName(ev.city):'全王国';
    const tpl=INTEL_UPCOMING_TPL[Math.floor(Math.random()*INTEL_UPCOMING_TPL.length)];
    return[{cls:'intel best',text:fillEvTpl(tpl,{city,evname:ev.name,evicon:ev.icon})}];
  }
  if(acts.length>0&&r<pBest+pRare){
    const ev=acts[Math.floor(Math.random()*acts.length)];
    markEventKnown(ev);
    const action=ev.target==='sell'?'出货':'进货';
    const tpl=INTEL_ACTIVE_TPL[Math.floor(Math.random()*INTEL_ACTIVE_TPL.length)];
    return[{cls:'intel rare',text:fillEvTpl(tpl,{city:getCityName(ev.city),evname:ev.name,evicon:ev.icon,action})}];
  }
  return[genPriceIntel(nearby)];
}

  if(d && d.items)for(const gid of Object.keys(d.items)){const q=parseInt(d.items[gid])||0;if(q>0)entries.push({gid,qty:q});}
  if(!entries.length){
    // 中转面板为空时也保留详情面板：具体数据按 0 / 空 显示
    const used0=getUsedCargo(),cap0=getVehicleCapacity();
    const pre0 = window.TradePreview ? (mode==='buy'?TradePreview.previewBuy(d):TradePreview.previewSell(d)) : null;
    const rate0 = pre0 ? pre0.taxRate : (window.Tax?Tax.getRate(getRepLevel(GS.location)):0);
    const cargoLine0 = `货舱 ${used0}/${cap0}${mode==='buy'?'（+0）':'（-0）'}`;
    const subLine0 = mode==='buy' ? '小计 0' : '收入 0';
    const taxLine0 = mode==='buy'
      ? `税率 ${Math.round(rate0*100)}% · 税额 0 · 应付 <b>0</b>`
      : `税率 ${Math.round(rate0*100)}% · 税额 0 · 到手 <b>0</b>`;
    box.innerHTML=`<div class="trade-side">
      <div class="trade-cart-panel empty">购物车为空：从左侧物资列表加入后，可一次性确认成交</div>
      <div class="trade-summary-panel">
        <div class="ts-row"><span class="ts-label">${cargoLine0}</span></div>
        <div class="ts-row"><span class="ts-label">${subLine0}</span></div>
        <div class="ts-row"><span class="ts-label">${taxLine0}</span></div>
        <button class="btn btn-primary td-confirm" onclick="confirmDraft('${mode}')">${mode==='buy'?'确认购入':'确认售出'}</button>
      </div>
    </div>`;
    return;
  }
  const pre = window.TradePreview ? (mode==='buy'?TradePreview.previewBuy(d):TradePreview.previewSell(d)) : null;
  const plannedQty = entries.reduce((s,e)=>s+e.qty,0);
  const used=getUsedCargo(),cap=getVehicleCapacity();
  const afterUsed = mode==='buy' ? (used+plannedQty) : Math.max(0, used-plannedQty);
  const cargoLine = `货舱 ${afterUsed}/${cap}${mode==='buy'?`（+${plannedQty}）`:`（-${plannedQty}）`}`;
  const totalLine = mode==='buy'
    ? `税率 ${Math.round(pre.taxRate*100)}% · 税额 ${fmt(pre.tax)} · 应付 <b>${fmt(pre.total)}</b>`
    : `税率 ${Math.round(pre.taxRate*100)}% · 税额 ${fmt(pre.tax)} · 到手 <b>${fmt(pre.net)}</b>`;
  let rows='';
  for(const e of entries){
    const it=getItem(e.gid);
    const max = mode==='buy'? Math.min(getCurStock(GS.location,e.gid), Math.floor(GS.gold/Math.max(1,(getDayPrice(GS.location,e.gid,GS.day)||1))), getCargoFree()+e.qty) : (GS.cargo[e.gid]||0);
    rows+=`<div class="td-row">
      <span class="td-name">${it.icon} ${it.name}</span>
      <input class="td-qty" type="number" min="0" max="${max}" value="${e.qty}" onchange="onDraftQtyChange('${mode}','${e.gid}',this.value)">
      <button class="td-del" onclick="onDraftRemove('${mode}','${e.gid}')">移除</button>
    </div>`;
  }
  box.innerHTML=`<div class="trade-side">
    <div class="trade-cart-panel">
      <div class="td-head">🧾 中转购物车（${mode==='buy'?'购入':'售出'} · ${entries.length}种）<button class="td-clear" onclick="clearDraftManual()">清空</button></div>
      <div class="td-list">${rows}</div>
    </div>
    <div class="trade-summary-panel">
      <div class="ts-row"><span class="ts-label">${cargoLine}</span></div>
      <div class="ts-row"><span class="ts-label">${mode==='buy'?`小计 ${fmt(pre.subtotal)}`:`收入 ${fmt(pre.revenue)}`}</span></div>
      <div class="ts-row"><span class="ts-label">${totalLine}</span></div>
      <button class="btn btn-primary td-confirm" onclick="confirmDraft('${mode}')">${mode==='buy'?'确认购入':'确认售出'}</button>
    </div>
  </div>`;
}
function onDraftQtyChange(mode,gid,val){
  const q=Math.max(0,parseInt(val)||0);
  TradeDraft.add(mode,gid,q);
  renderMarketCards();
}
function onDraftRemove(mode,gid){
  TradeDraft.remove(mode,gid);
  renderMarketCards();
}
function clearDraftManual(){
  if(!TradeDraft.anyNonEmpty())return;
  showModal('清空中转面板','确认清空中转面板中的全部内容？','清空',()=>{TradeDraft.clearAll('manual');renderMarketCards();});
}
function draftFromSlider(mode,gid){
  if(!window.TradeDraft)return;
  // 若中转面板已有内容，但锚点变化（游戏日/中枢/城市）则按规则提示并清空后再加入
  if(TradeDraft.anyNonEmpty()){
    const td=TradeDraft.getDraftState();
    const d0=td.buy, d1=td.sell;
    const now=TradeDraft.anchorForNow();
    const bad = (d0 && d0.items && Object.keys(d0.items).length && (d0.cityId!==now.cityId || d0.hub!==now.hub || d0.day!==now.day))
      || (d1 && d1.items && Object.keys(d1.items).length && (d1.cityId!==now.cityId || d1.hub!==now.hub || d1.day!==now.day));
    if(bad){
      showModal('⚠ 物价已更新',`由于游戏日/中枢点/城市发生变化，为避免按旧价成交，已清空中转面板内容。`,'知道了',()=>{TradeDraft.clearAll('anchor');doDraftAdd();});
      return;
    }
  }
  doDraftAdd();
  function doDraftAdd(){
    const qty=getSliderVal(gid);
    // 购入时校验货舱容量：阻止超出容量的加入操作
    if(mode==='buy'){
      const cap=getVehicleCapacity();
      const used=getUsedCargo()+getTaskCargoUsed();
      const td0=TradeDraft.getDraftState();
      const dBuy=td0&&td0.buy?td0.buy:null;
      let plannedOther=0;
      if(dBuy && dBuy.items){
        for(const k of Object.keys(dBuy.items)){
          if(k===gid) continue;
          plannedOther += parseInt(dBuy.items[k])||0;
        }
      }
      const totalPlanned = plannedOther + qty;
      if(used + totalPlanned > cap){
        const free=Math.max(0, cap-used);
        showModal('⚠ 货舱容量不足',
          `当前货舱剩余 ${free} 格，中转面板已有 ${plannedOther} 件，本次计划加入 ${qty} 件，合计 ${totalPlanned} 件，已超出容量 ${cap} 格。`,
          '知道了');
        return;
      }
    }
    TradeDraft.add(mode,gid,qty);
    toast('已加入中转面板','ok');
    renderMarketCards();
  }
}
async function confirmDraft(mode){
  if(GS.traveling)return toast('旅行中不可交易','info');
  advanceDay(); // 确认时推进一次游戏日（与单笔交易口径一致）
  if(!window.TradeDraft||!window.TradeValidate||!window.TradePreview)return toast('模块未就绪','err');
  const td=TradeDraft.getDraftState();
  const draft=td[mode];
  if(mode==='buy'){
    const v=TradeValidate.validateBuyDraft(draft);
    if(!v.ok)return toast(v.msg,'err');
    const msg=`物品种类：${v.list.length}\n小计：${fmt(v.subtotal)}\n税率：${Math.round(v.taxRate*100)}%\n税额：${fmt(v.tax)}\n应付总额：${fmt(v.total)}`;
    showModal('🧾 确认购入（中转面板）',msg,'确认购入',async()=>{
      const ok = await execBuyDraft(v.list);
      if(ok){TradeDraft.clearAll('buy-confirm');render();}
    });
    return;
  }
  // sell
  const vs=TradeValidate.validateSellDraft(draft);
  if(!vs.ok)return toast(vs.msg,'err');
  const warns=TradeValidate.sameVisitWarningsSell(vs.list);
  const proceed = async()=>{
    const pre=TradePreview.previewSell(draft);
    const msg=`物品种类：${pre.list.length}\n预计收入：${fmt(pre.revenue)}\n税率：${Math.round(pre.taxRate*100)}%\n税额：${fmt(pre.tax)}\n预计到手：${fmt(pre.net)}`;
    showModal('🧾 确认售出（中转面板）',msg,'确认售出',async()=>{
      const ok = await execSellDraft(pre.list);
      if(ok){TradeDraft.clearAll('sell-confirm');render();}
    });
  };
  if(warns.length){
    const rows=warns.map(w=>`- ${w.name}：同城同次 ${w.sameQty}件，将按买入价60%（${fmt(w.unit60)}/件）结算`).join('\n');
    showModal('⚠️ 同城倒卖警告',`以下物品命中“同城同次 + 顺价套利”惩罚：\n${rows}\n\n仍要继续吗？`,'继续售出',proceed);
    return;
  }
  proceed();
}

async function execBuyDraft(list){
  const city=GS.location;
  if(ONLINE){
    const user=localStorage.getItem(AUTH_KEY)||'';
    const r=await NET.post('/api/tradeBatch',{user,city,dir:'buy',items:list.map(x=>({item:x.gid,qty:x.qty}))});
    if(!r||!r.ok){toast('在线库存扣减失败：'+(r&&r.err?r.err:'网络错误'),'err');return false;}
    if(r.serverAt)GS.__lastServerAt=r.serverAt; // 防止后续自动保存覆盖服务器变更
    if(r.stocks){
      const cs=State.get('cityStocks')||{};
      cs[city]=r.stocks;
      State.set('cityStocks',cs);
    }
  }
  // 本地落地（一次确认，多物品成交；单笔交易不再重复推进游戏日）
  for(const it of list){
    const rr=buyItem(it.gid,it.qty,{skipAdvance:true});
    if(!rr.ok){toast('购入失败：'+rr.msg,'err');return false;}
  }
  toast('✅ 已完成购入（中转面板）','ok');
  return true;
}

async function execSellDraft(list){
  const city=GS.location;
  if(ONLINE){
    const user=localStorage.getItem(AUTH_KEY)||'';
    const r=await NET.post('/api/tradeBatch',{user,city,dir:'sell',items:list.map(x=>({item:x.gid,qty:x.qty}))});
    if(!r||!r.ok){toast('在线库存回补失败：'+(r&&r.err?r.err:'网络错误'),'err');return false;}
    if(r.serverAt)GS.__lastServerAt=r.serverAt;
    if(r.stocks){
      const cs=State.get('cityStocks')||{};
      cs[city]=r.stocks;
      State.set('cityStocks',cs);
    }
  }
  for(const it of list){
    const rr=sellItem(it.gid,it.qty,{skipAdvance:true});
    if(!rr.ok){toast('售出失败：'+rr.msg,'err');return false;}
  }
  toast('✅ 已完成售出（中转面板）','ok');
  return true;
}
function doAction(type,gid){
  const qty=getSliderVal(gid);
  if(type==='buy'){const r=buyItem(gid,qty);toast(r.msg,r.ok?'ok':'err');if(r.ok){delete sliderVals[gid];render();}return;}
  // 卖出前：同城同次 + 本城买入价<卖出价（顺价可套利）时弹窗确认 60% 惩罚
  const info=getSameVisitArbitrage(gid,qty);
  if(info){
    const unit60=Math.round(info.buy*0.6);
    showModal('⚠️ 同城倒卖警告',
      `本城该物资当前「买入价 ${fmt(info.buy)}」低于「卖出价 ${fmt(info.sPrice)}」\n本次出售中有 ${info.sameQty} 件为本城本次停留期间买入\n若确认出售，这 ${info.sameQty} 件将按当前买入价的 60%（${fmt(unit60)} 金/件）结算`,
      '确认出售',()=>{doSell(gid,qty);});
    return;
  }
  doSell(gid,qty);
}
function doSell(gid,qty){
  const r=sellItem(gid,qty);
  toast(r.msg,r.ok?'ok':'err');
  if(r.ok){delete sliderVals[gid];render();}
}
function getSliderVal(gid){const sl=document.getElementById('slider-'+gid);return sl?parseInt(sl.value)||1:1}
function qtySliderHTML(gid,maxVal,initVal){
  const base=sliderVals[gid]!==undefined?sliderVals[gid]:(initVal||1);
  const v=Math.max(1,Math.min(base,maxVal));
  return `<div class="qty-slider"><button class="qty-arrow" onclick="event.stopPropagation();setSliderDelta('${gid}',-1)">◀</button>
  <input type="range" id="slider-${gid}" min="1" max="${maxVal}" value="${v}" onclick="event.stopPropagation()" onpointerdown="window._draggingGid='${gid}'" oninput="document.getElementById('sv-${gid}').textContent=this.value;sliderVals['${gid}']=parseInt(this.value)||1" onpointerup="window._draggingGid=null;onSliderRelease()" onchange="event.stopPropagation()">
  <button class="qty-arrow" onclick="event.stopPropagation();setSliderDelta('${gid}',1)">▶</button>
  <span class="qty-val" id="sv-${gid}">${v}</span></div>`;
}
function setSliderDelta(gid,d){const sl=document.getElementById('slider-'+gid);if(sl){const v=Math.min(parseInt(sl.max),Math.max(1,(parseInt(sl.value)||1)+d));sl.value=v;document.getElementById('sv-'+gid).textContent=v;sliderVals[gid]=v;}}
function onSliderRelease(){window._draggingGid=null;if(window._pendingRefresh){window._pendingRefresh=false;render();}}

// ===== 折线图 =====
function drawChart(){
  if(!_chartItem)return;const canvas=document.getElementById('price-chart');if(!canvas)return;
  // 画布尺寸完全由 CSS 决定（固定高度 360px），避免因 bitmap 尺寸变化导致折线图变大变小
  const cssW=canvas.clientWidth||canvas.parentElement.clientWidth||320;
  const cssH=canvas.clientHeight||360;
  if(canvas.width!==cssW)canvas.width=cssW;
  if(canvas.height!==cssH)canvas.height=cssH;
  const loc=GS.location,hist=getPriceHistory(loc,_chartItem,_chartDays);
  const ctx=canvas.getContext('2d'),W=canvas.width,H=canvas.height,padL=55,padR=25,padT=20,padB=35;
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#0d1b2a';ctx.fillRect(0,0,W,H);
  if(hist.length<2)return;
  const isBuyView = (marketTab==='buy');
  const buyPrices=hist.map(h=>h.price);
  const sellPrices=hist.map(h=>h.sell);
  const allP = isBuyView ? [...buyPrices, ...sellPrices] : [...sellPrices];
  const minP=Math.min(...allP),maxP=Math.max(...allP),range=maxP-minP||1;
  const pw=(W-padL-padR)/(hist.length-1),by=y=>padT+(H-padT-padB)*(1-(y-minP)/range),bx=i=>padL+i*pw;
  ctx.strokeStyle='#1a1a3a';ctx.lineWidth=0.5;for(let i=0;i<=4;i++){const y=padT+(H-padT-padB)*i/4;ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(W-padR,y);ctx.stroke()}
  // 售出线（一直画）
  ctx.beginPath();
  ctx.strokeStyle='#ff9f43';
  ctx.lineWidth=isBuyView?1.5:2;
  if(isBuyView)ctx.setLineDash([4,3]);
  for(let i=0;i<hist.length;i++){const x=bx(i),y=by(hist[i].sell);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
  ctx.stroke();
  ctx.setLineDash([]);
  // 购入线（仅购入页面展示）
  if(isBuyView){
    ctx.beginPath();
    ctx.strokeStyle='#26d98b';
    ctx.lineWidth=2;
    for(let i=0;i<hist.length;i++){const x=bx(i),y=by(hist[i].price);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.stroke();
  }
  const last=hist[hist.length-1];
  if(isBuyView){
    ctx.beginPath();ctx.arc(bx(hist.length-1),by(last.price),5,0,Math.PI*2);ctx.fillStyle='#26d98b';ctx.fill();
    ctx.beginPath();ctx.arc(bx(hist.length-1),by(last.sell),4,0,Math.PI*2);ctx.fillStyle='#ff9f43';ctx.fill();
  }else{
    ctx.beginPath();ctx.arc(bx(hist.length-1),by(last.sell),5,0,Math.PI*2);ctx.fillStyle='#ff9f43';ctx.fill();
  }
  ctx.fillStyle='#8b95a5';ctx.font='10px sans-serif';for(let i=0;i<=4;i++){const y=padT+(H-padT-padB)*i/4;ctx.fillText(fmt(Math.round(maxP-(maxP-minP)*i/4)),2,y+4)}
  const steps=hist.length<=30?5:(hist.length<=60?8:12);for(let i=0;i<hist.length;i+=Math.ceil(hist.length/steps))ctx.fillText(hist[i].day,bx(i),H-padB+14);
  const trend=getTrend(GS.location,_chartItem, isBuyView ? 'buy' : 'sell');
  const cls=trend.cls==='up'?'color:var(--buy)':(trend.cls==='down'?'color:var(--red)':'color:var(--text2)');
  const tDay=Math.max(1,GS.day+1);
  const estBuy=getDayPrice(GS.location,_chartItem,tDay);
  const estSell=getSellPrice(GS.location,_chartItem,tDay);
  if(isBuyView){
    // 购入页：同时展示买入价与卖出价变化
    ctx.font='10px sans-serif';
    ctx.fillStyle='#26d98b';ctx.fillRect(W-160,padT,10,3);
    ctx.fillStyle='#ff9f43';ctx.fillRect(W-80,padT,10,3);
    ctx.fillStyle='#8b95a5';
    ctx.fillText('买入价',W-147,padT-2);
    ctx.fillText('卖出价',W-67,padT-2);
    const curBuy=last.price,curSell=last.sell;
    const spreadPct=curBuy?Math.round((1-curSell/curBuy)*100):0;
    const deltaBuy=(estBuy!=null?estBuy-curBuy:0);
    document.getElementById('chart-stats').innerHTML=
      `<span class="stat">买入 <b class="buy">${fmt(curBuy)}</b></span>`+
      `<span class="stat">卖出 <b class="sell">${fmt(curSell)}</b> (${spreadPct}%off)</span>`+
      `<span class="stat">${_chartDays}日买入最低 <b>${fmt(Math.min(...buyPrices))}</b></span>`+
      `<span class="stat">${_chartDays}日买入最高 <b>${fmt(Math.max(...buyPrices))}</b></span>`+
      `<span class="stat" style="${cls}">${trend.label}</span>`+
      `<span class="stat">预计明日买入 <b class="buy">${fmt(estBuy||0)}</b> (${deltaBuy>=0?'+':''}${fmt(deltaBuy)})</span>`;
  }else{
    // 售出页：只展示售价变化
    const curSell=last.sell;
    const deltaSell=(estSell!=null?estSell-curSell:0);
    document.getElementById('chart-stats').innerHTML=
      `<span class="stat">卖出 <b class="sell">${fmt(curSell)}</b></span>`+
      `<span class="stat">${_chartDays}日最低 <b>${fmt(Math.min(...sellPrices))}</b></span>`+
      `<span class="stat">${_chartDays}日最高 <b>${fmt(Math.max(...sellPrices))}</b></span>`+
      `<span class="stat" style="${cls}">${trend.label}</span>`+
      `<span class="stat">预计明日卖出 <b class="sell">${fmt(estSell||0)}</b> (${deltaSell>=0?'+':''}${fmt(deltaSell)})</span>`;
  }
  syncMarketHeightToChart();
}

// 以左侧“物价表 + 下方小标签”为唯一高度基准，锁定 .market-body 高度。
// 右侧面板严格按该高度填充，超出部分由各自内部滚动承担（避免出现折线图下方冗余空白）。
let __mh_inited=false;
function syncMarketHeightToChart(){
  const body=document.querySelector('.market-body');
  const chart=document.querySelector('.market-chart .chart-panel');
  if(!body || !chart) return;

  // 使用 requestAnimationFrame，等 canvas 与 stats 更新后再取高度
  requestAnimationFrame(()=>{
    const cs=getComputedStyle(body);
    const pad=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
    const h=Math.ceil(chart.getBoundingClientRect().height + pad);
    if(h>0) body.style.height=h+'px';
  });

  if(__mh_inited) return;
  __mh_inited=true;
  window.addEventListener('resize', ()=>syncMarketHeightToChart());
}

    const cfg=getWhConfig(loc);
    html+=`<div class="empty">本城暂无仓库，可花金币解锁（初始 100 格）
      <button class="btn btn-primary btn-small" onclick="doUnlockWarehouse()" ${GS.gold<cfg.unlock?'disabled':''}>🔓 解锁仓库（${fmt(cfg.unlock)} 金/100 格）</button></div>`;
  }
  else{
    const whUsed=Object.values(wh.items).reduce((a,b)=>a+b,0);
    const exCost=getWhExpandCost(loc);
    html+=`<p style="font-size:12px;color:var(--text2);margin-bottom:6px">${whUsed}/${wh.capacity}格
      <button class="btn-sm btn-buy-sm" style="float:right" onclick="doExpandWarehouse()" ${GS.gold<exCost?'disabled':''}>扩建 +50 格（${fmt(exCost)} 金）</button></p><div class="wh-list">`;
    if(whUsed===0)html+=`<div class="empty">仓库为空</div>`;
    for(let[id,qty]of Object.entries(wh.items)){
      if(!qty)continue;const it=getItem(id);
      html+=`<div class="wh-row"><span>${it.icon} ${it.name} ×${qty}</span><div class="qty-inline"><input type="number" id="wqty-${id}" value="${Math.min(1,qty)}" min="1" max="${qty}" style="width:50px"><button class="btn-sm btn-buy-sm" onclick="doWhOut('${id}',parseInt(document.getElementById('wqty-${id}').value)||1)">→载具</button></div></div>`;
    }
    html+=`</div>`;
  }
  return html;
}

// ===== 事件绑定 =====
function bindEvents(){
  if(currentTab==='map'&&MAP.needCenter){MAP.needCenter=false;centerOn(GS.location);applyMapView();} // 首次地图挂载后按真实尺寸居中
  document.querySelectorAll('.city-node').forEach(circle=>{circle.onclick=function(e){e.stopPropagation();const destId=this.dataset.city;if(destId==='starfall')return toast('星陨城暂未开放','info');if(destId===GS.location&&!GS.traveling)return;if(GS.traveling)return toast('正在旅行中','info');const sp=shortestPath(GS.location,destId);if(!sp)return;const realSec=Math.round(sp.distance/getVehicleSpeed()*60);const destName=getCityName(destId);const durLoss=calcDurabilityLoss(sp.distance);showModal(`前往 ${destName}`,`${fmt(sp.distance)} 里路程 · 约 ${realSec} 秒抵达\n预计耐久 -${durLoss}点（当前耐久 ${Math.round(getDurabilityPct()*100)}%）`,'出发',()=>{const r=startTravel(destId);toast(r.msg,r.ok?'ok':'err');if(r.ok)render();});}});
  document.querySelectorAll('.chart-time button').forEach(b=>{b.onclick=function(){document.querySelectorAll('.chart-time button').forEach(x=>x.classList.remove('active'));this.classList.add('active');_chartDays=parseInt(this.dataset.days);drawChart();}});
}

// ===== 导航 + 定时 =====
document.querySelectorAll('nav button').forEach(btn=>{btn.addEventListener('click',function(){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));this.classList.add('active');currentTab=this.dataset.tab;render()})});
let _tickCount=0;
setInterval(()=>{
  _tickCount++;
  const arrived=advanceDay();
  const dragging=!!window._draggingGid;
  if(arrived&&!dragging){render();return;}
  if(arrived&&dragging){window._pendingRefresh=true;}
  if(window._pendingRefresh&&!dragging){window._pendingRefresh=false;render();return;}
  renderTopbar();
  // 事件横幅倒计时每秒刷新（不重渲染整个内容区）
  const eb=document.getElementById('event-board');
  if(eb)eb.innerHTML=renderEventBoard();
  // 旅行中：仅增量更新地图位置点与进度（不重建地图，避免城市页/路网动画闪烁）
  // 抵达时 advanceDay 返回 arrived → 上面已全量 render()
  if(!dragging&&GS.traveling&&currentTab==='map'){updateTravelUI();}
},1000);
markCityAsKnown(GS.location);
genTasks(GS.location);
normalizeVehicleDurability(); // 新账号按耐久公式补满
migrateLots(); // 新账号批次结构初始化
if(!GS.visitStamp[GS.location])GS.visitStamp[GS.location]=1; // 初始停留批次
document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.querySelector('nav button[data-tab="map"]').classList.add('active');currentTab='map';render();
// 指令台：全局挂载，可键盘调用
window.runCmd=runCmd;
// 地图交互（缩放/拖拽，事件委托一次性绑定）
initMapInteract();
// 弹幕聊天室初始化（延迟到 DOM 就绪：chat-fab 位于脚本之后的 HTML 中）
function initChatUI(){initChatFab();chatLoad();startChatPolling();}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initChatUI);}else{initChatUI();}
// 登录门禁：在线与单机共享同一入口，但使用彼此隔离的持久化来源。
const __authSub=document.querySelector('.auth-sub');
if(__authSub)__authSub.textContent=Runtime.isStandalone?'单机模式 · 存档保存在当前浏览器':'在线模式 · 存档保存在服务器';
const __bootUser=localStorage.getItem(AUTH_KEY);
if(!__bootUser){const ao=document.getElementById('auth-overlay');if(ao){ao.style.display='flex';toggleAuth('login');}}
else{(async()=>{
  if(Runtime.isStandalone){
    // 单机启动只读取 localStorage，不发起任何 /api 请求。
    if(getUsers().includes(__bootUser)){
      const saved=getStoredGS(__bootUser);if(saved)applySaved(saved);
      window.__gsReady=true;render();
    }else{
      localStorage.removeItem(AUTH_KEY);
      const ao=document.getElementById('auth-overlay');if(ao){ao.style.display='flex';toggleAuth('login');}
    }
    return;
  }
  const online=await startOnline();
  if(online)await fullSync();
  else showOnlineUnavailable();
})();} // 在线模式失败时保持门禁，由玩家明确选择是否切换单机模式
</script>
